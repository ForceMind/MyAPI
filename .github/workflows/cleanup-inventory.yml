name: Current cleanup inventory

on:
  workflow_call:

permissions:
  contents: read

jobs:
  inventory:
    name: Current Go and frontend cleanup candidates
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
      GOTELEMETRY: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'
    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source identity and analysis boundary
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/dev
          test "$(git -c core.fileMode=false rev-parse HEAD)" = "$GITHUB_SHA"
          git -c core.fileMode=false diff --exit-code HEAD --
          echo "CLEANUP_INVENTORY_SOURCE sha=$GITHUB_SHA analysis_only=true deletion_authorized=false"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Verify AST inventory boundaries without product initialization
        run: go test -p 1 ./tools/go-reachability/short-functions.go ./tools/go-reachability/short-functions_test.go -count=1 -timeout=120s -v

      - name: Collect current tracked Go syntax inventory
        run: |
          set -euo pipefail
          go run ./tools/go-reachability/short-functions.go --root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" > "$RUNNER_TEMP/myapi-short-functions.xml"
          python3 - <<'PY'
          from collections import Counter
          import hashlib
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          raw = (Path(os.environ['RUNNER_TEMP']) / 'myapi-short-functions.xml').read_bytes()
          root = ET.fromstring(raw)
          assert root.tag == 'short_functions_report'
          assert root.findtext('schema_version') == '1'
          assert root.findtext('source_sha') == os.environ['GITHUB_SHA']
          assert root.findtext('analysis_only') == 'true'
          assert root.findtext('deletion_authorized') == 'false'
          records = root.find('records')
          files = root.find('files')
          assert records is not None and files is not None
          summary = {item.tag: int(item.text) for item in root.find('summary')}
          assert len(records) == summary['short_functions']
          assert len(files) == summary['files']
          numeric = {'line', 'column', 'function_lines', 'body_lines', 'production_references', 'test_references'}
          booleans = {'exported', 'method', 'test', 'manual_review_candidate', 'deletion_authorized'}

          def value(element):
              if element.get('unknown') == 'true':
                  assert element.text in (None, '')
                  return None
              if element.tag in {'references', 'protections'}:
                  return [value(child) for child in element]
              if len(element):
                  return {child.tag: value(child) for child in element}
              if element.tag in numeric:
                  return int(element.text)
              if element.tag in booleans:
                  assert element.text in {'true', 'false'}
                  return element.text == 'true'
              return element.text or ''

          reasons = Counter()
          candidates = 0
          for element in records:
              record = value(element)
              assert record['deletion_authorized'] is False
              reasons.update(record['protections'])
              candidates += record['manual_review_candidate'] is True
              if record['manual_review_candidate'] or (not record['exported'] and not record['method'] and record['production_references'] == 1):
                  print('CLEANUP_GO_RECORD ' + json.dumps(record, ensure_ascii=False))
          assert candidates == summary['manual_review_candidates']
          print('CLEANUP_GO_METADATA ' + json.dumps({'schema_version': 1, 'source_sha': root.findtext('source_sha'), 'go_version': root.findtext('go_version'), 'scope': {item.tag: item.text for item in root.find('scope')}, 'summary': summary, 'protection_counts': dict(reasons), 'report_sha256': hashlib.sha256(raw).hexdigest(), 'analysis_only': True, 'deletion_authorized': False}, ensure_ascii=False))
          PY

      - name: Set up Node for frontend report contracts
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify frontend inventory contracts
        run: node --test tools/ui/unused-exports.test.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frozen frontend analysis dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Collect configured and UI-inclusive Knip inventories
        working-directory: web
        run: |
          set -euo pipefail
          myapi_knip_version="$(bun run knip --version)"
          echo "CLEANUP_KNIP_VERSION $myapi_knip_version"
          myapi_ui_config="$(mktemp --suffix=.json "$GITHUB_WORKSPACE/web/.myapi-knip-ci-XXXXXX")"
          trap 'rm -f -- "$myapi_ui_config"' EXIT
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({ignore:["src/routeTree.gen.ts"],ignoreDependencies:["tailwindcss","tw-animate-css"]})+"\n")' "$myapi_ui_config"
          for myapi_inventory_mode in configured ui-inclusive; do
            myapi_report_config="$GITHUB_WORKSPACE/web/knip.config.ts"
            if [[ "$myapi_inventory_mode" == ui-inclusive ]]; then
              myapi_report_config="$myapi_ui_config"
            fi
            myapi_knip_input="$RUNNER_TEMP/myapi-knip-$myapi_inventory_mode.raw.json"
            myapi_knip_report="$RUNNER_TEMP/myapi-knip-$myapi_inventory_mode.report.json"
            myapi_knip_status=0
            bun run knip --config "$myapi_report_config" --include files,exports,types --reporter json --no-exit-code > "$myapi_knip_input" || myapi_knip_status=$?
            echo "CLEANUP_KNIP_EXIT mode=$myapi_inventory_mode actual_exit=$myapi_knip_status"
            if [[ "$myapi_knip_status" -ne 0 ]]; then
              exit "$myapi_knip_status"
            fi
            node "$GITHUB_WORKSPACE/tools/ui/unused-exports.mjs" --input "$myapi_knip_input" --mode "$myapi_inventory_mode" --project-dir "$GITHUB_WORKSPACE/web" --source-sha "$GITHUB_SHA" --config-file "$myapi_report_config" --tool-version "$myapi_knip_version" --tool-exit-code "$myapi_knip_status" > "$myapi_knip_report"
            echo "CLEANUP_FRONTEND_REPORT_BEGIN mode=$myapi_inventory_mode"
            cat "$myapi_knip_report"
            echo "CLEANUP_FRONTEND_REPORT_END mode=$myapi_inventory_mode"
          done

      - name: Retain analysis-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cleanup-inventory-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-short-functions.xml
            ${{ runner.temp }}/myapi-knip-*.raw.json
            ${{ runner.temp }}/myapi-knip-*.report.json
          retention-days: 7
          if-no-files-found: warn
