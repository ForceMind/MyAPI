name: Docker build smoke

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/docker-smoke.yml'
      - 'tools/runtime/**'
      - 'Dockerfile'
      - 'deploy/install.sh'
      - 'deploy/docker-compose.yml'
      - 'deploy/.env.example'
      - '**.go'

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-local-build:
    # Exercise the actual source installer, separately from the direct-run probe.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["codex/r1-usage-review-20261002","codex/settlement-review-status-20261009"]'), github.event.pull_request.head.ref))
    name: LAN source installer and fresh SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: myapi-install-${{ github.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Prepare isolated installer configuration
        run: |
          set -euo pipefail
          umask 077
          [[ ! -e deploy/.env ]]
          if docker container inspect my-api >/dev/null 2>&1; then
            echo 'Refusing to replace an existing installer target' >&2
            exit 1
          fi
          docker compose version
          export MYAPI_INSTALLER_ROOT="$RUNNER_TEMP/myapi-install-${GITHUB_SHA}"
          mkdir -m 700 "$MYAPI_INSTALLER_ROOT"
          echo "MYAPI_INSTALLER_ROOT=$MYAPI_INSTALLER_ROOT" >> "$GITHUB_ENV"
          {
            printf 'MYAPI_IMAGE=local/myapi:install-%s\n' "$GITHUB_SHA"
            printf 'MYAPI_EDITION=lan\nMYAPI_BUILD_LOCAL=true\nBATCH_UPDATE_ENABLED=false\nMYAPI_ACCOUNTING_CONFIG_VERSION=1\n'
            printf 'MYAPI_PORT=18082\nMYAPI_BIND_ADDRESS=127.0.0.1\nMYAPI_ALLOW_LAN=false\n'
            printf 'MYAPI_PUBLIC_URL=http://127.0.0.1:18082\nMYAPI_SESSION_COOKIE_SECURE=false\n'
            printf 'MYAPI_DATA_DIR=%s/data\nMYAPI_LOGS_DIR=%s/logs\n' "$MYAPI_INSTALLER_ROOT" "$MYAPI_INSTALLER_ROOT"
            printf 'MYAPI_CPU_LIMIT=2\nMYAPI_MEMORY_LIMIT=2g\nMYAPI_BUILD_PARALLELISM=2\n'
            printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'CHANNEL_QUOTA_IDENTITY_KEYS=active:installer:%s\n' "$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          } > deploy/.env

      - name: Run the source installer
        run: bash deploy/install.sh

      - name: Verify installed image, isolation and fresh setup
        run: |
          set -euo pipefail
          [[ "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' my-api)" == "$COMPOSE_PROJECT_NAME" ]]
          [[ "$(docker inspect --format '{{.Image}}' my-api)" == "$(docker image inspect --format '{{.Id}}' "local/myapi:install-$GITHUB_SHA")" ]]
          [[ "$(docker inspect --format '{{.State.Health.Status}}' my-api)" == 'healthy' ]]
          [[ "$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostIp}}' my-api)" == '127.0.0.1' ]]
          [[ "$(docker inspect --format '{{.HostConfig.Memory}}' my-api)" == '2147483648' ]]
          [[ "$(docker inspect --format '{{.HostConfig.NanoCpus}}' my-api)" == '2000000000' ]]
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          import { probeFreshSQLite } from './tools/runtime/docker-smoke.mjs'
          try {
            const expected = readFileSync('deploy/.env', 'utf8').split('\n').find(line => line.startsWith('CHANNEL_QUOTA_IDENTITY_KEYS='))
            const installed = JSON.parse(execFileSync('docker', ['inspect', '--format', '{{json .Config.Env}}', 'my-api'], { encoding: 'utf8' }))
            if (!expected || !installed.includes(expected)) throw new Error('INSTALLER_IDENTITY_KEY_NOT_FORWARDED')
            const report = await probeFreshSQLite({ baseUrl: 'http://127.0.0.1:18082', edition: 'lan', sha: process.env.GITHUB_SHA, isolated: true })
            console.log(JSON.stringify(report, null, 2))
            if (!report.passed) process.exitCode = 1
          } catch {
            console.error('INSTALLER_FRESH_SETUP_PROBE_FAILED')
            process.exitCode = 1
          }
          JS

      - name: Safe installer diagnostics
        if: failure()
        run: |
          docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}}' my-api 2>/dev/null || true

      - name: Remove only this installer instance
        if: always()
        run: |
          if [[ "$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' my-api 2>/dev/null)" == "$COMPOSE_PROJECT_NAME" ]]; then
            docker compose --env-file deploy/.env -f deploy/docker-compose.yml down
          fi

  build-and-healthcheck:
    # Bounded acceptance branches, never a general fork runner.
    # Manual Full/LAN coverage remains available unchanged.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["codex/r1-usage-review-20261002","codex/settlement-review-status-20261009","codex/personal-app-journey-20261009"]'), github.event.pull_request.head.ref))
    name: ${{ matrix.edition }} ${{ matrix.scenario }} ${{ matrix.writer }} image and SQLite smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        edition: ${{ fromJSON(github.event_name == 'pull_request' && '["full"]' || '["full","lan"]') }}
        scenario: [fresh]
        writer: [legacy]
        # The personal slice uses two fresh owned DBs; historical handoff remains
        # on its existing branches/manual entry, not duplicated into this slice.
        include: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/personal-app-journey-20261009' && '[{"edition":"full","scenario":"fresh","writer":"authoritative"}]' || '[{"edition":"full","scenario":"handoff","writer":"legacy"}]') }}
    env:
      MYAPI_SMOKE_EDITION: ${{ matrix.edition }}
      MYAPI_SMOKE_BASE_URL: http://127.0.0.1:18080
      MYAPI_ISOLATED_SMOKE: '1'
      MYAPI_SMOKE_PERSONAL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/personal-app-journey-20261009' && '1' || '0' }}
      MYAPI_SMOKE_WRITER: ${{ matrix.writer }}
      SMOKE_NETWORK: myapi-personal-${{ github.sha }}-${{ matrix.writer }}
      SMOKE_REDIS_CONTAINER: myapi-personal-redis-${{ github.sha }}-${{ matrix.writer }}
      SMOKE_CONTAINER: myapi-smoke-${{ matrix.edition }}-${{ github.sha }}
      SMOKE_FAKE_UPSTREAM_CONTAINER: myapi-smoke-fake-${{ matrix.edition }}-${{ github.sha }}
      SMOKE_RESTORE_CONTAINER: myapi-smoke-restore-${{ matrix.edition }}-${{ github.sha }}
      SMOKE_IMAGE: myapi:smoke-${{ matrix.edition }}-${{ github.sha }}
      SMOKE_SOURCE_IMAGE: ${{ matrix.scenario == 'handoff' && 'myapi:handoff-71277bf6055ce68b8cd1d11f1d10f1907d7696fd' || format('myapi:smoke-{0}-{1}', matrix.edition, github.sha) }}

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
          driver-opts: |
            memory=4g
            memory-swap=4g
            cpu-period=100000
            cpu-quota=200000

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Build local smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            MYAPI_EDITION=${{ matrix.edition }}
            MYAPI_BRAND_NAME=MyAPI
            MYAPI_BRAND_LOGO=/myapi-logo-v1.png
            MYAPI_BUILD_ID=${{ github.sha }}
            MYAPI_BUILD_PARALLELISM=2
          cache-from: type=gha,scope=smoke-${{ matrix.edition }}
          cache-to: type=gha,mode=min,scope=smoke-${{ matrix.edition }}

      # Checkout after the current build so historical source never enters its context.
      - name: Check out fixed handoff source
        if: matrix.scenario == 'handoff'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 71277bf6055ce68b8cd1d11f1d10f1907d7696fd
          path: .handoff-source
          persist-credentials: false

      - name: Build fixed handoff source image
        if: matrix.scenario == 'handoff'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .handoff-source
          load: true
          push: false
          platforms: linux/amd64
          tags: myapi:handoff-71277bf6055ce68b8cd1d11f1d10f1907d7696fd
          build-args: |
            MYAPI_EDITION=full
            MYAPI_BUILD_ID=71277bf6055ce68b8cd1d11f1d10f1907d7696fd
            MYAPI_BUILD_PARALLELISM=2
          cache-from: type=gha,scope=smoke-handoff
          cache-to: type=gha,mode=min,scope=smoke-handoff

      - name: Prepare owned personal test network and Redis
        if: env.MYAPI_SMOKE_PERSONAL == '1'
        run: |
          set -euo pipefail
          docker network create --internal --label "io.myapi.smoke.sha=$GITHUB_SHA" --label "io.myapi.personal.run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$SMOKE_NETWORK"
          if [[ "$MYAPI_SMOKE_WRITER" == 'authoritative' ]]; then
            redis_password="$(openssl rand -hex 24)"
            echo "::add-mask::$redis_password"
            docker run --detach --name "$SMOKE_REDIS_CONTAINER" \
              --label "io.myapi.smoke.sha=$GITHUB_SHA" --label "io.myapi.personal.run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
              --network "$SMOKE_NETWORK" --network-alias smoke-redis \
              --read-only --tmpfs /data:rw,noexec,nodev,nosuid,size=32m,uid=999,gid=999,mode=700 \
              --cap-drop ALL --security-opt no-new-privileges --user 999:999 \
              --cpus 0.25 --memory 128m --pids-limit 64 \
              redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 \
              redis-server --save '' --appendonly no --requirepass "$redis_password"
            [[ "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "$SMOKE_REDIS_CONTAINER")" == '0' ]]
            echo "REDIS_CONN_STRING=redis://:$redis_password@smoke-redis:6379/0" >> "$GITHUB_ENV"
            ready=false
            for attempt in $(seq 1 30); do
              if [[ "$(docker exec -e REDISCLI_AUTH="$redis_password" "$SMOKE_REDIS_CONTAINER" redis-cli ping 2>/dev/null || true)" == 'PONG' ]]; then
                ready=true
                break
              fi
              sleep 1
            done
            [[ "$ready" == 'true' ]]
          fi

      - name: Start isolated SQLite container
        run: |
          set -euo pipefail
          export SESSION_SECRET="$(openssl rand -hex 32)"
          export SMOKE_DATA_DIR="$RUNNER_TEMP/myapi-smoke-data-${MYAPI_SMOKE_EDITION}-${GITHUB_SHA}"
          mkdir -m 700 "$SMOKE_DATA_DIR"
          echo "SMOKE_DATA_DIR=$SMOKE_DATA_DIR" >> "$GITHUB_ENV"
          personal_args=()
          if [[ "$MYAPI_SMOKE_PERSONAL" == '1' ]]; then
            personal_args+=(--network "$SMOKE_NETWORK")
            if [[ "$MYAPI_SMOKE_WRITER" == 'authoritative' ]]; then
              personal_args+=(--env REDIS_CONN_STRING)
            fi
          fi
          docker run --detach "${personal_args[@]}" \
            --name "$SMOKE_CONTAINER" \
            --label "io.myapi.smoke.sha=${GITHUB_SHA}" \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:18080:3000 \
            --publish 127.0.0.1:19090:19090 \
            --cpus 1 --memory 768m --pids-limit 256 \
            --mount "type=bind,src=$SMOKE_DATA_DIR,dst=/data" \
            --env MYAPI_EDITION="$MYAPI_SMOKE_EDITION" \
            --env MEMORY_CACHE_ENABLED=false \
            --env FULL_CONTENT_LOG_ENABLED=true \
            --env FULL_CONTENT_LOG_DIR=/data/full-content \
            --env FULL_CONTENT_LOG_MAX_FILES=2 \
            --env FULL_CONTENT_LOG_MAX_MB=1 \
            --env SESSION_COOKIE_SECURE=false \
            --env TRUSTED_PROXIES=none \
            --env SQL_MAX_OPEN_CONNS=1 --env SQL_MAX_IDLE_CONNS=1 \
            --env GOMEMLIMIT=512MiB \
            --env SESSION_SECRET \
            --health-cmd='wget -q -O - http://127.0.0.1:3000/api/status | grep -q '"'"'"success"[[:space:]]*:[[:space:]]*true'"'"'' \
            --health-interval=3s --health-timeout=2s --health-retries=10 --health-start-period=20s \
            "$SMOKE_SOURCE_IMAGE"

      - name: Wait for health and verify status
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            running="$(docker inspect --format '{{.State.Running}}' "$SMOKE_CONTAINER")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$SMOKE_CONTAINER")"
            if [[ "$running" != "true" ]]; then
              echo 'Isolated smoke container exited before readiness' >&2
              exit 1
            fi
            if [[ "$health" == "healthy" ]]; then
              exit 0
            fi
            if [[ "$health" == "unhealthy" ]]; then
              echo "Docker smoke container did not become healthy (state=$health)" >&2
              exit 1
            fi
            sleep 2
          done
          echo 'Docker smoke health check timed out' >&2
          exit 1

      - name: Start isolated fake upstream
        run: |
          set -euo pipefail
          docker run --detach \
            --name "$SMOKE_FAKE_UPSTREAM_CONTAINER" \
            --label "io.myapi.smoke.sha=${GITHUB_SHA}" \
            --network "container:$SMOKE_CONTAINER" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nodev,nosuid,size=32m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 1000:1000 \
            --cpus 0.25 --memory 128m --pids-limit 64 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/tools/runtime/fake-openai.mjs,dst=/fixture/fake-openai.mjs,readonly" \
            --env BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 \
            --env FAKE_OPENAI_LISTEN_HOST=0.0.0.0 \
            oven/bun:1@sha256:0733e50325078969732ebe3b15ce4c4be5082f18c4ac1a0f0ca4839c2e4e42a7 \
            bun /fixture/fake-openai.mjs

      - name: Wait for fake upstream fixture
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:19090/__smoke__/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Fake upstream fixture did not become ready' >&2
          exit 1

      - name: Install isolated browser test runtime
        if: matrix.scenario == 'fresh'
        run: |
          npm install --prefix "$RUNNER_TEMP/myapi-smoke-browser" --no-save --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/myapi-smoke-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify fresh setup, authentication and real frontend
        if: matrix.scenario == 'fresh'
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-smoke-browser/node_modules/playwright/index.mjs
          MYAPI_FAKE_UPSTREAM_URL: http://127.0.0.1:19090
          MYAPI_SMOKE_FULL_CONTENT: '1'
          MYAPI_SMOKE_RESTORE: ${{ env.MYAPI_SMOKE_PERSONAL == '1' && '0' || '1' }}
          MYAPI_PERSONAL_ARTIFACT_DIR: ${{ runner.temp }}/myapi-personal-artifacts
        run: |
          mkdir -m 700 "$MYAPI_PERSONAL_ARTIFACT_DIR"
          node tools/runtime/docker-smoke.mjs

      - name: Preserve safe personal browser evidence
        if: always() && env.MYAPI_SMOKE_PERSONAL == '1'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-personal-${{ matrix.writer }}-${{ github.sha }}
          path: ${{ runner.temp }}/myapi-personal-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Verify handoff migration and original-backup recovery
        if: matrix.scenario == 'handoff'
        env:
          MYAPI_SMOKE_HANDOFF_UPGRADE: '1'
          MYAPI_SMOKE_RESTORE: '1'
        run: node tools/runtime/handoff-upgrade-smoke.mjs

      - name: Record safe image identity
        run: |
          set -euo pipefail
          image_edition="$(docker image inspect --format '{{index .Config.Labels "io.myapi.edition"}}' "$SMOKE_IMAGE")"
          [[ "$image_edition" == "$MYAPI_SMOKE_EDITION" ]]
          echo "source_sha=$GITHUB_SHA edition=$MYAPI_SMOKE_EDITION"
          docker image inspect --format 'image_id={{.Id}} os={{.Os}} architecture={{.Architecture}}' "$SMOKE_IMAGE"

      - name: Safe container diagnostics
        if: failure()
        run: |
          docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}}' "$SMOKE_CONTAINER" 2>/dev/null || true
          docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}}' "$SMOKE_FAKE_UPSTREAM_CONTAINER" 2>/dev/null || true
          docker inspect --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} oom_killed={{.State.OOMKilled}}' "$SMOKE_RESTORE_CONTAINER" 2>/dev/null || true

      - name: Remove smoke containers
        if: always()
        run: |
          if [[ "$(docker inspect --format '{{index .Config.Labels "io.myapi.smoke.sha"}}' "$SMOKE_RESTORE_CONTAINER" 2>/dev/null)" == "$GITHUB_SHA" ]]; then
            docker rm --force "$SMOKE_RESTORE_CONTAINER" >/dev/null
          fi
          if [[ "$(docker inspect --format '{{index .Config.Labels "io.myapi.smoke.sha"}}' "$SMOKE_FAKE_UPSTREAM_CONTAINER" 2>/dev/null)" == "$GITHUB_SHA" ]]; then
            docker rm --force "$SMOKE_FAKE_UPSTREAM_CONTAINER" >/dev/null
          fi
          if [[ "$(docker inspect --format '{{index .Config.Labels "io.myapi.smoke.sha"}}' "$SMOKE_CONTAINER" 2>/dev/null)" == "$GITHUB_SHA" ]]; then
            docker rm --force "$SMOKE_CONTAINER" >/dev/null
            if [[ "$SMOKE_DATA_DIR" == "$RUNNER_TEMP/myapi-smoke-data-${MYAPI_SMOKE_EDITION}-${GITHUB_SHA}" ]]; then
              rm -rf -- "$SMOKE_DATA_DIR"
            fi
          fi

      - name: Remove only owned personal Redis and network
        if: always() && env.MYAPI_SMOKE_PERSONAL == '1'
        run: |
          cleanup_failed=0
          if [[ "$(docker inspect --format '{{index .Config.Labels "io.myapi.smoke.sha"}}' "$SMOKE_REDIS_CONTAINER" 2>/dev/null)" == "$GITHUB_SHA" && "$(docker inspect --format '{{index .Config.Labels "io.myapi.personal.run"}}' "$SMOKE_REDIS_CONTAINER" 2>/dev/null)" == "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]; then
            docker rm --force "$SMOKE_REDIS_CONTAINER" >/dev/null || cleanup_failed=1
          fi
          if [[ "$(docker network inspect --format '{{index .Labels "io.myapi.smoke.sha"}}' "$SMOKE_NETWORK" 2>/dev/null)" == "$GITHUB_SHA" && "$(docker network inspect --format '{{index .Labels "io.myapi.personal.run"}}' "$SMOKE_NETWORK" 2>/dev/null)" == "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]; then
            docker network rm "$SMOKE_NETWORK" >/dev/null || cleanup_failed=1
          fi
          exit "$cleanup_failed"
