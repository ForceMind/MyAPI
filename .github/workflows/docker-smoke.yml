name: Docker build smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-healthcheck:
    name: Build local image and probe SQLite runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build local smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: myapi:smoke-${{ github.sha }}
          build-args: |
            MYAPI_EDITION=lan
            MYAPI_BRAND_NAME=MyAPI
            MYAPI_BRAND_LOGO=/myapi-logo-v1.png
            MYAPI_BUILD_ID=${{ github.sha }}
            MYAPI_BUILD_PARALLELISM=2
          cache-from: type=gha

      - name: Start isolated SQLite container
        run: |
          set -euo pipefail
          docker run --detach \
            --name myapi-smoke \
            --publish 18080:3000 \
            --env MYAPI_EDITION=lan \
            --env MYAPI_PUBLIC_URL=http://localhost:18080 \
            --env MYAPI_BIND_ADDRESS=0.0.0.0 \
            --env MYAPI_ALLOW_LAN=true \
            --env MYAPI_SESSION_COOKIE_SECURE=false \
            --env SESSION_SECRET=ci-smoke-secret-0123456789abcdefghijklmnopqrstuvwxyz-0123456789 \
            "myapi:smoke-${GITHUB_SHA}"

      - name: Wait for health and verify status
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{.State.Health.Status}}' myapi-smoke 2>/dev/null || true)"
            if [[ "$health" == "healthy" ]]; then
              curl --fail --silent --show-error http://127.0.0.1:18080/api/status \
                | grep -q '"success"[[:space:]]*:[[:space:]]*true'
              exit 0
            fi
            if [[ "$health" == "unhealthy" || ( "$health" == "" && "$attempt" -gt 10 ) ]]; then
              echo "Docker smoke container did not become healthy (state=$health)" >&2
              exit 1
            fi
            sleep 2
          done
          echo 'Docker smoke health check timed out' >&2
          exit 1

      - name: Remove smoke container
        if: always()
        run: docker rm --force myapi-smoke >/dev/null 2>&1 || true
