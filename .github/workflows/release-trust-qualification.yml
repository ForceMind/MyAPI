name: Read-only public signature verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualification:
    name: Verify fixed official Sigstore vectors offline
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && github.repository == 'ForceMind/MyAPI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYAPI_SIGNATURE_QUALIFICATION: '1'
    steps:
      - name: Checkout exact requested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source and read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/dev
          test "$GITHUB_REPOSITORY" = ForceMind/MyAPI
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(git -c core.fileMode=false rev-parse HEAD 2>&1 | sed '/non-monotonic/d')" = "$GITHUB_SHA"
          git -c core.fileMode=false diff --exit-code HEAD -- 2>&1 | sed '/non-monotonic/d'

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify input and refusal contracts
        run: node --test tools/release/verify-signature.test.mjs

      - name: Fetch exact official verifier and existing public vectors
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          input="$RUNNER_TEMP/myapi-signature-input-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$input"
          mkdir -m 700 "$input"
          export MYAPI_SIGNATURE_INPUT="$input"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          directory = Path(os.environ['MYAPI_SIGNATURE_INPUT'])
          assert directory.resolve() == directory
          marker = {'schema_version': 1, 'scope': 'official-vector-only', 'source_sha': os.environ['GITHUB_SHA'],
                    'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          with (directory / 'ownership.json').open('x') as output:
              json.dump(marker, output)
          PY
          fetch_pinned() {
            local name="$1" url="$2" bytes="$3" blob="$4" digest="$5"
            curl --disable --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-redirs 3 \
              --connect-timeout 15 --max-time 180 --max-filesize "$bytes" --output "$input/$name.partial" "$url"
            test "$(wc -c < "$input/$name.partial")" -eq "$bytes"
            if [[ -n "$blob" ]]; then
              test "$(git -c core.fileMode=false hash-object --no-filters "$input/$name.partial" 2>&1 | sed '/non-monotonic/d')" = "$blob"
            fi
            if [[ -n "$digest" ]]; then
              test "$(sha256sum "$input/$name.partial" | cut -d ' ' -f 1)" = "$digest"
            fi
            mv -- "$input/$name.partial" "$input/$name"
          }
          fetch_pinned cosign-linux-amd64 \
            https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 \
            145688404 '' 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
          fetch_pinned trusted-root.json \
            https://raw.githubusercontent.com/sigstore/root-signing/c9bda74ad2221f938f7d2e0295ca3aad2da710a8/targets/trusted_root.json \
            6787 effb0a19e6a0b3f69b3f0a2c72b5c2a02a0ddeea 6494e21ea73fa7ee769f85f57d5a3e6a08725eae1e38c755fc3517c9e6bc0b66
          base=https://raw.githubusercontent.com/sigstore/sigstore-conformance/9611941d54398f2e3f6383b6f744442a56d2fb2a/test/assets/bundle-verify
          fetch_pinned artifact.txt "$base/a.txt" 109 52c1fa7a106f88642e4e3cdc0c96bc0d4514c2cf ''
          fetch_pinned message.bundle.json "$base/happy-path-v0.3/bundle.sigstore.json" 10061 b1788a91feb4bf38cbadd48692be07c38c466276 ''
          fetch_pinned intoto-artifact.txt "$base/intoto-with-custom-trust-root/artifact" 109 fa6b1abff522a63181569917e0ff545d6fc3c2e1 ''
          fetch_pinned intoto.bundle.json "$base/intoto-with-custom-trust-root/bundle.sigstore.json" 10723 f88e885da67da04e6e6e022615f1178627f95fe7 ''
          fetch_pinned intoto-time-invalid.bundle.json "$base/intoto-set-outside-signing-cert-validity_fail/bundle.sigstore.json" 9989 4393ebc4a612b0cfefc52e49545f185ff2571e05 ''
          fetch_pinned fixture-trusted-root.json "$base/intoto-with-custom-trust-root/trusted_root.json" 3009 4598d26ac2594bdf0f275f8838899d318dbe0a1a ''
          chmod 700 "$input/cosign-linux-amd64"
          chmod 600 "$input"/*.json "$input"/*.txt
          git -c core.fileMode=false diff --exit-code HEAD -- 2>&1 | sed '/non-monotonic/d'

      - name: Run actual offline signature verification and require safe receipt
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { spawnSync } from 'node:child_process'
          import { lstatSync, mkdirSync, readFileSync, realpathSync, writeFileSync } from 'node:fs'
          import path from 'node:path'
          try {
          const result = spawnSync(process.execPath, ['tools/release/verify-signature.mjs'], {
            env: process.env, encoding: 'utf8', timeout: 180000, maxBuffer: 1024 * 1024,
          })
          assert.equal(result.error, undefined, 'SIGNATURE_PROCESS_UNCONFIRMED')
          const report = JSON.parse(result.stdout)
          const fields = ['schema_version', 'scope', 'source_sha', 'run_id', 'run_attempt', 'passed', 'phase', 'error_code',
            'read_only', 'offline', 'myapi_artifact_trusted', 'installer_connected', 'tool', 'inputs', 'cases',
            'tested_counts', 'inputs_unchanged', 'tool_unchanged', 'historical_certificate_accepted',
            'artifact_digest_bound', 'tampered_digest_differs']
          assert.deepEqual(Object.keys(report).sort(), fields.sort(), 'SIGNATURE_REPORT_SCHEMA_INVALID')
          assert.equal(report.schema_version, 1)
          assert.equal(report.scope, 'official-vector-only')
          assert.equal(report.source_sha, process.env.GITHUB_SHA)
          assert.equal(report.run_id, process.env.GITHUB_RUN_ID)
          assert.equal(report.run_attempt, process.env.GITHUB_RUN_ATTEMPT)
          assert.equal(report.read_only, true)
          assert.equal(report.offline, true)
          assert.equal(report.myapi_artifact_trusted, false)
          assert.equal(report.installer_connected, false)
          assert.equal(typeof report.passed, 'boolean')
          for (const field of ['inputs_unchanged', 'tool_unchanged', 'historical_certificate_accepted', 'artifact_digest_bound', 'tampered_digest_differs']) assert.equal(typeof report[field], 'boolean')
          assert.ok(['scope', 'inputs', 'verification', 'preservation', 'completed'].includes(report.phase))
          assert.ok(report.error_code === null || /^SIGSTORE_[A-Z0-9_]{1,80}$/.test(report.error_code))
          const root = path.join(process.env.RUNNER_TEMP, `myapi-signature-report-${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`)
          assert.equal(realpathSync(root), root)
          const directory = lstatSync(root)
          const filename = path.join(root, 'report.json')
          const metadata = lstatSync(filename)
          assert.ok(directory.isDirectory() && !directory.isSymbolicLink() && directory.uid === process.getuid() && (directory.mode & 0o777) === 0o700)
          assert.ok(metadata.isFile() && !metadata.isSymbolicLink() && metadata.uid === process.getuid() && (metadata.mode & 0o777) === 0o600)
          assert.deepEqual(JSON.parse(readFileSync(filename, 'utf8')), report)
          const expected = ['public_message_valid', 'custom_intoto_valid', 'artifact_tampered', 'signature_tampered',
            'wrong_subject', 'wrong_issuer', 'certificate_time_outside']
          const inputIds = ['trusted-root.json', 'artifact.txt', 'message.bundle.json', 'intoto-artifact.txt',
            'intoto.bundle.json', 'intoto-time-invalid.bundle.json', 'fixture-trusted-root.json', 'ownership.json',
            'tampered-artifact.txt', 'tampered.bundle.json']
          assert.ok(Array.isArray(report.inputs))
          assert.deepEqual(report.inputs.map(value => value.id).sort(), inputIds.sort())
          for (const input of report.inputs) {
            assert.deepEqual(Object.keys(input).sort(), ['id', 'bytes', 'before_sha256', 'after_sha256', 'pin_verified', 'unchanged'].sort())
            assert.equal(typeof input.id, 'string')
            assert.ok(input.bytes === null || Number.isSafeInteger(input.bytes) && input.bytes >= 0)
            for (const field of ['before_sha256', 'after_sha256']) assert.ok(input[field] === null || /^[a-f0-9]{64}$/.test(input[field]))
            assert.equal(typeof input.pin_verified, 'boolean')
            assert.equal(typeof input.unchanged, 'boolean')
          }
          assert.deepEqual(Object.keys(report.tool).sort(), ['version', 'expected_sha256', 'before_sha256', 'after_sha256', 'unchanged'].sort())
          assert.equal(report.tool.version, 'v3.1.4')
          assert.equal(report.tool.expected_sha256, '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa')
          for (const field of ['before_sha256', 'after_sha256']) assert.ok(report.tool[field] === null || /^[a-f0-9]{64}$/.test(report.tool[field]))
          assert.equal(typeof report.tool.unchanged, 'boolean')
          assert.deepEqual(Object.keys(report.tested_counts).sort(), ['cosign_invocations', 'positive_accepts', 'negative_rejections'].sort())
          for (const value of Object.values(report.tested_counts)) assert.ok(Number.isSafeInteger(value) && value >= 0)
          assert.ok(Array.isArray(report.cases))
          assert.deepEqual(report.cases.map(value => value.id), expected)
          for (const item of report.cases) {
            assert.deepEqual(Object.keys(item).sort(), ['id', 'expected', 'passed', 'cosign_exit_code', 'outcome', 'rejection'].sort())
            assert.ok(['accept', 'reject'].includes(item.expected))
            assert.equal(typeof item.passed, 'boolean')
            assert.ok(item.cosign_exit_code === null || Number.isSafeInteger(item.cosign_exit_code) && item.cosign_exit_code >= 0)
            assert.ok(['accepted', 'rejected', 'tool-failure', 'not-run'].includes(item.outcome))
            assert.ok(item.rejection === null || ['signature', 'artifact-digest', 'subject', 'issuer', 'certificate-time', 'unclassified'].includes(item.rejection))
          }
          const safeRoot = path.join(process.env.RUNNER_TEMP, `myapi-signature-safe-${process.env.GITHUB_SHA}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`)
          mkdirSync(safeRoot, { mode: 0o700 })
          assert.equal(realpathSync(safeRoot), safeRoot)
          writeFileSync(path.join(safeRoot, 'report.json'), JSON.stringify(report) + '\n', { flag: 'wx', mode: 0o600 })
          console.log(JSON.stringify(report))
          assert.equal(result.status, 0, 'SIGNATURE_ORIGINAL_PROCESS_FAILED')
          assert.equal(report.passed, true)
          assert.equal(report.phase, 'completed')
          assert.equal(report.error_code, null)
          assert.deepEqual(report.tested_counts, { cosign_invocations: 7, positive_accepts: 2, negative_rejections: 5 })
          assert.ok(report.inputs.every(value => value.pin_verified && value.unchanged && value.bytes !== null && value.before_sha256 === value.after_sha256))
          assert.equal(report.tool.before_sha256, report.tool.expected_sha256)
          assert.equal(report.tool.after_sha256, report.tool.expected_sha256)
          assert.equal(report.tool.unchanged, true)
          assert.equal(report.inputs_unchanged, true)
          assert.equal(report.tool_unchanged, true)
          assert.equal(report.historical_certificate_accepted, true)
          assert.equal(report.artifact_digest_bound, true)
          assert.equal(report.tampered_digest_differs, true)
          const rejected = ['signature', 'signature', 'subject', 'issuer', 'certificate-time']
          for (const [index, item] of report.cases.entries()) {
            assert.equal(item.passed, true)
            assert.equal(item.expected, index < 2 ? 'accept' : 'reject')
            assert.equal(item.outcome, index < 2 ? 'accepted' : 'rejected')
            assert.equal(item.rejection, index < 2 ? null : rejected[index - 2])
            assert.ok(index < 2 ? item.cosign_exit_code === 0 : item.cosign_exit_code > 0)
          }
          } catch {
            throw new Error('SIGSTORE_QUALIFICATION_UNCONFIRMED')
          }
          NODE

      - name: Reject an authentic public signature from a different workflow
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/myapi-signature-input-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          files=("$input/artifact.txt" "$input/message.bundle.json" "$input/cosign-linux-amd64" "$input/trusted-root.json")
          before="$(sha256sum "${files[@]}")"
          if result="$(bash deploy/install-native.sh verify-package --scope system --edition full --tag v0.2.0-beta.56 \
            --manifest "${files[0]}" --bundle "${files[1]}" --package "${files[0]}" \
            --cosign "${files[2]}" --root "${files[3]}" 2>&1)"; then
            echo "::error::Product package verification accepted a foreign signer."
            exit 1
          else
            test "$?" -eq 2
          fi
          test "$result" = 'MyAPI package verification failed [signer_mismatch]. Manifest signer does not match the release workflow and tag.'
          test "$(sha256sum "${files[@]}")" = "$before"
          echo 'Product package command rejected the foreign signer and preserved all inputs.'

      - name: Require source tree unchanged
        if: always()
        run: |
          set -euo pipefail
          test "$(git -c core.fileMode=false rev-parse HEAD 2>&1 | sed '/non-monotonic/d')" = "$GITHUB_SHA"
          git -c core.fileMode=false diff --exit-code HEAD -- 2>&1 | sed '/non-monotonic/d'

      - name: Preserve safe verification receipt only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myapi-signature-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/myapi-signature-safe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/report.json
          retention-days: 7
          if-no-files-found: error
