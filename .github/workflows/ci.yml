  desktop-contract:
    name: Desktop cross-platform contract
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Validate macOS and Windows desktop contract
        run: node tools/desktop/check.mjs --json

      - name: Run Electron runtime tests
        run: node --test electron/test/*.test.mjs

  native-service-contract:
    name: Native service paths and unit contracts
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Check native preview entry syntax and shell lint
        run: |
          bash -n deploy/install-native.sh
          shellcheck deploy/install-native.sh

      - name: Verify read-only paths and preserved fixture data
        run: node --test tools/runtime/native-service.test.mjs

      - name: Verify rendered system and user units with synthetic executable fixtures
        run: |
          set -euo pipefail
          command -v systemd-analyze
          systemd-analyze --version
          # These files exist only on this disposable runner. They are inert
          # executable fixtures, not a MyAPI build or an installed service.
          for path in /opt/my-api /etc/my-api /var/lib/my-api /var/log/my-api /var/cache/my-api; do
            if [[ -e "$path" || -L "$path" ]]; then
              echo "::error::Refusing to replace a pre-existing native fixture path."
              exit 1
            fi
          done
          myapi_native_ci_root="$RUNNER_TEMP/myapi-native-unit-fixtures"
          mkdir -p "$myapi_native_ci_root/system" "$myapi_native_ci_root/user"
          install -d -m 0700 "$myapi_native_ci_root/runtime"
          printf '#!/bin/sh\nexit 0\n' > "$myapi_native_ci_root/inert-binary"
          sudo install -d /opt/my-api/current /etc/my-api /var/lib/my-api/data /var/log/my-api /var/cache/my-api
          sudo install -m 0755 "$myapi_native_ci_root/inert-binary" /opt/my-api/current/my-api
          printf 'MYAPI_UNIT_FIXTURE=1\n' | sudo tee /etc/my-api/my-api.env > /dev/null
          bash deploy/install-native.sh render-unit --scope system > "$myapi_native_ci_root/system/my-api.service"
          systemd-analyze verify --man=no "$myapi_native_ci_root/system/my-api.service"
          myapi_native_ci_data="$myapi_native_ci_root/xdg-data"
          myapi_native_ci_config="$myapi_native_ci_root/xdg-config"
          myapi_native_ci_state="$myapi_native_ci_root/xdg-state"
          myapi_native_ci_cache="$myapi_native_ci_root/xdg-cache"
          mkdir -p "$myapi_native_ci_data/my-api/current" "$myapi_native_ci_data/my-api/data" "$myapi_native_ci_config/my-api" "$myapi_native_ci_state/my-api/logs" "$myapi_native_ci_cache/my-api"
          install -m 0755 "$myapi_native_ci_root/inert-binary" "$myapi_native_ci_data/my-api/current/my-api"
          printf 'MYAPI_UNIT_FIXTURE=1\n' > "$myapi_native_ci_config/my-api/my-api.env"
          XDG_DATA_HOME="$myapi_native_ci_data" XDG_CONFIG_HOME="$myapi_native_ci_config" XDG_STATE_HOME="$myapi_native_ci_state" XDG_CACHE_HOME="$myapi_native_ci_cache" bash deploy/install-native.sh render-unit --scope user > "$myapi_native_ci_root/user/my-api.service"
          # No manager is started and no unit is installed/enabled. The user
          # check must not require a login session or user-namespace sandbox.
          XDG_RUNTIME_DIR="$myapi_native_ci_root/runtime" systemd-analyze --user verify --man=no "$myapi_native_ci_root/user/my-api.service"
          echo 'MYAPI_NATIVE_UNITS_VERIFY_PASS system=true user=true runtime_started=false installation_connected=false fixture=synthetic-executable'

      - name: Verify literal user path characters with systemd
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ['RUNNER_TEMP']) / 'myapi-native-literal-paths'
          data = root / '数据 data=value space "quote" \\ %n $HOME $(literal) `literal`'
          config = root / r"配置 config='quote' %h $CONFIG * ? [literal] \ backslash"
          state = root / 'state space "quote" \\ %i ${HOME}'
          cache = root / 'cache space %t $CACHE'
          runtime = root / 'runtime'
          for directory in [data / 'my-api/current', data / 'my-api/data', config / 'my-api', state / 'my-api/logs', cache / 'my-api', runtime]:
              directory.mkdir(parents=True, exist_ok=True)
          runtime.chmod(0o700)
          binary = data / 'my-api/current/my-api'
          binary.write_text('#!/bin/sh\nexit 0\n')
          binary.chmod(0o755)
          (config / 'my-api/my-api.env').write_text('MYAPI_UNIT_FIXTURE=1\n')
          environment = {**os.environ, 'XDG_DATA_HOME': str(data), 'XDG_CONFIG_HOME': str(config), 'XDG_STATE_HOME': str(state), 'XDG_CACHE_HOME': str(cache), 'XDG_RUNTIME_DIR': str(runtime)}
          rendered = subprocess.run(['bash', 'deploy/install-native.sh', 'render-unit', '--scope', 'user'], env=environment, check=True, text=True, capture_output=True)
          unit = root / 'my-api.service'
          unit.write_text(rendered.stdout)
          subprocess.run(['systemd-analyze', '--user', 'verify', '--man=no', str(unit)], env=environment, check=True)
          print('MYAPI_NATIVE_LITERAL_PATHS_VERIFY_PASS runtime_started=false fixture=synthetic-executable')
          PY

  distribution-contract:
    name: Distribution and release contracts
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Validate CLI and distribution contracts
        run: |
          npm test
          npm run brand:test
          npm run brand:check
          npm run website:check
          npm run quota:openapi:check
          npm run lan:check -- --skip-docker
          npm run desktop:check
          npm run upgrade:check
          npm run release:workflow:check
          npm run source:manifest
          npm run pack:check

      - name: Verify Docker smoke fixture and restore contracts
        run: >-
          node --test tools/runtime/docker-smoke.test.mjs
          tools/runtime/installer-workflow.test.mjs
          tools/runtime/smoke-image-reuse-workflow.test.mjs
          tools/runtime/sqlite-restore-smoke.test.mjs
          tools/runtime/handoff-upgrade-smoke.test.mjs
          tools/runtime/upstream-acceptance.test.mjs
          tools/runtime/upstream-acceptance-offline.test.mjs

      - name: Set up Node for management MCP qualification
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Verify management MCP tools without upstream traffic
        run: node --test tools/management/management.test.mjs

      - name: Verify independently extractable operations kit
        run: node --test tools/runtime/operations-kit.test.mjs

      - name: Verify independent operations boundaries without Docker or providers
        run: node --test tools/operations/*.test.mjs

      - name: Verify local backup host guards with real Linux root privileges
        # These guards inspect the runner's entire /proc tree. Run fixture
        # files serially so unrelated test files do not race their scans.
        run: sudo "$(command -v node)" --test --test-concurrency=1 tools/operations/writer-guard.root-test.mjs tools/operations/backup-bundle.test.mjs tools/operations/backup-engine.test.mjs tools/operations/backup-cli.root-test.mjs tools/operations/archive-usage.root-test.mjs tools/operations/backup-helper.test.mjs tools/operations/backup-retention-engine.root-test.mjs tools/operations/backup-prune.root-test.mjs

  credential-maintenance:
    name: Isolated credential maintenance browser and real API
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_browser && (github.event.action != 'closed' || github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: '768MiB'
      NODE_OPTIONS: '--max-old-space-size=768'
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Wait for this run's exact production build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for credential_attempt in $(seq 1 60); do
            credential_artifact_ready="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts | any(.name == \"myapi-console-build-$GITHUB_SHA\" and .expired == false)")"
            if [ "$credential_artifact_ready" = true ]; then
              exit 0
            fi
            sleep 5
          done
          echo 'This run did not produce the expected frontend build within five minutes.' >&2
          exit 1
      - name: Download this run's exact production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: myapi-console-build-${{ github.sha }}
          path: web
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/myapi-credential-browser" --no-save --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/myapi-credential-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify credential maintenance states on the production build
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-credential-browser-artifacts
        run: node tools/ui/credential-maintenance-browser.mjs
      - name: Qualify credential rotation on the production build
        if: ${{ !cancelled() }}
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-credential-rotation-artifacts
        run: node tools/ui/credential-rotation-browser.mjs
      - name: Verify remaining Key maintenance session boundaries in Chromium
        if: ${{ !cancelled() }}
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-session-browser-artifacts
        run: node tools/ui/maintenance-session-browser.mjs
      - name: Verify real Go migration and proof routes on disposable SQLite
        if: ${{ !cancelled() }}
        env:
          MYAPI_CREDENTIAL_BROWSER_TESTS: '1'
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_CREDENTIAL_RUNTIME_ARTIFACTS: ${{ runner.temp }}/myapi-credential-runtime-artifacts
        run: go test -p 1 ./router -run '^TestTokenMaintenanceRuntimeBrowser$' -count=1 -timeout=240s -v
      - name: Verify real Go rotation, proof and old/new authentication on disposable SQLite
        if: ${{ !cancelled() }}
        env:
          MYAPI_CREDENTIAL_ROTATION_BROWSER_TESTS: '1'
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_ROTATION_RUNTIME_ARTIFACTS: ${{ runner.temp }}/myapi-rotation-runtime-artifacts
        run: go test -p 1 ./router -run '^TestTokenCredentialRotationRuntimeBrowser$' -count=1 -timeout=240s -v
      - name: Retain original credential screenshots and reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-credential-maintenance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-credential-browser-artifacts/*.png
            ${{ runner.temp }}/myapi-credential-browser-artifacts/*.json
            ${{ runner.temp }}/myapi-credential-rotation-artifacts/*.png
            ${{ runner.temp }}/myapi-credential-rotation-artifacts/*.json
            ${{ runner.temp }}/myapi-credential-runtime-artifacts/**/*.png
            ${{ runner.temp }}/myapi-credential-runtime-artifacts/**/*.json
            ${{ runner.temp }}/myapi-rotation-runtime-artifacts/**/*.png
            ${{ runner.temp }}/myapi-rotation-runtime-artifacts/**/*.json
            ${{ runner.temp }}/myapi-session-browser-artifacts/*.png
            ${{ runner.temp }}/myapi-session-browser-artifacts/*.json
          if-no-files-found: error
          retention-days: 7
