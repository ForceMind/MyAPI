                      event = json.loads(raw)
                      test = event.get('Test')
                      if test in actions:
                          actions[test].append(event.get('Action'))
          except (OSError, json.JSONDecodeError):
              raise SystemExit('PostgreSQL native selector result could not be verified')
          for observed in actions.values():
              if observed.count('run') != 1 or observed.count('pass') != 1 or 'skip' in observed or 'fail' in observed:
                  raise SystemExit('PostgreSQL native selector was empty, skipped, failed, or did not produce one PASS')
          with open(summary_path, 'a', encoding='utf-8') as report:
              report.write('PostgreSQL 9.6 selector: actual PASS; selected tests: 2; skips: 0\n')
          PY
