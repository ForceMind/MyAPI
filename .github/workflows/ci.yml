  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Source CI 38450353211 took 15m57s before the workbench seven-language
    # phone/desktop matrix. Keep individual test deadlines and allow bounded
    # margin for the added real browser journeys and runner/install variation.
    # The existing compatibility matrix alone exceeded ten minutes in
    # credential candidate 38902455293; keep all checks and their deadlines.
    # f83f027d needed 29m27s with the 42 connection locale/width journeys.
    # Preserve every assertion and per-action deadline with bounded job margin.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify pre-fix personal Key handoff regression
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_red
        run: |
          set -euo pipefail
          target=src/features/playground/hooks/use-playground-options.ts
          saved="$RUNNER_TEMP/personal-key-options-candidate.ts"
          report="$RUNNER_TEMP/myapi-ui-browser-artifacts/personal-key-handoff-baseline-red.json"
          mkdir -p "$(dirname "$report")"
          cp "$target" "$saved"
          trap 'cp "$saved" "$target"' EXIT
          git fetch --no-tags --depth=1 origin 963fabe521e9905c450b2e45968d0d7402488594
          git show 963fabe521e9905c450b2e45968d0d7402488594:web/"$target" > "$target"
          set +e
          bun run test src/features/playground/hooks/__tests__/key-request-lifecycle.test.tsx \
            -t 'selects a handed-off Key only after a fresh available-key response' \
            --reporter=json --outputFile="$report"
          result=$?
          set -e
          [[ "$result" -ne 0 ]]
          python3 - "$report" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1]))
          failures = [case for suite in report['testResults'] for case in suite['assertionResults'] if case['status'] == 'failed']
          assert len(failures) == 1, 'Require the single intended observable regression'
          assert failures[0]['title'] == 'selects a handed-off Key only after a fresh available-key response'
          message = '\n'.join(failures[0].get('failureMessages', []))
          assert 'keyId' in message and '23' in message, 'Require the expected missing Key selection assertion'
          assert not report.get('unhandledErrors'), 'Import or initialization errors are not regression evidence'
          PY
          cp "$saved" "$target"
          git diff --exit-code -- "$target"

      - name: Build real quota UI for browser regression
        id: frontend-build
        env:
          RAYON_NUM_THREADS: '2'
          NODE_OPTIONS: '--max-old-space-size=1536'
        run: VITE_REACT_APP_VERSION="$(cat ../VERSION)" VITE_BUILD_ID="$GITHUB_SHA" bun run build

      - name: Verify pre-fix Key maintenance session regressions
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dev'
        run: |
          set -euo pipefail
          baseline=7166e7922daeef0b53069610e9ff766105b51d61
          saved="$RUNNER_TEMP/key-maintenance-candidate"
          report="$RUNNER_TEMP/myapi-ui-browser-artifacts/key-maintenance-baseline-red.json"
          mkdir -p "$saved" "$(dirname "$report")"
          targets=(src/features/keys/components/api-keys-mutate-drawer.tsx src/features/keys/components/api-keys-provider.tsx src/features/keys/components/data-table-row-actions.tsx)
          for target in "${targets[@]}"; do cp "$target" "$saved/$(basename "$target")"; done
          restore_candidate() {
            for target in "${targets[@]}"; do cp "$saved/$(basename "$target")" "$target"; done
          }
          trap restore_candidate EXIT
          git fetch --no-tags --depth=1 origin "$baseline"
          for target in "${targets[@]}"; do git show "$baseline:web/$target" > "$target"; done
          set +e
          bun run test src/features/keys/components/__tests__/api-keys-mutate-session.test.tsx \
            src/features/keys/components/__tests__/api-key-export-session.test.tsx \
            -t 'a batch stops after its in-flight creation|a delayed Key reveal cannot open a chat' \
            --reporter=json --outputFile="$report"
          result=$?
          set -e
          [[ "$result" -ne 0 ]]
          python3 - "$report" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1]))
          failures = [case for suite in report['testResults'] for case in suite['assertionResults'] if case['status'] == 'failed']
          assert len(failures) == 8, 'Require all eight intended session-boundary regressions'
          for case in failures:
              assert case['title'].startswith(('a batch stops after its in-flight creation', 'a delayed Key reveal cannot open a chat'))
              message = '\n'.join(case.get('failureMessages', []))
              assert 'called' in message, 'Require an unexpected subsequent write or chat dispatch'
          assert not report.get('unhandledErrors'), 'Import and initialization errors are not regression evidence'
          PY
          restore_candidate
          git diff --exit-code -- "${targets[@]}"

      - name: Prove remaining maintenance authentication regressions on the pre-fix source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dev'
        run: |
          set -euo pipefail
          baseline=6ca9cce1b12e6b2061b429ab64c793d6cb8b343d
          saved="$RUNNER_TEMP/remaining-maintenance-candidate"
          report="$RUNNER_TEMP/myapi-ui-browser-artifacts/remaining-maintenance-baseline-red.json"
          mkdir -p "$saved" "$(dirname "$report")"
          targets=(src/features/keys/api.ts src/features/keys/token-budget-api.ts src/features/keys/components/token-budget-dialog.tsx src/features/access-policy/api.ts)
          for target in "${targets[@]}"; do
            mkdir -p "$saved/$(dirname "$target")"
            cp "$target" "$saved/$target"
          done
          restore_remaining_candidate() {
            for target in "${targets[@]}"; do cp "$saved/$target" "$target"; done
          }
          trap restore_remaining_candidate EXIT
          git fetch --no-tags --depth=1 origin "$baseline"
          for target in "${targets[@]}"; do git show "$baseline:web/$target" > "$target"; done
          set +e
          bun run test src/features/keys/components/__tests__/key-maintenance-auth-replay.test.tsx \
            src/features/keys/components/__tests__/budget-session-boundary.test.tsx \
            src/features/access-policy/__tests__/session-api.test.ts \
            -t 'a scoped .* returning 401|a budget (policy|recover) write returning 401|a token policy .* returning 401|a delayed old-SID budget read ending in success' \
            --reporter=json --outputFile="$report"
          result=$?
          set -e
          [[ "$result" -ne 0 ]]
          python3 - "$report" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1]))
          cases = [case for suite in report['testResults'] for case in suite['assertionResults']]
          failures = [case for case in cases if case['status'] == 'failed']
          expected = {
              'a scoped delete returning 401 after a same-user SID change never refreshes or replays',
              'a scoped batch delete returning 401 after a same-user SID change never refreshes or replays',
              'a budget policy write returning 401 never refreshes or replays',
              'a budget recover write returning 401 never refreshes or replays',
              'a delayed old-SID budget read ending in success never enters either session cache',
              *[f'a token policy {action} returning 401 never refreshes or replays' for action in ('read', 'save', 'remove', 'preview', 'owner')],
          }
          assert len(failures) == 10 and {case['title'] for case in failures} == expected, 'Require all ten intended authentication and SID regressions'
          for case in failures:
              message = '\n'.join(case.get('failureMessages', []))
              if case['title'].startswith('a delayed old-SID'):
                  assert '200' in message and 'Unable to find' in message, 'Require the missing fresh SID panel assertion'
              else:
                  assert ('length' in message or 'resolved' in message), 'Require a replay count or unexpectedly resolved write assertion'
          assert not report.get('unhandledErrors'), 'Import or initialization failures are not regression evidence'
          PY
          restore_remaining_candidate
          git diff --exit-code -- "${targets[@]}"

      - name: Retain runnable personal console build
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-console-build-${{ github.sha }}
          path: |
            web/dist/
            web/src/routeTree.gen.ts
          retention-days: 7

      - name: Typecheck
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/myapi-frontend-typecheck.log"

      - name: Lint
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' }}
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run test 2>&1 | tee "$RUNNER_TEMP/myapi-frontend-tests.log"

      - name: Retain frontend test results before browser qualification
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-frontend-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-frontend-tests.log
            ${{ runner.temp }}/myapi-frontend-typecheck.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record browser authorization
        if: always()
        env:
          RUN_BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.run_browser && '1' || '0' }}
        run: |
          if [[ "$RUN_BROWSER" == '1' ]]; then
            echo 'Browser qualification explicitly enabled for this manual run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Browser qualification: not run (no explicit authorization). 浏览器未验证。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install isolated browser test dependencies
        id: browser-dependencies
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_browser }}
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/myapi-browser" --no-save --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/myapi-browser/node_modules/.bin/playwright" install --with-deps chromium

      # Run the changed maintenance flows first so driver failures surface
      # before the longer unchanged browser matrices. All suites still run.
      - name: Qualify advanced personal maintenance in Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-advanced-maintenance-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: |
          scripts=(window-maintenance model-scope security-maintenance)
          pids=()
          for name in "${scripts[@]}"; do
            node "tools/ui/$name-browser.mjs" > "$RUNNER_TEMP/advanced-$name.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for index in "${!scripts[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "::error file=tools/ui/${scripts[$index]}-browser.mjs::Advanced maintenance qualification failed"
              failed=1
            fi
            cat "$RUNNER_TEMP/advanced-${scripts[$index]}.log"
          done
          exit "$failed"

      - name: Upload advanced maintenance screenshots and reports
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-advanced-maintenance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-advanced-maintenance-artifacts/*.png
            ${{ runner.temp }}/myapi-advanced-maintenance-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify real quota charts and responsive interactions
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-quota-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/quota/browser-smoke.mjs

      - name: Verify model discovery and routing workflow in real Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-routing-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/routing/browser-smoke.mjs

      - name: Verify assigned access and account events in real Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-access-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/access-policy/browser-smoke.mjs

      - name: Qualify personal console pages and native-window shares in Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-personal-console-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: |
          failed=0
          node --test tools/ui/browser-fixtures.test.mjs tools/ui/connection-key-browser-fixtures.test.mjs tools/ui/key-request-preview.test.mjs || failed=1
          for script in \
            tools/ui/personal-workbench-browser.mjs \
            tools/ui/subscription-share-browser.mjs \
            tools/ui/personal-console-browser.mjs \
            tools/ui/connections-browser.mjs \
            tools/ui/key-request-browser.mjs; do
            if ! node "$script"; then
              echo "::error file=$script::Personal console qualification failed"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload personal console screenshots and qualification reports
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-personal-console-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-personal-console-artifacts/*.png
            ${{ runner.temp }}/myapi-personal-console-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Qualify shared UI, roles, settings and responsive pages in Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-ui-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: |
          failed=0
          for script in \
            tools/ui/profile-browser.mjs \
            tools/ui/stability-browser.mjs \
            tools/ui/setup-browser.mjs \
            tools/ui/personal-status-browser.mjs \
            tools/ui/browser-smoke.mjs \
            tools/ui/playground-browser.mjs; do
            if ! node "$script"; then
              echo "::error file=$script::Browser qualification failed"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload full UI screenshots and qualification report
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-ui-browser-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-ui-browser-artifacts/*.png
            ${{ runner.temp }}/myapi-ui-browser-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload assigned access browser screenshots
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-access-browser-${{ github.sha }}
          path: ${{ runner.temp }}/myapi-access-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload routing browser screenshots
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-routing-browser-${{ github.sha }}
          path: ${{ runner.temp }}/myapi-routing-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload quota browser screenshots
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-quota-browser-${{ github.sha }}
          path: ${{ runner.temp }}/myapi-quota-browser-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  desktop-contract:
    name: Desktop cross-platform contract
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Validate macOS and Windows desktop contract
        run: node tools/desktop/check.mjs --json

      - name: Run Electron runtime tests
        run: node --test electron/test/*.test.mjs

  distribution-contract:
    name: Distribution and release contracts
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Validate CLI and distribution contracts
        run: |
          npm test
          npm run brand:test
          npm run brand:check
          npm run website:check
          npm run quota:openapi:check
          npm run lan:check -- --skip-docker
          npm run desktop:check
          npm run upgrade:check
          npm run release:workflow:check
          npm run source:manifest
          npm run pack:check

      - name: Verify Docker smoke fixture and restore contracts
        run: >-
          node --test tools/runtime/docker-smoke.test.mjs
          tools/runtime/installer-workflow.test.mjs
          tools/runtime/smoke-image-reuse-workflow.test.mjs
          tools/runtime/sqlite-restore-smoke.test.mjs
          tools/runtime/handoff-upgrade-smoke.test.mjs
          tools/runtime/upstream-acceptance.test.mjs
          tools/runtime/upstream-acceptance-offline.test.mjs

  credential-maintenance:
    name: Isolated credential maintenance browser and real API
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.run_browser && (github.event.action != 'closed' || github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: '768MiB'
      NODE_OPTIONS: '--max-old-space-size=768'
    steps:
      - name: Checkout qualified source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Wait for this run's exact production build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for credential_attempt in $(seq 1 60); do
            credential_artifact_ready="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts | any(.name == \"myapi-console-build-$GITHUB_SHA\" and .expired == false)")"
            if [ "$credential_artifact_ready" = true ]; then
              exit 0
            fi
            sleep 5
          done
          echo 'This run did not produce the expected frontend build within five minutes.' >&2
          exit 1
      - name: Download this run's exact production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: myapi-console-build-${{ github.sha }}
          path: web
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/myapi-credential-browser" --no-save --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/myapi-credential-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify credential maintenance states on the production build
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-credential-browser-artifacts
        run: node tools/ui/credential-maintenance-browser.mjs
      - name: Qualify credential rotation on the production build
        if: ${{ !cancelled() }}
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-credential-rotation-artifacts
        run: node tools/ui/credential-rotation-browser.mjs
      - name: Verify remaining Key maintenance session boundaries in Chromium
        if: ${{ !cancelled() }}
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-session-browser-artifacts
        run: node tools/ui/maintenance-session-browser.mjs
      - name: Verify real Go migration and proof routes on disposable SQLite
        if: ${{ !cancelled() }}
        env:
          MYAPI_CREDENTIAL_BROWSER_TESTS: '1'
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_CREDENTIAL_RUNTIME_ARTIFACTS: ${{ runner.temp }}/myapi-credential-runtime-artifacts
        run: go test -p 1 ./router -run '^TestTokenMaintenanceRuntimeBrowser$' -count=1 -timeout=240s -v
      - name: Verify real Go rotation, proof and old/new authentication on disposable SQLite
        if: ${{ !cancelled() }}
        env:
          MYAPI_CREDENTIAL_ROTATION_BROWSER_TESTS: '1'
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-credential-browser/node_modules/playwright/index.mjs
          MYAPI_ROTATION_RUNTIME_ARTIFACTS: ${{ runner.temp }}/myapi-rotation-runtime-artifacts
        run: go test -p 1 ./router -run '^TestTokenCredentialRotationRuntimeBrowser$' -count=1 -timeout=240s -v
      - name: Retain original credential screenshots and reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-credential-maintenance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-credential-browser-artifacts/*.png
            ${{ runner.temp }}/myapi-credential-browser-artifacts/*.json
            ${{ runner.temp }}/myapi-credential-rotation-artifacts/*.png
            ${{ runner.temp }}/myapi-credential-rotation-artifacts/*.json
            ${{ runner.temp }}/myapi-credential-runtime-artifacts/**/*.png
            ${{ runner.temp }}/myapi-credential-runtime-artifacts/**/*.json
            ${{ runner.temp }}/myapi-rotation-runtime-artifacts/**/*.png
            ${{ runner.temp }}/myapi-rotation-runtime-artifacts/**/*.json
            ${{ runner.temp }}/myapi-session-browser-artifacts/*.png
            ${{ runner.temp }}/myapi-session-browser-artifacts/*.json
          if-no-files-found: error
          retention-days: 7
