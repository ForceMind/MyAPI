name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:
    inputs:
      run_browser:
        description: 'Explicitly authorize browser installation and browser qualification for this run'
        type: boolean
        default: false
      run_reachability:
        description: 'Collect current Go reachability evidence on dev without deleting code'
        type: boolean
        default: false
      run_cleanup_inventory:
        description: 'Collect current cleanup candidates on dev without changing product code'
        type: boolean
        default: false
      run_container_assessment:
        description: 'Assess container user and existing-volume compatibility on dev without changing deployment defaults'
        type: boolean
        default: false
      run_backup_qualification:
        description: 'Qualify local backup and isolated restore on disposable dev Docker SQLite fixtures'
        type: boolean
        default: false
      run_desktop_backend_qualification:
        description: 'Qualify native macOS then Windows bundled-backend lifecycle without starting a GUI'
        type: boolean
        default: false
      run_deployment_tutorials:
        description: 'Execute source-bound deployment tutorial commands on owned dev fixtures'
        type: boolean
        default: false
      run_i18n_inventory:
        description: 'Collect source-bound seven-language translation candidates without changing locale files'
        type: boolean
        default: false
      baseline_red:
        description: 'Reproduce the personal Key handoff regression on the fixed pre-fix source before testing the candidate'
        type: boolean
        default: false
      body_ui_baseline:
        description: 'Prove body-log pagination and calendar regressions on the fixed pre-fix UI source'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-inventory:
    name: Current seven-language translation inventory
    if: github.event_name == 'workflow_dispatch' && inputs.run_i18n_inventory && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYAPI_I18N_INVENTORY: '1'
    steps:
      - name: Checkout exact inventory source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Verify inventory contracts
        working-directory: web
        run: node --test scripts/report-i18n.test.mjs
      - name: Collect translation candidates and run canonical sync on a copy
        working-directory: web
        run: |
          set -euo pipefail
          test "$(git -c core.fileMode=false rev-parse HEAD 2>&1 | sed '/non-monotonic/d')" = "$GITHUB_SHA"
          node scripts/report-i18n.mjs
          git -c core.fileMode=false diff --exit-code HEAD -- src/i18n scripts/sync-i18n.mjs 2>&1 | sed '/non-monotonic/d'
      - name: Verify source-bound inventory receipt
        run: |
          python3 - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve() / ('myapi-i18n-inventory-' + os.environ['GITHUB_SHA'] + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          filename = root / 'report.json'
          assert root.resolve() == root and filename.resolve() == filename
          directory = root.lstat()
          assert stat.S_ISDIR(directory.st_mode) and directory.st_uid == os.getuid() and stat.S_IMODE(directory.st_mode) == 0o700
          metadata = filename.lstat()
          assert stat.S_ISREG(metadata.st_mode) and metadata.st_uid == os.getuid()
          assert stat.S_IMODE(metadata.st_mode) == 0o600
          with filename.open() as source:
              report = json.load(source)
          assert report['schema_version'] == 1 and report['passed'] is True
          assert report['source_sha'] == os.environ['GITHUB_SHA']
          assert report['run_id'] == os.environ['GITHUB_RUN_ID']
          assert report['run_attempt'] == os.environ['GITHUB_RUN_ATTEMPT']
          assert report['analysis_only'] is True and report['deletion_authorized'] is False
          assert report['translation_accepted'] is False
          assert report['source_files_unchanged'] is True
          assert type(report['canonical_sync']['exit_code']) is int and report['canonical_sync']['exit_code'] == 0
          PY
      - name: Upload source-only translation inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myapi-i18n-inventory-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/myapi-i18n-inventory-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/report.json
          retention-days: 7
          if-no-files-found: error

  deployment-tutorials:
    name: Exact deployment tutorial command qualification
    if: github.event_name == 'workflow_dispatch' && inputs.run_deployment_tutorials && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/deployment-tutorials.yml

  backup-qualification:
    name: Root Docker Full and Lite SQLite backup and isolated restore qualification
    if: github.event_name == 'workflow_dispatch' && inputs.run_backup_qualification && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/backup-qualification.yml

  desktop-backend-qualification:
    name: Native Desktop owned backend lifecycle without GUI
    if: github.event_name == 'workflow_dispatch' && inputs.run_desktop_backend_qualification && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-qualification.yml

  container-assessment:
    name: Container user and old-volume compatibility assessment
    if: github.event_name == 'workflow_dispatch' && inputs.run_container_assessment && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/container-hardening.yml

  cleanup-inventory:
    name: Current private-function and frontend cleanup inventory
    if: github.event_name == 'workflow_dispatch' && inputs.run_cleanup_inventory && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
    uses: ./.github/workflows/cleanup-inventory.yml

  a3-reachability:
    name: A3 current Go reachability evidence
    if: github.event_name == 'workflow_dispatch' && inputs.run_reachability && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/go-reachability.yml
    with:
      source_ref: dev

  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Main CI 38022171765 used 18m36s before the added linux/386 build;
    # candidate CI 38124726661 spent another 2m28s on that build alone.
    # f83f027d CI39738004066 reached the final 180s race command at 29m49s;
    # the job was cancelled just after its 30m limit, before completion.
    # Keep every individual test deadline and bound the entire serial suite.
    timeout-minutes: 35
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Verify connection relationship Go formatting
        run: |
          files=(controller/token.go controller/token_creation_identity_test.go controller/full_content_log.go controller/full_content_log_test.go controller/subscription_share.go controller/subscription_share_connections_test.go model/subscription_share_connections.go model/subscription_share_connections_test.go model/subscription_share_database_test.go router/api-router.go router/full_content_log_segments_test.go)
          unformatted="$(gofmt -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            gofmt -d "${files[@]}"
            exit 1
          fi

      - name: Verify saved content segment contract and truthful truncation
        run: go test -race -p 1 ./controller ./router -run '^Test(FullContentLogSegments|LoadFullContentLogDetail)' -count=1 -timeout=180s -v

      - name: Vet root module
        run: go vet ./...

      - name: Verify saved balance capability and failure semantics
        run: >-
          go test -p 1 ./controller
          -run '^Test(AdvancedBalanceCapability|AdvancedBalanceWithoutQueryRoute|QuotaChangeProjectsLatestCapabilityReason)'
          -count=1 -timeout=90s -v

      - name: Verify scoped management keys and API boundaries
        run: go test -race -p 1 ./model ./service ./middleware ./controller ./router -run '^Test(Management|Operations)' -count=1 -timeout=180s -v

      - name: Verify exact created Key identity without credential disclosure
        run: go test -race -p 1 ./controller -run '^TestAddToken(ReturnsOnlyTheExactCreatedIdentity|RejectedCreationDoesNotReturnAnIdentity)$' -count=1 -timeout=180s -v

      - name: Verify approximate subscription share boundaries
        run: go test -p 1 ./model ./service ./middleware ./controller ./relay/channel -run '^TestSubscriptionShare' -count=1 -timeout=180s

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build root module for linux/386
        env:
          GOOS: linux
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go build ./...

      - name: Verify historical amount behavior on linux/386
        env:
          GOOS: linux
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go env GOOS GOARCH CGO_ENABLED GOWORK
          directed_log="$RUNNER_TEMP/myapi-historical-amount-386.jsonl"
          go test -json -p 1 ./common ./relay/common ./model ./controller ./service \
            -run '^(TestCheckedQuotaBalance|TestCheckedQuotaUsed|TestRelayPreservesStoredUserQuota|TestWideAccountQuotaReserveRefundAndAtomicRollback|TestAdminAdjustmentPreservesWideBalanceAndRejectsOutOfRangeTarget|TestQuotaStateBoundaryFailuresWriteNothingAndRequestLimitStaysInt32|TestHistoricalAmountV3RowsRemainByteAndStateStableDuringInitialization|TestHistoricalAmountV3FingerprintExecutesWithoutIdentityRewrite|TestHistoricalAmountV4WideAggregateReplaysOnce|TestHistoricalAmountCacheOrdersAdjacentQuotaAndAuthVersionsAboveDoublePrecision|TestHistoricalAmountCacheSchemasReplaceOnlyTheTouchedKey|TestTokenQuotaAdjustmentResultPreservesWideAmountsAndExactVersions|TestTokenMetadataPreservesWideQuota|TestTokenQuotaVersionIsExactAndStaleEditsWriteNothing|TestSubscriptionQuotaNotificationPreservesWideRemaining|TestCalculateImageTokensPatchUsesFloatAreaForLargeDimensions|TestCalculateImageTokensRejectsTileQuotaOverflow|TestOfficialTextCostUsesExplicitLongProfileAndTokenBounds)$' -count=1 -timeout=240s | tee "$directed_log"
          python3 - "$directed_log" <<'PY'
          import collections
          import json
          import sys
          from pathlib import Path

          expected = {
              "github.com/ForceMind/MyAPI/common": [
                  "TestCheckedQuotaBalance",
                  "TestCheckedQuotaUsed"
              ],
              "github.com/ForceMind/MyAPI/relay/common": [
                  "TestRelayPreservesStoredUserQuota"
              ],
              "github.com/ForceMind/MyAPI/model": [
                  "TestWideAccountQuotaReserveRefundAndAtomicRollback",
                  "TestAdminAdjustmentPreservesWideBalanceAndRejectsOutOfRangeTarget",
                  "TestQuotaStateBoundaryFailuresWriteNothingAndRequestLimitStaysInt32",
                  "TestHistoricalAmountV3RowsRemainByteAndStateStableDuringInitialization",
                  "TestHistoricalAmountV3FingerprintExecutesWithoutIdentityRewrite",
                  "TestHistoricalAmountV4WideAggregateReplaysOnce",
                  "TestHistoricalAmountCacheOrdersAdjacentQuotaAndAuthVersionsAboveDoublePrecision",
                  "TestHistoricalAmountCacheSchemasReplaceOnlyTheTouchedKey",
                  "TestTokenQuotaAdjustmentResultPreservesWideAmountsAndExactVersions"
              ],
              "github.com/ForceMind/MyAPI/controller": [
                  "TestTokenMetadataPreservesWideQuota",
                  "TestTokenQuotaVersionIsExactAndStaleEditsWriteNothing"
              ],
              "github.com/ForceMind/MyAPI/service": [
                  "TestSubscriptionQuotaNotificationPreservesWideRemaining",
                  "TestCalculateImageTokensPatchUsesFloatAreaForLargeDimensions",
                  "TestCalculateImageTokensRejectsTileQuotaOverflow",
                  "TestOfficialTextCostUsesExplicitLongProfileAndTokenBounds"
              ]
          }
          runs = collections.Counter()
          passes = collections.Counter()
          package_passes = collections.Counter()
          for line in Path(sys.argv[1]).read_text().splitlines():
              event = json.loads(line)
              package = event.get("Package")
              if package not in expected:
                  raise SystemExit("unexpected package in directed 386 run")
              action = event.get("Action")
              test = event.get("Test")
              if action in {"skip", "fail"}:
                  raise SystemExit("directed 386 test or package skipped/failed")
              if test:
                  top = test.split("/", 1)[0]
                  if top not in expected[package]:
                      raise SystemExit("unexpected test in directed 386 run")
                  if test == top and action == "run":
                      runs[(package, top)] += 1
                  if test == top and action == "pass":
                      passes[(package, top)] += 1
              elif action == "pass":
                  package_passes[package] += 1
          required = {(package, name) for package, names in expected.items() for name in names}
          if set(runs) != required or set(passes) != required:
              raise SystemExit("directed 386 run is missing required top-level tests")
          if any(count != 1 for count in runs.values()) or any(count != 1 for count in passes.values()):
              raise SystemExit("directed 386 top-level test did not run/pass exactly once")
          if dict(package_passes) != {package: 1 for package in expected}:
              raise SystemExit("directed 386 package terminal result is missing or duplicated")
          print("HISTORICAL_AMOUNT_386_CONTRACT_PASS " + json.dumps({
              "top_level_pass": len(required), "packages_pass": len(expected),
              "skip": 0, "fail": 0, "tests": sorted(name for _, name in required),
          }, sort_keys=True))
          PY

      # common/canonical_json.go is excluded because a canonical digest has to
      # walk the raw token stream: the wrappers decode into Go values, which
      # discards the number lexeme and key order the digest must preserve.
      - name: Verify root JSON wrapper policy
        run: |
          if git grep -n -E 'json\.(Marshal|Unmarshal|NewDecoder|NewEncoder)' -- '*.go' ':(exclude)**/*_test.go' ':(exclude)common/json.go' ':(exclude)common/canonical_json.go' ':(exclude)relaykit/**'; then
            echo 'root production JSON calls must use common/json.go wrappers' >&2
            exit 1
          fi

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Prove credential rotation and outbound generation compatibility
        run: go test -race -p 1 ./model ./service ./middleware ./relay ./relay/channel ./relay/channel/openai ./controller ./router -run '^Test(TokenCredential|ValidateTokenCredential|BeginTokenCredentialDispatchAdmission|CompleteTokenCredentialDispatchAdmission|ShouldRetryTaskRelayStopsAfterCredentialDispatchAdmission|MidjourneyCredential|MidjourneyAuthoritativeAdmission|PreWssConsumeQuotaAuthoritativeSession|RealtimeCredentialRotation|WebSocketCredentialGeneration|AssignedAccessHTTPDispatchWithoutFailover|VideoProxyPrivateResponses|RelayTask_GateOn_SuccessAcceptedAndReplay)' -count=1 -timeout=180s

      - name: Verify read-only edition command and Lite startup before migration
        run: go test -p 1 . -run '^TestEditionCompatibility' -count=1 -timeout=120s -v

      - name: Test root and relaykit modules
        run: make test

      - name: Verify quota history layering and shared consumers under race detector
        run: go test -race -p 1 ./service ./controller ./router -run '^Test(.*QuotaHistory|QuotaChanges|BuildQuotaChange|SortQuotaChange|CodexUsageHistory|ChannelQuotaChangesRoute)' -count=1 -timeout=180s -v

      - name: Verify Responses to Chat usage compatibility and single settlement
        run: >-
          go test -race -p 1 ./relay/channel/openai ./router
          -run '^Test(ResponsesChat|ResponsesToChat|OaiResponsesToChat|CodexSessionHeaders)'
          -count=1 -timeout=180s -v

      - name: Verify opt-in Codex Chat cache identity boundaries
        run: >-
          go test -race -p 1 ./relay ./relay/common ./router
          -run '^Test(CodexChat|SeedCodexDefaultSession|CodexSessionHeaders)'
          -count=1 -timeout=180s -v

      - name: Verify opt-in Codex upstream diagnostics and dispatch guards
        run: >-
          go test -race -p 1 ./middleware ./router
          -run '^Test(UpstreamDiagnostic|CodexUpstreamDiagnostic|CodexSessionHeaders)'
          -count=1 -timeout=180s -v

      - name: Test historical accounting audit tools
        working-directory: tools/accounting-audit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -v

      - name: Verify configuration publication ordering under race detector
        env:
          GOMAXPROCS: '1'
        run: go test -race -p 1 ./model -run '^TestOption(WritesPublishInCommitOrder|ReloadCannotOverwriteNewerWrite|SaveFailureDoesNotPublishOrHoldSequence|ReloadFailureDoesNotPublishOrHoldSequence)$' -count=1 -timeout=120s

      - name: Verify settings, rate-limit, and request snapshots under race detector
        env:
          GOMAXPROCS: '1'
        run: >-
          go test -race -p 1 ./common ./common/limiter ./types ./setting/config ./setting/model_setting ./setting/operation_setting ./setting/ratio_setting ./setting ./model ./middleware ./controller ./service ./relay/common
          -run '^Test(InMemoryRateLimiter|NewUsesProvidedRedisClient|Allow(RecoversAfterRedisScriptFlush|SetsAndRenewsBucketTTL|RejectsInvalidConfigWithoutWritingBucket|LuaValidationAndInvalidBucketStateDoNotWrite)|UpdateTopupGroupRatio|ValidateTopupGroupRatio|RWMap|LoadFromJsonString|Chats|UserUsableGroups|UpdateAutoGroups|UpdatePayMethods|UpdateConfigFromMap|ValidateConfigFromMap|ConfigManager|ToolPrice|GetClaudeSettings|ClaudeManagedConfig|RelayInfoKeepsCapturedClaudeSettingsDuringConcurrentPublish|ManagedMonitorSetting|GetMonitorSetting|MonitorSetting_|ValidateGeminiThinking|ValidateRatioMapJSON|ValidateNestedRatioMapJSON|RatioJSON|GroupRatio|ManagedGroupRatio|ValidateGroupSpecialUsableGroup|GetGroupSpecialUsableGroup|GetUserUsableGroups|GetUserModelsExpandsAutoGroups|LoadGroupRatio|LoadInvalidGroupRatio|UpdateGroupRatio|InitOptionMapPublishesAlias|GroupSpecialUsableGroupRemains|ExposedData|UpdateModelRequest|ModelRequest|ResolveModelRequest|ValidateModelRequest|EnabledModelRequest|RateLimitTyped|ValidateOptionValue|GenericConfig|ModelSemanticConfig|AuxiliaryOption|NullCollection|MalformedD07|UpdateOptionsBulk|LoadOptionsRejects|RateLimitPersistence|ModelRedisRateLimit|MemoryModelRateLimit|UpdateOptionRatioPersistence|ConfirmPaymentCompliance|S2PaymentComplianceBulkRollbackSQLite).*$'
          -count=1 -timeout=180s

      - name: Verify model discovery and route identity under race detector
        run: go test -race -p 1 ./model ./middleware ./controller ./service ./router -run '^Test(ChannelModel|SelectedModelRoute|ModelRoute|ExplicitModelRoutes|RelayFailover|RelayCooldown|RelayAccountHold|RelayHoldConfigDigest|ChannelAccountAffinity|RetrySafety|FixedPriceTextDispatch|TextDispatchSurvivesLossOfLiveSession)' -count=1 -timeout=180s

      - name: Verify native Chat budgets and funding admission boundaries under race detector
        run: go test -race -p 1 ./model ./service ./controller ./relay/channel/openai ./relay/helper ./router -run '^Test(TokenBudgetChat|StrictChat|StrictTokenBudget|OpenAIPriceCheck|ChatBudget|ChatStreamTerminal|ChatResponseCompletion|OpenaiHandler.*CompletionEvidence|StreamScannerHandler_ExactTerminatorEvidence|TextUsageReviewDisposition|TextUnknownUsagePersistsAcrossBothWriterModes|UsageReview|TokenBudgetRecovery|BillingOperationContext|QuotaBatchStartup|IncidentSynthetic|QuotaTask|SubscriptionTransactionPreConsumeAdmissionErrorIdentity|LegacyBillingSessionSubscription|LegacyBillingSessionWrappedSubscriptionAdmissionErrors|BillingSessionSubscriptionStorageFailureAcrossWriters)' -count=1 -timeout=180s

      - name: Verify assigned access and in-app account events under race detector
        run: go test -race -p 1 ./model ./service/accesspolicy ./service ./middleware ./controller ./router ./relay/channel -run '^Test(AssignedAccess|AssignedPolicy|AssignedModelRoute|NormalizeAssigned|EvaluateAssigned|ChannelQuotaAlert|ChannelQuotaEvents|CodexEventObservation|ListChannelQuotaAlert)' -count=1 -timeout=180s

      - name: Verify credential migration and sampling proofs under race detector
        run: go test -race -p 1 ./model ./service ./controller ./router -run '^Test(TokenMaintenance|TokenAccountMigration|NormalizeTokenAccountMigration|SamplingTargetProof|EnsureSamplingTargetUpgradesLegacyProofState|ValidateTrustedCodexCredentialContinuity)' -count=1 -timeout=180s

      - name: Verify isolated upstream acceptance controls under race detector
        run: go test -race -p 1 ./model ./service ./controller ./relay/channel ./router -run '^TestUpstreamAcceptance' -count=1 -timeout=180s

      - name: Verify io.net and cache codec boundaries under race detector
        env:
          GOMAXPROCS: '1'
        run: go test -race -p 1 ./pkg/ionet ./pkg/cachex -count=2 -timeout=120s

      - name: Verify task billing and logging boundaries under race detector
        env:
          GOMAXPROCS: '1'
        run: go test -race -p 1 ./logger ./model ./service ./relay/channel/task/kling -run 'Test(ConcurrentLog|BlockedInfo|ManualSetupLogger|AutomaticRotation|NewTaskBillingContext|TaskBillingSnapshotRoundTrip|TaskJSON|Recalculate|RefundTask|Settle_|SettleTask|TaskToken|TaskFreeSnapshot|TaskBilling|TaskRecalculate|TaskPollingAudits|UpdateVideoTasks|KlingPollingPreservesDeductionSaturationAudit)' -count=1 -timeout=180s

      - name: Verify durable submission model under race detector
        env:
          GOMAXPROCS: '1'
        run: go test -race -p 1 ./model -run '^Test(B2SubmissionSQLite|TaskQuotaReservation.*|AccountQuotaAndBalanceMigrationsUseBoundedKeysetBatches|AccountQuotaMigrationResumesPartialHeadAfterDatabaseReopen|AccountQuotaMigrationReadsTerminalBeyondFullReceiptPage|QuotaBalanceMigrationRecognizesPaddedLegacyFingerprintWithoutInferringCurrentCacheState)$' -count=1 -timeout=180s

  s1-databases:
    name: S1 identity and options database regression
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: myapi_s1_test
          MYSQL_ROOT_PASSWORD: s1-fixture-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ps1-fixture-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_DB: myapi_s1_test
          POSTGRES_PASSWORD: s1-fixture-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d myapi_s1_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'
      MYAPI_S1_DATABASE_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Verify identity migration and option persistence on disposable databases
        env:
          MYAPI_S1_MYSQL_DSN: root:s1-fixture-password@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/myapi_s1_test?charset=utf8mb4&parseTime=true
          MYAPI_S1_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} user=postgres password=s1-fixture-password dbname=myapi_s1_test sslmode=disable
        run: go test -p 1 ./model -run '^Test((AccessProfile|AssignedAccessPolicy)ConfiguredDatabases|LogResultFilterConfiguredDatabases|LogTokenStatisticsConfiguredDatabases)$' -count=1 -timeout=180s -v

  s2a-databases:
    name: S2-A payment and subscription database regression
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: myapi_s2a_test
          MYSQL_ROOT_PASSWORD: s2a-fixture-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ps2a-fixture-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_DB: myapi_s2a_test
          POSTGRES_PASSWORD: s2a-fixture-password
        ports:
          - 5432/tcp
        options: >-
