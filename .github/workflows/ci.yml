  frontend:
    name: Frontend typecheck and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # Source CI 38450353211 took 15m57s before the workbench seven-language
    # phone/desktop matrix. Keep individual test deadlines and allow bounded
    # margin for the added real browser journeys and runner/install variation.
    # The existing compatibility matrix alone exceeded ten minutes in
    # credential candidate 38902455293; keep all checks and their deadlines.
    # f83f027d needed 29m27s with the 42 connection locale/width journeys.
    # Preserve every assertion and per-action deadline with bounded job margin.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Synchronize frontend translations without changing locale contracts
        run: |
          set -euo pipefail
          bun run i18n:sync
          git -c core.fileMode=false diff --exit-code -- src/i18n/locales/en.json src/i18n/locales/zh.json src/i18n/locales/zh-TW.json src/i18n/locales/fr.json src/i18n/locales/ja.json src/i18n/locales/ru.json src/i18n/locales/vi.json

      - name: Verify frontend source types and lint before regressions
        id: frontend-source-checks
        run: |
          myapi_source_checks_status=0
          bun run typecheck || myapi_source_checks_status=1
          bun run lint || myapi_source_checks_status=1
          exit "$myapi_source_checks_status"

      - name: Verify complete saved content reading without provider traffic
        run: >-
          bun run test src/features/full-content-logs/components/__tests__/request-content-panels.test.tsx
          src/features/full-content-logs/components/__tests__/saved-content-segments.test.tsx
          src/features/full-content-logs/lib/__tests__/saved-segment.test.ts
          src/features/full-content-logs/__tests__/segments-http-scope.test.ts

      - name: Verify scoped reads and complete UI task handoffs
        run: >-
          bun run test src/lib/__tests__/http-client-scope.test.ts
          src/features/keys/__tests__/api-create-identity.test.ts
          src/features/keys/__tests__/key-creation-handoff.test.tsx
          src/features/keys/lib/__tests__/key-expiry.test.ts
          src/features/full-content-logs/__tests__/api-read-limit.test.ts
          src/features/usage-logs/lib/__tests__/request-return-state.test.ts
          src/features/wallet/hooks/__tests__
          src/features/wallet/lib/__tests__
          src/features/wallet/components/__tests__/wallet-session-workspace.test.tsx
          src/features/subscriptions/components/dialogs/__tests__/subscription-payment-session.test.tsx
          src/features/rankings/__tests__/models-section-totals.test.tsx

      - name: Verify Key delivery and saved connection evidence contracts
        run: |
          myapi_client_contract_status=0
          bun run test src/features/keys/lib/__tests__/client-configuration.test.ts \
            src/features/keys/__tests__/key-client-delivery.test.tsx \
            src/features/keys/__tests__/key-detail-layout.test.tsx \
            src/features/keys/components/__tests__/cc-switch-task.test.tsx \
            src/features/keys/components/__tests__/api-key-export-session.test.tsx || myapi_client_contract_status=1
          bun run test src/features/connections/__tests__/saved-windows.test.tsx \
            src/features/channels/components/__tests__/channel-routing-field-editor.test.tsx \
            src/features/connections/__tests__/connection-routing-edit.test.tsx \
            src/features/channels/components/__tests__/channel-inventory-task.test.tsx \
            src/features/channels/components/__tests__/channels-table-open.test.tsx \
            src/features/channels/components/__tests__/channel-workspace-page.test.tsx || myapi_client_contract_status=1
          exit "$myapi_client_contract_status"

      - name: Verify profile and authentication task contracts
        run: bun run test src/features/profile src/features/auth src/components/__tests__/password-input-accessibility.test.tsx src/features/system-info/__tests__/operations-api.test.ts src/features/system-info/__tests__/operations-upgrade-panel.test.tsx

      - name: Verify compact summaries and explicit expansion contracts
        run: >-
          bun run test src/components/__tests__/summary-disclosure.test.tsx
          src/features/connections/__tests__/connection-card-hierarchy.test.tsx
          src/features/connections/__tests__/summary-hierarchy-task.test.tsx
          src/features/dashboard/components/flow/__tests__/analysis-controls-task.test.tsx
          src/features/system-settings/content/__tests__/content-preview-disclosure.test.tsx
          src/features/pricing/components/__tests__/model-catalog-card.test.tsx
          src/features/rankings/__tests__/public-rankings-state.test.tsx

      - name: Verify channel inventory and explicit evidence workspace contracts
        run: >-
          bun run test src/features/channels/components/__tests__/channel-workspace-page.test.tsx
          src/features/channels/components/__tests__/channel-inventory-task.test.tsx
          src/features/channels/components/__tests__/channel-evidence-task.test.tsx
          src/features/channels/components/drawers/__tests__/sensitive-tools-drawer.test.tsx
          src/features/channels/__tests__/channels-permissions.test.tsx

      - name: Verify channel model sources and compact management dialogs
        run: >-
          bun run test src/features/channels/components/drawers/__tests__/channel-model-source.test.tsx
          src/features/channels/components/dialogs/__tests__/discovery-tools-state.test.tsx
          src/features/subscriptions/components/dialogs/__tests__/user-subscriptions-workspace.test.tsx
          src/features/subscriptions/components/dialogs/__tests__/user-subscriptions-recovery.test.tsx
          src/features/models/components/dialogs/__tests__/deployment-tools-state.test.tsx

      - name: Verify wallet, permission and OAuth task disclosures
        run: >-
          bun run test src/features/wallet/components/__tests__/subscription-plans-workspace.test.tsx
          src/features/users/components/__tests__/user-permission-hierarchy.test.tsx
          src/features/access-policy/__tests__/availability-hierarchy.test.tsx
          src/features/access-policy/__tests__/owner-session.test.tsx
          src/features/keys/components/__tests__/api-keys-action-menu.test.tsx
          src/features/system-settings/auth/custom-oauth/components/__tests__/provider-form-task.test.tsx
          src/features/subscriptions/components/dialogs/__tests__/subscription-task-layout.test.tsx

      - name: Verify sensitive guidance and group relationship disclosures
        if: ${{ !cancelled() && steps.frontend-source-checks.outcome == 'success' }}
        run: >-
          bun run test src/features/keys/components/__tests__/credential-maintenance-hierarchy.test.tsx
          src/features/keys/components/__tests__/credential-maintenance-dialog.test.tsx
          src/features/keys/components/__tests__/token-budget-dialog.test.tsx
          src/features/users/components/__tests__/user-usage-policy.test.tsx
          src/features/system-settings/models/__tests__/group-details-disclosure.test.tsx

      - name: Verify remaining settings, analytics and public task contracts
        run: >-
          bun run test src/features/system-settings src/features/system-info
          src/features/dashboard src/features/playground src/features/prompt-learning
          src/features/chat src/features/rankings src/features/legal src/features/about
          src/features/home src/features/setup src/features/errors
          src/components/layout/components/__tests__/public-navigation-scroll.test.tsx
          src/features/channels/__tests__/remaining-ui-api-no-replay.test.ts
          src/features/channels/__tests__/remaining-ui-entry-no-replay.test.tsx
          src/features/models/__tests__/maintenance-no-replay.test.ts

      - name: Verify user, access policy and funding workspace contracts
        run: bun run test src/features/users src/features/access-policy src/features/subscriptions src/features/redemption-codes src/features/wallet

      - name: Verify admin model metadata and editor contracts
        run: bun run test src/features/models

      - name: Verify model catalog, details and presentation contracts
        run: bun run test src/features/pricing

      - name: Verify saved account windows and share presentation contracts
        run: bun run test src/features/personal-upstream src/features/keys/components/__tests__/subscription-share-layout.test.tsx

      - name: Verify API Key workspaces and sensitive-action contracts
        run: bun run test src/features/keys

      - name: Verify connection cards, table, details and read-only contracts
        run: bun run test src/features/connections src/features/channels/components/__tests__ src/features/channels/__tests__/channels-permissions.test.tsx

      - name: Prove pre-fix body pagination and single-calendar regressions
        if: github.event_name == 'workflow_dispatch' && inputs.body_ui_baseline
        run: |
          set -euo pipefail
          saved="$RUNNER_TEMP/body-ui-candidate"
          report="$RUNNER_TEMP/body-ui-baseline-red.json"
          targets=(src/features/full-content-logs/index.tsx src/features/full-content-logs/components/full-content-log-filter-bar.tsx)
          mkdir -p "$saved"
          for index in "${!targets[@]}"; do cp "${targets[$index]}" "$saved/$index"; done
          restore_candidate() { for index in "${!targets[@]}"; do cp "$saved/$index" "${targets[$index]}"; done; }
          trap restore_candidate EXIT
          git -c core.fileMode=false fetch --no-tags --depth=1 origin 37450c2aff368543eb720fa14a39e59b9b5e2b49
          for target in "${targets[@]}"; do git -c core.fileMode=false show "37450c2aff368543eb720fa14a39e59b9b5e2b49:web/$target" > "$target"; done
          set +e
          bun run test src/features/full-content-logs/__tests__/list-pagination.test.tsx src/features/full-content-logs/components/__tests__/filters.test.tsx \
            -t 'page controls request the last page and reset to page one when page size changes|selects a calendar range into the filter draft and submits exact local timestamps only on Search' \
            --reporter=json --outputFile="$report"
          result=$?
          set -e
          [[ "$result" != '0' ]]
          python3 - "$report" <<'PY'
          import json,sys
          report=json.load(open(sys.argv[1]))
          failures=[case for suite in report['testResults'] for case in suite['assertionResults'] if case['status']=='failed']
          assert len(failures)==2, 'Both real UI regressions must fail on pre-fix source'
          for case in failures:
              message='\n'.join(case.get('failureMessages',[]))
              expected='Last page' if case['title'].startswith('page controls') else 'Date Range'
              assert expected in message and ('Unable to find' in message or 'could not find' in message), 'Require missing UI control, not an import failure'
          assert not report.get('unhandledErrors'), 'Initialization errors are not regression evidence'
          print('Both intended pre-fix UI regressions reproduced; candidate source restored next.')
          PY
          restore_candidate
          git -c core.fileMode=false diff --exit-code -- "${targets[@]}"

      - name: Verify request details, log workspaces and return-state contracts
        run: bun run test src/features/usage-logs src/features/full-content-logs src/components/date-time-range-picker src/lib/__tests__/log-pagination.test.ts src/features/keys/__tests__/key-page-url.test.tsx src/features/keys/__tests__/key-recent-requests.test.tsx

      - name: Verify pre-fix personal Key handoff regression
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_red
        run: |
          set -euo pipefail
          target=src/features/playground/hooks/use-playground-options.ts
          saved="$RUNNER_TEMP/personal-key-options-candidate.ts"
          report="$RUNNER_TEMP/myapi-ui-browser-artifacts/personal-key-handoff-baseline-red.json"
          mkdir -p "$(dirname "$report")"
          cp "$target" "$saved"
          trap 'cp "$saved" "$target"' EXIT
          git fetch --no-tags --depth=1 origin 963fabe521e9905c450b2e45968d0d7402488594
          git show 963fabe521e9905c450b2e45968d0d7402488594:web/"$target" > "$target"
          set +e
          bun run test src/features/playground/hooks/__tests__/key-request-lifecycle.test.tsx \
            -t 'selects a handed-off Key only after a fresh available-key response' \
            --reporter=json --outputFile="$report"
          result=$?
          set -e
          [[ "$result" -ne 0 ]]
          python3 - "$report" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1]))
          failures = [case for suite in report['testResults'] for case in suite['assertionResults'] if case['status'] == 'failed']
          assert len(failures) == 1, 'Require the single intended observable regression'
          assert failures[0]['title'] == 'selects a handed-off Key only after a fresh available-key response'
          message = '\n'.join(failures[0].get('failureMessages', []))
          assert 'keyId' in message and '23' in message, 'Require the expected missing Key selection assertion'
          assert not report.get('unhandledErrors'), 'Import or initialization errors are not regression evidence'
          PY
          cp "$saved" "$target"
          git diff --exit-code -- "$target"

      - name: Build real quota UI for browser regression
        if: ${{ !cancelled() && steps.frontend-source-checks.outcome == 'success' }}
        id: frontend-build
        env:
          RAYON_NUM_THREADS: '2'
          NODE_OPTIONS: '--max-old-space-size=1536'
        run: VITE_REACT_APP_VERSION="$(cat ../VERSION)" VITE_BUILD_ID="$GITHUB_SHA" bun run build

      - name: Verify pre-fix Key maintenance session regressions
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dev'
        run: |
          set -euo pipefail
          baseline=7166e7922daeef0b53069610e9ff766105b51d61
          saved="$RUNNER_TEMP/key-maintenance-candidate"
          report="$RUNNER_TEMP/myapi-ui-browser-artifacts/key-maintenance-baseline-red.json"
          mkdir -p "$saved" "$(dirname "$report")"
          targets=(src/features/keys/components/api-keys-mutate-drawer.tsx src/features/keys/components/api-keys-provider.tsx src/features/keys/components/data-table-row-actions.tsx)
          for target in "${targets[@]}"; do cp "$target" "$saved/$(basename "$target")"; done
          restore_candidate() {
            for target in "${targets[@]}"; do cp "$saved/$(basename "$target")" "$target"; done
          }
          trap restore_candidate EXIT
          git fetch --no-tags --depth=1 origin "$baseline"
          for target in "${targets[@]}"; do git show "$baseline:web/$target" > "$target"; done
          set +e
          bun run test src/features/keys/components/__tests__/api-keys-mutate-session.test.tsx \
            src/features/keys/components/__tests__/api-key-export-session.test.tsx \
            -t 'a batch stops after its in-flight creation|a delayed Key reveal cannot open a chat' \
            --reporter=json --outputFile="$report"
          result=$?
          set -e
          [[ "$result" -ne 0 ]]
          python3 - "$report" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1]))
          failures = [case for suite in report['testResults'] for case in suite['assertionResults'] if case['status'] == 'failed']
          assert len(failures) == 8, 'Require all eight intended session-boundary regressions'
          for case in failures:
              assert case['title'].startswith(('a batch stops after its in-flight creation', 'a delayed Key reveal cannot open a chat'))
              message = '\n'.join(case.get('failureMessages', []))
              assert 'called' in message, 'Require an unexpected subsequent write or chat dispatch'
          assert not report.get('unhandledErrors'), 'Import and initialization errors are not regression evidence'
          PY
          restore_candidate
          git diff --exit-code -- "${targets[@]}"

      - name: Prove remaining maintenance authentication regressions on the pre-fix source
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'dev'
        run: |
          set -euo pipefail
          baseline=6ca9cce1b12e6b2061b429ab64c793d6cb8b343d
          saved="$RUNNER_TEMP/remaining-maintenance-candidate"
          report="$RUNNER_TEMP/myapi-ui-browser-artifacts/remaining-maintenance-baseline-red.json"
          mkdir -p "$saved" "$(dirname "$report")"
          targets=(src/features/keys/api.ts src/features/keys/token-budget-api.ts src/features/keys/components/token-budget-dialog.tsx src/features/access-policy/api.ts)
          for target in "${targets[@]}"; do
            mkdir -p "$saved/$(dirname "$target")"
            cp "$target" "$saved/$target"
          done
          restore_remaining_candidate() {
            for target in "${targets[@]}"; do cp "$saved/$target" "$target"; done
          }
          trap restore_remaining_candidate EXIT
          git fetch --no-tags --depth=1 origin "$baseline"
          for target in "${targets[@]}"; do git show "$baseline:web/$target" > "$target"; done
          set +e
          bun run test src/features/keys/components/__tests__/key-maintenance-auth-replay.test.tsx \
            src/features/keys/components/__tests__/budget-session-boundary.test.tsx \
            src/features/access-policy/__tests__/session-api.test.ts \
            -t 'a scoped .* returning 401|a budget (policy|recover) write returning 401|a token policy .* returning 401|a delayed old-SID budget read ending in success' \
            --reporter=json --outputFile="$report"
          result=$?
          set -e
          [[ "$result" -ne 0 ]]
          python3 - "$report" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1]))
          cases = [case for suite in report['testResults'] for case in suite['assertionResults']]
          failures = [case for case in cases if case['status'] == 'failed']
          expected = {
              'a scoped delete returning 401 after a same-user SID change never refreshes or replays',
              'a scoped batch delete returning 401 after a same-user SID change never refreshes or replays',
              'a budget policy write returning 401 never refreshes or replays',
              'a budget recover write returning 401 never refreshes or replays',
              'a delayed old-SID budget read ending in success never enters either session cache',
              *[f'a token policy {action} returning 401 never refreshes or replays' for action in ('read', 'save', 'remove', 'preview', 'owner')],
          }
          assert len(failures) == 10 and {case['title'] for case in failures} == expected, 'Require all ten intended authentication and SID regressions'
          for case in failures:
              message = '\n'.join(case.get('failureMessages', []))
              if case['title'].startswith('a delayed old-SID'):
                  assert '200' in message and 'Unable to find' in message, 'Require the missing fresh SID panel assertion'
              else:
                  assert ('length' in message or 'resolved' in message), 'Require a replay count or unexpectedly resolved write assertion'
          assert not report.get('unhandledErrors'), 'Import or initialization failures are not regression evidence'
          PY
          restore_remaining_candidate
          git diff --exit-code -- "${targets[@]}"

      - name: Retain runnable personal console build
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-console-build-${{ github.sha }}
          path: |
            web/dist/
            web/src/routeTree.gen.ts
          retention-days: 7

      - name: Typecheck
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee "$RUNNER_TEMP/myapi-frontend-typecheck.log"

      - name: Lint
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' }}
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run test 2>&1 | tee "$RUNNER_TEMP/myapi-frontend-tests.log"

      - name: Retain frontend test results before browser qualification
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-frontend-tests-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-frontend-tests.log
            ${{ runner.temp }}/myapi-frontend-typecheck.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record browser authorization
        if: always()
        env:
          RUN_BROWSER: ${{ github.event_name == 'workflow_dispatch' && inputs.run_browser && '1' || '0' }}
        run: |
          if [[ "$RUN_BROWSER" == '1' ]]; then
            echo 'Browser qualification explicitly enabled for this manual run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Browser qualification: not run (no explicit authorization). 浏览器未验证。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install isolated browser test dependencies
        id: browser-dependencies
        if: ${{ !cancelled() && steps.frontend-build.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.run_browser }}
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/myapi-browser" --no-save --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/myapi-browser/node_modules/.bin/playwright" install --with-deps chromium

      # Run the changed maintenance flows first so driver failures surface
      # before the longer unchanged browser matrices. All suites still run.
      - name: Qualify advanced personal maintenance in Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-advanced-maintenance-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: |
          scripts=(window-maintenance model-scope security-maintenance)
          pids=()
          for name in "${scripts[@]}"; do
            node "tools/ui/$name-browser.mjs" > "$RUNNER_TEMP/advanced-$name.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for index in "${!scripts[@]}"; do
            if ! wait "${pids[$index]}"; then
              echo "::error file=tools/ui/${scripts[$index]}-browser.mjs::Advanced maintenance qualification failed"
              failed=1
            fi
            cat "$RUNNER_TEMP/advanced-${scripts[$index]}.log"
          done
          exit "$failed"

      - name: Upload advanced maintenance screenshots and reports
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-advanced-maintenance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-advanced-maintenance-artifacts/*.png
            ${{ runner.temp }}/myapi-advanced-maintenance-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify real quota charts and responsive interactions
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-quota-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/quota/browser-smoke.mjs

      - name: Verify model discovery and routing workflow in real Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-routing-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/routing/browser-smoke.mjs

      - name: Verify assigned access and account events in real Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-access-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/access-policy/browser-smoke.mjs

      - name: Qualify personal console pages and native-window shares in Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-personal-console-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: |
          failed=0
          node --test tools/ui/browser-fixtures.test.mjs tools/ui/connection-key-browser-fixtures.test.mjs tools/ui/key-request-preview.test.mjs || failed=1
          for script in \
            tools/ui/personal-workbench-browser.mjs \
            tools/ui/subscription-share-browser.mjs \
            tools/ui/personal-console-browser.mjs \
            tools/ui/connections-browser.mjs \
            tools/ui/key-request-browser.mjs; do
            if ! node "$script"; then
              echo "::error file=$script::Personal console qualification failed"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload personal console screenshots and qualification reports
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-personal-console-${{ github.sha }}
          path: |
            ${{ runner.temp }}/myapi-personal-console-artifacts/*.png
            ${{ runner.temp }}/myapi-personal-console-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Qualify shared UI, roles, settings and responsive pages in Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-ui-browser-artifacts
