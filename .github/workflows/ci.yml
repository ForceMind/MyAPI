name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:
    inputs:
      native_only:
        description: Run only isolated historical-accounting native contracts
        required: false
        default: false
        type: boolean
      expected_sha:
        description: Full 40-character lowercase HEAD SHA of the native validation branch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged == true) &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.native_only == 'true')
    runs-on: ubuntu-latest
    # Main CI 38022171765 used 18m36s before the added linux/386 build;
    # candidate CI 38124726661 spent another 2m28s on that build alone.
    # Keep every test deadline and allow bounded time for the serial suite.
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build root module for linux/386
        env:
          GOOS: linux
          GOARCH: '386'
          CGO_ENABLED: '0'
        run: go build ./...

      # common/canonical_json.go is excluded because a canonical digest has to
      # walk the raw token stream: the wrappers decode into Go values, which
      # discards the number lexeme and key order the digest must preserve.
      - name: Verify root JSON wrapper policy
        run: |
          if git grep -n -E 'json\.(Marshal|Unmarshal|NewDecoder|NewEncoder)' -- '*.go' ':(exclude)**/*_test.go' ':(exclude)common/json.go' ':(exclude)common/canonical_json.go' ':(exclude)relaykit/**'; then
            echo 'root production JSON calls must use common/json.go wrappers' >&2
            exit 1
          fi

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

      - name: Test historical accounting audit tools
        working-directory: tools/accounting-audit
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -v

      - name: Verify configuration publication ordering under race detector
        env:
          GOMAXPROCS: '1'
        run: go test -race -p 1 ./model -run '^TestOption(WritesPublishInCommitOrder|ReloadCannotOverwriteNewerWrite|SaveFailureDoesNotPublishOrHoldSequence|ReloadFailureDoesNotPublishOrHoldSequence)$' -count=1 -timeout=120s

      - name: Verify settings, rate-limit, and request snapshots under race detector
        env:
          GOMAXPROCS: '1'
        run: >-
          go test -race -p 1 ./common ./common/limiter ./types ./setting/config ./setting/model_setting ./setting/operation_setting ./setting/ratio_setting ./setting ./model ./middleware ./controller ./service ./relay/common
          -run '^Test(InMemoryRateLimiter|NewUsesProvidedRedisClient|Allow(RecoversAfterRedisScriptFlush|SetsAndRenewsBucketTTL|RejectsInvalidConfigWithoutWritingBucket|LuaValidationAndInvalidBucketStateDoNotWrite)|UpdateTopupGroupRatio|ValidateTopupGroupRatio|RWMap|LoadFromJsonString|Chats|UserUsableGroups|UpdateAutoGroups|UpdatePayMethods|UpdateConfigFromMap|ValidateConfigFromMap|ConfigManager|ToolPrice|GetClaudeSettings|ClaudeManagedConfig|RelayInfoKeepsCapturedClaudeSettingsDuringConcurrentPublish|ManagedMonitorSetting|GetMonitorSetting|MonitorSetting_|ValidateGeminiThinking|ValidateRatioMapJSON|ValidateNestedRatioMapJSON|RatioJSON|GroupRatio|ManagedGroupRatio|ValidateGroupSpecialUsableGroup|GetGroupSpecialUsableGroup|GetUserUsableGroups|GetUserModelsExpandsAutoGroups|LoadGroupRatio|LoadInvalidGroupRatio|UpdateGroupRatio|InitOptionMapPublishesAlias|GroupSpecialUsableGroupRemains|ExposedData|UpdateModelRequest|ModelRequest|ResolveModelRequest|ValidateModelRequest|EnabledModelRequest|RateLimitTyped|ValidateOptionValue|GenericConfig|ModelSemanticConfig|AuxiliaryOption|NullCollection|MalformedD07|UpdateOptionsBulk|LoadOptionsRejects|RateLimitPersistence|ModelRedisRateLimit|MemoryModelRateLimit|UpdateOptionRatioPersistence|ConfirmPaymentCompliance|S2PaymentComplianceBulkRollbackSQLite).*$'
          -count=1 -timeout=180s

      - name: Verify model discovery and route identity under race detector
        run: go test -race -p 1 ./model ./middleware ./controller ./service ./router -run '^Test(ChannelModel|SelectedModelRoute|ModelRoute|ExplicitModelRoutes|RelayFailover|RelayCooldown|RelayAccountHold|RelayHoldConfigDigest|ChannelAccountAffinity|RetrySafety|FixedPriceTextDispatch|TextDispatchSurvivesLossOfLiveSession)' -count=1 -timeout=180s

      - name: Verify native Chat budgets and funding admission boundaries under race detector
        run: go test -race -p 1 ./model ./service ./controller ./relay/channel/openai ./router -run '^Test(TokenBudgetChat|StrictChat|OpenAIPriceCheck|ChatBudget|ChatStreamTerminal|UsageReview|TokenBudgetRecovery|BillingOperationContext|QuotaBatchStartup|IncidentSynthetic|QuotaTask|SubscriptionTransactionPreConsumeAdmissionErrorIdentity|LegacyBillingSessionSubscription|LegacyBillingSessionWrappedSubscriptionAdmissionErrors|BillingSessionSubscriptionStorageFailureAcrossWriters)' -count=1 -timeout=180s

      - name: Verify assigned access and in-app account events under race detector
        run: go test -race -p 1 ./model ./service/accesspolicy ./service ./middleware ./controller ./router ./relay/channel -run '^Test(AssignedAccess|AssignedPolicy|AssignedModelRoute|NormalizeAssigned|EvaluateAssigned|ChannelQuotaAlert|ChannelQuotaEvents|CodexEventObservation|ListChannelQuotaAlert)' -count=1 -timeout=180s

      - name: Verify io.net and cache codec boundaries under race detector
        env:
          GOMAXPROCS: '1'
        run: go test -race -p 1 ./pkg/ionet ./pkg/cachex -count=2 -timeout=120s

      - name: Verify task billing and logging boundaries under race detector
        env:
          GOMAXPROCS: '1'
        run: go test -race -p 1 ./logger ./model ./service ./relay/channel/task/kling -run 'Test(ConcurrentLog|BlockedInfo|ManualSetupLogger|AutomaticRotation|NewTaskBillingContext|TaskBillingSnapshotRoundTrip|TaskJSON|Recalculate|RefundTask|Settle_|SettleTask|TaskToken|TaskFreeSnapshot|TaskBilling|TaskRecalculate|TaskPollingAudits|UpdateVideoTasks|KlingPollingPreservesDeductionSaturationAudit)' -count=1 -timeout=180s

      - name: Verify durable submission model under race detector
        env:
          GOMAXPROCS: '1'
        run: go test -race -p 1 ./model -run '^Test(B2SubmissionSQLite|TaskQuotaReservation.*|AccountQuotaAndBalanceMigrationsUseBoundedKeysetBatches|AccountQuotaMigrationResumesPartialHeadAfterDatabaseReopen|AccountQuotaMigrationReadsTerminalBeyondFullReceiptPage|QuotaBalanceMigrationRecognizesPaddedLegacyFingerprintWithoutInferringCurrentCacheState)$' -count=1 -timeout=180s

  s1-databases:
    name: S1 identity and options database regression
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged == true) &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.native_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: myapi_s1_test
          MYSQL_ROOT_PASSWORD: s1-fixture-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ps1-fixture-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_DB: myapi_s1_test
          POSTGRES_PASSWORD: s1-fixture-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d myapi_s1_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'
      MYAPI_S1_DATABASE_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Verify identity migration and option persistence on disposable databases
        env:
          MYAPI_S1_MYSQL_DSN: root:s1-fixture-password@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/myapi_s1_test?charset=utf8mb4&parseTime=true
          MYAPI_S1_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} user=postgres password=s1-fixture-password dbname=myapi_s1_test sslmode=disable
        run: go test -p 1 ./model -run '^Test(AccessProfile|AssignedAccessPolicy)ConfiguredDatabases$' -count=1 -timeout=180s -v

  s2a-databases:
    name: S2-A payment and subscription database regression
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged == true) &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.native_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: myapi_s2a_test
          MYSQL_ROOT_PASSWORD: s2a-fixture-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ps2a-fixture-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_DB: myapi_s2a_test
          POSTGRES_PASSWORD: s2a-fixture-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d myapi_s2a_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'
      MYAPI_S2A_DATABASE_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Verify payment transactions on disposable databases
        env:
          MYAPI_S2A_MYSQL_DSN: root:s2a-fixture-password@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/myapi_s2a_test?charset=utf8mb4&parseTime=true
          MYAPI_S2A_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} user=postgres password=s2a-fixture-password dbname=myapi_s2a_test sslmode=disable
        run: go test -p 1 ./model -run '^TestS2APaymentConfiguredDatabases$' -count=1 -timeout=180s -v

  b2-databases:
    name: B2 durable submission database regression
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged == true) &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.native_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: myapi_b2_test
          MYSQL_ROOT_PASSWORD: b2-fixture-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pb2-fixture-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_DB: myapi_b2_test
          POSTGRES_PASSWORD: b2-fixture-password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d myapi_b2_test"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'
      MYAPI_B2_DATABASE_TESTS: '1'
      TASK_RECOVERY_IDEMPOTENCY_SECRET: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Verify durable submissions on disposable databases
        env:
          MYAPI_B2_MYSQL_DSN: root:b2-fixture-password@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/myapi_b2_test?charset=utf8mb4&parseTime=true
          MYAPI_B2_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} user=postgres password=b2-fixture-password dbname=myapi_b2_test sslmode=disable
        run: go test -p 1 ./model -run '^TestB2SubmissionConfiguredDatabases$' -count=1 -timeout=180s -v

      - name: Verify quota identity migration and account projection on disposable databases
        env:
          MYAPI_B2_MYSQL_DSN: root:b2-fixture-password@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/myapi_b2_test?charset=utf8mb4&parseTime=true
          MYAPI_B2_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports[5432] }} user=postgres password=b2-fixture-password dbname=myapi_b2_test sslmode=disable
        run: |
          go test -p 1 ./model -run '^Test(ChannelQuotaIdentity|OfficialPriceVersion|R1UsageReview|PricePublication|TokenBudget|PlaygroundToken|RelayAccountHold|OpenAIPriceCheck|ChannelQuotaAlert)ConfiguredDatabases$' -count=1 -timeout=180s -v
          go test -p 1 ./model -run '^TestAccountQuotaConfiguredSchema(MySQLAndPostgres|SQLite)$' -count=1 -timeout=180s -v
          go test -p 1 ./model -run '^TestChannelModel(Discovery|Route)ConfiguredDatabases$' -count=1 -timeout=180s -v
          go test -p 1 ./model -run '^TestPostgresRepeatedMigrationPreservesDefaults$' -count=1 -timeout=180s -v

  b2-clickhouse:
    name: B2 ClickHouse log migration regression
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged == true) &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.native_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: myapi_b2_clickhouse_test
          CLICKHOUSE_USER: b2_fixture
          CLICKHOUSE_PASSWORD: b2-fixture-password
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports:
          - 9000/tcp
        options: >-
          --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'
      MYAPI_B2_CLICKHOUSE_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Verify ClickHouse logs migration on a disposable database
        env:
          MYAPI_B2_CLICKHOUSE_DSN: clickhouse://b2_fixture:b2-fixture-password@127.0.0.1:${{ job.services.clickhouse.ports[9000] }}/myapi_b2_clickhouse_test
        run: go test -p 1 ./model -run '^TestB2ClickHouseConfiguredDatabase$' -count=1 -timeout=180s -v

  s2c-redis:
    name: S2-C quota script Redis regression
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged == true) &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.native_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'
      MYAPI_S2C_REDIS_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Verify quota scripts on disposable Redis
        env:
          MYAPI_S2C_REDIS_ADDR: 127.0.0.1:${{ job.services.redis.ports[6379] }}
        run: go test -p 1 ./model -run '^TestS2CQuotaConfiguredRedis$' -count=1 -timeout=120s -v

  c09-redis-limiter:
    name: S2-C09 Redis limiter lifecycle regression
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged == true) &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.native_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      GOWORK: 'off'
      GOMAXPROCS: '1'
      GOMEMLIMIT: '768MiB'
      MYAPI_S2C_REDIS_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Verify limiter lifecycle on disposable Redis
        env:
          MYAPI_S2C_REDIS_ADDR: 127.0.0.1:${{ job.services.redis.ports[6379] }}
        run: go test -p 1 ./common/limiter -run '^TestS2CLimiterConfiguredRedis$' -count=1 -timeout=120s -v

  frontend:
    name: Frontend typecheck and test
    if: >-
      (github.event.action != 'closed' || github.event.pull_request.merged == true) &&
      !(github.event_name == 'workflow_dispatch' && github.event.inputs.native_only == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || github.repository }}
          persist-credentials: false
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build real quota UI for browser regression
        env:
          RAYON_NUM_THREADS: '2'
          NODE_OPTIONS: '--max-old-space-size=1536'
        run: bun run build

      - name: Install isolated browser test dependencies
        id: browser-dependencies
        working-directory: .
        run: |
          npm install --prefix "$RUNNER_TEMP/myapi-browser" --no-save --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/myapi-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify real quota charts and responsive interactions
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-quota-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/quota/browser-smoke.mjs

      - name: Verify model discovery and routing workflow in real Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-routing-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/routing/browser-smoke.mjs

      - name: Verify assigned access and account events in real Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-access-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: node tools/access-policy/browser-smoke.mjs

      - name: Qualify shared UI, roles, settings and responsive pages in Chromium
        if: ${{ !cancelled() && steps.browser-dependencies.outcome == 'success' }}
        working-directory: .
        env:
          MYAPI_PLAYWRIGHT_MODULE: ${{ runner.temp }}/myapi-browser/node_modules/playwright/index.mjs
          MYAPI_BROWSER_ARTIFACTS: ${{ runner.temp }}/myapi-ui-browser-artifacts
          NODE_OPTIONS: '--max-old-space-size=768'
        run: |
          node --test tools/ui/browser-fixtures.test.mjs
          node tools/ui/profile-browser.mjs
          node tools/ui/browser-smoke.mjs
          node tools/ui/playground-browser.mjs

      - name: Upload full UI screenshots and qualification report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-ui-browser-${{ github.sha }}
