      - name: Upload quota browser screenshots
        if: ${{ always() && steps.browser-dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
