name: Check MyAPI static website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/website/**'
      - 'tools/branding/**'
      - 'package.json'
      - '.github/workflows/website-check.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'tools/website/**'
      - 'tools/branding/**'
      - 'package.json'
      - '.github/workflows/website-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    name: Validate static website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check website/script.js

      - name: Check website structure and assets
        run: node tools/website/check-static.mjs

      - name: Audit public brand references
        run: npm run brand:check
