name: Build MyAPI release artifacts (manual)
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing semantic version tag (for example, v0.1.2)'
        required: true
        type: string
      confirm:
        description: 'Type PUBLISH only after maintainer approval and release review'
        required: true
        type: string

concurrency:
  group: myapi-stable-latest-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate MyAPI release input
    if: ${{ inputs.confirm == 'PUBLISH' && vars.MYAPI_ENABLE_RELEASE == 'true' }}
    environment: github-release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - name: Checkout requested tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Validate tag, version, and publish gate
        id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_GATE: ${{ vars.MYAPI_ENABLE_RELEASE }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$PUBLISH_GATE" != "true" || "$CONFIRM" != "PUBLISH" ]]; then
            echo "::error::Release is disabled or not explicitly confirmed. Set MYAPI_ENABLE_RELEASE=true and enter PUBLISH only after approval."
            exit 1
          fi
          if ! node tools/release/semver.mjs validate-tag "$RELEASE_TAG"; then
            echo "::error::Tag must be an exact semantic version beginning with v"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == "v0.1.0" || "$RELEASE_TAG" == "v0.1.1" ]]; then
            echo "::error::$RELEASE_TAG is a protected legacy tag; create a new release tag"
            exit 1
          fi
          if ! git rev-parse "refs/tags/$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            echo "::error::Tag '$RELEASE_TAG' does not exist"
            exit 1
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$FILE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::VERSION ($FILE_VERSION) does not match $RELEASE_TAG"
            exit 1
          fi
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match $RELEASE_TAG"
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$HEAD_SHA" != "$TAG_SHA" ]]; then
            echo "::error::Checked out commit does not match tag $RELEASE_TAG"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: Linux Release
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && inputs.confirm == 'PUBLISH' && vars.MYAPI_ENABLE_RELEASE == 'true' }}
    environment: github-release
    timeout-minutes: 45
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Determine Version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION VITE_BUILD_ID=${{ needs.prepare.outputs.sha }} bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (amd64)
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          [[ "$MODULE_PATH" == "github.com/ForceMind/MyAPI" ]] || { echo "::error::unexpected Go module path: $MODULE_PATH"; exit 1; }
          GOMAXPROCS=2 go build -p 2 -ldflags "-s -w -X '${MODULE_PATH}/common.Version=$VERSION' -extldflags '-static'" -o my-api-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          MODULE_PATH="$(go list -m)"
          [[ "$MODULE_PATH" == "github.com/ForceMind/MyAPI" ]] || { echo "::error::unexpected Go module path: $MODULE_PATH"; exit 1; }
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 GOMAXPROCS=2 go build -p 2 -ldflags "-s -w -X '${MODULE_PATH}/common.Version=$VERSION' -extldflags '-static'" -o my-api-arm64-$VERSION
      - name: Generate checksums
        run: sha256sum my-api-* > checksums-linux.txt

      - name: Upload Linux release assets
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-release-linux
          path: |
            my-api-*
            checksums-linux.txt
          if-no-files-found: error

  macos:
    name: macOS Release
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && inputs.confirm == 'PUBLISH' && vars.MYAPI_ENABLE_RELEASE == 'true' }}
    environment: github-release
    timeout-minutes: 45
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Determine Version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION VITE_BUILD_ID=${{ needs.prepare.outputs.sha }} bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          [[ "$MODULE_PATH" == "github.com/ForceMind/MyAPI" ]] || { echo "::error::unexpected Go module path: $MODULE_PATH"; exit 1; }
          GOMAXPROCS=2 go build -p 2 -ldflags "-X '${MODULE_PATH}/common.Version=$VERSION'" -o my-api-macos-$VERSION
      - name: Generate checksums
        run: shasum -a 256 my-api-macos-* > checksums-macos.txt

      - name: Upload macOS release assets
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-release-macos
          path: |
            my-api-macos-*
            checksums-macos.txt
          if-no-files-found: error

  windows:
    name: Windows Release
    needs: prepare
    if: ${{ needs.prepare.result == 'success' && inputs.confirm == 'PUBLISH' && vars.MYAPI_ENABLE_RELEASE == 'true' }}
    environment: github-release
    timeout-minutes: 45
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Determine Version
        run: echo "VERSION=${{ needs.prepare.outputs.version }}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION VITE_BUILD_ID=${{ needs.prepare.outputs.sha }} bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          [[ "$MODULE_PATH" == "github.com/ForceMind/MyAPI" ]] || { echo "::error::unexpected Go module path: $MODULE_PATH"; exit 1; }
          GOMAXPROCS=2 go build -p 2 -ldflags "-s -w -X '${MODULE_PATH}/common.Version=$VERSION'" -o my-api-$VERSION.exe
      - name: Generate checksums
        run: sha256sum my-api-*.exe > checksums-windows.txt

      - name: Upload Windows release assets
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-release-windows
          path: |
            my-api-*.exe
            checksums-windows.txt
          if-no-files-found: error

  finalize:
    name: Create MyAPI GitHub Release
    needs: [prepare, linux, macos, windows]
    if: ${{ needs.prepare.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' && inputs.confirm == 'PUBLISH' && vars.MYAPI_ENABLE_RELEASE == 'true' }}
    environment: github-release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download platform release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: myapi-release-*
          path: release-assets
          merge-multiple: false
      - name: Refuse stable latest rollback
        if: ${{ needs.prepare.outputs.prerelease != 'true' }}
        env:
          CANDIDATE_VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp 2>release-query-error.txt)"
          query_status=$?
          set -e
          if [[ "$query_status" -ne 0 ]]; then
            cat release-query-error.txt >&2
            echo "::error::could not determine the current GitHub stable release"
            exit 1
          fi
          current_tag="$(printf '%s' "$releases_json" | node tools/release/semver.mjs latest-stable-release-tag)"
          if [[ -n "$current_tag" ]] && ! node tools/release/semver.mjs can-advance-stable-latest "$CANDIDATE_VERSION" "${current_tag#v}"; then
            echo "::error::refusing to move GitHub latest from $current_tag to v$CANDIDATE_VERSION"
            exit 1
          fi
      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: |
            release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
