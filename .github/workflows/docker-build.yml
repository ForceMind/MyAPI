name: Build MyAPI release images

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (for example, v0.1.1)'
        required: true
        type: string

concurrency:
  group: myapi-ghcr-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.edition }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            edition: full
            image_repository: ghcr.io/forcemind/myapi
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            edition: full
            image_repository: ghcr.io/forcemind/myapi
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            edition: lan
            image_repository: ghcr.io/forcemind/myapi-lan
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            edition: lan
            image_repository: ghcr.io/forcemind/myapi-lan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Resolve tag & write VERSION
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          IMAGE_REPOSITORY: ${{ matrix.image_repository }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must be an exact semantic version beginning with v"
            exit 1
          fi
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' does not exist"
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$HEAD_SHA" != "$TAG_SHA" ]]; then
            echo "::error::Checked out commit does not match tag $TAG"
            exit 1
          fi
          EXPECTED_VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$FILE_VERSION" != "$EXPECTED_VERSION" || "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::VERSION and package.json must match ${EXPECTED_VERSION}"
            exit 1
          fi
          LATEST_TAG=""
          if [[ "$TAG" != *-* ]]; then
            LATEST_TAG="${IMAGE_REPOSITORY}:latest-${{ matrix.arch }}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image_repository=${IMAGE_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "${TAG}" > VERSION
          echo "Building MyAPI ${{ matrix.edition }} tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image_repository }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ steps.version.outputs.image_repository }}:${{ env.TAG }}-${{ matrix.arch }}
            ${{ steps.version.outputs.latest_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MYAPI_EDITION=${{ matrix.edition }}
            MYAPI_BRAND_NAME=MyAPI
            MYAPI_BRAND_LOGO=/myapi-logo-v1.png
            MYAPI_BUILD_PARALLELISM=2
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes "${IMAGE_REPOSITORY}@${{ steps.build.outputs.digest }}"

      - name: Image summary
        run: |
          echo "### GHCR Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_REPOSITORY}:${TAG}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests (${{ matrix.edition }})
    needs: [build_single_arch]
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: full
            image_repository: ghcr.io/forcemind/myapi
          - edition: lan
            image_repository: ghcr.io/forcemind/myapi-lan
    runs-on: ubuntu-latest

    permissions:
      packages: write
      id-token: write

    steps:
      - name: Set version
        run: |
          echo "TAG=${{ inputs.tag || github.ref_name }}" >> $GITHUB_ENV
          echo "IMAGE_REPOSITORY=${{ matrix.image_repository }}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_REPOSITORY}:${TAG}" \
            "${IMAGE_REPOSITORY}:${TAG}-amd64" \
            "${IMAGE_REPOSITORY}:${TAG}-arm64"

      - name: Create & push manifest (latest stable)
        if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_REPOSITORY}:latest" \
            "${IMAGE_REPOSITORY}:latest-amd64" \
            "${IMAGE_REPOSITORY}:latest-arm64"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifests with cosign
        run: |
          cosign sign --yes "${IMAGE_REPOSITORY}:${TAG}"
          if [[ "$TAG" != *-* ]]; then
            cosign sign --yes "${IMAGE_REPOSITORY}:latest"
          fi

      - name: Manifest summary
        run: |
          echo "### GHCR Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${TAG}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
