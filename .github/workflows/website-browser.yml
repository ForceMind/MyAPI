name: Browser smoke test for MyAPI website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'tools/website/browser-smoke.mjs'
      - '.github/workflows/website-browser.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'tools/website/browser-smoke.mjs'
      - '.github/workflows/website-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Mobile Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install browser runner
        run: npm install --no-save --ignore-scripts playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile website smoke test
        run: node tools/website/browser-smoke.mjs

      - name: Upload mobile screenshot
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: myapi-website-mobile-${{ github.sha }}
          path: artifacts/myapi-website-mobile.png
          if-no-files-found: ignore
          retention-days: 7
