name: Publish MyAPI npm distribution

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: myapi-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Use trusted-publishing-compatible npm
        run: npm install --global npm@11.5.1
      - name: Verify version and clean source state
        run: npm run release:state
      - name: Test backend
        run: |
          go test ./model ./controller ./middleware
          (cd relaykit && GOWORK=off go test ./...)
      - name: Test and build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          node ./node_modules/vitest/vitest.mjs run
          bun run build
          VITE_SELF_USE_MINIMAL=true bun run build
      - name: Build release container
        run: docker build --tag myapi-release-check:${{ github.sha }} .
      - name: Verify CLI, manifest, and package contents
        run: npm run release:check
      - name: Show runtime versions
        run: |
          node --version
          npm --version
      - name: Publish with provenance
        run: npm publish --access public --provenance
