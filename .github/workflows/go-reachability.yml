name: Go reachability evidence

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: dev
        required: true
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Analyze dev only; no deletion, release, or deployment'
        required: true
        type: choice
        options: [dev]
        default: dev

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: '3GiB'
    defaults:
      run:
        shell: bash
    steps:
      - name: Require manual dev request
        env:
          REQUESTED_REF: ${{ inputs.source_ref }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/dev
          test "$REQUESTED_REF" = dev

      - name: Checkout requested source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up repository-standard Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Record exact source and evidence location
        id: source
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          test "$(git -c core.fileMode=false rev-parse HEAD)" = "$GITHUB_SHA"
          evidence_dir="$RUNNER_TEMP/go-reachability-$TARGET_GOOS-$TARGET_GOARCH"
          tool_bin_dir="$RUNNER_TEMP/go-reachability-bin"
          mkdir -p "$evidence_dir" "$tool_bin_dir"
          printf 'EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"
          printf 'TOOL_BIN_DIR=%s\n' "$tool_bin_dir" >> "$GITHUB_ENV"
          node --version | tee "$evidence_dir/node-version.txt"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          const metadata = {
            sourceSha: process.env.GITHUB_SHA,
            tool: { module: 'golang.org/x/tools/cmd/deadcode', version: 'v0.38.0' },
            target: { goos: process.env.TARGET_GOOS, goarch: process.env.TARGET_GOARCH },
            run: { id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT },
            analysis_only: true, deletion_authorized: false,
            environment: { cgo_enabled: '0', build_tags: [], gowork: 'off' },
          };
          const directory = path.join(process.env.RUNNER_TEMP, `go-reachability-${metadata.target.goos}-${metadata.target.goarch}`);
          writeFileSync(path.join(directory, 'metadata.json'), JSON.stringify(metadata, null, 2) + '\n');
          console.log(JSON.stringify({ type: 'reachability_source', ...metadata }));
          JS

      - name: Verify report contract with synthetic fixtures
        run: node --test tools/go-reachability/summarize.test.mjs

      - name: Set up pinned repository Go version
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Install and verify pinned native analysis tool
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          export GOBIN="$TOOL_BIN_DIR"
          go telemetry off
          go version | tee "$EVIDENCE_DIR/go-version.txt"
          go install golang.org/x/tools/cmd/deadcode@v0.38.0
          go version -m "$TOOL_BIN_DIR/deadcode" | tee "$EVIDENCE_DIR/deadcode-go-info.txt"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const info = readFileSync(path.join(process.env.EVIDENCE_DIR, 'deadcode-go-info.txt'), 'utf8');
          if (!/^\s*path\s+golang\.org\/x\/tools\/cmd\/deadcode\s*$/m.test(info) ||
              !/^\s*mod\s+golang\.org\/x\/tools\s+v0\.38\.0(?:\s|$)/m.test(info)) {
            throw new Error('Installed deadcode does not match the required pin');
          }
          JS

      - name: Create runner-only frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Build root for target without executing project programs
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOFLAGS: '-mod=readonly'
        run: go build -p 1 ./... 2>&1 | tee "$EVIDENCE_DIR/root-build.log"

      - name: Build relaykit independently for target
        working-directory: relaykit
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOFLAGS: '-mod=readonly'
        run: go build -p 1 ./... 2>&1 | tee "$EVIDENCE_DIR/relaykit-build.log"

      - name: Capture all three real analysis exit statuses
        id: scans
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOFLAGS: '-mod=readonly -p=1'
        run: |
          any_failure=0
          run_scan() {
            local label="$1"
            local directory="$2"
            shift 2
            local status=0
            set +e
            (cd "$directory" && "$TOOL_BIN_DIR/deadcode" -generated -json -filter '^github[.]com/ForceMind/MyAPI($|/)' "$@" ./...) > "$EVIDENCE_DIR/$label.json" 2> "$EVIDENCE_DIR/$label.stderr"
            status=$?
            set -e
            printf '%s\n' "$status" > "$EVIDENCE_DIR/$label.exit"
            printf 'scan=%s target=%s/%s actual_exit=%s\n' "$label" "$GOOS" "$GOARCH" "$status"
            cat "$EVIDENCE_DIR/$label.stderr"
            if [ "$status" -ne 0 ]; then
              any_failure=1
            fi
          }
          run_scan root-production "$GITHUB_WORKSPACE"
          run_scan root-with-tests "$GITHUB_WORKSPACE" -test
          run_scan relaykit-with-tests "$GITHUB_WORKSPACE/relaykit" -test
          exit "$any_failure"

      - name: Verify dependency manifests were not changed
        if: always() && steps.source.outcome == 'success'
        run: git -c core.fileMode=false diff --exit-code -- go.mod go.sum relaykit/go.mod relaykit/go.sum

      - name: Validate evidence and print every source-bound candidate
        if: always() && steps.source.outcome == 'success'
        run: |
          node tools/go-reachability/summarize.mjs \
            --repository-root "$GITHUB_WORKSPACE" \
            --evidence-dir "$EVIDENCE_DIR" \
            --output "$EVIDENCE_DIR/report.json" | tee "$EVIDENCE_DIR/summary.jsonl"
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import path from 'node:path';
          const report = JSON.parse(readFileSync(path.join(process.env.EVIDENCE_DIR, 'report.json'), 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '### 当前源码可达性证据（未授权删除）',
            `- 源码：${report.source_sha}`,
            `- 目标：${report.target.goos}/${report.target.goarch}；CGO=0；默认构建标签`,
            `- 工具：${report.tool.module}@${report.tool.version}`,
            `- 记录：${report.summary.records}；可进入人工复核：${report.summary.manual_review_candidates}`,
            '- root 的 production / with-tests 与 relaykit 独立测试根分别记录；不代表运行时、外部API或全部平台的完整性。',
            '- 完整候选逐行见本步骤日志；原始输入、退出码及报告保留7天。',
            '- 本轮只分析，没有删除产品代码，也没有授权删除。',
            '',
          ].join('\n'));
          JS

      - name: Retain raw evidence and diagnostics for seven days
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-reachability-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}/
          retention-days: 7
          if-no-files-found: error
