name: Build MyAPI Electron App
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing tag to build (leave blank for the selected branch)'
        required: false
        type: string
      confirm:
        description: 'Type PUBLISH only when attaching artifacts to a release'
        required: false
        default: ''
        type: string

concurrency:
  group: myapi-electron-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build MyAPI desktop package
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate requested tag
        env:
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$BUILD_TAG" ]]; then
            exit 0
          fi
          if [[ ! "$BUILD_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must be an exact semantic version beginning with v"
            exit 1
          fi
          if ! git rev-parse "refs/tags/$BUILD_TAG^{commit}" >/dev/null 2>&1; then
            echo "::error::tag '$BUILD_TAG' does not exist"
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/$BUILD_TAG^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "$HEAD_SHA" != "$TAG_SHA" ]]; then
            echo "::error::checked out commit does not match tag $BUILD_TAG"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'

      - name: Build frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_SELF_USE_MINIMAL='true' VITE_BRAND_NAME='MyAPI' VITE_BRAND_LOGO='/myapi-logo-v1.png' VITE_REACT_APP_VERSION=$(git describe --tags --always) bun run build
          cd ..

      - name: Build Go binary (macOS)
        if: runner.os == 'macOS'
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          [[ "$MODULE_PATH" == "github.com/ForceMind/MyAPI" ]] || { echo "::error::unexpected Go module path: $MODULE_PATH"; exit 1; }
          go build -ldflags "-s -w -X '${MODULE_PATH}/common.Version=$(git describe --tags --always)'" -o my-api

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          [[ "$MODULE_PATH" == "github.com/ForceMind/MyAPI" ]] || { echo "::error::unexpected Go module path: $MODULE_PATH"; exit 1; }
          go build -ldflags "-s -w -X '${MODULE_PATH}/common.Version=$(git describe --tags --always)'" -o my-api.exe

      - name: Update Electron version
        run: |
          cd electron
          VERSION=$(git describe --tags --always)
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          # Convert to valid semver: take first 3 components and convert rest to prerelease format
          # e.g., 0.9.3-patch.1 -> 0.9.3-patch.1
          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            REST=${BASH_REMATCH[4]}
          
            VERSION="$MAJOR.$MINOR.$PATCH"
          
            # If there's extra content, append it without adding -dev
            if [[ -n "$REST" ]]; then
              VERSION="$VERSION$REST"
            fi
          else
            # A branch without a reachable semver tag yields a raw commit SHA;
            # npm version rejects that value. Use the distribution version as
            # a stable base and add a CI-only prerelease suffix.
            BASE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('../package.json', 'utf8')).version")
            VERSION="$BASE_VERSION-dev.${GITHUB_RUN_NUMBER:-0}"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci

      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd electron
          npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: |
          cd electron
          npm run build:win

      - name: Generate artifact checksums
        run: |
          cd electron/dist
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const files = fs.readdirSync('.').filter((name) => /\.(?:dmg|zip|exe)$/i.test(name)).sort();
          if (files.length === 0) throw new Error('No desktop artifacts were produced');
          const lines = files.map((name) => {
            const digest = crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex');
            return `${digest}  ${name}`;
          });
          fs.writeFileSync(`SHA256SUMS-${process.env.RUNNER_OS}.txt`, `${lines.join('\n')}\n`);
          NODE

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/SHA256SUMS-${{ runner.os }}.txt

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: |
            electron/dist/*.exe
            electron/dist/SHA256SUMS-${{ runner.os }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'PUBLISH' && vars.MYAPI_ENABLE_RELEASE == 'true' && inputs.tag != '' }}
    environment: github-release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Upload to Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.build.outputs.source_sha }}
          files: |
            windows-build/*
            macos-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
