name: Build MyAPI Electron App
permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing tag to build (leave blank for the selected branch)'
        required: false
        type: string
      confirm:
        description: 'Type PUBLISH only when attaching artifacts to a release'
        required: false
        default: ''
        type: string
      platform:
        description: 'Build macOS first, then Windows; both preserves the existing default'
        required: false
        default: both
        type: choice
        options: [both, macos, windows]

concurrency:
  group: myapi-electron-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build MyAPI desktop package
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Resolve source commit
        id: source
        run: |
          SOURCE_SHA="$(git -c core.fileMode=false rev-parse HEAD)"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          if [[ "$FILE_VERSION" != "$PACKAGE_VERSION" || ! "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION and package.json must match a valid desktop version"
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$FILE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate desktop distribution contract
        run: node tools/desktop/check.mjs --json

      - name: Validate requested tag
        env:
          BUILD_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            BUILD_TAG="$GITHUB_REF_NAME"
          fi
          if [[ -z "$BUILD_TAG" ]]; then
            exit 0
          fi
          if [[ ! "$BUILD_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag must be an exact semantic version beginning with v"
            exit 1
          fi
          if ! git -c core.fileMode=false rev-parse "refs/tags/$BUILD_TAG^{commit}" >/dev/null 2>&1; then
            echo "::error::tag '$BUILD_TAG' does not exist"
            exit 1
          fi
          TAG_SHA="$(git -c core.fileMode=false rev-parse "refs/tags/$BUILD_TAG^{commit}")"
          HEAD_SHA="$(git -c core.fileMode=false rev-parse HEAD)"
          if [[ "$HEAD_SHA" != "$TAG_SHA" ]]; then
            echo "::error::checked out commit does not match tag $BUILD_TAG"
            exit 1
          fi
          EXPECTED_VERSION="${BUILD_TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE_VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          if [[ "$FILE_VERSION" != "$EXPECTED_VERSION" || "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::VERSION and package.json must match $EXPECTED_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'

      - name: Verify desktop lifecycle without starting Electron
        run: node --test electron/test/*.test.mjs

      - name: Build frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_SELF_USE_MINIMAL='true' VITE_BRAND_NAME='MyAPI' VITE_BRAND_LOGO='/myapi-logo-v1.png' VITE_REACT_APP_VERSION='${{ steps.source.outputs.version }}' VITE_BUILD_ID='${{ steps.source.outputs.sha }}' bun run build
          cd ..

      - name: Build Go binary (macOS)
        if: runner.os == 'macOS'
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          [[ "$MODULE_PATH" == "github.com/ForceMind/MyAPI" ]] || { echo "::error::unexpected Go module path: $MODULE_PATH"; exit 1; }
          GOMAXPROCS=2 go build -p 2 -ldflags "-s -w -X '${MODULE_PATH}/common.Version=${{ steps.source.outputs.version }}'" -o my-api

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        run: |
          go mod download
          MODULE_PATH="$(go list -m)"
          [[ "$MODULE_PATH" == "github.com/ForceMind/MyAPI" ]] || { echo "::error::unexpected Go module path: $MODULE_PATH"; exit 1; }
          GOMAXPROCS=2 go build -p 2 -ldflags "-s -w -X '${MODULE_PATH}/common.Version=${{ steps.source.outputs.version }}'" -o my-api.exe

      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci

      - name: Build Electron app (macOS)
        if: runner.os == 'macOS'
        run: |
          cd electron
          npm run build:mac -- --config.extraMetadata.version='${{ steps.source.outputs.version }}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: |
          cd electron
          npm run build:win -- --config.extraMetadata.version='${{ steps.source.outputs.version }}'

      - name: Generate artifact checksums
        run: |
          cd electron/dist
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const files = fs.readdirSync('.').filter((name) => /\.(?:dmg|zip|exe)$/i.test(name)).sort();
          if (files.length === 0) throw new Error('No desktop artifacts were produced');
          const lines = files.map((name) => {
            const digest = crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex');
            return `${digest}  ${name}`;
          });
          fs.writeFileSync(`SHA256SUMS-${process.env.RUNNER_OS}.txt`, `${lines.join('\n')}\n`);
          NODE

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          path: |
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/SHA256SUMS-${{ runner.os }}.txt

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: |
            electron/dist/*.exe
            electron/dist/SHA256SUMS-${{ runner.os }}.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'PUBLISH' && vars.MYAPI_ENABLE_RELEASE == 'true' && inputs.tag != '' && (inputs.platform == 'both' || inputs.platform == '') }}
    environment: github-release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Upload to Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ needs.build.outputs.source_sha }}
          files: |
            windows-build/*
            macos-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
