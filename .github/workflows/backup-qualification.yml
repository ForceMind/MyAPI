name: SQLite backup and isolated restore qualification

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: dev
        required: false

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MYAPI_B4_QUALIFICATION: '1'
      MYAPI_SMOKE_API_ONLY: '1'
      MYAPI_SMOKE_BROWSER: '0'
      MYAPI_SMOKE_PERSONAL: '0'
    steps:
      - name: Require a manual exact-source dev request
        env:
          REQUESTED_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/dev
          test "$REQUESTED_SOURCE_REF" = dev

      - name: Check out the caller source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source identity
        run: |
          set -euo pipefail
          test "$(git -c core.fileMode=false rev-parse HEAD)" = "$GITHUB_SHA"
          git -c core.fileMode=false diff --exit-code HEAD --

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Set up bounded Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
          driver-opts: |
            memory=4g
            memory-swap=4g
            cpu-period=100000
            cpu-quota=200000

      - name: Build and load the current Full image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        timeout-minutes: 20
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: myapi:b4-app-${{ github.sha }}
          labels: |
            io.myapi.smoke.source=${{ github.sha }}
          build-args: |
            MYAPI_EDITION=full
            MYAPI_BRAND_NAME=MyAPI
            MYAPI_BRAND_LOGO=/myapi-logo-v1.png
            MYAPI_BUILD_ID=${{ github.sha }}
            MYAPI_BUILD_PARALLELISM=2
          cache-from: type=gha,scope=smoke-full
          cache-to: type=gha,mode=min,scope=smoke-full

      - name: Prepare the pinned source-bound synthetic transport image
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/myapi-b4-fixture.Dockerfile" <<'DOCKERFILE'
          FROM oven/bun:1@sha256:0733e50325078969732ebe3b15ce4c4be5082f18c4ac1a0f0ca4839c2e4e42a7
          COPY tools/runtime/fake-openai.mjs /fixture/fake-openai.mjs
          DOCKERFILE

      - name: Build and load the fixed synthetic upstream image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        timeout-minutes: 8
        with:
          context: .
          file: ${{ runner.temp }}/myapi-b4-fixture.Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: myapi:b4-fixture-${{ github.sha }}
          labels: |
            io.myapi.smoke.source=${{ github.sha }}

      - name: Bind the two immutable loaded images
        run: |
          set -euo pipefail
          app_id="$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' "myapi:b4-app-$GITHUB_SHA")"
          bun_id="$(docker --host unix:///var/run/docker.sock image inspect --format '{{.Id}}' "myapi:b4-fixture-$GITHUB_SHA")"
          [[ "$app_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$bun_id" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "SMOKE_APP_IMAGE_ID=$app_id" >> "$GITHUB_ENV"
          echo "SMOKE_BUN_IMAGE_ID=$bun_id" >> "$GITHUB_ENV"
          node --version
          /usr/bin/python3 --version

      - name: Qualify the real root CLI backup and isolated restore
        timeout-minutes: 20
        run: |
          set -euo pipefail
          umask 077
          node_binary="$(command -v node)"
          sudo -n env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REF="$GITHUB_REF" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            MYAPI_B4_QUALIFICATION=1 MYAPI_SMOKE_API_ONLY=1 MYAPI_SMOKE_BROWSER=0 MYAPI_SMOKE_PERSONAL=0 \
            SMOKE_APP_IMAGE_ID="$SMOKE_APP_IMAGE_ID" SMOKE_BUN_IMAGE_ID="$SMOKE_BUN_IMAGE_ID" \
            "$node_binary" tools/runtime/backup-qualification.mjs | tee "$RUNNER_TEMP/myapi-b4-report.json"
          python3 - <<'PY'
          import json, os, stat
          filename = os.path.join(os.environ['RUNNER_TEMP'], 'myapi-b4-report.json')
          metadata = os.stat(filename)
          assert metadata.st_uid == os.getuid() and stat.S_IMODE(metadata.st_mode) == 0o600
          with open(filename) as source:
              result = json.load(source)
          assert result['qualified'] is True and result['cleanup_verified'] is True
          assert result['source_sha'] == os.environ['GITHUB_SHA']
          assert result['upstream_requests'] == {'source': 2, 'recovery': 0, 'combined': 2, 'additional': 0}
          assert result['backup_committed_verified'] is True and result['isolated_restore_verified'] is True
          assert result['source_left_stopped'] is True and result['original_data_unchanged_after_stop'] is True
          assert result['production_touched'] is False and result['real_provider_requests'] is False
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('B4 production CLI qualification completed on isolated Full/SQLite fixtures: plan-confirm backup, unchanged stopped source, verified new-directory restore and exact business readback. Synthetic upstream counts remained 2+0=2. Only a safe report is retained; browser, production and external providers were not tested.\n')
          PY

      - name: Retain only the safe qualification report for seven days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: myapi-b4-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/myapi-b4-report.json
          retention-days: 7
          if-no-files-found: warn
