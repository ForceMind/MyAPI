name: Build deployment artifact
on:
  push:
    branches: ['codex/deploy-*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deployment-artifact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.10'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate version
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+',version)
          assert json.loads(Path('package.json').read_text())['version']==version
          PY
      - name: Install frontend
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check and build frontend
        working-directory: web
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          bun run typecheck
          bun run test --maxWorkers=2
          VITE_REACT_APP_VERSION="$(cat ../VERSION)" bun run build
      - name: Verify affected backend and independent module
        run: |
          go test -p 2 ./model ./service ./controller ./middleware ./router ./relay ./relay/channel/codex ./relay/channel/openai
          (cd relaykit && GOWORK=off go build -p 2 ./...)
      - name: Build Linux amd64 deployment bundle
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p bundle
          go build -p 2 -trimpath -ldflags "-s -w -X github.com/ForceMind/MyAPI/common.Version=$(cat VERSION)" -o bundle/my-api .
          cp VERSION LICENSE NOTICE THIRD-PARTY-LICENSES.md bundle/
          printf '%s\n' "$GITHUB_SHA" > bundle/SOURCE_COMMIT
          (cd bundle && sha256sum my-api VERSION SOURCE_COMMIT LICENSE NOTICE THIRD-PARTY-LICENSES.md > SHA256SUMS)
          tar -czf my-api-linux-amd64.tar.gz -C bundle .
      - name: Upload private deployment artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: my-api-linux-amd64-${{ github.sha }}
          path: my-api-linux-amd64.tar.gz
          retention-days: 3
          if-no-files-found: error
