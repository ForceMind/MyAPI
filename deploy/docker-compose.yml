services:
  new-api:
    image: ${NEW_API_IMAGE:-local/new-api:custom-rc25}
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:${NEW_API_PORT:-3000}:3000"
    volumes:
      - ${NEW_API_DATA_DIR:-./data}:/data
      - ${NEW_API_LOGS_DIR:-./logs}:/app/logs
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: ${NEW_API_PUBLIC_URL:?NEW_API_PUBLIC_URL is required}
      FRONTEND_BASE_URL: ${NEW_API_PUBLIC_URL:?NEW_API_PUBLIC_URL is required}
      TRUSTED_PROXIES: 172.16.0.0/12
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      FULL_CONTENT_LOG_ENABLED: ${FULL_CONTENT_LOG_ENABLED:-true}
      FULL_CONTENT_LOG_MAX_MB: ${FULL_CONTENT_LOG_MAX_MB:-100}
      FULL_CONTENT_LOG_MAX_FILES: ${FULL_CONTENT_LOG_MAX_FILES:-10}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:3000/api/status | grep -q '"success"[[:space:]]*:[[:space:]]*true'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
