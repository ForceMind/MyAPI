services:
  my-api:
    # MYAPI_* is canonical. Image/port/path values accept NEW_API_* as a
    # read-only fallback; the CLI and install script normalize the legacy
    # public URL before invoking this file, then the required check below
    # prevents an empty origin.
    image: ${MYAPI_IMAGE:-${NEW_API_IMAGE:-ghcr.io/forcemind/myapi:v0.1.1}}
    container_name: my-api
    restart: always
    # Keep workstation and small-server deployments bounded by default. These
    # values are configurable in deploy/.env and prevent a build or runaway
    # request from consuming all host CPU/memory.
    cpus: ${MYAPI_CPU_LIMIT:-2.0}
    mem_limit: ${MYAPI_MEMORY_LIMIT:-2g}
    command: --log-dir /app/logs
    ports:
      - "${MYAPI_BIND_ADDRESS:-127.0.0.1}:${MYAPI_PORT:-${NEW_API_PORT:-3000}}:3000"
    volumes:
      # The container mount points are stable runtime/data contracts. Host
      # paths may be changed with MYAPI_DATA_DIR/MYAPI_LOGS_DIR (or legacy
      # NEW_API_DATA_DIR/NEW_API_LOGS_DIR) without moving existing files.
      - ${MYAPI_DATA_DIR:-${NEW_API_DATA_DIR:-./data}}:/data
      - ${MYAPI_LOGS_DIR:-${NEW_API_LOGS_DIR:-./logs}}:/app/logs
    environment:
      TZ: Asia/Shanghai
      MYAPI_EDITION: ${MYAPI_EDITION:-full}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_COOKIE_SECURE: "${MYAPI_SESSION_COOKIE_SECURE:-true}"
      # install.sh and the CLI normalize a legacy NEW_API_PUBLIC_URL into the
      # canonical environment before invoking Compose. Keep a required check
      # here so direct Compose runs cannot start with an empty public origin.
      SESSION_COOKIE_TRUSTED_URL: ${MYAPI_PUBLIC_URL:?MYAPI_PUBLIC_URL is required; run myapi migrate for legacy settings}
      FRONTEND_BASE_URL: ${MYAPI_PUBLIC_URL:?MYAPI_PUBLIC_URL is required; run myapi migrate for legacy settings}
      TRUSTED_PROXIES: 172.16.0.0/12
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      FULL_CONTENT_LOG_ENABLED: ${FULL_CONTENT_LOG_ENABLED:-true}
      FULL_CONTENT_LOG_MAX_MB: ${FULL_CONTENT_LOG_MAX_MB:-100}
      FULL_CONTENT_LOG_MAX_FILES: ${FULL_CONTENT_LOG_MAX_FILES:-10}
      CHANNEL_QUOTA_SNAPSHOT_RETENTION_DAYS: ${CHANNEL_QUOTA_SNAPSHOT_RETENTION_DAYS:-0}
      # Empty defaults preserve runtime defaults and allow admin UI changes.
      CHANNEL_QUOTA_SYNC_ENABLED: ${CHANNEL_QUOTA_SYNC_ENABLED:-}
      CHANNEL_QUOTA_SYNC_INTERVAL: ${CHANNEL_QUOTA_SYNC_INTERVAL:-}
      CHANNEL_QUOTA_SYNC_MAX_CHANNELS: ${CHANNEL_QUOTA_SYNC_MAX_CHANNELS:-}
      CHANNEL_QUOTA_ALERT_ENABLED: ${CHANNEL_QUOTA_ALERT_ENABLED:-false}
      CHANNEL_QUOTA_ALERT_WARNING_PERCENT: ${CHANNEL_QUOTA_ALERT_WARNING_PERCENT:-20}
      CHANNEL_QUOTA_ALERT_CRITICAL_PERCENT: ${CHANNEL_QUOTA_ALERT_CRITICAL_PERCENT:-10}
      CHANNEL_QUOTA_ALERT_COOLDOWN_SECONDS: ${CHANNEL_QUOTA_ALERT_COOLDOWN_SECONDS:-3600}
      CHANNEL_QUOTA_ALERT_NOTIFY_ON_RECOVERY: ${CHANNEL_QUOTA_ALERT_NOTIFY_ON_RECOVERY:-false}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:3000/api/status | grep -q '"success"[[:space:]]*:[[:space:]]*true'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
