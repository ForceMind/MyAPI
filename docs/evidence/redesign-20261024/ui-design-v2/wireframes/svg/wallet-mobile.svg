0" y2="1075" stroke="#aaaaaa"/><text x="30" y="1095" font-size="13" font-weight="normal" fill="#262626">· 资金模式未知、停用、退役分别展示；历史可见</text><text x="40" y="1115" font-size="13" font-weight="normal" fill="#262626">不代表允许新充值。</text><text x="30" y="1145" font-size="13" font-weight="normal" fill="#262626">· 仅页面设计，不改充值 / 结算 / 退款规则，也</text><text x="40" y="1165" font-size="13" font-weight="normal" fill="#262626">不接支付网络。</text><rect x="16" y="1195" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1221" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1250" x2="360" y2="1250" stroke="#aaaaaa"/><text x="30" y="1270" font-size="13" font-weight="normal" fill="#262626">· 余额、充值、兑换、我的订阅分为清晰区块；资</text><text x="40" y="1290" font-size="13" font-weight="normal" fill="#262626">金历史统一入口，管理订阅仍在管理员区域。</text><text x="30" y="1320" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1340" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1370" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1408" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1464" font-size="10" font-weight="normal" fill="#666666">wallet · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
