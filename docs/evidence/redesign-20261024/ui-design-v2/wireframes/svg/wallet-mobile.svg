<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2091" viewBox="0 0 390 2091" role="img" aria-labelledby="title desc"><title id="title">钱包与资金 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">钱包与资金</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/wallet</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="253" font-size="14" font-weight="600" fill="#262626">钱包余额 未知</text><rect x="200.0" y="225" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="212.0" y="253" font-size="14" font-weight="600" fill="#262626">已用额度 未知</text><rect x="16.0" y="315" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="343" font-size="14" font-weight="600" fill="#262626">订阅状态 —</text><rect x="16" y="411" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="434" font-size="13" font-weight="600" fill="#262626">A1 查看资金历史</text><rect x="184" y="411" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="434" font-size="13" font-weight="normal" fill="#262626">A2 确认充值</text><rect x="16" y="467" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="490" font-size="13" font-weight="normal" fill="#262626">A3 购买订阅</text><rect x="184" y="467" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="490" font-size="13" font-weight="normal" fill="#262626">A4 兑换</text><rect x="16.0" y="531" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="556" font-size="12" font-weight="normal" fill="#262626">当前订阅</text><rect x="16.0" y="583" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="608" font-size="12" font-weight="normal" fill="#262626">全部记录 N</text><rect x="16.0" y="635" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="660" font-size="12" font-weight="normal" fill="#262626">选购套餐〔原购买资格〕</text><text x="16" y="713" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="16.0" y="743" font-size="12" font-weight="600" fill="#262626">扣费顺序〔原偏好〕</text><rect x="16.0" y="752" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="779" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="837" font-size="12" font-weight="600" fill="#262626">当前合同名称 / 状态</text><rect x="16.0" y="846" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="873" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="931" font-size="12" font-weight="600" fill="#262626">各自额度 / 剩余 / 用量〔未知不补零〕</text><rect x="16.0" y="940" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="967" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="1025" font-size="12" font-weight="600" fill="#262626">有效期 / 下一重置时间</text><rect x="16.0" y="1034" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="1061" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="1107" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1133" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="30" y1="1162" x2="360" y2="1162" stroke="#aaaaaa"/><text x="30" y="1182" font-size="13" font-weight="normal" fill="#262626">· 读取失败 / 能力未知 / 原实际钱包回退说明常</text><text x="40" y="1202" font-size="13" font-weight="normal" fill="#262626">驻</text><text x="30" y="1232" font-size="13" font-weight="normal" fill="#262626">· 默认当前合同，不把历史 / 全商品铺满首屏</text><rect x="16" y="1262" width="358" height="167" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1288" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="30" y1="1317" x2="360" y2="1317" stroke="#aaaaaa"/><text x="30" y="1337" font-size="13" font-weight="normal" fill="#262626">· 记录：20条本地分页，准确合同字段 / 原动作</text><text x="30" y="1367" font-size="13" font-weight="normal" fill="#262626">· 选购：完整报价、币种、限购、周期与原Subscri</text><text x="40" y="1387" font-size="13" font-weight="normal" fill="#262626">be</text><text x="30" y="1417" font-size="13" font-weight="normal" fill="#262626">· 购买仍走原弹窗与独立支付确认，不改算法</text><rect x="16" y="1447" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1473" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="30" y1="1502" x2="360" y2="1502" stroke="#aaaaaa"/><text x="30" y="1522" font-size="13" font-weight="normal" fill="#262626">· 切换和展开仅使用已加载数据，不自动发支付或</text><text x="40" y="1542" font-size="13" font-weight="normal" fill="#262626">偏好写入。</text><text x="30" y="1572" font-size="13" font-weight="normal" fill="#262626">· 错误不当真空，0不当未知，合同不跨项求和；身</text><text x="40" y="1592" font-size="13" font-weight="normal" fill="#262626">份变化拒旧回报。</text><rect x="16" y="1622" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1648" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1677" x2="360" y2="1677" stroke="#aaaaaa"/><text x="30" y="1697" font-size="13" font-weight="normal" fill="#262626">· 资金模式未知、停用、退役分别展示；历史可见</text><text x="40" y="1717" font-size="13" font-weight="normal" fill="#262626">不代表允许新充值。</text><text x="30" y="1747" font-size="13" font-weight="normal" fill="#262626">· 仅页面设计，不改充值 / 结算 / 退款规则，也</text><text x="40" y="1767" font-size="13" font-weight="normal" fill="#262626">不接支付网络。</text><rect x="16" y="1797" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1823" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1852" x2="360" y2="1852" stroke="#aaaaaa"/><text x="30" y="1872" font-size="13" font-weight="normal" fill="#262626">· 余额、充值、兑换、我的订阅分为清晰区块；资</text><text x="40" y="1892" font-size="13" font-weight="normal" fill="#262626">金历史统一入口，管理订阅仍在管理员区域。</text><text x="30" y="1922" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1942" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1972" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="2010" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="2066" font-size="10" font-weight="normal" fill="#666666">wallet · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
