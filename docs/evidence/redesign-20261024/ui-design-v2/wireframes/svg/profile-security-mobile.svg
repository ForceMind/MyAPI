<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1180" viewBox="0 0 390 1180" role="img" aria-labelledby="title desc"><title id="title">个人资料 · 安全与登录 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">个人资料 · 安全与登录</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/profile〔security〕</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="94" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="252" font-size="13" font-weight="normal" fill="#262626">资料与偏好</text><rect x="118" y="225" width="94" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="128" y="252" font-size="13" font-weight="600" fill="#262626">安全与登录</text><rect x="220" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="230" y="252" font-size="13" font-weight="normal" fill="#262626">我的订阅</text><rect x="16.0" y="285" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="311" font-size="16" font-weight="600" fill="#262626">身份验证</text><line x1="30.0" y1="340" x2="360.0" y2="340" stroke="#aaaaaa"/><text x="30.0" y="360" font-size="13" font-weight="normal" fill="#262626">· Passkey</text><text x="30.0" y="390" font-size="13" font-weight="normal" fill="#262626">· 两步验证</text><text x="30.0" y="420" font-size="13" font-weight="normal" fill="#262626">· 访问令牌维护</text><rect x="16.0" y="448" width="358.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="474" font-size="16" font-weight="600" fill="#262626">登录会话</text><line x1="30.0" y1="503" x2="360.0" y2="503" stroke="#aaaaaa"/><text x="30.0" y="523" font-size="13" font-weight="normal" fill="#262626">· 当前会话标识</text><text x="30.0" y="553" font-size="13" font-weight="normal" fill="#262626">· 设备 / 时间</text><text x="30.0" y="583" font-size="13" font-weight="normal" fill="#262626">· 逐项撤销</text><text x="30.0" y="613" font-size="13" font-weight="normal" fill="#262626">· 撤销其他会话确认</text><rect x="16" y="641" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="667" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="696" x2="360" y2="696" stroke="#aaaaaa"/><text x="30" y="716" font-size="13" font-weight="normal" fill="#262626">· 个人资料拆为明确的子区；Lite 的订阅只读能力</text><text x="40" y="736" font-size="13" font-weight="normal" fill="#262626">不变；隐藏商业写入不隐藏已有历史。</text><rect x="16" y="766" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="792" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="821" x2="360" y2="821" stroke="#aaaaaa"/><text x="30" y="841" font-size="13" font-weight="normal" fill="#262626">· 整理长页面为资料、安全、订阅三个清晰分区；</text><text x="40" y="861" font-size="13" font-weight="normal" fill="#262626">所有现有可用能力仍可达。</text><text x="30" y="891" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="911" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="941" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="964" font-size="13" font-weight="600" fill="#262626">A1 保存当前修改</text><rect x="184" y="941" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="964" font-size="13" font-weight="normal" fill="#262626">A2 登录会话</text><rect x="16" y="997" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1020" font-size="13" font-weight="normal" fill="#262626">A3 提示词学习</text><rect x="0" y="1061" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1099" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1155" font-size="10" font-weight="normal" fill="#666666">profile-security · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
