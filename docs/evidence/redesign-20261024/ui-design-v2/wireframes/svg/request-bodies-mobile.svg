<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1936" viewBox="0 0 390 1936" role="img" aria-labelledby="title desc"><title id="title">正文与 SSE · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。管理员；沿用既有正文路由和API权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">正文与 SSE</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/full-content-logs</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16.0" y="225" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="253" font-size="14" font-weight="600" fill="#262626">匹配请求 —</text><rect x="200.0" y="225" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="212.0" y="253" font-size="14" font-weight="600" fill="#262626">日志文件 —</text><rect x="16.0" y="315" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="343" font-size="14" font-weight="600" fill="#262626">磁盘占用 —</text><rect x="16" y="411" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="434" font-size="13" font-weight="normal" fill="#262626">A4 刷新</text><rect x="184" y="411" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="434" font-size="13" font-weight="normal" fill="#262626">A5 日志存储</text><rect x="16" y="475" width="358" height="64" rx="5" fill="#fafafa" stroke="#888888"/><text x="28" y="499" font-size="12" font-weight="normal" fill="#262626">A7 筛选：日期 / 模型 / Key / Request ID</text><text x="28" y="523" font-size="12" font-weight="normal" fill="#262626">已应用条件摘要                       展开 ›</text><rect x="16" y="555" width="358" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="581" font-size="16" font-weight="600" fill="#262626">记录 1〔合成占位〕</text><line x1="30" y1="610" x2="360" y2="610" stroke="#aaaaaa"/><text x="30" y="630" font-size="13" font-weight="normal" fill="#262626">· 时间：10-28 10:20〔合成〕</text><text x="30" y="660" font-size="13" font-weight="normal" fill="#262626">· 模型 / 端点：合成示例 A</text><text x="30" y="690" font-size="13" font-weight="normal" fill="#262626">· API Key：演示 Key · ••••</text><text x="30" y="720" font-size="13" font-weight="normal" fill="#262626">· HTTP 状态：未知 / —</text><text x="30" y="750" font-size="13" font-weight="normal" fill="#262626">· 请求 / 响应大小：未知 / —</text><text x="30" y="780" font-size="13" font-weight="normal" fill="#262626">· 耗时：未知 / —</text><rect x="16" y="800" width="358" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="28" y="827" font-size="13" font-weight="normal" fill="#262626">A6 查看内容 · 返回保留位置</text><rect x="16" y="860" width="358" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="886" font-size="16" font-weight="600" fill="#262626">记录 2〔合成占位〕</text><line x1="30" y1="915" x2="360" y2="915" stroke="#aaaaaa"/><text x="30" y="935" font-size="13" font-weight="normal" fill="#262626">· 时间：10-28 10:20〔合成〕</text><text x="30" y="965" font-size="13" font-weight="normal" fill="#262626">· 模型 / 端点：合成示例 B</text><text x="30" y="995" font-size="13" font-weight="normal" fill="#262626">· API Key：演示 Key · ••••</text><text x="30" y="1025" font-size="13" font-weight="normal" fill="#262626">· HTTP 状态：未知 / —</text><text x="30" y="1055" font-size="13" font-weight="normal" fill="#262626">· 请求 / 响应大小：未知 / —</text><text x="30" y="1085" font-size="13" font-weight="normal" fill="#262626">· 耗时：未知 / —</text><rect x="16" y="1105" width="358" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="28" y="1132" font-size="13" font-weight="normal" fill="#262626">A6 查看内容 · 返回保留位置</text><text x="16" y="1183" font-size="12" font-weight="normal" fill="#262626">共 — 条 · 第 p / N 页〔从真实响应读取；未知时禁用跳页</text><text x="16" y="1202" font-size="12" font-weight="normal" fill="#262626">〕</text><rect x="16" y="1205" width="358" height="48" rx="5" fill="#fafafa" stroke="#999999"/><text x="28" y="1234" font-size="12" font-weight="normal" fill="#262626">每页条数：20 / 50 / 100</text><rect x="16" y="1263" width="358" height="48" rx="5" fill="#fafafa" stroke="#999999"/><text x="28" y="1292" font-size="12" font-weight="normal" fill="#262626">页码：首页  ‹  1  2  …  N  ›  末页</text><rect x="16" y="1321" width="358" height="48" rx="5" fill="#fafafa" stroke="#999999"/><text x="28" y="1350" font-size="12" font-weight="normal" fill="#262626">直接跳页：第 [ 输入页码 ] 页  [ 跳转 ]</text><rect x="16" y="1387" width="358" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1413" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1442" x2="360" y2="1442" stroke="#aaaaaa"/><text x="30" y="1462" font-size="13" font-weight="normal" fill="#262626">· 分页含首尾页、页码、20/50/100条选择与输入页</text><text x="40" y="1482" font-size="13" font-weight="normal" fill="#262626">码直接跳转；不一次拉取所有正文。</text><text x="30" y="1512" font-size="13" font-weight="normal" fill="#262626">· 页码、每页条数、筛选和焦点在返回时保留；缓</text><text x="40" y="1532" font-size="13" font-weight="normal" fill="#262626">存继续按用户与会话隔离。</text><text x="30" y="1562" font-size="13" font-weight="normal" fill="#262626">· 记录可检索不等于有完整正文；未采集、已过期</text><text x="40" y="1582" font-size="13" font-weight="normal" fill="#262626">、截断和加载失败分别说明。</text><text x="30" y="1612" font-size="13" font-weight="normal" fill="#262626">· 打开记录只读，绝不重放生成请求。</text><rect x="16" y="1642" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1668" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1697" x2="360" y2="1697" stroke="#aaaaaa"/><text x="30" y="1717" font-size="13" font-weight="normal" fill="#262626">· 请求工作区共享筛选和分页；正文权限保持独立</text><text x="40" y="1737" font-size="13" font-weight="normal" fill="#262626">，不把正文复制到普通用户的调用记录缓存。</text><text x="30" y="1767" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1787" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1817" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1855" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1911" font-size="10" font-weight="normal" fill="#666666">request-bodies · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
