<svg xmlns="http://www.w3.org/2000/svg" width="390" height="970" viewBox="0 0 390 970" role="img" aria-labelledby="title desc"><title id="title">管理 Key · 手机线稿</title><desc id="desc">现有个人资料安全区的增量组件，保留旧访问令牌、权限、确认和返回上下文；不是新增路由或视觉验收。</desc><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,sans-serif" fill="#222"><rect x="16" y="747" width="358" height="190" fill="none" stroke="#888" rx="6"/><rect x="16" y="563" width="358" height="166" fill="none" stroke="#888" rx="6"/><rect x="16" y="355" width="358" height="190" fill="none" stroke="#888" rx="6"/><rect x="16" y="171" width="358" height="166" fill="none" stroke="#888" rx="6"/><text x="30" y="45" font-size="18">MyAPI / Profile / 管理</text><text x="30" y="69" font-size="18">Key</text><text x="30" y="105" font-size="12">沿用 profile-security；线稿，</text><text x="30" y="129" font-size="12">未浏览器验证</text><text x="30" y="201" font-size="16">管理 Key · 个人资料安全区增量</text><text x="30" y="235" font-size="14">名称 / 状态 / 权限摘要 / 到期时间</text><text x="30" y="269" font-size="14">新建管理 Key    刷新列表</text><text x="30" y="293" font-size="14">撤销指定 Key〔确认〕</text><text x="30" y="385" font-size="16">创建〔仅登录管理员可见〕</text><text x="30" y="419" font-size="14">名称 + 权限〔默认只读〕 +</text><text x="30" y="443" font-size="14">有效天数〔默认7，最多90〕</text><text x="30" y="477" font-size="14">高级范围 ▸ 渠道 ID / API Key</text><text x="30" y="501" font-size="14">ID；空列表表示该领域全部已有权限</text><text x="30" y="593" font-size="16">确认与一次性凭据</text><text x="30" y="627" font-size="14">确认名称、权限、对象范围与有效期后仅提交一次</text><text x="30" y="661" font-size="14">创建后仅此次显示 /</text><text x="30" y="685" font-size="14">复制；关闭、换账户、换会话立即清除</text><text x="30" y="777" font-size="16">异常与安全接入</text><text x="30" y="811" font-size="14">加载 / 空 / 失败 / 已撤销 /</text><text x="30" y="835" font-size="14">已到期分别显示</text><text x="30" y="869" font-size="14">结果未知：先刷新核对，不重放；凭据放安全文件，</text><text x="30" y="893" font-size="14">不贴聊天</text></g></svg>
