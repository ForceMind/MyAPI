<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1104" viewBox="0 0 1200 1104" role="img" aria-labelledby="title desc"><title id="title">渠道工作区 · 路由预览 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">渠道工作区 · 路由预览</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/channels#channel-routing</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="240" font-size="12" font-weight="normal" fill="#262626">渠道库</text><rect x="322.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="330.0" y="240" font-size="12" font-weight="normal" fill="#262626">额度证据</text><rect x="604.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="240" font-size="12" font-weight="normal" fill="#262626">全部事件</text><rect x="886.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="894.0" y="240" font-size="12" font-weight="normal" fill="#262626">路由预览</text><rect x="40.0" y="275" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="300" font-size="12" font-weight="normal" fill="#262626">返回渠道库</text><rect x="604.0" y="275" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="300" font-size="12" font-weight="normal" fill="#262626">当前范围：明确对象 / 全部渠道</text><text x="40" y="353" font-size="15" font-weight="600" fill="#262626">路由预览 · 切任务保草稿</text><text x="40.0" y="383" font-size="12" font-weight="600" fill="#262626">明确分组〔必填〕</text><rect x="40.0" y="392" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="419" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="383" font-size="12" font-weight="600" fill="#262626">明确模型〔必填〕</text><rect x="417.3333333333333" y="392" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="419" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="383" font-size="12" font-weight="600" fill="#262626">请求路径〔可选〕</text><rect x="794.6666666666666" y="392" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="419" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40.0" y="465" width="1120.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="490" font-size="12" font-weight="normal" fill="#262626">提交预览〔必填完整后可用〕</text><rect x="40" y="525" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="551" font-size="16" font-weight="600" fill="#262626">上次只读快照 / 未提交空态</text><line x1="54" y1="580" x2="1146" y2="580" stroke="#aaaaaa"/><text x="54" y="600" font-size="13" font-weight="normal" fill="#262626">· 优先级与fallback层级 → 完整候选及0权重</text><text x="54" y="630" font-size="13" font-weight="normal" fill="#262626">· 拒绝原因 / cooldown / account hold / 缓存与epoch</text><text x="54" y="660" font-size="13" font-weight="normal" fill="#262626">· 只读本地配置，不是Key权限、预算或供应商调用成功证明</text><rect x="40" y="690" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="716" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="54" y1="745" x2="1146" y2="745" stroke="#aaaaaa"/><text x="54" y="765" font-size="13" font-weight="normal" fill="#262626">· 切换任务保草稿和上次快照，不自动重新预览/模型测试/写入affinity。</text><text x="54" y="795" font-size="13" font-weight="normal" fill="#262626">· 状态和查询按id/role/SID隔离，旧结果不进入新会话。</text><rect x="40" y="825" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="851" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="880" x2="1146" y2="880" stroke="#aaaaaa"/><text x="54" y="900" font-size="13" font-weight="normal" fill="#262626">· 同一路由的显式任务视图，不新建路由或调用模型。</text><rect x="40" y="930" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="956" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="985" x2="1146" y2="985" stroke="#aaaaaa"/><text x="54" y="1005" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作；保留管理员渠道表格所需的高级列。</text><text x="54" y="1035" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1079" font-size="10" font-weight="normal" fill="#666666">channel-routing-workspace · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
