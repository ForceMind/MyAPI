<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc"><title id="title">Key 下的请求详情 · SSE · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">Key 下的请求详情 · SSE</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/keys/$keyId/requests/$requestId?tab=sse</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="50" y="242" font-size="13" font-weight="normal" fill="#262626">诊断</text><rect x="136" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="146" y="242" font-size="13" font-weight="normal" fill="#262626">正文</text><rect x="232" y="215" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="242" y="242" font-size="13" font-weight="600" fill="#262626">SSE</text><rect x="328" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="338" y="242" font-size="13" font-weight="normal" fill="#262626">原始</text><rect x="40.0" y="275" width="272.5" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="52.0" y="303" font-size="14" font-weight="600" fill="#262626">业务结果 未知</text><rect x="322.5" y="275" width="272.5" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="334.5" y="303" font-size="14" font-weight="600" fill="#262626">HTTP —</text><rect x="605.0" y="275" width="272.5" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="617.0" y="303" font-size="14" font-weight="600" fill="#262626">用量证据 未知</text><rect x="887.5" y="275" width="272.5" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="899.5" y="303" font-size="14" font-weight="600" fill="#262626">结算 未知</text><rect x="40" y="371" width="120" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="394" font-size="13" font-weight="600" fill="#262626">A1 返回列表</text><rect x="168" y="371" width="154" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="178" y="394" font-size="13" font-weight="normal" fill="#262626">A2 复制 Request ID</text><rect x="330" y="371" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="340" y="394" font-size="13" font-weight="normal" fill="#262626">A3 查看已存正文</text><rect x="40.0" y="435" width="552.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="461" font-size="16" font-weight="600" fill="#262626">事件流</text><line x1="54.0" y1="490" x2="578.0" y2="490" stroke="#aaaaaa"/><text x="54.0" y="510" font-size="13" font-weight="normal" fill="#262626">· 序号 / 相对时间</text><text x="54.0" y="540" font-size="13" font-weight="normal" fill="#262626">· 事件类型</text><text x="54.0" y="570" font-size="13" font-weight="normal" fill="#262626">· 展开事件数据</text><text x="54.0" y="600" font-size="13" font-weight="normal" fill="#262626">· 仅本地文本搜索</text><rect x="608.0" y="435" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="622.0" y="461" font-size="16" font-weight="600" fill="#262626">证据边界</text><line x1="622.0" y1="490" x2="1146.0" y2="490" stroke="#aaaaaa"/><text x="622.0" y="510" font-size="13" font-weight="normal" fill="#262626">· 结束标记是否存在</text><text x="622.0" y="540" font-size="13" font-weight="normal" fill="#262626">· 业务错误与HTTP分开</text><text x="622.0" y="570" font-size="13" font-weight="normal" fill="#262626">· 缺失不推定成功</text><rect x="40.0" y="628" width="552.0" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="654" font-size="16" font-weight="600" fill="#262626">完整分段原文〔明确打开后〕</text><line x1="54.0" y1="683" x2="578.0" y2="683" stroke="#aaaaaa"/><text x="54.0" y="703" font-size="13" font-weight="normal" fill="#262626">· 请求 / 响应各自读取；上屏最多1 MiB，不一次加载全部正文</text><text x="54.0" y="733" font-size="13" font-weight="normal" fill="#262626">· 同请求版本 / 当前字节范围 / 已保存总量；采集完整性缺失仍为未知</text><text x="54.0" y="763" font-size="13" font-weight="normal" fill="#262626">· 首页 / 上一段 / 下一段；起始字节输入 + 跳转，不必逐页翻</text><text x="54.0" y="793" font-size="13" font-weight="normal" fill="#262626">· 复制当前段 / 换行 / 返回预览；旧16 MiB及SSE结构化预览能力保留</text><text x="54.0" y="823" font-size="13" font-weight="normal" fill="#262626">· 内容变更或轮转：保当前上下文并提示明确重读；换账号或权限失效不显示旧</text><text x="54.0" y="843" font-size="13" font-weight="normal" fill="#262626">正</text><text x="64.0" y="843" font-size="13" font-weight="normal" fill="#262626">文</text><rect x="40" y="871" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="897" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="926" x2="1146" y2="926" stroke="#aaaaaa"/><text x="54" y="946" font-size="13" font-weight="normal" fill="#262626">· 打开和切换页签只读取既有证据，绝不调用供应商或重放请求。</text><text x="54" y="976" font-size="13" font-weight="normal" fill="#262626">· 正文只在既有权限允许时显示；禁止把上个用户/会话的内容作为加载占位。</text><text x="54" y="1006" font-size="13" font-weight="normal" fill="#262626">· 分段只读取已经保存的原始字节；不下载整日志、不重放请求，不把读到末尾当业务成功或已结算。</text><rect x="40" y="1036" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1062" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1091" x2="1146" y2="1091" stroke="#aaaaaa"/><text x="54" y="1111" font-size="13" font-weight="normal" fill="#262626">· Key 请求页与调用记录请求页复用同一详情内容；两个入口和返回上下文保留。</text><text x="54" y="1141" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1185" font-size="10" font-weight="normal" fill="#666666">key-request-sse · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
