<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">个人资料 · 账户绑定 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">个人资料 · 账户绑定</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/profile〔bindings〕</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40.0" y="215" width="1120.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="241" font-size="16" font-weight="600" fill="#262626">已绑定身份</text><line x1="54.0" y1="270" x2="1146.0" y2="270" stroke="#aaaaaa"/><text x="54.0" y="290" font-size="13" font-weight="normal" fill="#262626">· 邮箱</text><text x="54.0" y="320" font-size="13" font-weight="normal" fill="#262626">· GitHub / Discord / OIDC等既有绑定</text><text x="54.0" y="350" font-size="13" font-weight="normal" fill="#262626">· Telegram / WeChat等已启用方式</text><text x="54.0" y="380" font-size="13" font-weight="normal" fill="#262626">· 明确绑定 / 解绑入口</text><rect x="40" y="408" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="434" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="463" x2="1146" y2="463" stroke="#aaaaaa"/><text x="54" y="483" font-size="13" font-weight="normal" fill="#262626">· 与基本资料设置分开成图；解绑前确认身份与目标，不删除账户或刷新登录来绕过验证。</text><rect x="40" y="513" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="536" font-size="13" font-weight="600" fill="#262626">A1 返回个人资料</text><rect x="181" y="513" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="191" y="536" font-size="13" font-weight="normal" fill="#262626">A2 安全验证</text><text x="40" y="591" font-size="10" font-weight="normal" fill="#666666">profile-bindings · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
