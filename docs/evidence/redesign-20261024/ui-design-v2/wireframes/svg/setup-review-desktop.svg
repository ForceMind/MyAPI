<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">安装向导 · 4 复核并初始化 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">文档 / 登录 / 控制台</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">安装向导 · 4 复核并初始化</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/setup〔review〕</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="50" y="242" font-size="13" font-weight="normal" fill="#262626">数据库</text><rect x="136" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="146" y="242" font-size="13" font-weight="normal" fill="#262626">管理员</text><rect x="232" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="242" y="242" font-size="13" font-weight="normal" fill="#262626">模式</text><rect x="328" y="215" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="338" y="242" font-size="13" font-weight="600" fill="#262626">复核</text><rect x="40" y="275" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="297" font-size="12" font-weight="normal" fill="#262626">数据库检查 → 管理员 → 使用模式 → 复核；提交结果未知时只读恢复</text><rect x="40.0" y="339" width="1120.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="365" font-size="16" font-weight="600" fill="#262626">复核摘要</text><line x1="54.0" y1="394" x2="1146.0" y2="394" stroke="#aaaaaa"/><text x="54.0" y="414" font-size="13" font-weight="normal" fill="#262626">· 数据库状态</text><text x="54.0" y="444" font-size="13" font-weight="normal" fill="#262626">· 管理员身份〔不展示密码〕</text><text x="54.0" y="474" font-size="13" font-weight="normal" fill="#262626">· 使用模式</text><text x="54.0" y="504" font-size="13" font-weight="normal" fill="#262626">· 初始化影响说明</text><rect x="40" y="532" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="558" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="587" x2="1146" y2="587" stroke="#aaaaaa"/><text x="54" y="607" font-size="13" font-weight="normal" fill="#262626">· 顶部品牌与当前步骤保持可访问；手机滚动不遮住表单错误或底部动作。</text><text x="54" y="637" font-size="13" font-weight="normal" fill="#262626">· 初次安装与已有实例分开，禁止通过线稿重建已有数据库。</text><rect x="40" y="667" width="120" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="690" font-size="13" font-weight="600" fill="#262626">A1 返回修改</text><rect x="168" y="667" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="178" y="690" font-size="13" font-weight="normal" fill="#262626">A2 确认初始化</text><text x="40" y="745" font-size="10" font-weight="normal" fill="#666666">setup-review · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
