<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">钱包与资金 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">钱包与资金</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/wallet</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40.0" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="52.0" y="243" font-size="14" font-weight="600" fill="#262626">钱包余额 未知</text><rect x="416.6666666666667" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="428.6666666666667" y="243" font-size="14" font-weight="600" fill="#262626">已用额度 未知</text><rect x="793.3333333333334" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="805.3333333333334" y="243" font-size="14" font-weight="600" fill="#262626">订阅状态 —</text><rect x="40" y="311" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="334" font-size="13" font-weight="600" fill="#262626">A1 查看资金历史</text><rect x="181" y="311" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="191" y="334" font-size="13" font-weight="normal" fill="#262626">A2 确认充值</text><rec