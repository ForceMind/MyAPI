<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1403" viewBox="0 0 1200 1403" role="img" aria-labelledby="title desc"><title id="title">钱包与资金 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">钱包与资金</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/wallet</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="52.0" y="243" font-size="14" font-weight="600" fill="#262626">钱包余额 未知</text><rect x="416.6666666666667" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="428.6666666666667" y="243" font-size="14" font-weight="600" fill="#262626">已用额度 未知</text><rect x="793.3333333333334" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="805.3333333333334" y="243" font-size="14" font-weight="600" fill="#262626">订阅状态 —</text><rect x="40" y="311" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="334" font-size="13" font-weight="600" fill="#262626">A1 查看资金历史</text><rect x="181" y="311" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="191" y="334" font-size="13" font-weight="normal" fill="#262626">A2 确认充值</text><rect x="309" y="311" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="319" y="334" font-size="13" font-weight="normal" fill="#262626">A3 购买订阅</text><rect x="437" y="311" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="447" y="334" font-size="13" font-weight="normal" fill="#262626">A4 兑换</text><rect x="40.0" y="375" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="400" font-size="12" font-weight="normal" fill="#262626">当前订阅</text><rect x="416.0" y="375" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="424.0" y="400" font-size="12" font-weight="normal" fill="#262626">全部记录 N</text><rect x="792.0" y="375" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="800.0" y="400" font-size="12" font-weight="normal" fill="#262626">选购套餐〔原购买资格〕</text><text x="40" y="453" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="40.0" y="483" font-size="12" font-weight="600" fill="#262626">扣费顺序〔原偏好〕</text><rect x="40.0" y="492" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="519" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="483" font-size="12" font-weight="600" fill="#262626">当前合同名称 / 状态</text><rect x="417.3333333333333" y="492" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="519" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="483" font-size="12" font-weight="600" fill="#262626">各自额度 / 剩余 / 用量〔未知不补零〕</text><rect x="794.6666666666666" y="492" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="519" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="40.0" y="577" font-size="12" font-weight="600" fill="#262626">有效期 / 下一重置时间</text><rect x="40.0" y="586" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="613" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="659" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="685" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="54" y1="714" x2="1146" y2="714" stroke="#aaaaaa"/><text x="54" y="734" font-size="13" font-weight="normal" fill="#262626">· 读取失败 / 能力未知 / 原实际钱包回退说明常驻</text><text x="54" y="764" font-size="13" font-weight="normal" fill="#262626">· 默认当前合同，不把历史 / 全商品铺满首屏</text><rect x="40" y="794" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="820" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="54" y1="849" x2="1146" y2="849" stroke="#aaaaaa"/><text x="54" y="869" font-size="13" font-weight="normal" fill="#262626">· 记录：20条本地分页，准确合同字段 / 原动作</text><text x="54" y="899" font-size="13" font-weight="normal" fill="#262626">· 选购：完整报价、币种、限购、周期与原Subscribe</text><text x="54" y="929" font-size="13" font-weight="normal" fill="#262626">· 购买仍走原弹窗与独立支付确认，不改算法</text><rect x="40" y="959" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="985" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="54" y1="1014" x2="1146" y2="1014" stroke="#aaaaaa"/><text x="54" y="1034" font-size="13" font-weight="normal" fill="#262626">· 切换和展开仅使用已加载数据，不自动发支付或偏好写入。</text><text x="54" y="1064" font-size="13" font-weight="normal" fill="#262626">· 错误不当真空，0不当未知，合同不跨项求和；身份变化拒旧回报。</text><rect x="40" y="1094" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1120" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="1149" x2="1146" y2="1149" stroke="#aaaaaa"/><text x="54" y="1169" font-size="13" font-weight="normal" fill="#262626">· 资金模式未知、停用、退役分别展示；历史可见不代表允许新充值。</text><text x="54" y="1199" font-size="13" font-weight="normal" fill="#262626">· 仅页面设计，不改充值 / 结算 / 退款规则，也不接支付网络。</text><rect x="40" y="1229" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1255" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1284" x2="1146" y2="1284" stroke="#aaaaaa"/><text x="54" y="1304" font-size="13" font-weight="normal" fill="#262626">· 余额、充值、兑换、我的订阅分为清晰区块；资金历史统一入口，管理订阅仍在管理员区域。</text><text x="54" y="1334" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1378" font-size="10" font-weight="normal" fill="#666666">wallet · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
