<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1607" viewBox="0 0 390 1607" role="img" aria-labelledby="title desc"><title id="title">账户与注册 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。管理员 / Root按既有设置权限，Lite按既有能力裁剪</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">账户与注册</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/system-settings/auth/basic-auth</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><text x="16" y="243" font-size="15" font-weight="600" fill="#262626">当前任务字段</text><text x="16.0" y="273" font-size="12" font-weight="600" fill="#262626">密码登录</text><rect x="16.0" y="282" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="309" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="367" font-size="12" font-weight="600" fill="#262626">开放注册</text><rect x="16.0" y="376" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="403" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="461" font-size="12" font-weight="600" fill="#262626">邮箱验证</text><rect x="16.0" y="470" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="497" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="555" font-size="12" font-weight="600" fill="#262626">邮箱域名限制</text><rect x="16.0" y="564" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="591" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="649" font-size="12" font-weight="600" fill="#262626">邮箱别名限制</text><rect x="16.0" y="658" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="685" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16.0" y="731" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="757" font-size="16" font-weight="600" fill="#262626">基础登录</text><line x1="30.0" y1="786" x2="360.0" y2="786" stroke="#aaaaaa"/><text x="30.0" y="806" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="30.0" y="836" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="30.0" y="866" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="16.0" y="894" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="920" font-size="16" font-weight="600" fill="#262626">注册安全约束</text><line x1="30.0" y1="949" x2="360.0" y2="949" stroke="#aaaaaa"/><text x="30.0" y="969" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="30.0" y="999" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="30.0" y="1029" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="16" y="1057" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1083" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1112" x2="360" y2="1112" stroke="#aaaaaa"/><text x="30" y="1132" font-size="13" font-weight="normal" fill="#262626">· 分区顶部只保留一个主保存入口；底部未保存栏</text><text x="40" y="1152" font-size="13" font-weight="normal" fill="#262626">在手机不遮挡最后一个字段或验证信息。</text><text x="30" y="1182" font-size="13" font-weight="normal" fill="#262626">· 低保真图表达任务分组和可访问字段范围；最终</text><text x="40" y="1202" font-size="13" font-weight="normal" fill="#262626">字段校验与服务端契约保持不变。</text><rect x="16" y="1232" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1258" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1287" x2="360" y2="1287" stroke="#aaaaaa"/><text x="30" y="1307" font-size="13" font-weight="normal" fill="#262626">· 同一任务的字段在当前分区内归组；高级参数可</text><text x="40" y="1327" font-size="13" font-weight="normal" fill="#262626">展开，旧分区地址和服务端选项不删除。</text><text x="30" y="1357" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1377" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1407" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1430" font-size="13" font-weight="600" fill="#262626">A1 保存当前分区</text><rect x="184" y="1407" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1430" font-size="13" font-weight="normal" fill="#262626">A2 放弃草稿</text><rect x="0" y="1471" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1509" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1565" font-size="10" font-weight="normal" fill="#666666">settings-auth-basic-auth · 手机390 · 来源 c916051e · 浏览器未验</text><text x="16" y="1582" font-size="10" font-weight="normal" fill="#666666">证</text></g></svg>
