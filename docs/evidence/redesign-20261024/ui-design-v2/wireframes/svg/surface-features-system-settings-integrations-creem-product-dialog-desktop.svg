<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="906" viewBox="0 0 1200 906" role="img" aria-labelledby="title desc"><title id="title">编辑产品 / 添加产品 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">编辑产品 / 添加产品</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：编辑产品 / 添加产品</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="237" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原列表并恢复焦点。</text><text x="40" y="297" font-size="15" font-weight="600" fill="#262626">任务字段 / 当前证据</text><text x="40.0" y="327" font-size="12" font-weight="600" fill="#262626">产品名称</text><rect x="40.0" y="336" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="363" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="327" font-size="12" font-weight="600" fill="#262626">产品 ID</text><rect x="417.3333333333333" y="336" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="363" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="327" font-size="12" font-weight="600" fill="#262626">货币</text><rect x="794.6666666666666" y="336" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="363" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="40.0" y="421" font-size="12" font-weight="600" fill="#262626">价格</text><rect x="40.0" y="430" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="457" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="421" font-size="12" font-weight="600" fill="#262626">额度</text><rect x="417.3333333333333" y="430" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="457" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="503" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="529" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="558" x2="1146" y2="558" stroke="#aaaaaa"/><text x="54" y="578" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="54" y="608" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐；不得因统一模板删去业务参数。</text><text x="54" y="638" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、影响及取消入口；若为编辑，错误就近显示并保留草稿。</text><rect x="40" y="668" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="694" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="723" x2="1146" y2="723" stroke="#aaaaaa"/><text x="54" y="743" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；确认语义与提交契约仍按各自业务保留。</text><text x="54" y="773" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="803" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="826" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="174" y="803" width="126" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="826" font-size="13" font-weight="normal" fill="#262626">A2 更新 / 添加</text><text x="40" y="881" font-size="10" font-weight="normal" fill="#666666">surface-features-system-settings-integrations-creem-product-dialog · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
