a" stroke="#999999"/><text x="52" y="916" font-size="12" font-weight="normal" fill="#262626">每页条数：20 / 50 / 100</text><rect x="40" y="945" width="1120" height="48" rx="5" fill="#fafafa" stroke="#999999"/><text x="52" y="974" font-size="12" font-weight="normal" fill="#262626">页码：首页  ‹  1  2  …  N  ›  末页</text><rect x="40" y="1003" width="1120" height="48" rx="5" fill="#fafafa" stroke="#999999"/><text x="52" y="1032" font-size="12" font-weight="normal" fill="#262626">直接跳页：第 [ 输入页码 ] 页  [ 跳转 ]</text><rect x="40" y="1069" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1095" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="1124" x2="1146" y2="1124" stroke="#aaaaaa"/><text x="54" y="1144" font-size="13" font-weight="normal" fill="#262626">· 分页含首尾页、页码、20/50/100条选择与输入页码直接跳转；不一次拉取所有正文。</text><text x="54" y="1174" font-size="13" font-weight="normal" fill="#262626">· 页码、每页条数、筛选和焦点在返回时保留；缓存继续按用户与会话隔离。</text><text x="54" y="1204" font-size="13" font-weight="normal" fill="#262626">· 记录可检索不等于有完整正文；未采集、已过期、截断和加载失败分别说明。</text><text x="54" y="1234" font-size="13" font-weight="normal" fill="#262626">· 打开记录只读，绝不重放生成请求。</text><rect x="40" y="1264" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1290" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1319" x2="1146" y2="1319" stroke="#aaaaaa"/><text x="54" y="1339" font-size="13" font-weight="normal" fill="#262626">· 请求工作区共享筛选和分页；正文权限保持独立，不把正文复制到普通用户的调用记录缓存。</text><text x="54" y="1369" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1413" font-size="10" font-weight="normal" fill="#666666">request-bodies · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
