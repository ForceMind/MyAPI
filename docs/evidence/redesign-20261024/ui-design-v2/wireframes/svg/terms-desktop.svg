<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">用户协议 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">文档 / 登录 / 控制台</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">用户协议</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/user-agreement</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="120" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="238" font-size="13" font-weight="600" fill="#262626">A1 进入控制台</text><rect x="168" y="215" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="178" y="238" font-size="13" font-weight="normal" fill="#262626">A2 登录</text><rect x="296" y="215" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="306" y="238" font-size="13" font-weight="normal" fill="#262626">A3 查看模型</text><rect x="40.0" y="279" width="1120.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="305" font-size="16" font-weight="600" fill="#262626">协议正文</text><line x1="54.0" y1="334" x2="1146.0" y2="334" stroke="#aaaaaa"/><text x="54.0" y="354" font-size="13" font-weight="normal" fill="#262626">· 标题与更新时间</text><text x="54.0" y="384" font-size="13" font-weight="normal" fill="#262626">· 可读内容区</text><text x="54.0" y="414" font-size="13" font-weight="normal" fill=