<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1701" viewBox="0 0 390 1701" role="img" aria-labelledby="title desc"><title id="title">邮件服务 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。管理员 / Root按既有设置权限，Lite按既有能力裁剪</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">邮件服务</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/system-settings/operations/email</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><text x="16" y="243" font-size="15" font-weight="600" fill="#262626">当前任务字段</text><text x="16.0" y="273" font-size="12" font-weight="600" fill="#262626">SMTP地址 / 端口</text><rect x="16.0" y="282" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="309" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="367" font-size="12" font-weight="600" fill="#262626">账号 / 发件人</text><rect x="16.0" y="376" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="403" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="461" font-size="12" font-weight="600" fill="#262626">密码〔掩码〕</text><rect x="16.0" y="470" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="497" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="