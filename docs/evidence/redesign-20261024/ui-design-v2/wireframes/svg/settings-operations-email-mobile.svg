1="30" y1="1206" x2="360" y2="1206" stroke="#aaaaaa"/><text x="30" y="1226" font-size="13" font-weight="normal" fill="#262626">· 分区顶部只保留一个主保存入口；底部未保存栏</text><text x="40" y="1246" font-size="13" font-weight="normal" fill="#262626">在手机不遮挡最后一个字段或验证信息。</text><text x="30" y="1276" font-size="13" font-weight="normal" fill="#262626">· 低保真图表达任务分组和可访问字段范围；最终</text><text x="40" y="1296" font-size="13" font-weight="normal" fill="#262626">字段校验与服务端契约保持不变。</text><rect x="16" y="1326" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1352" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1381" x2="360" y2="1381" stroke="#aaaaaa"/><text x="30" y="1401" font-size="13" font-weight="normal" fill="#262626">· 同一任务的字段在当前分区内归组；高级参数可</text><text x="40" y="1421" font-size="13" font-weight="normal" fill="#262626">展开，旧分区地址和服务端选项不删除。</text><text x="30" y="1451" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1471" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1501" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1524" font-size="13" font-weight="600" fill="#262626">A1 保存当前分区</text><rect x="184" y="1501" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1524" font-size="13" font-weight="normal" fill="#262626">A2 放弃草稿</text><rect x="0" y="1565" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1603" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1659" font-size="10" font-weight="normal" fill="#666666">settings-operations-email · 手机390 · 来源 c916051e · 浏览器未</text><text x="16" y="1676" font-size="10" font-weight="normal" fill="#666666">验证</text></g></svg>
