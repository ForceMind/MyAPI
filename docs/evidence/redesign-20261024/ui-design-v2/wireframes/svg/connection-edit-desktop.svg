<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1262" viewBox="0 0 1200 1262" role="img" aria-labelledby="title desc"><title id="title">添加 / 编辑连接 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">添加 / 编辑连接</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：添加 / 编辑连接</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="240" font-size="12" font-weight="normal" fill="#262626">基本连接</text><rect x="322.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="330.0" y="240" font-size="12" font-weight="normal" fill="#262626">账户凭据</text><rect x="604.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="240" font-size="12" font-weight="normal" fill="#262626">模型与分组</text><rect x="886.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="894.0" y="240" font-size="12" font-weight="normal" fill="#262626">高级设置</text><text x="40" y="293" font-size="15" font-weight="600" fill="#262626">当前主分区 · 其余原字段按选中分区显示</text><text x="40.0" y="323" font-size="12" font-weight="600" fill="#262626">连接名称〔完整〕</text><rect x="40.0" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="323" font-size="12" font-weight="600" fill="#262626">供应商类型〔原选项〕</text><rect x="417.3333333333333" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="323" font-size="12" font-weight="600" fill="#262626">地址 / 接入方式</text><rect x="794.6666666666666" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="40.0" y="417" font-size="12" font-weight="600" fill="#262626">当前所需凭据字段</text><rect x="40.0" y="426" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="453" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40.0" y="499" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="524" font-size="12" font-weight="normal" fill="#262626">模型与分组：已保存 N 项 ▾</text><rect x="604.0" y="499" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="524" font-size="12" font-weight="normal" fill="#262626">获取当前渠道模型〔明确点击〕</text><rect x="40" y="559" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="585" font-size="16" font-weight="600" fill="#262626">模型来源与草稿</text><line x1="54" y1="614" x2="1146" y2="614" stroke="#aaaaaa"/><text x="54" y="634" font-size="13" font-weight="normal" fill="#262626">· 只从当前渠道本次获取结果选择，不按前缀/全局目录填充</text><text x="54" y="664" font-size="13" font-weight="normal" fill="#262626">· 当前已保存ID、手工输入、映射与自定义预设保留；应用前可复核</text><text x="54" y="694" font-size="13" font-weight="normal" fill="#262626">· 变更类型/地址/凭据后旧结果失效，失败和无列表能力明确提示</text><rect x="40" y="724" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="750" font-size="16" font-weight="600" fill="#262626">高级配置入口〔默认收起；错误自动展开〕</text><line x1="54" y1="779" x2="1146" y2="779" stroke="#aaaaaa"/><text x="54" y="799" font-size="13" font-weight="normal" fill="#262626">· 已配置 N 组  ›  选路 / 参数 / 请求头 / 状态码 / 透传</text><text x="54" y="829" font-size="13" font-weight="normal" fill="#262626">· 手机与桌面都能直达同一分区；不因优先级/权重非0铺开全部内容</text><text x="54" y="859" font-size="13" font-weight="normal" fill="#262626">· 原保存、风险确认、取消、字段校验与返回焦点保留</text><rect x="40" y="889" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="915" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="54" y1="944" x2="1146" y2="944" stroke="#aaaaaa"/><text x="54" y="964" font-size="13" font-weight="normal" fill="#262626">· 错误自动展开并定位，不折叠必填字段、金额或关键确认。</text><text x="54" y="994" font-size="13" font-weight="normal" fill="#262626">· 字段、校验、草稿、凭据隔离、原API/写入顺序与不重放保持。</text><rect x="40" y="1024" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1050" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="1079" x2="1146" y2="1079" stroke="#aaaaaa"/><text x="54" y="1099" font-size="13" font-weight="normal" fill="#262626">· 把基本接入、路由和高级参数分组；保存与主动测试分开。</text><text x="54" y="1129" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机全屏或单列，不堆叠窄抽屉。</text><rect x="40" y="1159" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="1182" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="174" y="1159" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="1182" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><rect x="364" y="1159" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="374" y="1182" font-size="13" font-weight="normal" fill="#262626">A3 编辑模型映射</text><text 