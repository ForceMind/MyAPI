<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="828" viewBox="0 0 1200 828" role="img" aria-labelledby="title desc"><title id="title">添加 / 编辑连接 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">添加 / 编辑连接</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：添加 / 编辑连接</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40" y="215" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="241" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="270" x2="1146" y2="270" stroke="#aaaaaa"/><text x="54" y="290" font-size="13" font-weight="normal" fill="#262626">· 原全部编辑字段 / 错误 / 保存操作</text><text x="54" y="320" font-size="13" font-weight="normal" fill="#262626">· 发现模型：状态 / 观察时间 / 过期提示 / 显式刷新</text><text x="54" y="350" font-size="13" font-weight="normal" fill="#262626">· 发现模型 N ▾</text><rect x="40" y="380" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="406" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="435" x2="1146" y2="435" stroke="#aaaaaa"/><text x="54" y="455" font-size="13" font-weight="normal" fill="#262626">· 完整已发现模型名单；收起保留编辑草稿</text><rect x="40" y="485" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="511" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="540" x2="1146" y2="540" stroke="#aaaaaa"/><text x="54" y="560" font-size="13" font-weight="normal" fill="#262626">· 展开不触发上游发现；刷新保持明确操作和原权限。</text><rect x="40" y="590" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="616" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="645" x2="1146" y2="645" stroke="#aaaaaa"/><text x="54" y="665" font-size="13" font-weight="normal" fill="#262626">· 把基本接入、路由和高级参数分组；保存与主动测试分开。</text><text x="54" y="695" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机全屏或单列，不堆叠窄抽屉。</text><rect x="40" y="725" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="748" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="174" y="725" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="748" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><rect x="364" y="725" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="374" y="748" font-size="13" font-weight="normal" fill="#262626">A3 编辑模型映射</text><text x="40" y="803" font-size="10" font-weight="normal" fill="#666666">connection-edit · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
