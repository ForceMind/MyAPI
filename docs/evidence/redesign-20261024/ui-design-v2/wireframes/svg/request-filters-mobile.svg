<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1049" viewBox="0 0 390 1049" role="img" aria-labelledby="title desc"><title id="title">正文与 SSE · 手机筛选展开态 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">正文与 SSE · 手机筛选展开态</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/full-content-logs〔手机筛选〕</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="247" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原</text><text x="28" y="266" font-size="12" font-weight="normal" fill="#262626">列表并恢复焦点。</text><text x="16" y="321" font-size="15" font-weight="600" fill="#262626">任务字段 / 当前证据</text><text x="16.0" y="351" font-size="12" font-weight="600" fill="#262626">日期范围〔同一日历〕</text><rect x="16.0" y="360" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="387" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="445" font-size="12" font-weight="600" fill="#262626">模型</text><rect x="16.0" y="454" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="481" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="539" font-size="12" font-weight="600" fill="#262626">API Key名称 / ID</text><rect x="16.0" y="548" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="575" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="633" font-size="12" font-weight="600" fill="#262626">Request ID</text><rect x="16.0" y="642" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="669" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="715" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="741" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="770" x2="360" y2="770" stroke="#aaaaaa"/><text x="30" y="790" font-size="13" font-weight="normal" fill="#262626">· 展开态与正文列表主屏分开画；默认一行筛选摘</text><text x="40" y="810" font-size="13" font-weight="normal" fill="#262626">要，避免手机首屏全被表单占据。</text><text x="30" y="840" font-size="13" font-weight="normal" fill="#262626">· 键盘提交与查询按钮等价；日期无效或起止倒置</text><text x="40" y="860" font-size="13" font-weight="normal" fill="#262626">时就近报错并保留草稿。</text><rect x="16" y="890" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="913" font-size="13" font-weight="600" fill="#262626">A1 应用并查询</text><rect x="184" y="890" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="913" font-size="13" font-weight="normal" fill="#262626">A2 日期范围</text><rect x="16" y="946" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="969" font-size="13" font-weight="normal" fill="#262626">A3 重置筛选</text><rect x="184" y="946" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="969" font-size="13" font-weight="normal" fill="#262626">A4 取消</text><text x="16" y="1024" font-size="10" font-weight="normal" fill="#666666">request-filters · 手机390 · 来源 c916051e · 浏览器未验证</text></g><