<svg xmlns="http://www.w3.org/2000/svg" width="390" height="752" viewBox="0 0 390 752" role="img" aria-labelledby="title desc"><title id="title">隐私政策 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">隐私政策</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/privacy-policy</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="248" font-size="13" font-weight="600" fill="#262626">A1 进入控制台</text><rect x="184" y="225" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="248" font-size="13" font-weight="normal" fill="#262626">A2 登录</text><rect x="16" y="281" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="304" font-size="13" font-weight="normal" fill="#262626">A3 查看模型</text><rect x="16.0" y="345" width="358.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="371" font-size="16" font-weight="600" fill="#262626">政策正文</text><line x1="30.0" y1="400" x2="360.0" y2="400" stroke="#aaaaaa"/><text x="30.0" y="420" font-size="13" font-weight="normal" fill="#262626">· 标题与更新时间</text><text x="30.0" y="450" font-size="13" font-weight="normal" fill="#262626">· 可读内容区</text><text x="30.0" y="480" font-size="13" font-weight="normal" fill="#262626">· 章节索引</text><text x="30.0" y="510" font-size="13" font-weight="normal" fill="#262626">· 返回上一页</text><rect x="16" y="538" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="564" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="593" x2="360" y2="593" stroke="#aaaaaa"/><text x="30" y="613" font-size="13" font-weight="normal" fill="#262626">· 公开内容按现有开关与权限显示；模型名 / 提供</text><text x="40" y="633" font-size="13" font-weight="normal" fill="#262626">方名不作项目品牌替换。</text><text x="30" y="663" font-size="13" font-weight="normal" fill="#262626">· 仅重组呈现，不修改价格计算、支付或供应商契</text><text x="40" y="683" font-size="13" font-weight="normal" fill="#262626">约。</text><text x="16" y="727" font-size="10" font-weight="normal" fill="#666666">privacy · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
