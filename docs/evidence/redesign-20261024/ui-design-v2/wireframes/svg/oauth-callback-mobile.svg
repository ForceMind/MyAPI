<svg xmlns="http://www.w3.org/2000/svg" width="390" height="650" viewBox="0 0 390 650" role="img" aria-labelledby="title desc"><title id="title">OAuth 回调页 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">OAuth 回调页</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/oauth/$provider</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="248" font-size="13" font-weight="600" fill="#262626">A1 失败后返回登录</text><rect x="16.0" y="289" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="315" font-size="16" font-weight="600" fill="#262626">授权结果</text><line x1="30.0" y1="344" x2="360.0" y2="344" stroke="#aaaaaa"/><text x="30.0" y="364" font-size="13" font-weight="normal" fill="#262626">· 提供方名称</text><text x="30.0" y="394" font-size="13" font-weight="normal" fill="#262626">· 处理中 / 成功 / 失败</text><text x="30.0" y="424" font-size="13" font-weight="normal" fill="#262626">· 失败时返回登录</text><rect x="16" y="452" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="478" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="507" x2="360" y2="507" stroke="#aaaaaa"/><text x="30" y="527" font-size="13" font-weight="normal" fill="#262626">· 认证状态切换不携带上一账户的缓存或正文；不</text><text x="40" y="547" font-size="13" font-weight="normal" fill="#262626">用“重试”盲目重放OAuth写入。</text><text x="16" y="591" font-size="10" font-weight="normal" fill="#666666">oauth-callback · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
