="1090" font-size="13" font-weight="normal" fill="#262626">· 路由按优先级排列</text><text x="30.0" y="1120" font-size="13" font-weight="normal" fill="#262626">· 移动规则与替换全部路由分开确认</text><rect x="16" y="1148" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1174" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1203" x2="360" y2="1203" stroke="#aaaaaa"/><text x="30" y="1223" font-size="13" font-weight="normal" fill="#262626">· 不同内容页签单独成图，不用一个未展开的“高级</text><text x="40" y="1243" font-size="13" font-weight="normal" fill="#262626">设置”占位替代。</text><text x="30" y="1273" font-size="13" font-weight="normal" fill="#262626">· 模式切换保留草稿；从结构化视图切到JSON时不</text><text x="40" y="1293" font-size="13" font-weight="normal" fill="#262626">得丢失未知字段或合法的显式0 / false。</text><rect x="16" y="1323" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1346" font-size="13" font-weight="600" fill="#262626">A1 应用当前草稿</text><rect x="184" y="1323" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1346" font-size="13" font-weight="normal" fill="#262626">A2 返回来源页</text><text x="16" y="1401" font-size="10" font-weight="normal" fill="#666666">surface-features-channels-components-dialogs-advanced-custom-ed</text><text x="16" y="1418" font-size="10" font-weight="normal" fill="#666666">itor-dialog-view-forwarding · 手机390 · 来源 c916051e · 浏览器</text><text x="16" y="1435" font-size="10" font-weight="normal" fill="#666666">未验证</text></g></svg>
