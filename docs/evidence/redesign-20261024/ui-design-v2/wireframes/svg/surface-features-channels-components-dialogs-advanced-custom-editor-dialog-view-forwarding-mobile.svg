<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1460" viewBox="0 0 390 1460" role="img" aria-labelledby="title desc"><title id="title">高级自定义路由 · 转发路由 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">高级自定义路由 · 转发路由</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：高级自定义路由〔forwarding〕</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="26" y="252" font-size="13" font-weight="600" fill="#262626">转发路由</text><rect x="112" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="122" y="252" font-size="13" font-weight="normal" fill="#262626">模型规则</text><rect x="208" y="225" width="108" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="218" y="252" font-size="13" font-weight="normal" fill="#262626">余额查询规则</text><rect x="16" y="277" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="304" font-size="13" font-weight="normal" fill="#262626">原始JSON</text><rect x="16" y="337" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="359" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原</text><text x