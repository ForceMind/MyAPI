<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="811" viewBox="0 0 1200 811" role="img" aria-labelledby="title desc"><title id="title">个人资料 · 我的订阅 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">个人资料 · 我的订阅</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/profile〔subscription〕</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="94" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="50" y="242" font-size="13" font-weight="normal" fill="#262626">资料与偏好</text><rect x="142" y="215" width="94" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="152" y="242" font-size="13" font-weight="normal" fill="#262626">安全与登录</text><rect x="244" y="215" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="254" y="242" font-size="13" font-weight="600" fill="#262626">我的订阅</text><rect x="40.0" y="275" width="552.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="301" font-size="16" font-weight="600" fill="#262626">只读订阅</text><line x1="54.0" y1="330" x2="578.0" y2="330" stroke="#aaaaaa"/><text x="54.0" y="350" font-size="13" font-weight="normal" fill="#262626">· 方案名称</text><text x="54.0" y="380" font-size="13" font-weight="normal" fill="#262626">· 当前周期</text><text x="54.0" y="410" font-size="13" font-weight="normal" fill="#262626">· 剩余证据</text><text x="54.0" y="440" font-size="13" font-weight="normal" fill="#262626">· 到期时间</text><rect x="608.0" y="275" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="622.0" y="301" font-size="16" font-weight="600" fill="#262626">账户功能</text><line x1="622.0" y1="330" x2="1146.0" y2="330" stroke="#aaaaaa"/><text x="622.0" y="350" font-size="13" font-weight="normal" fill="#262626">· 签到入口〔能力允许时〕</text><text x="622.0" y="380" font-size="13" font-weight="normal" fill="#262626">· 奖励记录</text><text x="622.0" y="410" font-size="13" font-weight="normal" fill="#262626">· 历史资金入口</text><rect x="40" y="468" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="494" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="523" x2="1146" y2="523" stroke="#aaaaaa"/><text x="54" y="543" font-size="13" font-weight="normal" fill="#262626">· 个人资料拆为明确的子区；Lite 的订阅只读能力不变；隐藏商业写入不隐藏已有历史。</text><rect x="40" y="573" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="599" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="628" x2="1146" y2="628" stroke="#aaaaaa"/><text x="54" y="648" font-size="13" font-weight="normal" fill="#262626">· 整理长页面为资料、安全、订阅三个清晰分区；所有现有可用能力仍可达。</text><text x="54" y="678" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="708" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="731" font-size="13" font-weight="600" fill="#262626">A1 保存当前修改</text><rect x="181" y="708" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="191" y="731" font-size="13" font-weight="normal" fill="#262626">A2 登录会话</text><rect x="309" y="708" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="319" y="731" font-size="13" font-weight="normal" fill="#262626">A3 提示词学习</text><text x="40" y="786" font-size="10" font-weight="normal" fill="#666666">profile-subscription · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
