<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="778" viewBox="0 0 1200 778" role="img" aria-labelledby="title desc"><title id="title">管理 Key · 桌面线稿</title><desc id="desc">现有个人资料安全区的增量组件，保留旧访问令牌、权限、确认和返回上下文；不是新增路由或视觉验收。</desc><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,sans-serif" fill="#222"><rect x="40" y="603" width="1120" height="142" fill="none" stroke="#888" rx="6"/><rect x="40" y="443" width="1120" height="142" fill="none" stroke="#888" rx="6"/><rect x="40" y="283" width="1120" height="142" fill="none" stroke="#888" rx="6"/><rect x="40" y="123" width="1120" height="142" fill="none" stroke="#888" rx="6"/><text x="54" y="45" font-size="18">MyAPI / Profile / 管理 Key</text><text x="54" y="81" font-size="12">沿用 profile-security；线稿，未浏览器验证</text><text x="54" y="153" font-size="16">管理 Key · 个人资料安全区增量</text><text x="54" y="187" font-size="14">名称 / 状态 / 权限摘要 / 到期时间</text><text x="54" y="221" font-size="14">新建管理 Key    刷新列表    撤销指定 Key〔确认〕</text><text x="54" y="313" font-size="16">创建〔仅登录管理员可见〕</text><text x="54" y="347" font-size="14">名称 + 权限〔默认只读〕 + 有效天数〔默认7，最多90〕</text><text x="54" y="381" font-size="14">高级范围 ▸ 渠道 ID / API Key ID；空列表表示该领域全部已有权限</text><text x="54" y="473" font-size="16">确认与一次性凭据</text><text x="54" y="507" font-size="14">确认名称、权限、对象范围与有效期后仅提交一次</text><text x="54" y="541" font-size="14">创建后仅此次显示 / 复制；关闭、换账户、换会话立即清除</text><text x="54" y="633" font-size="16">异常与安全接入</text><text x="54" y="667" font-size="14">加载 / 空 / 失败 / 已撤销 / 已到期分别显示</text><text x="54" y="701" font-size="14">结果未知：先刷新核对，不重放；凭据放安全文件，不贴聊天</text></g></svg>
