<svg xmlns="http://www.w3.org/2000/svg" width="390" height="726" viewBox="0 0 390 726" role="img" aria-labelledby="title desc"><title id="title">个人资料 · 账户绑定 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">个人资料 · 账户绑定</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/profile〔bindings〕</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16.0" y="225" width="358.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="251" font-size="16" font-weight="600" fill="#262626">已绑定身份</text><line x1="30.0" y1="280" x2="360.0" y2="280" stroke="#aaaaaa"/><text x="30.0" y="300" font-size="13" font-weight="normal" fill="#262626">· 邮箱</text><text x="30.0" y="330" font-size="13" font-weight="normal" fill="#262626">· GitHub / Discord / OIDC等既有绑定</text><text x="30.0" y="360" font-size="13" font-weight="normal" fill="#262626">· Telegram / WeChat等已启用方式</text><text x="30.0" y="390" font-size="13" font-weight="normal" fill="#262626">· 明确绑定 / 解绑入口</text><rect x="16" y="418" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="444" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="473" x2="360" y2="473" stroke="#aaaaaa"/><text x="30" y="493" font-size="13" font-weight="normal" fill="#262626">· 与基本资料设置分开成图；解绑前确认身份与目</text><text x="40" y="513" font-size="13" font-weight="normal" fill="#262626">标，不删除账户或刷新登录来绕过验证。</text><rect x="16" y="543" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="566" font-size="13" font-weight="600" fill="#262626">A1 返回个人资料</text><rect x="184" y="543" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="566" font-size="13" font-weight="normal" fill="#262626">A2 安全验证</text><rect x="0" y="607" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="645" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="701" font-size="10" font-weight="normal" fill="#666666">profile-bindings · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
