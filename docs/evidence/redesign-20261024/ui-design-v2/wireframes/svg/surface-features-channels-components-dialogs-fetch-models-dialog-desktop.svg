<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1363" viewBox="0 0 1200 1363" role="img" aria-labelledby="title desc"><title id="title">获取模型 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">获取模型</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：获取模型</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="240" font-size="12" font-weight="normal" fill="#262626">当前渠道 / 连接来源〔不展示密钥〕</text><rect x="604.0" y="215" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="240" font-size="12" font-weight="normal" fill="#262626">重新获取〔明确动作〕</text><rect x="40.0" y="275" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="300" font-size="12" font-weight="normal" fill="#262626">新增候选 N</text><rect x="416.0" y="275" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="424.0" y="300" font-size="12" font-weight="normal" fill="#262626">已保存 N</text><rect x="792.0" y="275" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="800.0" y="300" font-size="12" font-weight="normal" fill="#262626">上游缺失 N</text><text x="40" y="353" font-size="15" font-weight="600" fill="#262626">当前渠道结果；不读取全局推荐名单</text><text x="40.0" y="383" font-size="12" font-weight="600" fill="#262626">搜索当前返回的模型 ID</text><rect x="40.0" y="392" width="1120.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="419" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="465" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="491" font-size="16" font-weight="600" fill="#262626">模型列表〔合成占位〕</text><line x1="54" y1="520" x2="1146" y2="520" stroke="#aaaaaa"/><text x="54" y="540" font-size="13" font-weight="normal" fill="#262626">· □ 当前渠道返回的模型 A</text><text x="54" y="570" font-size="13" font-weight="normal" fill="#262626">· □ 当前渠道返回的模型 B</text><text x="54" y="600" font-size="13" font-weight="normal" fill="#262626">· 已保存但本次未返回的模型：保留，人工复核</text><text x="54" y="630" font-size="13" font-weight="normal" fill="#262626">· 全选仅作用于当前分区；不自动替换配置</text><rect x="40" y="660" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="686" font-size="16" font-weight="600" fill="#262626">底部动作</text><line x1="54" y1="715" x2="1146" y2="715" stroke="#aaaaaa"/><text x="54" y="735" font-size="13" font-weight="normal" fill="#262626">· 取消：不改草稿或渠道</text><text x="54" y="765" font-size="13" font-weight="normal" fill="#262626">· 应用所选：保留原确认、权限和保存目标</text><rect x="40" y="795" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="821" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="54" y1="850" x2="1146" y2="850" stroke="#aaaaaa"/><text x="54" y="870" font-size="13" font-weight="normal" fill="#262626">· 不按前缀猜支持，不把全局/静态目录称作当前渠道返回。</text><text x="54" y="900" font-size="13" font-weight="normal" fill="#262626">· 类型/地址/凭据/身份改变使旧获取结果失效；失败不回填旧名单。</text><text x="54" y="930" font-size="13" font-weight="normal" fill="#262626">· 无查询能力时明确未知，保留手工配置与原权限；不因展示自动请求供应商。</text><rect x="40" y="960" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="986" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="1015" x2="1146" y2="1015" stroke="#aaaaaa"/><text x="54" y="1035" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="54" y="1065" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐；不得因统一模板删去业务参数。</text><text x="54" y="1095" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、影响及取消入口；若为编辑，错误就近显示并保留草稿。</text><rect x="40" y="1125" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1151" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1180" x2="1146" y2="1180" stroke="#aaaaaa"/><text x="54" y="1200" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；确认语义与提交契约仍按各自业务保留。</text><text x="54" y="1230" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="1260" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="1283" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="174" y="1260" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="1283" font-size="13" font-weight="normal" fill="#262626">A2 保存模型</text><text x="40" y="1338" font-size="10" font-weight="normal" fill="#666666">surface-features-channels-components-dialogs-fetch-models-dialog · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
