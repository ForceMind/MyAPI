<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1272" viewBox="0 0 390 1272" role="img" aria-labelledby="title desc"><title id="title">模型范围 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">模型范围</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：模型范围</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="251" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="280" x2="360" y2="280" stroke="#aaaaaa"/><text x="30" y="300" font-size="13" font-weight="normal" fill="#262626">· 模型模式 / 已保存 N ▾ / 原风险说明</text><text x="30" y="330" font-size="13" font-weight="normal" fill="#262626">· 目录搜索及原完整保存/取消</text><rect x="16" y="360" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="386" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="415" x2="360" y2="415" stroke="#aaaaaa"/><text x="30" y="435" font-size="13" font-weight="normal" fill="#262626">· 全部可编辑已保存模型ID，包括旧ID/空ID</text><text x="30" y="465" font-size="13" font-weight="normal" fill="#262626">· 原逐项移除动作与受限模式规则</text><rect x="16" y="495" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="521" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="550" x2="360" y2="550" stroke="#aaaaaa"/><text x="30" y="570" font-size="13" font-weight="normal" fill="#262626">· 折叠不清空/去重/修改draft.models；不隐藏模</text><text x="40" y="590" font-size="13" font-weight="normal" fill="#262626">式或保存影响。</text><rect x="16" y="620" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="646" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="675" x2="360" y2="675" stroke="#aaaaaa"/><text x="30" y="695" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="715" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="745" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="765" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="795" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="815" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="835" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="865" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="891" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="920" x2="360" y2="920" stroke="#aaaaaa"/><text x="30" y="940" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="960" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="990" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1010" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1040" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1063" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="184" y="1040" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1063" font-size="13" font-weight="normal" fill="#262626">A2 重试</text><rect x="16" y="1096" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1119" font-size="13" font-weight="normal" fill="#262626">A3 重试加载目录</text><rect x="184" y="1096" width="175" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1119" font-size="13" font-weight="normal" fill="#262626">A4 清除保留的模型列表</text><rect x="16" y="1152" width="161" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1175" font-size="13" font-weight="normal" fill="#262626">A5 重新加载当前范围</text><rect x="185" y="1152" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="195" y="1175" font-size="13" font-weight="normal" fill="#262626">A6 保存模型范围</text><text x="16" y="1230" font-size="10" font-weight="normal" fill="#666666">surface-features-keys-components-model-scope-dialog · 手机390 ·</text><text x="16" y="1247" font-size="10" font-weight="normal" fill="#666666"> 来源 c916051e · 浏览器未验证</text></g></svg>
