<svg xmlns="http://www.w3.org/2000/svg" width="390" height="886" viewBox="0 0 390 886" role="img" aria-labelledby="title desc"><title id="title">安装向导 · 4 复核并初始化 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">安装向导 · 4 复核并初始化</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/setup〔review〕</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="252" font-size="13" font-weight="normal" fill="#262626">数据库</text><rect x="112" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="122" y="252" font-size="13" font-weight="normal" fill="#262626">管理员</text><rect x="208" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="218" y="252" font-size="13" font-weight="normal" fill="#262626">模式</text><rect x="16" y="277" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="26" y="304" font-size="13" font-weight="600" fill="#262626">复核</text><rect x="16" y="337" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="359" font-size="12" font-weight="normal" fill="#262626">数据库检查 → 管理员 → 使用模式 → 复核；提交结果未</text><text x="28" y="378" font-size="12" font-weight="normal" fill="#262626">知时只读恢复</text><rect x="16.0" y="415" width="358.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="441" font-size="16" font-weight="600" fill="#262626">复核摘要</text><line x1="30.0" y1="470" x2="360.0" y2="470" stroke="#aaaaaa"/><text x="30.0" y="490" font-size="13" font-weight="normal" fill="#262626">· 数据库状态</text><text x="30.0" y="520" font-size="13" font-weight="normal" fill="#262626">· 管理员身份〔不展示密码〕</text><text x="30.0" y="550" font-size="13" font-weight="normal" fill="#262626">· 使用模式</text><text x="30.0" y="580" font-size="13" font-weight="normal" fill="#262626">· 初始化影响说明</text><rect x="16" y="608" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="634" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="663" x2="360" y2="663" stroke="#aaaaaa"/><text x="30" y="683" font-size="13" font-weight="normal" fill="#262626">· 顶部品牌与当前步骤保持可访问；手机滚动不遮</text><text x="40" y="703" font-size="13" font-weight="normal" fill="#262626">住表单错误或底部动作。</text><text x="30" y="733" font-size="13" font-weight="normal" fill="#262626">· 初次安装与已有实例分开，禁止通过线稿重建已</text><text x="40" y="753" font-size="13" font-weight="normal" fill="#262626">有数据库。</text><rect x="16" y="783" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="806" font-size="13" font-weight="600" fill="#262626">A1 返回修改</text><rect x="184" y="783" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="806" font-size="13" font-weight="normal" fill="#262626">A2 确认初始化</text><text x="16" y="861" font-size="10" font-weight="normal" fill="#666666">setup-review · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
