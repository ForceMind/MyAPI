<svg xmlns="http://www.w3.org/2000/svg" width="390" height="802" viewBox="0 0 390 802" role="img" aria-labelledby="title desc"><title id="title">两步验证 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">两步验证</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/otp</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><text x="16" y="243" font-size="15" font-weight="600" fill="#262626">当前任务字段</text><text x="16.0" y="273" font-size="12" font-weight="600" fill="#262626">六位验证码 / 恢复码</text><rect x="16.0" y="282" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="309" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16.0" y="355" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="381" font-size="16" font-weight="600" fill="#262626">登录上下文</text><line x1="30.0" y1="410" x2="360.0" y2="410" stroke="#aaaaaa"/><text x="30.0" y="430" font-size="13" font-weight="normal" fill="#262626">· 明确验证中的账户</text><text x="30.0" y="460" font-size="13" font-weight="normal" fill="#262626">· 切换恢复码</text><text x="30.0" y="490" font-size="13" font-weight="normal" fill="#262626">· 返回登录</text><rect x="16" y="518" width="358" height="107" rx="5" fill="#ffffff" stroke="#888