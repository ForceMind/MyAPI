<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1385" viewBox="0 0 390 1385" role="img" aria-labelledby="title desc"><title id="title">高级自定义路由 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">高级自定义路由</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：高级自定义路由</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="252" font-size="13" font-weight="normal" fill="#262626">转发路由</text><rect x="112" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="122" y="252" font-size="13" font-weight="normal" fill="#262626">模型规则</text><rect x="208" y="225" width="108" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="218" y="252" font-size="13" font-weight="normal" fill="#262626">余额查询规则</text><rect x="16" y="277" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="304" font-size="13" font-weight="normal" fill="#262626">原始JSON</text><rect x="16" y="337" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="359" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原</text><text x="28" y="378" font-size="12" font-weight="normal" fill="#262626">列表并恢复焦点。</text><text x="16" y="433" font-size="15" font-weight="600" fill="#262626">任务字段 / 当前证据</text><text x="16.0" y="463" font-size="12" font-weight="600" fill="#262626">作用对象 / 范围</text><rect x="16.0" y="472" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="499" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="557" font-size="12" font-weight="600" fill="#262626">当前值或已存证据</text><rect x="16.0" y="566" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="593" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="651" font-size="12" font-weight="600" fill="#262626">明确动作与影响说明</text><rect x="16.0" y="660" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="687" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="733" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="759" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="788" x2="360" y2="788" stroke="#aaaaaa"/><text x="30" y="808" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="828" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="858" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="878" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="908" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="928" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="948" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="978" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1004" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1033" x2="360" y2="1033" stroke="#aaaaaa"/><text x="30" y="1053" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="1073" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="1103" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1123" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1153" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1176" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="184" y="1153" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1176" font-size="13" font-weight="normal" fill="#262626">A2 保存更改</text><rect x="16" y="1209" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1232" font-size="13" font-weight="normal" fill="#262626">A3 全部折叠</text><rect x="184" y="1209" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1232" font-size="13" font-weight="normal" fill="#262626">A4 展开全部</text><rect x="16" y="1265" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1288" font-size="13" font-weight="normal" fill="#262626">A5 修复顺序</text><text x="16" y="1343" font-size="10" font-weight="normal" fill="#666666">surface-features-channels-components-dialogs-advanced-custom-ed</text><text x="16" y="1360" font-size="10" font-weight="normal" fill="#666666">itor-dialog · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
