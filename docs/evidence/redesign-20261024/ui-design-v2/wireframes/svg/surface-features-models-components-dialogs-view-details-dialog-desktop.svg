<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1083" viewBox="0 0 1200 1083" role="img" aria-labelledby="title desc"><title id="title">部署详情 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">部署详情</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：部署详情</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40" y="215" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="241" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="270" x2="1146" y2="270" stroke="#aaaaaa"/><text x="54" y="290" font-size="13" font-weight="normal" fill="#262626">· 部署ID / 原状态 / 硬件 / GPU数常驻</text><text x="54" y="320" font-size="13" font-weight="normal" fill="#262626">· 容器数量：确知数量或Unknown；读取失败常驻</text><text x="54" y="350" font-size="13" font-weight="normal" fill="#262626">· 位置 N ▾ · 容器 N ▾；原始状态分布保留可见</text><rect x="40" y="380" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="406" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="435" x2="1146" y2="435" stroke="#aaaaaa"/><text x="54" y="455" font-size="13" font-weight="normal" fill="#262626">· 键盘或点击展开全部位置与完整容器ID</text><text x="54" y="485" font-size="13" font-weight="normal" fill="#262626">· 每个容器的原status与明确Open按钮保留</text><text x="54" y="515" font-size="13" font-weight="normal" fill="#262626">· Raw JSON沿原展开方式，不复制多份原始数据</text><rect x="40" y="545" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="571" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="600" x2="1146" y2="600" stroke="#aaaaaa"/><text x="54" y="620" font-size="13" font-weight="normal" fill="#262626">· 展开不刷新、不打开地址、不部署；Open仍逐条明确点击。</text><text x="54" y="650" font-size="13" font-weight="normal" fill="#262626">· 不定义新供应商健康规则；失败/缺失不补0。</text><rect x="40" y="680" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="706" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="735" x2="1146" y2="735" stroke="#aaaaaa"/><text x="54" y="755" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="54" y="785" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐；不得因统一模板删去业务参数。</text><text x="54" y="815" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、影响及取消入口；若为编辑，错误就近显示并保留草稿。</text><rect x="40" y="845" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="871" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="900" x2="1146" y2="900" stroke="#aaaaaa"/><text x="54" y="920" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；确认语义与提交契约仍按各自业务保留。</text><text x="54" y="950" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="980" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="1003" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="174" y="980" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="1003" font-size="13" font-weight="normal" fill="#262626">A2 复制</text><rect x="302" y="980" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="312" y="1003" font-size="13" font-weight="normal" fill="#262626">A3 刷新</text><rect x="430" y="980" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="440" y="1003" font-size="13" font-weight="normal" fill="#262626">A4 打开</text><text x="40" y="1058" font-size="10" font-weight="normal" fill="#666666">surface-features-models-components-dialogs-view-details-dialog · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
