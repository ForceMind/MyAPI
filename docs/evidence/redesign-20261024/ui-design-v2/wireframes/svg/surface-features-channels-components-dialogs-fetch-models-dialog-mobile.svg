<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1726" viewBox="0 0 390 1726" role="img" aria-labelledby="title desc"><title id="title">获取模型 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">获取模型</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：获取模型</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">当前渠道 / 连接来源〔不展示密钥〕</text><rect x="16.0" y="277" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="302" font-size="12" font-weight="normal" fill="#262626">重新获取〔明确动作〕</text><rect x="16.0" y="337" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="362" font-size="12" font-weight="normal" fill="#262626">新增候选 N</text><rect x="16.0" y="389" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="414" font-size="12" font-weight="normal" fill="#262626">已保存 N</text><rect x="16.0" y="441" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="466" font-size="12" font-weight="normal" fill="#262626">上游缺失 N</text><text x="16" y="519" font-size="15" font-weight="600" fill="#262626">当前渠道结果；不读取全局推荐名单</text><text x="16.0" y="549" font-size="12" font-weight="600" fill="#262626">搜索当前返回的模型 ID</text><rect x="16.0" y="558" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="585" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="631" width="358" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="657" font-size="16" font-weight="600" fill="#262626">模型列表〔合成占位〕</text><line x1="30" y1="686" x2="360" y2="686" stroke="#aaaaaa"/><text x="30" y="706" font-size="13" font-weight="normal" fill="#262626">· □ 当前渠道返回的模型 A</text><text x="30" y="736" font-size="13" font-weight="normal" fill="#262626">· □ 当前渠道返回的模型 B</text><text x="30" y="766" font-size="13" font-weight="normal" fill="#262626">· 已保存但本次未返回的模型：保留，人工复核</text><text x="30" y="796" font-size="13" font-weight="normal" fill="#262626">· 全选仅作用于当前分区；不自动替换配置</text><rect x="16" y="826" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="852" font-size="16" font-weight="600" fill="#262626">底部动作</text><line x1="30" y1="881" x2="360" y2="881" stroke="#aaaaaa"/><text x="30" y="901" font-size="13" font-weight="normal" fill="#262626">· 取消：不改草稿或渠道</text><text x="30" y="931" font-size="13" font-weight="normal" fill="#262626">· 应用所选：保留原确认、权限和保存目标</text><rect x="16" y="961" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="987" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="30" y1="1016" x2="360" y2="1016" stroke="#aaaaaa"/><text x="30" y="1036" font-size="13" font-weight="normal" fill="#262626">· 不按前缀猜支持，不把全局/静态目录称作当前渠</text><text x="40" y="1056" font-size="13" font-weight="normal" fill="#262626">道返回。</text><text x="30" y="1086" font-size="13" font-weight="normal" fill="#262626">· 类型/地址/凭据/身份改变使旧获取结果失效；失</text><text x="40" y="1106" font-size="13" font-weight="normal" fill="#262626">败不回填旧名单。</text><text x="30" y="1136" font-size="13" font-weight="normal" fill="#262626">· 无查询能力时明确未知，保留手工配置与原权限</text><text x="40" y="1156" font-size="13" font-weight="normal" fill="#262626">；不因展示自动请求供应商。</text><rect x="16" y="1186" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1212" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1241" x2="360" y2="1241" stroke="#aaaaaa"/><text x="30" y="1261" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="1281" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="1311" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="1331" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="1361" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="1381" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="1401" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="1431" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1457" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1486" x2="360" y2="1486" stroke="#aaaaaa"/><text x="30" y="1506" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="1526" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="1556" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1576" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1606" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1629" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="184" y="1606" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1629" font-size="13" font-weight="normal" fill="#262626">A2 保存模型</text><text x="16" y="1684" font-size="10" font-weight="normal" fill="#666666">surface-features-channels-components-dialogs-fetch-models-dialo</text><text x="16" y="1701" font-size="10" font-weight="normal" fill="#666666">g · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
