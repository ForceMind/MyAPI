<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3359" viewBox="0 0 390 3359" role="img" aria-labelledby="title desc"><title id="title">概览 · 流向板 · 手机</title><desc id="desc">2026-11-07主线线稿增量，合成数据；不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">概览 · 流向板</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/dashboard/overview</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">现另验 / 浏览器未验证</text><rect x="16" y="225" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="247" font-size="12" font-weight="normal" fill="#262626">Full · 流向图主视图；Lite / Desktop布局在下方分别</text><text x="28" y="266" font-size="12" font-weight="normal" fill="#262626">定义，不叠成产品中的三个面板</text><rect x="16" y="303" width="161" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="326" font-size="13" font-weight="600" fill="#262626">A1 添加连接〔跳转〕</text><rect x="16" y="359" width="203" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="382" font-size="13" font-weight="normal" fill="#262626">A2 创建 / 选择Key〔跳转〕</text><rect x="16" y="415" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="438" font-size="13" font-weight="normal" fill="#262626">A4 复制接入地址〔只读〕</text><rect x="16" y="471" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="494" font-size="13" font-weight="normal" fill="#262626">A6 查看请求〔只读跳转〕</text><rect x="16" y="535" width="358" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="561" font-size="16" font-weight="600" fill="#262626">谁在调用 · API Key</text><line x1="30" y1="590" x2="360" y2="590" stroke="#aaaaaa"/><text x="30" y="610" font-size="13" font-weight="normal" fill="#262626">· Key A〔掩码〕 / 请求 —</text><text x="30" y="640" font-size="13" font-weight="normal" fill="#262626">· Key B〔掩码〕 / 状态未知</text><text x="30" y="670" font-size="13" font-weight="normal" fill="#262626">· 选择节点：只筛选已存请求</text><rect x="16" y="700" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="726" font-size="16" font-weight="600" fill="#262626">MyAPI 网关 · 中性紧凑核心</text><line x1="30" y1="755" x2="360" y2="755" stroke="#aaaaaa"/><text x="30" y="775" font-size="13" font-weight="normal" fill="#262626">· 真实Base URL〔来源：配置 / 当前访问〕</text><text x="30" y="805" font-size="13" font-weight="normal" fill="#262626">· A4 复制接入地址〔只读〕</text><text x="30" y="835" font-size="13" font-weight="normal" fill="#262626">· 24小时请求 — / 失败率 — / 中位耗时 —</text><text x="30" y="865" font-size="13" font-weight="normal" fill="#262626">· 每小时请求及数值文字；样本未覆盖不补0</text><text x="30" y="895" font-size="13" font-weight="normal" fill="#262626">· 版本 / 访问摘要；完整原meta保留</text><rect x="16" y="925" width="358" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="951" font-size="16" font-weight="600" fill="#262626">连接到哪里 · 原连接</text><line x1="30" y1="980" x2="360" y2="980" stroke="#aaaaaa"/><text x="30" y="1000" font-size="13" font-weight="normal" fill="#262626">· 连接 A / 已保存状态；健康未知</text><text x="30" y="1030" font-size="13" font-weight="normal" fill="#262626">· A5 模型 N ▾〔只读展开〕</text><text x="30" y="1060" font-size="13" font-weight="normal" fill="#262626">· 优先级 / 权重 → 原连接路由任务</text><text x="30" y="1090" font-size="13" font-weight="normal" fill="#262626">· 窗口剩余 — / 来源 / 观察时间</text><rect x="16" y="1120" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1146" font-size="16" font-weight="600" fill="#262626">最近请求 · Full完整保留</text><line x1="30" y1="1175" x2="360" y2="1175" stroke="#aaaaaa"/><text x="30" y="1195" font-size="13" font-weight="normal" fill="#262626">· 时间 / 模型 / Key / 连接 / 业务结果 / 用量</text><text x="40" y="1215" font-size="13" font-weight="normal" fill="#262626">证据</text><text x="30" y="1245" font-size="13" font-weight="normal" fill="#262626">· 选择节点只筛选；A6 查看请求 → 原调用记录，</text><text x="40" y="1265" font-size="13" font-weight="normal" fill="#262626">返回恢复条件</text><rect x="16" y="1295" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="1317" font-size="12" font-weight="normal" fill="#262626">Lite · 接入你的客户端；默认以三步任务和实际地址为</text><text x="28" y="1336" font-size="12" font-weight="normal" fill="#262626">首屏</text><rect x="16" y="1373" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1399" font-size="16" font-weight="600" fill="#262626">1 添加连接</text><line x1="30" y1="1428" x2="360" y2="1428" stroke="#aaaaaa"/><text x="30" y="1448" font-size="13" font-weight="normal" fill="#262626">· A1 → /connections〔跳转〕</text><text x="30" y="1478" font-size="13" font-weight="normal" fill="#262626">· 在原编辑任务保存；不自动创建或测试</text><rect x="16" y="1502" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1528" font-size="16" font-weight="600" fill="#262626">2 创建 / 选择 API Key</text><line x1="30" y1="1557" x2="360" y2="1557" stroke="#aaaaaa"/><text x="30" y="1577" font-size="13" font-weight="normal" fill="#262626">· A2 → /keys〔跳转〕</text><text x="30" y="1607" font-size="13" font-weight="normal" fill="#262626">· 选择准确Key；不自动创建或读秘密</text><rect x="16" y="1631" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1657" font-size="16" font-weight="600" fill="#262626">3 配置客户端</text><line x1="30" y1="1686" x2="360" y2="1686" stroke="#aaaaaa"/><text x="30" y="1706" font-size="13" font-weight="normal" fill="#262626">· A3 先选Key → 该Key交付〔跳转〕</text><text x="30" y="1736" font-size="13" font-weight="normal" fill="#262626">· 地址 / 模板 / 复制 / 导入按原明确流程</text><rect x="16.0" y="1760" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="1785" font-size="12" font-weight="normal" fill="#262626">真实Base URL〔配置 / 当前访问来源〕</text><rect x="16.0" y="1812" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="1837" font-size="12" font-weight="normal" fill="#262626">A4 复制地址〔只读 / 失败反馈〕</text><rect x="16" y="1872" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1898" font-size="16" font-weight="600" fill="#262626">折叠外常驻 · 已有状态与保存窗口</text><line x1="30" y1="1927" x2="360" y2="1927" stroke="#aaaaaa"/><text x="30" y="1947" font-size="13" font-weight="normal" fill="#262626">· 待处理 / 失败 / 结果未知：原OverviewAttenti</text><text x="40" y="1967" font-size="13" font-weight="normal" fill="#262626">on保持</text><text x="30" y="1997" font-size="13" font-weight="normal" fill="#262626">· Key / 连接 / 统计各自加载、失败或未知；不把</text><text x="40" y="2017" font-size="13" font-weight="normal" fill="#262626">缺数据当空列表</text><text x="30" y="2047" font-size="13" font-weight="normal" fill="#262626">· 当前连接已保存窗口：剩余 — / 状态未知 / 来</text><text x="40" y="2067" font-size="13" font-weight="normal" fill="#262626">源 / 观察时间</text><text x="30" y="2097" font-size="13" font-weight="normal" fill="#262626">· 不支持余额接口、尚未获取、读取失败分别说明</text><text x="40" y="2117" font-size="13" font-weight="normal" fill="#262626">；不推断全部不支持</text><rect x="16.0" y="2147" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="2172" font-size="12" font-weight="normal" fill="#262626">A7 完整流向与统计 ▸〔只读 / Enter或Space展开〕</text><rect x="16" y="2207" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2233" font-size="16" font-weight="600" fill="#262626">A7展开态参考 · 同一页面，默认收起</text><line x1="30" y1="2262" x2="360" y2="2262" stroke="#aaaaaa"/><text x="30" y="2282" font-size="13" font-weight="normal" fill="#262626">· 原完整FlowBoard：Key → 网关 → 连接及全部值</text><text x="40" y="2302" font-size="13" font-weight="normal" fill="#262626">、筛选和统计</text><text x="30" y="2332" font-size="13" font-weight="normal" fill="#262626">· 原错误详情、retry/actions、样本覆盖和每小时</text><text x="40" y="2352" font-size="13" font-weight="normal" fill="#262626">数值文字完整可达</text><text x="30" y="2382" font-size="13" font-weight="normal" fill="#262626">· 展开/收起不新增请求；失败/未知/窗口风险保留</text><text x="40" y="2402" font-size="13" font-weight="normal" fill="#262626">在外侧，焦点回summary</text><rect x="16" y="2432" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="2454" font-size="12" font-weight="normal" fill="#262626">Desktop · Lite桌面壳；复用上方任务 / 地址 / 已存</text><text x="28" y="2473" font-size="12" font-weight="normal" fill="#262626">状态，不把概念图画成已实现服务控制</text><rect x="16" y="2510" width="358" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2536" font-size="16" font-weight="600" fill="#262626">原生壳边界</text><line x1="30" y1="2565" x2="360" y2="2565" stroke="#aaaaaa"/><text x="30" y="2585" font-size="13" font-weight="normal" fill="#262626">· 当前只保已有关闭窗口 / 托盘指引；状态来自真</text><text x="40" y="2605" font-size="13" font-weight="normal" fill="#262626">实既有能力</text><text x="30" y="2635" font-size="13" font-weight="normal" fill="#262626">· 配置客户端仍先选Key，不自动读秘密或测试</text><text x="30" y="2665" font-size="13" font-weight="normal" fill="#262626">· B5待实现：原生服务健康、停止服务、局域网访</text><text x="40" y="2685" font-size="13" font-weight="normal" fill="#262626">问控制</text><text x="30" y="2715" font-size="13" font-weight="normal" fill="#262626">· 本轮不画停止 / LAN开关，不用页面可访问推断</text><text x="40" y="2735" font-size="13" font-weight="normal" fill="#262626">后台健康</text><rect x="16" y="2765" width="358" height="457" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2791" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="2820" x2="360" y2="2820" stroke="#aaaaaa"/><text x="30" y="2840" font-size="13" font-weight="normal" fill="#262626">· 效果图仅作方向参考；Full保原全部统计、图表</text><text x="40" y="2860" font-size="13" font-weight="normal" fill="#262626">可访问文字、样本覆盖和meta，不因卡片紧凑删</text><text x="40" y="2880" font-size="13" font-weight="normal" fill="#262626">字段。</text><text x="30" y="2910" font-size="13" font-weight="normal" fill="#262626">· Lite首屏是三步任务与真实地址，完整流向/统计</text><text x="40" y="2930" font-size="13" font-weight="normal" fill="#262626">放可键盘展开区；收起保已加载数据，展开不新</text><text x="40" y="2950" font-size="13" font-weight="normal" fill="#262626">增HTTP。</text><text x="30" y="2980" font-size="13" font-weight="normal" fill="#262626">· 折叠外保OverviewAttention及各类加载/读取失</text><text x="40" y="3000" font-size="13" font-weight="normal" fill="#262626">败/未知摘要；已保存窗口的剩余/状态/观察时间</text><text x="40" y="3020" font-size="13" font-weight="normal" fill="#262626">常驻，保进入详情重试入口。</text><text x="30" y="3050" font-size="13" font-weight="normal" fill="#262626">· 加载、无连接、无Key、失败、未知和权限变化分</text><text x="40" y="3070" font-size="13" font-weight="normal" fill="#262626">别提示；没有证据不得显示健康或可调用。</text><text x="30" y="3100" font-size="13" font-weight="normal" fill="#262626">· 当前供应商余额能力按实际连接说明支持/不支持</text><text x="40" y="3120" font-size="13" font-weight="normal" fill="#262626">/未获取/失败；可查看已保存账号窗口，不笼统</text><text x="40" y="3140" font-size="13" font-weight="normal" fill="#262626">判定全部不支持。</text><text x="30" y="3170" font-size="13" font-weight="normal" fill="#262626">· Desktop原生服务健康、停止、LAN均标B5待实现</text><text x="40" y="3190" font-size="13" font-weight="normal" fill="#262626">；本轮只保已有壳及关窗/托盘指引，不承诺已验</text><text x="40" y="3210" font-size="13" font-weight="normal" fill="#262626">收。</text><rect x="0" y="3240" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="3278" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="3334" font-size="10" font-weight="normal" fill="#666666">overview · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
