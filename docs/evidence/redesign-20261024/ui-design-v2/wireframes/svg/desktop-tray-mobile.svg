<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2736" viewBox="0 0 390 2736" role="img" aria-labelledby="title desc"><title id="title">Desktop · 本机服务 / 托盘 / 明确退出 · 手机</title><desc id="desc">2026-11-07主线线稿增量，合成数据；不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="180" y="34" font-size="12" font-weight="normal" fill="#262626">本机服务 / 语言 / 关闭窗口留</text><text x="180" y="53" font-size="12" font-weight="normal" fill="#262626">托盘</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">Desktop · 本机服务 / 托盘 / </text><text x="16" y="125" font-size="22" font-weight="600" fill="#262626">明确退出</text><text x="16" y="160" font-size="11" font-weight="normal" fill="#666666">原生托盘 / LAN帮助</text><rect x="16" y="176" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="198" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实</text><text x="28" y="217" font-size="12" font-weight="normal" fill="#262626">现另验 / 浏览器未验证</text><rect x="16" y="254" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="276" font-size="12" font-weight="normal" fill="#262626">本机原生面板：以下均为线稿状态；后端停止/失败时仍</text><text x="28" y="295" font-size="12" font-weight="normal" fill="#262626">保留操作入口</text><rect x="16" y="332" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="358" font-size="16" font-weight="600" fill="#262626">B5a本地面板 · 后端停止仍可用</text><line x1="30" y1="387" x2="360" y2="387" stroke="#aaaaaa"/><text x="30" y="407" font-size="13" font-weight="normal" fill="#262626">· 本机服务状态：停止 / 启动中 / 可连接 / 停止</text><text x="40" y="427" font-size="13" font-weight="normal" fill="#262626">中 / 失败 / 停止未确认 / 外部开发服务</text><text x="30" y="457" font-size="13" font-weight="normal" fill="#262626">· 实际地址 / 本机或LAN范围 / 当前版本；公网可</text><text x="40" y="477" font-size="13" font-weight="normal" fill="#262626">达性未验证</text><text x="30" y="507" font-size="13" font-weight="normal" fill="#262626">· A1打开控制台；A2明确启动；A3明确停止；忙状</text><text x="40" y="527" font-size="13" font-weight="normal" fill="#262626">态不重复提交</text><text x="30" y="557" font-size="13" font-weight="normal" fill="#262626">· 数据 / 日志仅展开已知位置和固定入口，不展示</text><text x="40" y="577" font-size="13" font-weight="normal" fill="#262626">凭据或正文</text><rect x="16" y="605" width="358" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="631" font-size="16" font-weight="600" fill="#262626">窗口 / 服务 / 应用三个独立动作</text><line x1="30" y1="660" x2="360" y2="660" stroke="#aaaaaa"/><text x="30" y="680" font-size="13" font-weight="normal" fill="#262626">· 关闭窗口：留托盘，服务状态不变</text><text x="30" y="710" font-size="13" font-weight="normal" fill="#262626">· 仅停止：确认后停止本应用创建的child，面板和</text><text x="40" y="730" font-size="13" font-weight="normal" fill="#262626">应用保留</text><text x="30" y="760" font-size="13" font-weight="normal" fill="#262626">· 退出应用：确认后等待owned child实际关闭，再</text><text x="40" y="780" font-size="13" font-weight="normal" fill="#262626">退出</text><text x="30" y="810" font-size="13" font-weight="normal" fill="#262626">· 停止未确认：不标已停止，不允许第二个进程，</text><text x="40" y="830" font-size="13" font-weight="normal" fill="#262626">保留错误与核对入口</text><rect x="16" y="858" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="884" font-size="16" font-weight="600" fill="#262626">停止或退出确认〔默认取消〕</text><line x1="30" y1="913" x2="360" y2="913" stroke="#aaaaaa"/><text x="30" y="933" font-size="13" font-weight="normal" fill="#262626">· 当前请求可能中断；先确认客户端状态，配置、</text><text x="40" y="953" font-size="13" font-weight="normal" fill="#262626">数据库、日志保留</text><text x="30" y="983" font-size="13" font-weight="normal" fill="#262626">· 取消 / 明确停止本机服务；确认返回后复核窗口</text><text x="40" y="1003" font-size="13" font-weight="normal" fill="#262626">、generation与child</text><text x="30" y="1033" font-size="13" font-weight="normal" fill="#262626">· 仅持有的ChildProcess可被停止，不按端口或任</text><text x="40" y="1053" font-size="13" font-weight="normal" fill="#262626">意PID找进程</text><rect x="16" y="1081" width="358" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1107" font-size="16" font-weight="600" fill="#262626">托盘与访问范围</text><line x1="30" y1="1136" x2="360" y2="1136" stroke="#aaaaaa"/><text x="30" y="1156" font-size="13" font-weight="normal" fill="#262626">· 中英文一致：打开控制台 / 本机服务 / 当前范</text><text x="40" y="1176" font-size="13" font-weight="normal" fill="#262626">围 / LAN设置 / 退出MyAPI</text><text x="30" y="1206" font-size="13" font-weight="normal" fill="#262626">· 本机默认；LAN沿原明确同意、私网和重启门禁</text><text x="30" y="1236" font-size="13" font-weight="normal" fill="#262626">· 公网B5b独立向导待后续；不自动开端口/防火墙/</text><text x="40" y="1256" font-size="13" font-weight="normal" fill="#262626">NAT或声称已验证</text><text x="30" y="1286" font-size="13" font-weight="normal" fill="#262626">· 自动更新关闭；macOS先、Windows后，不宣称Lin</text><text x="40" y="1306" font-size="13" font-weight="normal" fill="#262626">ux首发支持</text><rect x="16" y="1334" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1360" font-size="16" font-weight="600" fill="#262626">可信本地面板边界</text><line x1="30" y1="1389" x2="360" y2="1389" stroke="#aaaaaa"/><text x="30" y="1409" font-size="13" font-weight="normal" fill="#262626">· 面板使用独立preload；网关HTTP页面不获得服务</text><text x="40" y="1429" font-size="13" font-weight="normal" fill="#262626">控制能力</text><text x="30" y="1459" font-size="13" font-weight="normal" fill="#262626">· 固定窗口+主frame+精确file URL+固定动作，导</text><text x="40" y="1479" font-size="13" font-weight="normal" fill="#262626">航/iframe/错误来源拒绝</text><text x="30" y="1509" font-size="13" font-weight="normal" fill="#262626">· 无任意invoke、命令、PID、文件路径或URL参数</text><text x="40" y="1529" font-size="13" font-weight="normal" fill="#262626">；状态按文本渲染</text><text x="30" y="1559" font-size="13" font-weight="normal" fill="#262626">· 开发模式外部服务不由本应用开始/停止；无自动</text><text x="40" y="1579" font-size="13" font-weight="normal" fill="#262626">重放或恢复旧快照</text><rect x="16" y="1607" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1630" font-size="13" font-weight="600" fill="#262626">A1 打开控制台</text><rect x="184" y="1607" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1630" font-size="13" font-weight="normal" fill="#262626">A2 启动本机服务</text><rect x="16" y="1663" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1686" font-size="13" font-weight="normal" fill="#262626">A3 停止本机服务</text><rect x="184" y="1663" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1686" font-size="13" font-weight="normal" fill="#262626">A4 退出MyAPI</text><rect x="16" y="1719" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1742" font-size="13" font-weight="normal" fill="#262626">A5 LAN设置</text><rect x="184" y="1719" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1742" font-size="13" font-weight="normal" fill="#262626">A6 公网配置说明</text><rect x="16" y="1775" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1798" font-size="13" font-weight="normal" fill="#262626">A7 数据与日志</text><rect x="184" y="1775" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1798" font-size="13" font-weight="normal" fill="#262626">A8 复制接入地址</text><text x="16" y="1857" font-size="15" font-weight="600" fill="#262626">补充任务字段</text><text x="16.0" y="1887" font-size="12" font-weight="600" fill="#262626">服务状态</text><rect x="16.0" y="1896" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="1923" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="1981" font-size="12" font-weight="600" fill="#262626">本机Base URL〔合成〕</text><rect x="16.0" y="1990" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="2017" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="2075" font-size="12" font-weight="600" fill="#262626">访问模式：仅本机 / 局域网</text><rect x="16.0" y="2084" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="2111" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="2157" width="358" height="327" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2183" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="2212" x2="360" y2="2212" stroke="#aaaaaa"/><text x="30" y="2232" font-size="13" font-weight="normal" fill="#262626">· 沿同目录Desktop服务效果图；所有状态示例为结</text><text x="40" y="2252" font-size="13" font-weight="normal" fill="#262626">构说明，不是已运行或视觉验收。</text><text x="30" y="2282" font-size="13" font-weight="normal" fill="#262626">· 沿用appId/userData/旧DB原位采用、SESSION_SE</text><text x="40" y="2302" font-size="13" font-weight="normal" fill="#262626">CRET及显式数据库路径，不搬动/删除数据，不回</text><text x="40" y="2322" font-size="13" font-weight="normal" fill="#262626">灌或重放。</text><text x="30" y="2352" font-size="13" font-weight="normal" fill="#262626">· B5a仅当前迭代，完整三版本计划和公网B5b仍在</text><text x="40" y="2372" font-size="13" font-weight="normal" fill="#262626">主Goal；界面不得把unknown写成健康或已停止。</text><text x="30" y="2402" font-size="13" font-weight="normal" fill="#262626">· Node/VM/合成子进程与打包验证在Actions，浏览</text><text x="40" y="2422" font-size="13" font-weight="normal" fill="#262626">器/真实托盘/设备交互仍需单独验收。</text><text x="30" y="2452" font-size="13" font-weight="normal" fill="#262626">· mobile SVG仅窄窗口排列参考，不表示移动App或</text><text x="40" y="2472" font-size="13" font-weight="normal" fill="#262626">手机支持。</text><rect x="16" y="2502" width="358" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2528" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="2557" x2="360" y2="2557" stroke="#aaaaaa"/><text x="30" y="2577" font-size="13" font-weight="normal" fill="#262626">· 本地服务管理与网关业务控制台各有职责；复用</text><text x="40" y="2597" font-size="13" font-weight="normal" fill="#262626">已有托盘、探测、目录和LAN规则，不重搭后台或</text><text x="40" y="2617" font-size="13" font-weight="normal" fill="#262626">提供任意宿主控制。</text><text x="30" y="2647" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="2667" font-size="13" font-weight="normal" fill="#262626">务功能。</text><text x="16" y="2711" font-size="10" font-weight="normal" fill="#666666">desktop-tray · 手机390 · 来源 4601139a · 浏览器未验证</text></g></svg>
