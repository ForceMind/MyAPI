<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1178" viewBox="0 0 390 1178" role="img" aria-labelledby="title desc"><title id="title">Desktop 托盘与本机接入 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">Desktop 托盘与本机接入</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">原生托盘 / LAN帮助</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="247" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原</text><text x="28" y="266" font-size="12" font-weight="normal" fill="#262626">列表并恢复焦点。</text><text x="16" y="321" font-size="15" font-weight="600" fill="#262626">任务字段 / 当前证据</text><text x="16.0" y="351" font-size="12" font-weight="600" fill="#262626">服务状态</text><rect x="16.0" y="360" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="387" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="445" font-size="12" font-weight="600" fill="#262626">本机Base URL〔合成〕</text><rect x="16.0" y="454" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="481" font-size="13" font-weight="normal" fill="#666666"