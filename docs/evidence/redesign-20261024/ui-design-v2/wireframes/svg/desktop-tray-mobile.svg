<svg xmlns="http://www.w3.org/2000/svg" width="390" height="3465" viewBox="0 0 390 3465" role="img" aria-labelledby="title desc"><title id="title">Desktop · 本机服务 / 公网接入向导 · 手机</title><desc id="desc">2026-11-08入口检查线稿增量，沿既有2026-11-07方案；合成数据，不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="180" y="34" font-size="12" font-weight="normal" fill="#262626">本机服务 / 语言 / 关闭窗口留</text><text x="180" y="53" font-size="12" font-weight="normal" fill="#262626">托盘</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">Desktop · 本机服务 / 公网接入</text><text x="16" y="125" font-size="22" font-weight="600" fill="#262626">向导</text><text x="16" y="160" font-size="11" font-weight="normal" fill="#666666">原生托盘 / LAN帮助</text><rect x="16" y="176" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="198" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实</text><text x="28" y="217" font-size="12" font-weight="normal" fill="#262626">现另验 / 浏览器未验证</text><rect x="16" y="254" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="276" font-size="12" font-weight="normal" fill="#262626">已有HTTPS反代向导 · 以下均为合成示例 · 用户提供的</text><text x="28" y="295" font-size="12" font-weight="normal" fill="#262626">公网入口始终未验证</text><rect x="16" y="332" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="358" font-size="16" font-weight="600" fill="#262626">本机事实〔保留原B5a操作〕</text><line x1="30" y1="387" x2="360" y2="387" stroke="#aaaaaa"/><text x="30" y="407" font-size="13" font-weight="normal" fill="#262626">· 服务状态 / 实际监听范围 / 当前版本；关窗留</text><text x="40" y="427" font-size="13" font-weight="normal" fill="#262626">托盘、仅停止和退出仍各自独立</text><text x="30" y="457" font-size="13" font-weight="normal" fill="#262626">· 本机监听 http://127.0.0.1:3000〔合成〕；公</text><text x="40" y="477" font-size="13" font-weight="normal" fill="#262626">网入口单独显示，不混入本机复制列表</text><rect x="16.0" y="505" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="530" font-size="12" font-weight="normal" fill="#262626">1 反代位置</text><rect x="199.0" y="505" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="530" font-size="12" font-weight="normal" fill="#262626">2 外部条件</text><rect x="16.0" y="557" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="582" font-size="12" font-weight="normal" fill="#262626">3 入口地址〔当前〕</text><rect x="199.0" y="557" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="582" font-size="12" font-weight="normal" fill="#262626">4 配置客户端</text><rect x="16" y="617" width="358" height="200" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="643" font-size="16" font-weight="600" fill="#262626">▸ 1 反代位置〔选择后继续〕〔步骤说明</text><text x="30" y="666" font-size="16" font-weight="600" fill="#262626">〕</text><line x1="30" y1="695" x2="360" y2="695" stroke="#aaaaaa"/><text x="30" y="715" font-size="13" font-weight="normal" fill="#262626">· 同一电脑：明确复制本机反代目标根地址，不附 </text><text x="40" y="735" font-size="13" font-weight="normal" fill="#262626">/v1</text><text x="30" y="765" font-size="13" font-weight="normal" fill="#262626">· 另一台LAN设备：需要现有私网监听与防火墙条件</text><text x="40" y="785" font-size="13" font-weight="normal" fill="#262626">，只提供原LAN显式确认入口；不因填写地址自动</text><text x="40" y="805" font-size="13" font-weight="normal" fill="#262626">重启</text><rect x="16" y="833" width="358" height="220" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="859" font-size="16" font-weight="600" fill="#262626">▸ 2 外部条件〔默认收起说明〕〔步骤说</text><text x="30" y="882" font-size="16" font-weight="600" fill="#262626">明〕</text><line x1="30" y1="911" x2="360" y2="911" stroke="#aaaaaa"/><text x="30" y="931" font-size="13" font-weight="normal" fill="#262626">· 已有HTTPS反代：由用户管理域名/DNS/证书、端</text><text x="40" y="951" font-size="13" font-weight="normal" fill="#262626">口、反代与防火墙；未具备则待配置，不伪报连</text><text x="40" y="971" font-size="13" font-weight="normal" fill="#262626">接失败</text><text x="30" y="1001" font-size="13" font-weight="normal" fill="#262626">· 开机/休眠/合盖/断网/退出、动态地址、上行带</text><text x="40" y="1021" font-size="13" font-weight="normal" fill="#262626">宽和额度会影响服务；NAT/CGNAT、IPv4/IPv6与</text><text x="40" y="1041" font-size="13" font-weight="normal" fill="#262626">第三方入口由用户选择，不自动购买或改配置</text><rect x="16" y="1069" width="358" height="297" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1095" font-size="16" font-weight="600" fill="#262626">3 填入口地址〔本图当前步骤〕</text><line x1="30" y1="1124" x2="360" y2="1124" stroke="#aaaaaa"/><text x="30" y="1144" font-size="13" font-weight="normal" fill="#262626">· 只接受已有HTTPS根origin；示例 https://gatew</text><text x="40" y="1164" font-size="13" font-weight="normal" fill="#262626">ay.example.com</text><text x="30" y="1194" font-size="13" font-weight="normal" fill="#262626">· 预览 https://gateway.example.com/v1；用户提</text><text x="40" y="1214" font-size="13" font-weight="normal" fill="#262626">供 · 未验证</text><text x="30" y="1244" font-size="13" font-weight="normal" fill="#262626">· HTTP/凭据/query/fragment/控制符/超长输入拒</text><text x="40" y="1264" font-size="13" font-weight="normal" fill="#262626">绝；路径前缀或已知本机/LAN入口解释当前不支</text><text x="40" y="1284" font-size="13" font-weight="normal" fill="#262626">持/转对应分支，不偷偷截断</text><text x="30" y="1314" font-size="13" font-weight="normal" fill="#262626">· 保存前默认取消确认：仅保存此电脑的入口记录</text><text x="40" y="1334" font-size="13" font-weight="normal" fill="#262626">；确认后重新核对可信窗口、声明版本与服务身</text><text x="40" y="1354" font-size="13" font-weight="normal" fill="#262626">份</text><rect x="16" y="1382" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1405" font-size="13" font-weight="normal" fill="#262626">A12 返回上一步</text><rect x="184" y="1382" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1405" font-size="13" font-weight="normal" fill="#262626">A9 确认保存入口</text><rect x="16" y="1446" width="358" height="797" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1472" font-size="16" font-weight="600" fill="#262626">保存后 · 4 配置客户端〔保存后显示〕</text><line x1="30" y1="1501" x2="360" y2="1501" stroke="#aaaaaa"/><text x="30" y="1521" font-size="13" font-weight="normal" fill="#262626">· 已保存 · 未验证；明确复制当前所见公网 /v1，</text><text x="40" y="1541" font-size="13" font-weight="normal" fill="#262626">打开本机控制台选择Key</text><text x="30" y="1571" font-size="13" font-weight="normal" fill="#262626">· 不读取Key，不发模型请求，不改现有客户端导入</text><text x="40" y="1591" font-size="13" font-weight="normal" fill="#262626">、后台配置或监听</text><text x="30" y="1621" font-size="13" font-weight="normal" fill="#262626">· 修改/撤销后旧地址不可复制；撤销需确认，只清</text><text x="40" y="1641" font-size="13" font-weight="normal" fill="#262626">除此应用声明，外部反代/隧道须用户自行关闭</text><g id="desktop-public-check-increment"><rect x="30" y="1661" width="330" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="40" y="1679" font-size="14" font-weight="600" fill="#262626">▸ 从此电脑检查</text><text x="40" y="1697" font-size="12" font-weight="normal" fill="#262626">默认折叠；展开不会自动请求</text><rect x="30" y="1717" width="330" height="510" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="40" y="1741" font-size="14" font-weight="600" fill="#262626">展开态参考〔默认不显示〕</text><text x="40" y="1767" font-size="13" font-weight="normal" fill="#262626">检查入口〔合成〕</text><text x="40" y="1789" font-size="12" font-weight="normal" fill="#262626">https://gateway.example.com</text><text x="40" y="1813" font-size="12" font-weight="normal" fill="#262626">实际观察时间：尚未检查</text><rect x="40" y="1827" width="310" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="48" y="1845" font-size="12" font-weight="normal" fill="#262626">DNS〔直接IP时为地址检查〕</text><text x="48" y="1862" font-size="12" font-weight="normal" fill="#262626">尚未检查</text><rect x="40" y="1877" width="310" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="48" y="1895" font-size="12" font-weight="normal" fill="#262626">TLS证书</text><text x="48" y="1912" font-size="12" font-weight="normal" fill="#262626">尚未检查</text><rect x="40" y="1927" width="310" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="48" y="1945" font-size="12" font-weight="normal" fill="#262626">公共状态响应</text><text x="48" y="1962" font-size="12" font-weight="normal" fill="#262626">尚未检查</text><rect x="40" y="1983" width="149" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><rect x="201" y="1983" width="149" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="48" y="2010" font-size="12" font-weight="normal" fill="#262626">A13 检查入口</text><text x="209" y="2010" font-size="12" font-weight="normal" fill="#262626">A14 取消检查</text><text x="40" y="2055" font-size="12" font-weight="normal" fill="#262626">仅此电脑的DNS/地址、TLS及公共状态观测</text><text x="40" y="2075" font-size="12" font-weight="normal" fill="#262626">外部 verification 保持 unknown</text><text x="40" y="2095" font-size="12" font-weight="normal" fill="#262626">不证明外网入站、本机实例、鉴权、模型或额度</text><text x="40" y="2115" font-size="12" font-weight="normal" fill="#262626">不读取Key，不发送模型请求</text><text x="40" y="2135" font-size="12" font-weight="normal" fill="#262626">停止/退出仍可用；草稿、步骤与焦点保留</text><text x="40" y="2167" font-size="12" font-weight="normal" fill="#262626">来源origin / revision / generation变化</text><text x="40" y="2187" font-size="12" font-weight="normal" fill="#262626">旧结果失效；不得覆盖新入口或新结果</text></g><rect x="16" y="2259" width="358" height="247" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2285" font-size="16" font-weight="600" fill="#262626">状态与恢复〔关键说明始终可见〕</text><line x1="30" y1="2314" x2="360" y2="2314" stroke="#aaaaaa"/><text x="30" y="2334" font-size="13" font-weight="normal" fill="#262626">· 待配置 / 当前不支持 / 外部状态无法判断 / 已</text><text x="40" y="2354" font-size="13" font-weight="normal" fill="#262626">保存未验证分开；文件无法读取不得装成从未配</text><text x="40" y="2374" font-size="13" font-weight="normal" fill="#262626">置</text><text x="30" y="2404" font-size="13" font-weight="normal" fill="#262626">· 保存失败保旧记录与草稿；旧revision不盖新结</text><text x="40" y="2424" font-size="13" font-weight="normal" fill="#262626">果，定时状态不重置输入/步骤或抢焦点</text><text x="30" y="2454" font-size="13" font-weight="normal" fill="#262626">· 此电脑DNS/地址、TLS、公共状态按点击检查</text><text x="40" y="2474" font-size="13" font-weight="normal" fill="#262626">公网入站、本机实例、鉴权、模型与额度</text><text x="40" y="2494" font-size="13" font-weight="normal" fill="#262626">仍未验证；外部verification保持unknown</text><text x="16" y="2540" font-size="15" font-weight="600" fill="#262626">补充任务字段</text><text x="16.0" y="2570" font-size="12" font-weight="600" fill="#262626">反代位置：同机 / 另一台LAN设备</text><rect x="16.0" y="2579" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="2606" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="2664" font-size="12" font-weight="600" fill="#262626">已有HTTPS根origin〔示例〕</text><rect x="16.0" y="2673" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="2700" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="2746" width="358" height="467" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2772" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="2801" x2="360" y2="2801" stroke="#aaaaaa"/><text x="30" y="2821" font-size="13" font-weight="normal" fill="#262626">· 沿同目录Desktop服务效果图；所有状态示例为结</text><text x="40" y="2841" font-size="13" font-weight="normal" fill="#262626">构说明，不是已运行或视觉验收。</text><text x="30" y="2871" font-size="13" font-weight="normal" fill="#262626">· 沿用appId/userData/旧DB原位采用、SESSION_SE</text><text x="40" y="2891" font-size="13" font-weight="normal" fill="#262626">CRET及显式数据库路径，不搬动/删除数据，不回</text><text x="40" y="2911" font-size="13" font-weight="normal" fill="#262626">灌或重放。</text><text x="30" y="2941" font-size="13" font-weight="normal" fill="#262626">· B5a仅当前迭代，完整三版本计划和公网B5b仍在</text><text x="40" y="2961" font-size="13" font-weight="normal" fill="#262626">主Goal；界面不得把unknown写成健康或已停止。</text><text x="30" y="2991" font-size="13" font-weight="normal" fill="#262626">· Node/VM/合成子进程与打包验证在Actions，浏览</text><text x="40" y="3011" font-size="13" font-weight="normal" fill="#262626">器/真实托盘/设备交互仍需单独验收。</text><text x="30" y="3041" font-size="13" font-weight="normal" fill="#262626">· mobile SVG仅窄窗口排列参考，不表示移动App或</text><text x="40" y="3061" font-size="13" font-weight="normal" fill="#262626">手机支持。</text><text x="30" y="3091" font-size="13" font-weight="normal" fill="#262626">· 沿desktop-public-access-concept-20261107.pn</text><text x="40" y="3111" font-size="13" font-weight="normal" fill="#262626">g；本批B5b1是已有反代交付，不取代完整B5b公</text><text x="40" y="3131" font-size="13" font-weight="normal" fill="#262626">网验证目标。</text><text x="30" y="3161" font-size="13" font-weight="normal" fill="#262626">· 所有公网示例均未验证；原B5a停止未知/owned-c</text><text x="40" y="3181" font-size="13" font-weight="normal" fill="#262626">hild、可信file IPC、明确LAN和数据保护规则不</text><text x="40" y="3201" font-size="13" font-weight="normal" fill="#262626">放宽。</text><rect x="16" y="3231" width="358" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="3257" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="3286" x2="360" y2="3286" stroke="#aaaaaa"/><text x="30" y="3306" font-size="13" font-weight="normal" fill="#262626">· 公网入口引导收在原本机面板内，分步只展当前</text><text x="40" y="3326" font-size="13" font-weight="normal" fill="#262626">任务；真实监听与用户声明各有来源，原服务管</text><text x="40" y="3346" font-size="13" font-weight="normal" fill="#262626">理/网关控制台继续复用。</text><text x="30" y="3376" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="3396" font-size="13" font-weight="normal" fill="#262626">务功能。</text><text x="16" y="3440" font-size="10" font-weight="normal" fill="#666666">desktop-tray · 手机390 · 来源 13eedad9 · 浏览器未验证</text></g></svg>
