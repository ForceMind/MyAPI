<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1140" viewBox="0 0 390 1140" role="img" aria-labelledby="title desc"><title id="title">公告 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。管理员 / Root按既有设置权限，Lite按既有能力裁剪</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">公告</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/system-settings/content/announcements</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="251" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="280" x2="360" y2="280" stroke="#aaaaaa"/><text x="30" y="300" font-size="13" font-weight="normal" fill="#262626">· 公告摘要 / 类型 / 日期 / 选择与编辑操作</text><text x="30" y="330" font-size="13" font-weight="normal" fill="#262626">· 查看全文 ▾ · 附加说明数量</text><rect x="16" y="360" width="358" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="386" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="415" x2="360" y2="415" stroke="#aaaaaa"/><text x="30" y="435" font-size="13" font-weight="normal" fill="#262626">· 本条全部正文与附加说明</text><rect x="16" y="465" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="491" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="520" x2="360" y2="520" stroke="#aaaaaa"/><text x="30" y="540" font-size="13" font-weight="normal" fill="#262626">· 保留id=0、排序、多选、即时Enable和页面最终S</text><text x="40" y="560" font-size="13" font-weight="normal" fill="#262626">ave。</text><rect x="16" y="590" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="616" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="645" x2="360" y2="645" stroke="#aaaaaa"/><text x="30" y="665" font-size="13" font-weight="normal" fill="#262626">· 分区顶部只保留一个主保存入口；底部未保存栏</text><text x="40" y="685" font-size="13" font-weight="normal" fill="#262626">在手机不遮挡最后一个字段或验证信息。</text><text x="30" y="715" font-size="13" font-weight="normal" fill="#262626">· 低保真图表达任务分组和可访问字段范围；最终</text><text x="40" y="735" font-size="13" font-weight="normal" fill="#262626">字段校验与服务端契约保持不变。</text><rect x="16" y="765" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="791" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="820" x2="360" y2="820" stroke="#aaaaaa"/><text x="30" y="840" font-size="13" font-weight="normal" fill="#262626">· 同一任务的字段在当前分区内归组；高级参数可</text><text x="40" y="860" font-size="13" font-weight="normal" fill="#262626">展开，旧分区地址和服务端选项不删除。</text><text x="30" y="890" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="910" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="940" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="963" font-size="13" font-weight="600" fill="#262626">A1 保存当前分区</text><rect x="184" y="940" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="963" font-size="13" font-weight="normal" fill="#262626">A2 放弃草稿</text><rect x="0" y="1004" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1042" font-size="