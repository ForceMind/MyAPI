<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="881" viewBox="0 0 1200 881" role="img" aria-labelledby="title desc"><title id="title">系统行为 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。管理员 / Root按既有设置权限，Lite按既有能力裁剪</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">系统行为</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/system-settings/operations/behavior</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><text x="40" y="233" font-size="15" font-weight="600" fill="#262626">当前任务字段</text><text x="40.0" y="263" font-size="12" font-weight="600" fill="#262626">演示模式</text><rect x="40.0" y="272" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="263" font-size="12" font-weight="600" fill="#262626">自用模式</text><rect x="417.3333333333333" y="272" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="263" font-size="12" font-weight="600" fill="#262626">既有界面偏好</text><rect x="794.6666666666666" y="272" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40.0" y="345" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="371" font-size="16" font-weight="600" fill="#262626">运行模式</text><line x1="54.0" y1="400" x2="578.0" y2="400" stroke="#aaaaaa"/><text x="54.0" y="420" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="54.0" y="450" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="54.0" y="480" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="608.0" y="345" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="622.0" y="371" font-size="16" font-weight="600" fill="#262626">切换影响说明</text><line x1="622.0" y1="400" x2="1146.0" y2="400" stroke="#aaaaaa"/><text x="622.0" y="420" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="622.0" y="450" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="622.0" y="480" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="40" y="508" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="534" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="563" x2="1146" y2="563" stroke="#aaaaaa"/><text x="54" y="583" font-size="13" font-weight="normal" fill="#262626">· 分区顶部只保留一个主保存入口；底部未保存栏在手机不遮挡最后一个字段或验证信息。</text><text x="54" y="613" font-size="13" font-weight="normal" fill="#262626">· 低保真图表达任务分组和可访问字段范围；最终字段校验与服务端契约保持不变。</text><rect x="40" y="643" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="669" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="698" x2="1146" y2="698" stroke="#aaaaaa"/><text x="54" y="718" font-size="13" font-weight="normal" fill="#262626">· 同一任务的字段在当前分区内归组；高级参数可展开，旧分区地址和服务端选项不删除。</text><text x="54" y="748" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="778" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="801" font-size="13" font-weight="600" fill="#262626">A1 保存当前分区</text><rect x="181" y="778" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="191" y="801" font-size="13" font-weight="normal" fill="#262626">A2 放弃草稿</text><text x="40" y="856" font-size="10" font-weight="normal" fill="#666666">settings-operations-behavior · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
