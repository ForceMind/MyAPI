><rect x="40.0" y="499" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="525" font-size="16" font-weight="600" fill="#262626">资金能力状态</text><line x1="54.0" y1="554" x2="578.0" y2="554" stroke="#aaaaaa"/><text x="54.0" y="574" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="54.0" y="604" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="54.0" y="634" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="608.0" y="499" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="622.0" y="525" font-size="16" font-weight="600" fill="#262626">提供方配置分组</text><line x1="622.0" y1="554" x2="1146.0" y2="554" stroke="#aaaaaa"/><text x="622.0" y="574" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="622.0" y="604" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="622.0" y="634" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="40.0" y="662" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="688" font-size="16" font-weight="600" fill="#262626">提交前影响摘要</text><line x1="54.0" y1="717" x2="578.0" y2="717" stroke="#aaaaaa"/><text x="54.0" y="737" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="54.0" y="767" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="54.0" y="797" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="40" y="825" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="851" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="880" x2="1146" y2="880" stroke="#aaaaaa"/><text x="54" y="900" font-size="13" font-weight="normal" fill="#262626">· 分区顶部只保留一个主保存入口；底部未保存栏在手机不遮挡最后一个字段或验证信息。</text><text x="54" y="930" font-size="13" font-weight="normal" fill="#262626">· 低保真图表达任务分组和可访问字段范围；最终字段校验与服务端契约保持不变。</text><rect x="40" y="960" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="986" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1015" x2="1146" y2="1015" stroke="#aaaaaa"/><text x="54" y="1035" font-size="13" font-weight="normal" fill="#262626">· 同一任务的字段在当前分区内归组；高级参数可展开，旧分区地址和服务端选项不删除。</text><text x="54" y="1065" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="1095" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="1118" font-size="13" font-weight="600" fill="#262626">A1 保存当前分区</text><rect x="181" y="1095" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="191" y="1118" font-size="13" font-weight="normal" fill="#262626">A2 放弃草稿</text><rect x="309" y="1095" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="319" y="1118" font-size="13" font-weight="normal" fill="#262626">A3 危险操作确认</text><text x="40" y="1173" font-size="10" font-weight="normal" fill="#666666">settings-billing-payment · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
