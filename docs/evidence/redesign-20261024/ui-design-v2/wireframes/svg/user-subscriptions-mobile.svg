<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1048" viewBox="0 0 390 1048" role="img" aria-labelledby="title desc"><title id="title">用户订阅管理 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">用户订阅管理</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：用户订阅管理</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="358" height="167" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="251" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="280" x2="360" y2="280" stroke="#aaaaaa"/><text x="30" y="300" font-size="13" font-weight="normal" fill="#262626">· 准确用户名称 / ID · 读取失败与结果未确认常</text><text x="40" y="320" font-size="13" font-weight="normal" fill="#262626">驻</text><text x="30" y="350" font-size="13" font-weight="normal" fill="#262626">· 默认订阅记录 · 当前 / 历史数量 · 有界分页</text><text x="30" y="380" font-size="13" font-weight="normal" fill="#262626">· 明确进入授予套餐 · 不混入记录列表首屏</text><rect x="16" y="410" width="358" height="187" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="436" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="465" x2="360" y2="465" stroke="#aaaaaa"/><text x="30" y="485" font-size="13" font-weight="normal" fill="#262626">· 记录保原计划、来源、起止、用量、状态及取消/</text><text x="40" y="505" font-size="13" font-weight="normal" fill="#262626">恢复/重置入口</text><text x="30" y="535" font-size="13" font-weight="normal" fill="#262626">· 授予套餐保选择草稿与原Add确认，切换不产生写</text><text x="40" y="555" font-size="13" font-weight="normal" fill="#262626">入</text><text x="30" y="585" font-size="13" font-weight="normal" fill="#262626">· 所有原失败与结果未确认锁跨分区保留</text><rect x="16" y="615" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="641" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="670" x2="360" y2="670" stroke="#aaaaaa"/><text x="30" y="690" font-size="13" font-weight="normal" fill="#262626">· 不合并不同套餐额度，不改变金额/Unknown/Unli</text><text x="40" y="710" font-size="13" font-weight="normal" fill="#262626">mited语义。</text><text x="30" y="740" font-size="13" font-weight="normal" fill="#262626">· 保权限、原请求参数、确认和返回焦点；展示切</text><text x="40" y="760" font-size="13" font-weight="normal" fill="#262626">换不自动授权或重试。</text><rect x="16" y="790" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="816" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="845" x2="360" y2="845" stroke="#aaaaaa"/><text x="30" y="865" font-size="13" font-weight="normal" fill="#262626">· 历史、分配、停用、重置是明确分开的动作。</text><text x="30" y="895" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机</text><text x="40" y="915" font-size="13" font-weight="normal" fill="#262626">全屏或单列，不堆叠窄抽屉。</text><rect x="16" y="945" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="968" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="184" y="945" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="968" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><text x="16" y="1023" font-size="10" font-weight="normal" fill="#666666">user-subscriptions · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
