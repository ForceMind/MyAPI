<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1488" viewBox="0 0 390 1488" role="img" aria-labelledby="title desc"><title id="title">渠道工作区 · 额度证据 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">渠道工作区 · 额度证据</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/channels#channel-evidence</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="252" font-size="13" font-weight="normal" fill="#262626">渠道库存</text><rect x="112" y="225" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="122" y="252" font-size="13" font-weight="600" fill="#262626">额度证据</text><rect x="208" y="225" width="108" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="218" y="252" font-size="13" font-weight="normal" fill="#262626">全部渠道事件</text><rect x="16" y="277" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="304" font-size="13" font-weight="normal" fill="#262626">路由预览</text><rect x="16" y="337" width="358" height="247" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="363" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="392" x2="360" y2="392" stroke="#aaaaaa"/><text x="30" y="412" font-size="13" font-weight="normal" fill="#262626">· 返回库存 · 额度证据 · 明确全渠道/目标渠道范</text><text x="40" y="432" font-size="13" font-weight="normal" fill="#262626">围</text><text x="30" y="462" font-size="13" font-weight="normal" fill="#262626">· 原时间范围 / 自定义日期 / 窗口与状态筛选 / </text><text x="40" y="482" font-size="13" font-weight="normal" fill="#262626">刷新保存证据</text><text x="30" y="512" font-size="13" font-weight="normal" fill="#262626">· 桌面：系列目录 | 选中系列的趋势与完整证据</text><text x="30" y="542" font-size="13" font-weight="normal" fill="#262626">· 手机：对象选择 → 一份选中证据正文</text><text x="30" y="572" font-size="13" font-weight="normal" fill="#262626">· 失败/Unknown/来源不完整/采样关闭保持外露</text><rect x="16" y="602" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="628" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="657" x2="360" y2="657" stroke="#aaaaaa"/><text x="30" y="677" font-size="13" font-weight="normal" fill="#262626">· 精确series的原current/previous/change/rate/</text><text x="40" y="697" font-size="13" font-weight="normal" fill="#262626">status/source/单位/币种/plan/观察时间</text><text x="30" y="727" font-size="13" font-weight="normal" fill="#262626">· 原latest_interval/observed_window/ewma、rat</text><text x="40" y="747" font-size="13" font-weight="normal" fill="#262626">e_window、half-life、granularity、timezone</text><text x="30" y="777" font-size="13" font-weight="normal" fill="#262626">· 源limit2000/5000、source_complete/items_com</text><text x="40" y="797" font-size="13" font-weight="normal" fill="#262626">plete及图中断点不变</text><rect x="16" y="827" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="853" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="882" x2="360" y2="882" stroke="#aaaaaa"/><text x="30" y="902" font-size="13" font-weight="normal" fill="#262626">· 进入才读取已保存数据，选中才读明细；离开停</text><text x="40" y="922" font-size="13" font-weight="normal" fill="#262626">止页面轮询，后台采样不改。</text><text x="30" y="952" font-size="13" font-weight="normal" fill="#262626">· quotaChannelId找不到时明确无目标证据，不自</text><text x="40" y="972" font-size="13" font-weight="normal" fill="#262626">动替换成另一个渠道。</text><text x="30" y="1002" font-size="13" font-weight="normal" fill="#262626">· 关闭后已知错误/不完整仍在入口摘要，未读取不</text><text x="40" y="1022" font-size="13" font-weight="normal" fill="#262626">显示0或健康。</text><rect x="16" y="1052" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1078" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1107" x2="360" y2="1107" stroke="#aaaaaa"/><text x="30" y="1127" font-size="13" font-weight="normal" fill="#262626">· 同一路由的显式任务视图，不新建路由或调用模</text><text x="40" y="1147" font-size="13" font-weight="normal" fill="#262626">型。</text><rect x="16" y="1177" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1203" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1232" x2="360" y2="1232" stroke="#aaaaaa"/><text x="30" y="1252" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作</text><text x="40" y="1272" font-size="13" font-weight="normal" fill="#262626">；保留管理员渠道表格所需的高级列。</text><text x="30" y="1302" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1322" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1352" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1390" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1446" font-size="10" font-weight="normal" fill="#666666">channel-evidence-workspace · 手机390 · 来源 c916051e · 浏览器未</text><text x="16" y="1463" font-size="10" font-weight="normal" fill="#666666">验证</text></g></svg>
