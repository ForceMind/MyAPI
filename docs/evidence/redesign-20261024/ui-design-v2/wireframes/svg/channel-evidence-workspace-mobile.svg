<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1437" viewBox="0 0 390 1437" role="img" aria-labelledby="title desc"><title id="title">渠道工作区 · 额度证据 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">渠道工作区 · 额度证据</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/channels#channel-evidence</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">渠道库</text><rect x="107.5" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="115.5" y="250" font-size="12" font-weight="normal" fill="#262626">额度证据</text><rect x="199.0" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="250" font-size="12" font-weight="normal" fill="#262626">全部事件</text><rect x="290.5" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="298.5" y="250" font-size="12" font-weight="normal" fill="#262626">路由预览</text><rect x="16.0" y="285" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="310" font-size="12" font-weight="normal" fill="#262626">返回渠道库</text><rect x="16.0" y="337" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="362" font-size="12" font-weight="normal" fill="#262626">当前范围：明确对象 / 全部渠道</text><rect x="16.0" y="397" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="422" font-size="12" font-weight="normal" fill="#262626">原时间范围 / 日期</text><rect x="16.0" y="449" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="474" font-size="12" font-weight="normal" fill="#262626">窗口 / 状态筛选</text><rect x="16.0" y="501" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="526" font-size="12" font-weight="normal" fill="#262626">刷新保存证据</text><rect x="16.0" y="561" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="586" font-size="12" font-weight="normal" fill="#262626">请选择账户窗口 ▾〔当前不自动替换对象〕</text><rect x="16" y="621" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="647" font-size="16" font-weight="600" fill="#262626">证据主正文 · 默认尚未选择</text><line x1="30" y1="676" x2="360" y2="676" stroke="#aaaaaa"/><text x="30" y="696" font-size="13" font-weight="normal" fill="#262626">· 选中后读取这一series的图 / 数字表 / 完整状</text><text x="40" y="716" font-size="13" font-weight="normal" fill="#262626">态</text><text x="30" y="746" font-size="13" font-weight="normal" fill="#262626">· 错误、Unknown、来源不完整在筛选外保持可见</text><rect x="16" y="776" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="802" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="30" y1="831" x2="360" y2="831" stroke="#aaaaaa"/><text x="30" y="851" font-size="13" font-weight="normal" fill="#262626">· 进入才读取已保存数据，选中才读明细；离开停</text><text x="40" y="871" font-size="13" font-weight="normal" fill="#262626">止页面轮询，后台采样不改。</text><text x="30" y="901" font-size="13" font-weight="normal" fill="#262626">· quotaChannelId找不到时明确无目标证据，不自</text><text x="40" y="921" font-size="13" font-weight="normal" fill="#262626">动替换成另一个渠道。</text><text x="30" y="951" font-size="13" font-weight="normal" fill="#262626">· 关闭后已知错误/不完整仍在入口摘要，未读取不</text><text x="40" y="971" font-size="13" font-weight="normal" fill="#262626">显示0或健康。</text><rect x="16" y="1001" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1027" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1056" x2="360" y2="1056" stroke="#aaaaaa"/><text x="30" y="1076" font-size="13" font-weight="normal" fill="#262626">· 同一路由的显式任务视图，不新建路由或调用模</text><text x="40" y="1096" font-size="13" font-weight="normal" fill="#262626">型。</text><rect x="16" y="1126" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1152" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1181" x2="360" y2="1181" stroke="#aaaaaa"/><text x="30" y="1201" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作</text><text x="40" y="1221" font-size="13" font-weight="normal" fill="#262626">；保留管理员渠道表格所需的高级列。</text><text x="30" y="1251" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1271" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1301" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1339" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1395" font-size="10" font-weight="normal" fill="#666666">channel-evidence-workspace · 手机390 · 来源 c916051e · 浏览器未</text><text x="16" y="1412" font-size="10" font-weight="normal" fill="#666666">验证</text></g></svg>
