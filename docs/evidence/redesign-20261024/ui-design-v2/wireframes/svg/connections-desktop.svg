<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1264" viewBox="0 0 1200 1264" role="img" aria-labelledby="title desc"><title id="title">连接 · 卡片视图 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">连接 · 卡片视图</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/connections</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="52.0" y="243" font-size="14" font-weight="600" fill="#262626">连接 —</text><rect x="416.6666666666667" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="428.6666666666667" y="243" font-size="14" font-weight="600" fill="#262626">可用 —</text><rect x="793.3333333333334" y="215" width="366.6666666666667" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="805.3333333333334" y="243" font-size="14" font-weight="600" fill="#262626">未知 —</text><text x="40" y="329" font-size="15" font-weight="600" fill="#262626">查询与筛选</text><text x="40.0" y="359" font-size="12" font-weight="600" fill="#262626">名称 / 模型搜索</text><rect x="40.0" y="368" width="271.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="395" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="323.0" y="359" font-size="12" font-weight="600" fill="#262626">供应商</text><rect x="323.0" y="368" width="271.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="333.0" y="395" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="606.0" y="359" font-size="12" font-weight="600" fill="#262626">状态</text><rect x="606.0" y="368" width="271.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="616.0" y="395" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="889.0" y="359" font-size="12" font-weight="600" fill="#262626">优先级</text><rect x="889.0" y="368" width="271.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="899.0" y="395" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="441" width="120" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="464" font-size="13" font-weight="600" fill="#262626">A1 添加连接</text><rect x="168" y="441" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="178" y="464" font-size="13" font-weight="normal" fill="#262626">A2 切换表格</text><rect x="296" y="441" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="306" y="464" font-size="13" font-weight="normal" fill="#262626">A3 查看连接</text><rect x="424" y="441" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="434" y="464" font-size="13" font-weight="normal" fill="#262626">A4 测试连接</text><rect x="40" y="505" width="1120" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="531" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="560" x2="1146" y2="560" stroke="#aaaaaa"/><text x="54" y="580" font-size="13" font-weight="normal" fill="#262626">· 合成连接 A #7 · 使用中 · 启用开关</text><text x="54" y="610" font-size="13" font-weight="normal" fill="#262626">· 7天剩余42% · 5小时剩余82%〔合成；未知不补零〕</text><text x="54" y="640" font-size="13" font-weight="normal" fill="#262626">· 模型 8 ▾ · 分组 1 ▾ · 优先级 9 · 权重 25</text><text x="54" y="670" font-size="13" font-weight="normal" fill="#262626">· 上次测试：已保存结果与时间摘要</text><text x="54" y="700" font-size="13" font-weight="normal" fill="#262626">· 历史记录 1 ▾ · 查看 / 测试 / 编辑</text><rect x="40" y="730" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="756" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="785" x2="1146" y2="785" stroke="#aaaaaa"/><text x="54" y="805" font-size="13" font-weight="normal" fill="#262626">· 模型8：完整模型ID逐项列出，可复制，不跳详情</text><text x="54" y="835" font-size="13" font-weight="normal" fill="#262626">· 分组1：显示全部已保存分组</text><text x="54" y="865" font-size="13" font-weight="normal" fill="#262626">· 窗口明细：每系列保留来源/时间/状态</text><text x="54" y="895" font-size="13" font-weight="normal" fill="#262626">· 历史记录：完整原说明与身份不确定性；不标已解决</text><rect x="40" y="925" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="951" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="980" x2="1146" y2="980" stroke="#aaaaaa"/><text x="54" y="1000" font-size="13" font-weight="normal" fill="#262626">· 卡片自然高度，同排不因一个展开而等高拉伸。</text><text x="54" y="1030" font-size="13" font-weight="normal" fill="#262626">· 当前故障/额度未知始终可见；未接入能力不能凭历史失败推断。</text><text x="54" y="1060" font-size="13" font-weight="normal" fill="#262626">· 模型/历史展开只读已加载数据，不测试、不刷新、不读取密钥。</text><rect x="40" y="1090" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1116" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1145" x2="1146" y2="1145" stroke="#aaaaaa"/><text x="54" y="1165" font-size="13" font-weight="normal" fill="#262626">· 连接与渠道不再表现成两套管理功能：卡片 / 表格是同一对象的两种视图；旧地址保留。</text><text x="54" y="1195" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1239" font-size="10" font-weight="normal" fill="#666666">connections · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
