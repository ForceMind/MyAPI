<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1292" viewBox="0 0 1200 1292" role="img" aria-labelledby="title desc"><title id="title">连接 · 卡片视图 · 桌面</title><desc id="desc">2026-11-07主线线稿增量，合成数据；不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">连接 · 卡片视图</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/connections</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实现另验 / 浏览器未验证</text><text x="40" y="233" font-size="15" font-weight="600" fill="#262626">查询与筛选</text><text x="40.0" y="263" font-size="12" font-weight="600" fill="#262626">名称 / 模型搜索</text><rect x="40.0" y="272" width="271.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="323.0" y="263" font-size="12" font-weight="600" fill="#262626">供应商</text><rect x="323.0" y="272" width="271.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="333.0" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="606.0" y="263" font-size="12" font-weight="600" fill="#262626">状态</text><rect x="606.0" y="272" width="271.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="616.0" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="889.0" y="263" font-size="12" font-weight="600" fill="#262626">优先级</text><rect x="889.0" y="272" width="271.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="899.0" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="345" width="161" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="368" font-size="13" font-weight="600" fill="#262626">A1 添加连接〔跳转〕</text><rect x="209" y="345" width="161" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="219" y="368" font-size="13" font-weight="normal" fill="#262626">A7 切换表格〔跳转〕</text><rect x="378" y="345" width="161" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="388" y="368" font-size="13" font-weight="normal" fill="#262626">A8 返回来源〔跳转〕</text><rect x="40.0" y="409" width="551.0" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="435" font-size="16" font-weight="600" fill="#262626">合成连接 A #7 · 默认收起</text><line x1="54.0" y1="464" x2="577.0" y2="464" stroke="#aaaaaa"/><text x="54.0" y="484" font-size="13" font-weight="normal" fill="#262626">· 原启用状态 / 待处理 / 失败 / 未知常驻</text><text x="54.0" y="514" font-size="13" font-weight="normal" fill="#262626">· 模型 8 ▾〔A2只读〕 · 分组 1 ▾〔A9只读〕</text><text x="54.0" y="544" font-size="13" font-weight="normal" fill="#262626">· 7天 / 5小时各自剩余 — · 来源 / 观察时间</text><text x="54.0" y="574" font-size="13" font-weight="normal" fill="#262626">· 优先级 9 / 权重 25 → A4原路由任务</text><text x="54.0" y="604" font-size="13" font-weight="normal" fill="#262626">· A5 启用切换〔原写入 / 忙保护〕</text><text x="54.0" y="634" font-size="13" font-weight="normal" fill="#262626">· A3 查看窗口〔只读跳转〕 · A6 测试〔确认任务〕</text><rect x="609.0" y="409" width="551.0" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="623.0" y="435" font-size="16" font-weight="600" fill="#262626">同一连接 · A2明确展开后</text><line x1="623.0" y1="464" x2="1146.0" y2="464" stroke="#aaaaaa"/><text x="623.0" y="484" font-size="13" font-weight="normal" fill="#262626">· 模型8：完整模型ID逐项换行；保全部名称，不用前缀猜</text><text x="623.0" y="514" font-size="13" font-weight="normal" fill="#262626">· 可复制完整已加载模型；不获取上游或读取密钥</text><text x="623.0" y="544" font-size="13" font-weight="normal" fill="#262626">· 窗口：来源 / 观察时间 / 期限 / 单位 / 状态完整</text><text x="623.0" y="574" font-size="13" font-weight="normal" fill="#262626">· 未知 / 无窗口 / 不支持 / 尚未获取 / 失败分开</text><text x="623.0" y="604" font-size="13" font-weight="normal" fill="#262626">· 历史记录只读；不把历史错误当当前故障</text><text x="623.0" y="634" font-size="13" font-weight="normal" fill="#262626">· 同排卡片自然高度，收起恢复A2焦点</text><rect x="40" y="664" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="50" y="687" font-size="13" font-weight="normal" fill="#262626">A2 模型 N 展开〔只读〕</text><rect x="230" y="664" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="240" y="687" font-size="13" font-weight="normal" fill="#262626">A3 查看窗口〔只读跳转〕</text><rect x="427" y="664" width="224" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="437" y="687" font-size="13" font-weight="normal" fill="#262626">A4 优先级 / 权重〔编辑跳转〕</text><rect x="659" y="664" width="175" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="669" y="687" font-size="13" font-weight="normal" fill="#262626">A5 启用切换〔原写入〕</text><rect x="842" y="664" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="852" y="687" font-size="13" font-weight="normal" fill="#262626">A6 测试连接〔进入确认〕</text><rect x="40" y="728" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="754" font-size="16" font-weight="600" fill="#262626">状态与写入边界</text><line x1="54" y1="783" x2="1146" y2="783" stroke="#aaaaaa"/><text x="54" y="803" font-size="13" font-weight="normal" fill="#262626">· 加载骨架 / 真空列表 / 失败与重读 / 未授权分别呈现；未知数量不补0</text><text x="54" y="833" font-size="13" font-weight="normal" fill="#262626">· A4进入原编辑，原保存才写；取消保值，权限变化清私有内容</text><text x="54" y="863" font-size="13" font-weight="normal" fill="#262626">· A5失败回已确认状态；未知结果只读核对，不自动重放写入</text><text x="54" y="893" font-size="13" font-weight="normal" fill="#262626">· A6只有明确执行测试才联系上游，可能有用量；本线稿不执行</text><rect x="40" y="923" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="949" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="978" x2="1146" y2="978" stroke="#aaaaaa"/><text x="54" y="998" font-size="13" font-weight="normal" fill="#262626">· 卡片自然高度；一个展开不拉伸同排其他卡；手机单列、按钮44px、长模型ID换行。</text><text x="54" y="1028" font-size="13" font-weight="normal" fill="#262626">· 数量按钮使用准确已加载计数；未知不能显示0，展开与关闭保焦点且不触发写入。</text><text x="54" y="1058" font-size="13" font-weight="normal" fill="#262626">· 窗口百分比为合成占位，不代表供应商当前健康；不同窗口/单位/来源不相加。</text><text x="54" y="1088" font-size="13" font-weight="normal" fill="#262626">· 保存、开关、测试均沿原权限；身份或权限变化清除旧私有结果，失败与未知不能藏在收起区。</text><rect x="40" y="1118" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1144" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1173" x2="1146" y2="1173" stroke="#aaaaaa"/><text x="54" y="1193" font-size="13" font-weight="normal" fill="#262626">· 连接与渠道不再表现成两套管理功能：卡片 / 表格是同一对象的两种视图；旧地址保留。</text><text x="54" y="1223" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1267" font-size="10" font-weight="normal" fill="#666666">connections · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
