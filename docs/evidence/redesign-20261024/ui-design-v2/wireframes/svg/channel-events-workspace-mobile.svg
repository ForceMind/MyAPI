<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1877" viewBox="0 0 390 1877" role="img" aria-labelledby="title desc"><title id="title">渠道工作区 · 全部渠道事件 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">渠道工作区 · 全部渠道事件</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/channels#channel-events</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">渠道库</text><rect x="107.5" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="115.5" y="250" font-size="12" font-weight="normal" fill="#262626">额度证据</text><rect x="199.0" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="250" font-size="12" font-weight="normal" fill="#262626">全部事件</text><rect x="290.5" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="298.5" y="250" font-size="12" font-weight="normal" fill="#262626">路由预览</text><rect x="16.0" y="285" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="310" font-size="12" font-weight="normal" fill="#262626">返回渠道库</text><rect x="16.0" y="337" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="362" font-size="12" font-weight="normal" fill="#262626">当前范围：明确对象 / 全部渠道</text><rect x="16.0" y="397" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="422" font-size="12" font-weight="normal" fill="#262626">范围：全部渠道〔API不支持单渠道筛选〕</text><rect x="16.0" y="449" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="474" font-size="12" font-weight="normal" fill="#262626">原状态筛选 ▾</text><rect x="16.0" y="501" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="526" font-size="12" font-weight="normal" fill="#262626">刷新已存事件</text><rect x="16" y="561" width="358" height="167" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="587" font-size="16" font-weight="600" fill="#262626">合成事件 1 · 原状态 / 投递状态</text><line x1="30" y1="616" x2="360" y2="616" stroke="#aaaaaa"/><text x="30" y="636" font-size="13" font-weight="normal" fill="#262626">· 渠道与窗口 / 发生时间 / kind</text><text x="30" y="666" font-size="13" font-weight="normal" fill="#262626">· 当前原证据：available / total / unit / rese</text><text x="40" y="686" font-size="13" font-weight="normal" fill="#262626">tAt</text><text x="30" y="716" font-size="13" font-weight="normal" fill="#262626">· 查看完整series/ref/投递错误  ▾</text><rect x="16" y="738" width="358" height="167" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="764" font-size="16" font-weight="600" fill="#262626">合成事件 2 · 原状态 / 投递状态</text><line x1="30" y1="793" x2="360" y2="793" stroke="#aaaaaa"/><text x="30" y="813" font-size="13" font-weight="normal" fill="#262626">· 渠道与窗口 / 发生时间 / kind</text><text x="30" y="843" font-size="13" font-weight="normal" fill="#262626">· 当前原证据：available / total / unit / rese</text><text x="40" y="863" font-size="13" font-weight="normal" fill="#262626">tAt</text><text x="30" y="893" font-size="13" font-weight="normal" fill="#262626">· 查看完整series/ref/投递错误  ▾</text><rect x="16" y="915" width="358" height="167" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="941" font-size="16" font-weight="600" fill="#262626">合成事件 3 · 原状态 / 投递状态</text><line x1="30" y1="970" x2="360" y2="970" stroke="#aaaaaa"/><text x="30" y="990" font-size="13" font-weight="normal" fill="#262626">· 渠道与窗口 / 发生时间 / kind</text><text x="30" y="1020" font-size="13" font-weight="normal" fill="#262626">· 当前原证据：available / total / unit / rese</text><text x="40" y="1040" font-size="13" font-weight="normal" fill="#262626">tAt</text><text x="30" y="1070" font-size="13" font-weight="normal" fill="#262626">· 查看完整series/ref/投递错误  ▾</text><rect x="16.0" y="1092" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="1117" font-size="12" font-weight="normal" fill="#262626">上一页</text><rect x="16.0" y="1144" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="1169" font-size="12" font-weight="normal" fill="#262626">第 N 页 · 总数未知</text><rect x="16.0" y="1196" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="1221" font-size="12" font-weight="normal" fill="#262626">下一页</text><rect x="16" y="1256" width="358" height="167" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1282" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="30" y1="1311" x2="360" y2="1311" stroke="#aaaaaa"/><text x="30" y="1331" font-size="13" font-weight="normal" fill="#262626">· 当前API无channel_id筛选，不把当前页过滤冒充</text><text x="40" y="1351" font-size="13" font-weight="normal" fill="#262626">该渠道全部事件。</text><text x="30" y="1381" font-size="13" font-weight="normal" fill="#262626">· 空事件不代表渠道健康；缺失总数不补0。</text><text x="30" y="1411" font-size="13" font-weight="normal" fill="#262626">· 进入才读取；没有模型或真实供应商请求。</text><rect x="16" y="1441" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1467" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1496" x2="360" y2="1496" stroke="#aaaaaa"/><text x="30" y="1516" font-size="13" font-weight="normal" fill="#262626">· 同一路由的显式任务视图，不新建路由或调用模</text><text x="40" y="1536" font-size="13" font-weight="normal" fill="#262626">型。</text><rect x="16" y="1566" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1592" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1621" x2="360" y2="1621" stroke="#aaaaaa"/><text x="30" y="1641" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作</text><text x="40" y="1661" font-size="13" font-weight="normal" fill="#262626">；保留管理员渠道表格所需的高级列。</text><text x="30" y="1691" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1711" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1741" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1779" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1835" font-size="10" font-weight="normal" fill="#666666">channel-events-workspace · 手机390 · 来源 c916051e · 浏览器未验</text><text x="16" y="1852" font-size="10" font-weight="normal" fill="#666666">证</text></g></svg>
