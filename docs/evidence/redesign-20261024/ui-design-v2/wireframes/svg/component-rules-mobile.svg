<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1168" viewBox="0 0 390 1168" role="img" aria-labelledby="title desc"><title id="title">按钮、输入与反馈规范 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">按钮、输入与反馈规范</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">组件：设计语言</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="248" font-size="13" font-weight="600" fill="#262626">A1 日期范围规范</text><rect x="184" y="225" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="248" font-size="13" font-weight="normal" fill="#262626">A2 分页规范</text><rect x="16" y="281" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="304" font-size="13" font-weight="normal" fill="#262626">A3 各状态规范</text><rect x="16.0" y="345" width="358.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="371" font-size="16" font-weight="600" fill="#262626">按钮层级</text><line x1="30.0" y1="400" x2="360.0" y2="400" stroke="#aaaaaa"/><text x="30.0" y="420" font-size="13" font-weight="normal" fill="#262626">· 主操作：每个任务一个</text><text x="30.0" y="450" font-size="13" font-weight="normal" fill="#262626">· 次操作：描边 / 文本</text><text x="30.0" y="480" font-size="13" font-weight="normal" fill="#262626">· 危险操作：明确文案与确认</text><text x="30.0" y="510" font-size="13" font-weight="normal" fill="#262626">· 图标按钮有名称</text><rect x="16.0" y="538" width="358.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="564" font-size="16" font-weight="600" fill="#262626">输入控件</text><line x1="30.0" y1="593" x2="360.0" y2="593" stroke="#aaaaaa"/><text x="30.0" y="613" font-size="13" font-weight="normal" fill="#262626">· 输入 / 选择 / 开关 / 多行</text><text x="30.0" y="643" font-size="13" font-weight="normal" fill="#262626">· 标签 / 帮助 / 错误就近</text><text x="30.0" y="673" font-size="13" font-weight="normal" fill="#262626">· 必填与禁用理由</text><text x="30.0" y="703" font-size="13" font-weight="normal" fill="#262626">· 提交中防重复</text><rect x="16.0" y="731" width="358.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="757" font-size="16" font-weight="600" fill="#262626">视觉与可达性</text><line x1="30.0" y1="786" x2="360.0" y2="786" stroke="#aaaaaa"/><text x="30.0" y="806" font-size="13" font-weight="normal" fill="#262626">· 方向3令牌 / Hugeicons</text><text x="30.0" y="836" font-size="13" font-weight="normal" fill="#262626">· 浅色 / 暗色同一语义</text><text x="30.0" y="866" font-size="13" font-weight="normal" fill="#262626">· 手机至少44px触控目标</text><text x="30.0" y="896" font-size="13" font-weight="normal" fill="#262626">· 键盘焦点可见</text><rect x="16" y="924" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="950" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="979" x2="360" y2="979" stroke="#aaaaaa"/><text x="30" y="999" font-size="13" font-weight="normal" fill="#262626">· 保留Logo；没有引用真实供应商标志、凭据、金</text><text x="40" y="1019" font-size="13" font-weight="normal" fill="#262626">额或在线内容。</text><rect x="0" y="1049" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1087" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1143" font-size="10" font-weight="normal" fill="#666666">component-rules · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
