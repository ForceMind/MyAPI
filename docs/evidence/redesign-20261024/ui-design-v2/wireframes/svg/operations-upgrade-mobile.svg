<svg xmlns="http://www.w3.org/2000/svg" width="390" height="892" viewBox="0 0 390 892" role="img" aria-labelledby="title desc"><title id="title">独立运维升级计划 · 手机</title><desc id="desc">沿用SystemInfo与既有确认组件。线稿表达流程，不连接API，不代表浏览器验收。</desc><rect width="100%" height="100%" fill="white"/><g font-family="system-ui,sans-serif" fill="#222"><rect x="16" y="682" width="358" height="182" fill="none" stroke="#888" rx="6"/><rect x="16" y="482" width="358" height="182" fill="none" stroke="#888" rx="6"/><rect x="16" y="258" width="358" height="206" fill="none" stroke="#888" rx="6"/><rect x="16" y="82" width="358" height="158" fill="none" stroke="#888" rx="6"/><text x="28" y="40" font-size="20">MyAPI · 运维计划 · 增量线稿</text><text x="28" y="110" font-size="16">系统状态 / 独立运维计划〔Root〕</text><text x="28" y="142" font-size="14">实例 + 源版本 → 目标版本 + 状态；刷</text><text x="28" y="166" font-size="14">新仅GET</text><text x="28" y="198" font-size="13">恢复风险始终可见；长SHA/制品身份显式展开</text><text x="28" y="286" font-size="16">核对准确计划</text><text x="28" y="318" font-size="14">实例 / 旧新镜像ID / source+t</text><text x="28" y="342" font-size="14">ree SHA / run+artifact</text><text x="28" y="366" font-size="14"> / 摘要 / 到期</text><text x="28" y="398" font-size="13">旧容器禁自动重启；新容器保原策略；保配置/开</text><text x="28" y="422" font-size="13">关/新增账务</text><text x="28" y="510" font-size="16">确认后才开始二次验证</text><text x="28" y="542" font-size="14">固定plan-id + digest → 2</text><text x="28" y="566" font-size="14">FA / Passkey 专用proof</text><text x="28" y="598" font-size="13">验证前后GET再核对同一计划；漂移/过期立即</text><text x="28" y="622" font-size="13">拒绝</text><text x="28" y="710" font-size="16">批准结果与只读恢复</text><text x="28" y="742" font-size="14">批准不自动执行；MCP仅能执行已批准计划一次</text><text x="28" y="774" font-size="13">未知 / interrupted / rec</text><text x="28" y="798" font-size="13">overy_required：仅查询，不重放</text><text x="28" y="822" font-size="13">、不回滚</text></g></svg>
