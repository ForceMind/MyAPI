<line x1="54" y1="1459" x2="572" y2="1459" stroke="#aaaaaa"/>
<text x="54" y="1480" font-size="13" font-weight="400" fill="#262626">有写权限：点编辑并调整数值，沿用现有提交规则。</text>
<text x="54" y="1502" font-size="13" font-weight="400" fill="#262626">保存中锁定当前字段，成功确认保存值。</text>
<text x="54" y="1524" font-size="13" font-weight="400" fill="#262626">保存结果不明：锁住编辑，提供「读取已保存值」；只读，不重放。</text>
<rect x="614" y="1422" width="546" height="129" rx="5" fill="#ffffff" stroke="#777777"/>
<text x="628" y="1447" font-size="15" font-weight="600" fill="#262626">读取结果与返回位置</text>
<line x1="628" y1="1459" x2="1146" y2="1459" stroke="#aaaaaa"/>
<text x="628" y="1480" font-size="13" font-weight="400" fill="#262626">读回成功后显示保存值，原草稿如不同可供对照。</text>
<text x="628" y="1502" font-size="13" font-weight="400" fill="#262626">读回失败提示原因，锁定保留并提供再次读取。</text>
<text x="628" y="1524" font-size="13" font-weight="400" fill="#262626">详情返回原页、筛选、滚动位置和触发焦点。</text>
