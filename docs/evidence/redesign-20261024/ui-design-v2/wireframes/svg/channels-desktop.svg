<text x="54" y="776" font-size="13" font-weight="normal" fill="#262626">· 选路视图：优先级 / 权重 / 分组 / 模型 / Tag与原行内编辑</text>
<text x="54" y="806" font-size="13" font-weight="normal" fill="#262626">· 自定义列：保留原所有列和个人列宽，不覆盖旧偏好</text>
<text x="54" y="836" font-size="13" font-weight="normal" fill="#262626">· 选中数值ID / 整个Tag / 全部渠道分别确认，不混同范围</text>
<rect x="40" y="866" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/>
<text x="54" y="892" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text>
<line x1="54" y1="921" x2="1146" y2="921" stroke="#aaaaaa"/>
<text x="54" y="941" font-size="13" font-weight="normal" fill="#262626">· 库存为默认工作区，重证据不默认读取；当前故障/Unknown/操作错误保留。</text>
<text x="54" y="971" font-size="13" font-weight="normal" fill="#262626">· 切任务保筛选、分页、排序、列偏好、选择、滚动与返回焦点。</text>
<text x="54" y="1001" font-size="13" font-weight="normal" fill="#262626">· 维护是全库；Tag是全标签；批选是数值ID，不混淆范围。</text>
<text x="54" y="1031" font-size="13" font-weight="normal" fill="#262626">· 旧锚点与quotaChannelId保留；默认不测试模型/查供应商余额。</text>
<rect x="40" y="1061" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/>
<text x="54" y="1087" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text>
<line x1="54" y1="1116" x2="1146" y2="1116" stroke="#aaaaaa"/>
<text x="54" y="1136" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作；保留管理员渠道表格所需的高级列。</text>
<text x="54" y="1166" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text>
