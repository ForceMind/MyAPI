<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1094" viewBox="0 0 1200 1094" role="img" aria-labelledby="title desc"><title id="title">连接 · 表格视图（原渠道） · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">连接 · 表格视图（原渠道）</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/channels</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40" y="215" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="50" y="242" font-size="13" font-weight="600" fill="#262626">渠道库存</text><rect x="136" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="146" y="242" font-size="13" font-weight="normal" fill="#262626">额度证据</text><rect x="232" y="215" width="108" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="242" y="242" font-size="13" font-weight="normal" fill="#262626">全部渠道事件</text><rect x="348" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="358" y="242" font-size="13" font-weight="normal" fill="#262626">路由预览</text><rect x="40" y="275" width="1120" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="301" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="330" x2="1146" y2="330" stroke="#aaaaaa"/><text x="54" y="350" font-size="13" font-weight="normal" fill="#262626">· 渠道库存 · 创建渠道 / 选择渠道</text><text x="54" y="380" font-size="13" font-weight="normal" fill="#262626">· 搜索名称、ID、Key · 状态 · 更多筛选〔保原模型/类型/分组组合〕</text><text x="54" y="410" font-size="13" font-weight="normal" fill="#262626">· 监控视图 / 路由视图 / 自定义列 · 原偏好不覆盖</text><text x="54" y="440" font-size="13" font-weight="normal" fill="#262626">· 名称与ID / 供应商 / 状态 / 额度或余额 / 上次测试 / 明确操作</text><text x="54" y="470" font-size="13" font-weight="normal" fill="#262626">· 显示设置〔Tag聚合、ID排序、列〕 / 全局维护〔明确全部渠道范围〕</text><text x="54" y="500" font-size="13" font-weight="normal" fill="#262626">· 额度证据 未读取 › · 全部渠道事件 未读取 › · 路由预览 未提交 ›</text><rect x="40" y="530" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="556" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="585" x2="1146" y2="585" stroke="#aaaaaa"/><text x="54" y="605" font-size="13" font-weight="normal" fill="#262626">· 选中渠道：真实已选数与启停/设Tag/删除，退出选择</text><text x="54" y="635" font-size="13" font-weight="normal" fill="#262626">· Tag聚合：按整个标签操作，不能伪装选中ID或跳普通详情</text><text x="54" y="665" font-size="13" font-weight="normal" fill="#262626">· 行更多：诊断 / 模型配置 / 凭据维护 / 危险操作分组</text><text x="54" y="695" font-size="13" font-weight="normal" fill="#262626">· 备注、禁用原因、模型与分组完整内容可点击查看</text><rect x="40" y="725" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="751" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="780" x2="1146" y2="780" stroke="#aaaaaa"/><text x="54" y="800" font-size="13" font-weight="normal" fill="#262626">· 库存为默认工作区，重证据不默认读取；当前故障/Unknown/操作错误保留。</text><text x="54" y="830" font-size="13" font-weight="normal" fill="#262626">· 切任务保筛选、分页、排序、列偏好、选择、滚动与返回焦点。</text><text x="54" y="860" font-size="13" font-weight="normal" fill="#262626">· 维护是全库；Tag是全标签；批选是数值ID，不混淆范围。</text><text x="54" y="890" font-size="13" font-weight="normal" fill="#262626">· 旧锚点与quotaChannelId保留；默认不测试模型/查供应商余额。</text><rect x="40" y="920" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="946" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="975" x2="1146" y2="975" stroke="#aaaaaa"/><text x="54" y="995" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作；保留管理员渠道表格所需的高级列。</text><text x="54" y="1025" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1069" font-size="10" font-weight="normal" fill="#666666">channels · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
