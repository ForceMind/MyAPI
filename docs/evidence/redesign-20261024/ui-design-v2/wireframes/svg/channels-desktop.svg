<text x="628" y="1354" font-size="13" font-weight="400" fill="#262626">展开查看绝对时刻、观测来源、历史错误。过期标「上次记录」。</text>
<text x="628" y="1376" font-size="13" font-weight="400" fill="#262626">缺失显示未知，不支持显示中性状态，当前故障在原处保留。</text>
<rect x="40" y="1422" width="546" height="129" rx="5" fill="#ffffff" stroke="#777777"/>
