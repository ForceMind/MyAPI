<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="807" viewBox="0 0 1200 807" role="img" aria-labelledby="title desc"><title id="title">加载、空、失败、未授权与未知 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">加载、空、失败、未授权与未知</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">组件：页面状态</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="238" font-size="13" font-weight="600" fill="#262626">A1 返回正文线稿</text><rect x="40.0" y="279" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="305" font-size="16" font-weight="600" fill="#262626">加载中</text><line x1="54.0" y1="334" x2="578.0" y2="334" stroke="#aaaaaa"/><text x="54.0" y="354" font-size="13" font-weight="normal" fill="#262626">· 骨架 / 正在读取</text><text x="54.0" y="384" font-size="13" font-weight="normal" fill="#262626">· 不展示上一身份缓存</text><text x="54.0" y="414" font-size="13" font-weight="normal" fill="#262626">· 读操作可取消</text><rect x="608.0" y="279" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="622.0" y="305" font-size="16" font-weight="600" fill="#262626">无匹配结果</text><line x1="622.0" y1="334" x2="1146.0" y2="334" stroke="#aaaaaa"/><text x="622.0" y="354" font-size="13" font-weight="normal" fill="#262626">· 保留已应用筛选</text><text x="622.0" y="384" font-size="13" font-weight="normal" fill="#262626">· 清空筛选入口</text><text x="622.0" y="414" font-size="13" font-weight="normal" fill="#262626">· 不误写成系统无数据</text><rect x="40.0" y="442" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="468" font-size="16" font-weight="600" fill="#262626">读取失败</text><line x1="54.0" y1="497" x2="578.0" y2="497" stroke="#aaaaaa"/><text x="54.0" y="517" font-size="13" font-weight="normal" fill="#262626">· 错误与可恢复入口</text><text x="54.0" y="547" font-size="13" font-weight="normal" fill="#262626">· 只读重试</text><text x="54.0" y="577" font-size="13" font-weight="normal" fill="#262626">· 不把失败显示为0条</text><rect x="608.0" y="442" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="622.0" y="468" font-size="16" font-weight="600" fill="#262626">无权限 / 会话变化</text><line x1="622.0" y1="497" x2="1146.0" y2="497" stroke="#aaaaaa"/><text x="622.0" y="517" font-size="13" font-weight="normal" fill="#262626">· 受限内容立即移除</text><text x="622.0" y="547" font-size="13" font-weight="normal" fill="#262626">· 返回可用区域</text><text x="622.0" y="577" font-size="13" font-weight="normal" fill="#262626">· 重新登录</text><rect x="40.0" y="605" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="631" font-size="16" font-weight="600" fill="#262626">处理中 / 成功 / 结果未知</text><line x1="54.0" y1="660" x2="578.0" y2="660" stroke="#aaaaaa"/><text x="54.0" y="680" font-size="13" font-weight="normal" fill="#262626">· 提交中禁止重复点击</text><text x="54.0" y="710" font-size="13" font-weight="normal" fill="#262626">· 成功给明确反馈</text><text x="54.0" y="740" font-size="13" font-weight="normal" fill="#262626">· 未知只查状态，不自动重放</text><text x="40" y="782" font-size="10" font-weight="normal" fill="#666666">state-board · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
