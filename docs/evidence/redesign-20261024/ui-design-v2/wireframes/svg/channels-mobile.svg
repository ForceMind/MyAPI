ize="13" font-weight="normal" fill="#262626">混同范围</text><rect x="16" y="1294" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1320" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="30" y1="1349" x2="360" y2="1349" stroke="#aaaaaa"/><text x="30" y="1369" font-size="13" font-weight="normal" fill="#262626">· 库存为默认工作区，重证据不默认读取；当前故</text><text x="40" y="1389" font-size="13" font-weight="normal" fill="#262626">障/Unknown/操作错误保留。</text><text x="30" y="1419" font-size="13" font-weight="normal" fill="#262626">· 切任务保筛选、分页、排序、列偏好、选择、滚</text><text x="40" y="1439" font-size="13" font-weight="normal" fill="#262626">动与返回焦点。</text><text x="30" y="1469" font-size="13" font-weight="normal" fill="#262626">· 维护是全库；Tag是全标签；批选是数值ID，不混</text><text x="40" y="1489" font-size="13" font-weight="normal" fill="#262626">淆范围。</text><text x="30" y="1519" font-size="13" font-weight="normal" fill="#262626">· 旧锚点与quotaChannelId保留；默认不测试模型/</text><text x="40" y="1539" font-size="13" font-weight="normal" fill="#262626">查供应商余额。</text><rect x="16" y="1569" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1595" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1624" x2="360" y2="1624" stroke="#aaaaaa"/><text x="30" y="1644" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作</text><text x="40" y="1664" font-size="13" font-weight="normal" fill="#262626">；保留管理员渠道表格所需的高级列。</text><text x="30" y="1694" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1714" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1744" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1782" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1838" font-size="10" font-weight="normal" fill="#666666">channels · 手机390 · 来源 c916051e · 浏览器未验证