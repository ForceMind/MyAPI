<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1536" viewBox="0 0 390 1536" role="img" aria-labelledby="title desc"><title id="title">连接 · 表格视图（原渠道） · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">连接 · 表格视图（原渠道）</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/channels</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="26" y="252" font-size="13" font-weight="600" fill="#262626">渠道库存</text><rect x="112" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="122" y="252" font-size="13" font-weight="normal" fill="#262626">额度证据</text><rect x="208" y="225" width="108" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="218" y="252" font-size="13" font-weight="normal" fill="#262626">全部渠道事件</text><rect x="16" y="277" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="304" font-size="13" font-weight="normal" fill="#262626">路由预览</text><rect x="16" y="337" width="358" height="337" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="363" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="392" x2="360" y2="392" stroke="#aaaaaa"/><text x="30" y="412" font-size="13" font-weight="normal" fill="#262626">· 渠道库存 · 创建渠道 / 选择渠道</text><text x="30" y="442" font-size="13" font-weight="normal" fill="#262626">· 搜索名称、ID、Key · 状态 · 更多筛选〔保原模</text><text x="40" y="462" font-size="13" font-weight="normal" fill="#262626">型/类型/分组组合〕</text><text x="30" y="492" font-size="13" font-weight="normal" fill="#262626">· 监控视图 / 路由视图 / 自定义列 · 原偏好不覆</text><text x="40" y="512" font-size="13" font-weight="normal" fill="#262626">盖</text><text x="30" y="542" font-size="13" font-weight="normal" fill="#262626">· 名称与ID / 供应商 / 状态 / 额度或余额 / 上</text><text x="40" y="562" font-size="13" font-weight="normal" fill="#262626">次测试 / 明确操作</text><text x="30" y="592" font-size="13" font-weight="normal" fill="#262626">· 显示设置〔Tag聚合、ID排序、列〕 / 全局维护</text><text x="40" y="612" font-size="13" font-weight="normal" fill="#262626">〔明确全部渠道范围〕</text><text x="30" y="642" font-size="13" font-weight="normal" fill="#262626">· 额度证据 未读取 › · 全部渠道事件 未读取 › ·</text><text x="40" y="662" font-size="13" font-weight="normal" fill="#262626"> 路由预览 未提交 ›</text><rect x="16" y="692" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="718" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="747" x2="360" y2="747" stroke="#aaaaaa"/><text x="30" y="767" font-size="13" font-weight="normal" fill="#262626">· 选中渠道：真实已选数与启停/设Tag/删除，退出</text><text x="40" y="787" font-size="13" font-weight="normal" fill="#262626">选择</text><text x="30" y="817" font-size="13" font-weight="normal" fill="#262626">· Tag聚合：按整个标签操作，不能伪装选中ID或跳</text><text x="40" y="837" font-size="13" font-weight="normal" fill="#262626">普通详情</text><text x="30" y="867" font-size="13" font-weight="normal" fill="#262626">· 行更多：诊断 / 模型配置 / 凭据维护 / 危险操</text><text x="40" y="887" font-size="13" font-weight="normal" fill="#262626">作分组</text><text x="30" y="917" font-size="13" font-weight="normal" fill="#262626">· 备注、禁用原因、模型与分组完整内容可点击查</text><text x="40" y="937" font-size="13" font-weight="normal" fill="#262626">看</text><rect x="16" y="967" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="993" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="1022" x2="360" y2="1022" stroke="#aaaaaa"/><text x="30" y="1042" font-size="13" font-weight="normal" fill="#262626">· 库存为默认工作区，重证据不默认读取；当前故</text><text x="40" y="1062" font-size="13" font-weight="normal" fill="#262626">障/Unknown/操作错误保留。</text><text x="30" y="1092" font-size="13" font-weight="normal" fill="#262626">· 切任务保筛选、分页、排序、列偏好、选择、滚</text><text x="40" y="1112" font-size="13" font-weight="normal" fill="#262626">动与返回焦点。</text><text x="30" y="1142" font-size="13" font-weight="normal" fill="#262626">· 维护是全库；Tag是全标签；批选是数值ID，不混</text><text x="40" y="1162" font-size="13" font-weight="normal" fill="#262626">淆范围。</text><text x="30" y="1192" font-size="13" font-weight="normal" fill="#262626">· 旧锚点与quotaChannelId保留；默认不测试模型/</text><text x="40" y="1212" font-size="13" font-weight="normal" fill="#262626">查供应商余额。</text><rect x="16" y="1242" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1268" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1297" x2="360" y2="1297" stroke="#aaaaaa"/><text x="30" y="1317" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作</text><text x="40" y="1337" font-size="13" font-weight="normal" fill="#262626">；保留管理员渠道表格所需的高级列。</text><text x="30" y="1367" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1387" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1417" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1455" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1511" font-size="10" font-weight="normal" fill="#666666">channels · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
