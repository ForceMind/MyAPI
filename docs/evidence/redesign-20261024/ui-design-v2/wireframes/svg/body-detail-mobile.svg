<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1769" viewBox="0 0 390 1769" role="img" aria-labelledby="title desc"><title id="title">已保存正文 / SSE 内容详情 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">已保存正文 / SSE 内容详情</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/full-content-logs〔查看内容〕</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16.0" y="225" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="253" font-size="14" font-weight="600" fill="#262626">Request ID 合成示例</text><rect x="200.0" y="225" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="212.0" y="253" font-size="14" font-weight="600" fill="#262626">响应大小 —</text><rect x="16.0" y="315" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="343" font-size="14" font-weight="600" fill="#262626">截断 未知</text><rect x="16" y="411" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="434" font-size="13" font-weight="600" fill="#262626">A1 返回正文列表</text><rect x="184" y="411" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="434" font-size="13" font-weight="normal" fill="#262626">A2 查看关联请求</text><rect x="16" y="467" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="490" font-size="13" font-weight="normal" fill="#262626">A3 切换原始视图</text><rect x="16.0" y="531" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="557" font-size="16" font-weight="600" fill="#262626">请求内容</text><line x1="30.0" y1="586" x2="360.0" y2="586" stroke="#aaaaaa"/><text x="30.0" y="606" font-size="13" font-weight="normal" fill="#262626">· 已脱敏请求头</text><text x="30.0" y="636" font-size="13" font-weight="normal" fill="#262626">· 请求体</text><text x="30.0" y="666" font-size="13" font-weight="normal" fill="#262626">· 编码与内容类型</text><rect x="16.0" y="694" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="720" font-size="16" font-weight="600" fill="#262626">响应内容</text><line x1="30.0" y1="749" x2="360.0" y2="749" stroke="#aaaaaa"/><text x="30.0" y="769" font-size="13" font-weight="normal" fill="#262626">· 已保存正文 / SSE事件</text><text x="30.0" y="799" font-size="13" font-weight="normal" fill="#262626">· 视图切换：可读 / 原始</text><text x="30.0" y="829" font-size="13" font-weight="normal" fill="#262626">· 截断与未采集说明</text><rect x="16.0" y="857" width="358.0" height="357" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="883" font-size="16" font-weight="600" fill="#262626">完整分段原文〔明确打开后〕</text><line x1="30.0" y1="912" x2="360.0" y2="912" stroke="#aaaaaa"/><text x="30.0" y="932" font-size="13" font-weight="normal" fill="#262626">· 请求 / 响应各自读取；每段解码后最多1 MiB，b</text><text x="40.0" y="952" font-size="13" font-weight="normal" fill="#262626">ase64表示有编码开销</text><text x="30.0" y="982" font-size="13" font-weight="normal" fill="#262626">· 同请求版本 / 当前字节范围 / 已保存总量；采</text><text x="40.0" y="1002" font-size="13" font-weight="normal" fill="#262626">集完整性缺失仍为未知</text><text x="30.0" y="1032" font-size="13" font-weight="normal" fill="#262626">· 首页 / 上一段 / 下一段；起始字节输入 + 跳转</text><text x="40.0" y="1052" font-size="13" font-weight="normal" fill="#262626">，不必逐页翻</text><text x="30.0" y="1082" font-size="13" font-weight="normal" fill="#262626">· 复制当前段 / 换行 / 返回预览；旧16 MiB及SSE</text><text x="40.0" y="1102" font-size="13" font-weight="normal" fill="#262626">结构化预览能力保留</text><text x="30.0" y="1132" font-size="13" font-weight="normal" fill="#262626">· 打开分段时替换该部分预览；关闭后恢复其状态</text><text x="40.0" y="1152" font-size="13" font-weight="normal" fill="#262626">与焦点</text><text x="30.0" y="1182" font-size="13" font-weight="normal" fill="#262626">· 内容变更或轮转：保当前上下文并提示明确重读</text><text x="40.0" y="1202" font-size="13" font-weight="normal" fill="#262626">；换账号或权限失效不显示旧正文</text><rect x="16" y="1230" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1256" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1285" x2="360" y2="1285" stroke="#aaaaaa"/><text x="30" y="1305" font-size="13" font-weight="normal" fill="#262626">· 设计提案：统一为完整请求详情的内容区，移动</text><text x="40" y="1325" font-size="13" font-weight="normal" fill="#262626">端整页；不新增第二套正文权限。</text><text x="30" y="1355" font-size="13" font-weight="normal" fill="#262626">· 按明确操作才读取大正文，限制单次响应大小，</text><text x="40" y="1375" font-size="13" font-weight="normal" fill="#262626">读失败时不显示上条记录。</text><text x="30" y="1405" font-size="13" font-weight="normal" fill="#262626">· 分段只读取已经保存的原始字节；不下载整日志</text><text x="40" y="1425" font-size="13" font-weight="normal" fill="#262626">、不重放请求，不把读到末尾当业务成功或已结</text><text x="40" y="1445" font-size="13" font-weight="normal" fill="#262626">算。</text><rect x="16" y="1475" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1501" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1530" x2="360" y2="1530" stroke="#aaaaaa"/><text x="30" y="1550" font-size="13" font-weight="normal" fill="#262626">· 合并重复的正文查看外壳，保留普通记录与管理</text><text x="40" y="1570" font-size="13" font-weight="normal" fill="#262626">员正文之间的权限分界。</text><text x="30" y="1600" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1620" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1650" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1688" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1744" font-size="10" font-weight="normal" fill="#666666">body-detail · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
