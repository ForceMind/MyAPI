<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1029" viewBox="0 0 1200 1029" role="img" aria-labelledby="title desc"><title id="title">聊天预设容器 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">聊天预设容器</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/chat/$chatId</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="120" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="238" font-size="13" font-weight="600" fill="#262626">A1 返回概览</text><rect x="168" y="215" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="178" y="238" font-size="13" font-weight="normal" fill="#262626">A2 管理 API Key</text><rect x="40.0" y="279" width="1120.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="305" font-size="16" font-weight="600" fill="#262626">项目可控的容器</text><line x1="54.0" y1="334" x2="1146.0" y2="334" stroke="#aaaaaa"/><text x="54.0" y="354" font-size="13" font-weight="normal" fill="#262626">· 预设名称 / 状态</text><text x="54.0" y="384" font-size="13" font-weight="normal" fill="#262626">· 受限iframe边界</text><text x="54.0" y="414" font-size="13" font-weight="normal" fill="#262626">· 无法加载时说明</text><rect x="40.0" y="442" width="1120.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="468" font-size="16" font-weight="600" fill="#262626">第三方内容区域</text><line x1="54.0" y1="497" x2="1146.0" y2="497" stroke="#aaaaaa"/><text x="54.0" y="517" font-size="13" font-weight="normal" fill="#262626">· 外部站点自有UI，不能由MyAPI重设计</text><text x="54.0" y="547" font-size="13" font-weight="normal" fill="#262626">· 禁止在线稿载入真实外站</text><text x="54.0" y="577" font-size="13" font-weight="normal" fill="#262626">· 本图只画容器与异常状态</text><rect x="40" y="605" width="1120" height="260" rx="5" fill="#fafafa" stroke="#777777" stroke-dasharray="5 4"/><text x="60" y="685" font-size="16" font-weight="600" fill="#262626">外部内容边界〔不载入实际iframe〕</text><text x="60" y="730" font-size="13" font-weight="normal" fill="#262626">第三方界面不属于MyAPI可重设计范围；这里只设计项目容器与异常入口。</text><rect x="40" y="885" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="911" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="940" x2="1146" y2="940" stroke="#aaaaaa"/><text x="54" y="960" font-size="13" font-weight="normal" fill="#262626">· 保留既有iframe安全边界；线稿不嵌入真实页面、不读取或转交凭据。</text><text x="40" y="1004" font-size="10" font-weight="normal" fill="#666666">chat-preset · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
