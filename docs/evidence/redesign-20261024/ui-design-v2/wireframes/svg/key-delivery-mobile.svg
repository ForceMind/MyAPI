<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2232" viewBox="0 0 390 2232" role="img" aria-labelledby="title desc"><title id="title">API Key 详情 · 交付 · 手机</title><desc id="desc">2026-11-07主线线稿增量，合成数据；不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">API Key 详情 · 交付</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/keys/$keyId?tab=delivery</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">现另验 / 浏览器未验证</text><rect x="16" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="252" font-size="13" font-weight="normal" fill="#262626">请求</text><rect x="112" y="225" width="94" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="122" y="252" font-size="13" font-weight="normal" fill="#262626">范围与分额</text><rect x="214" y="225" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="224" y="252" font-size="13" font-weight="600" fill="#262626">交付</text><rect x="16" y="285" width="161" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="308" font-size="13" font-weight="600" fill="#262626">A1 返回来源〔跳转〕</text><rect x="185" y="285" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="195" y="308" font-size="13" font-weight="normal" fill="#262626">A7 凭据维护〔独立确认〕</text><rect x="16" y="349" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="375" font-size="16" font-weight="600" fill="#262626">准确Key与来源 · 首屏常驻</text><line x1="30" y1="404" x2="360" y2="404" stroke="#aaaaaa"/><text x="30" y="424" font-size="13" font-weight="normal" fill="#262626">· Key #示例 · 名称 / 掩码 / 状态未知；当前身</text><text x="40" y="444" font-size="13" font-weight="normal" fill="#262626">份和权限</text><text x="30" y="474" font-size="13" font-weight="normal" fill="#262626">· 首页来源 → 该Key交付；A1返回恢复原选择与焦</text><text x="40" y="494" font-size="13" font-weight="normal" fill="#262626">点</text><text x="30" y="524" font-size="13" font-weight="normal" fill="#262626">· 加载 / 无Key / 读取失败 / 撤权可见，不回显</text><text x="40" y="544" font-size="13" font-weight="normal" fill="#262626">旧对象秘密</text><rect x="16.0" y="574" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="599" font-size="12" font-weight="normal" fill="#262626">真实Base URL〔配置 / 当前访问来源〕</text><rect x="16.0" y="626" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="651" font-size="12" font-weight="normal" fill="#262626">A2 复制Base URL〔只读〕</text><text x="16" y="704" font-size="15" font-weight="600" fill="#262626">交付草稿 · 不自动发现 / 读密钥 / 发送</text><text x="16.0" y="734" font-size="12" font-weight="600" fill="#262626">客户端模板〔原支持列表〕</text><rect x="16.0" y="743" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="770" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="828" font-size="12" font-weight="600" fill="#262626">候选地址 ▾ / 手工输入〔原校验〕</text><rect x="16.0" y="837" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="864" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="922" font-size="12" font-weight="600" fill="#262626">凭据〔默认掩码；可手工粘贴〕</text><rect x="16.0" y="931" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="958" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="1004" width="238" height="56" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1027" font-size="13" font-weight="normal" fill="#262626">A3 选择 / 手填候选〔本地草稿</text><text x="26" y="1047" font-size="13" font-weight="normal" fill="#262626">〕</text><rect x="16" y="1068" width="217" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1091" font-size="13" font-weight="normal" fill="#262626">A4 手工粘贴凭据〔本地草稿〕</text><rect x="16" y="1132" width="224" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1155" font-size="13" font-weight="normal" fill="#262626">A5 复制配置〔显式 / 原确认〕</text><rect x="16" y="1196" width="203" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1219" font-size="13" font-weight="normal" fill="#262626">A6 导入客户端〔明确确认〕</text><rect x="16" y="1268" width="358" height="307" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1294" font-size="16" font-weight="600" fill="#262626">预览与确认 · 复制 / 导入分开</text><line x1="30" y1="1323" x2="360" y2="1323" stroke="#aaaaaa"/><text x="30" y="1343" font-size="13" font-weight="normal" fill="#262626">· 预览：准确地址、目标客户端、原协议字段；秘</text><text x="40" y="1363" font-size="13" font-weight="normal" fill="#262626">密保持原掩码策略</text><text x="30" y="1393" font-size="13" font-weight="normal" fill="#262626">· A5显式复制配置；含秘密沿原确认，复制失败就</text><text x="40" y="1413" font-size="13" font-weight="normal" fill="#262626">近反馈</text><text x="30" y="1443" font-size="13" font-weight="normal" fill="#262626">· A6导入前明确确认目标 / 地址及秘密；确认后才</text><text x="40" y="1463" font-size="13" font-weight="normal" fill="#262626">按原方式唤起</text><text x="30" y="1493" font-size="13" font-weight="normal" fill="#262626">· 无目标应用 / 无导入支持 / 字段无效：保草稿</text><text x="40" y="1513" font-size="13" font-weight="normal" fill="#262626">和替代复制入口</text><text x="30" y="1543" font-size="13" font-weight="normal" fill="#262626">· 不自动调用模型；成功复制不等于客户端已经连</text><text x="40" y="1563" font-size="13" font-weight="normal" fill="#262626">通</text><rect x="16" y="1593" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1619" font-size="16" font-weight="600" fill="#262626">权限变化与返回</text><line x1="30" y1="1648" x2="360" y2="1648" stroke="#aaaaaa"/><text x="30" y="1668" font-size="13" font-weight="normal" fill="#262626">· 切Key / 换账号 / 撤权：清旧秘密及敏感导入草</text><text x="40" y="1688" font-size="13" font-weight="normal" fill="#262626">稿，不复用旧异步回报</text><text x="30" y="1718" font-size="13" font-weight="normal" fill="#262626">· 取消与返回保非秘密上下文；显示 / 复制 / 轮</text><text x="40" y="1738" font-size="13" font-weight="normal" fill="#262626">换保持独立原授权</text><text x="30" y="1768" font-size="13" font-weight="normal" fill="#262626">· A7凭据维护进入既有任务，保独立确认与结果未</text><text x="40" y="1788" font-size="13" font-weight="normal" fill="#262626">知恢复</text><rect x="16" y="1818" width="358" height="277" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1844" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1873" x2="360" y2="1873" stroke="#aaaaaa"/><text x="30" y="1893" font-size="13" font-weight="normal" fill="#262626">· 所有地址、Key与候选均为线稿占位；实现复用现</text><text x="40" y="1913" font-size="13" font-weight="normal" fill="#262626">有真实来源与模板，不把示例URL写死进产品。</text><text x="30" y="1943" font-size="13" font-weight="normal" fill="#262626">· 保完整原字段、协议、复制/导入能力与权限；本</text><text x="40" y="1963" font-size="13" font-weight="normal" fill="#262626">轮不新增自动读密钥、自动唤起或自动测试。</text><text x="30" y="1993" font-size="13" font-weight="normal" fill="#262626">· 加载、无Key、字段无效、复制失败、目标应用不</text><text x="40" y="2013" font-size="13" font-weight="normal" fill="#262626">可用、权限变化均就近可见；禁止旧对象秘密进</text><text x="40" y="2033" font-size="13" font-weight="normal" fill="#262626">入新对象。</text><text x="30" y="2063" font-size="13" font-weight="normal" fill="#262626">· 返回与取消保非秘密上下文，敏感值沿原生命周</text><text x="40" y="2083" font-size="13" font-weight="normal" fill="#262626">期清理；轮换、保存与交付分离。</text><rect x="0" y="2113" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="2151" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="2207" font-size="10" font-weight="normal" fill="#666666">key-delivery · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
