<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1591" viewBox="0 0 390 1591" role="img" aria-labelledby="title desc"><title id="title">渠道工作区 · 路由预览 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">渠道工作区 · 路由预览</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/channels#channel-routing</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">渠道库</text><rect x="107.5" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="115.5" y="250" font-size="12" font-weight="normal" fill="#262626">额度证据</text><rect x="199.0" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="250" font-size="12" font-weight="normal" fill="#262626">全部事件</text><rect x="290.5" y="225" width="83.5" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="298.5" y="250" font-size="12" font-weight="normal" fill="#262626">路由预览</text><rect x="16.0" y="285" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="310" font-size="12" font-weight="normal" fill="#262626">返回渠道库</text><rect x="16.0" y="337" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="362" font-size="12" font-weight="normal" fill="#262626">当前范围：明确对象 / 全部渠道</text><text x="16" y="415" font-size="15" font-weight="600" fill="#262626">路由预览 · 切任务保草稿</text><text x="16.0" y="445" font-size="12" font-weight="600" fill="#262626">明确分组〔必填〕</text><rect x="16.0" y="454" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="481" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="539" font-size="12" font-weight="600" fill="#262626">明确模型〔必填〕</text><rect x="16.0" y="548" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="575" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="633" font-size="12" font-weight="600" fill="#262626">请求路径〔可选〕</text><rect x="16.0" y="642" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="669" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16.0" y="715" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="740" font-size="12" font-weight="normal" fill="#262626">提交预览〔必填完整后可用〕</text><rect x="16" y="775" width="358" height="187" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="801" font-size="16" font-weight="600" fill="#262626">上次只读快照 / 未提交空态</text><line x1="30" y1="830" x2="360" y2="830" stroke="#aaaaaa"/><text x="30" y="850" font-size="13" font-weight="normal" fill="#262626">· 优先级与fallback层级 → 完整候选及0权重</text><text x="30" y="880" font-size="13" font-weight="normal" fill="#262626">· 拒绝原因 / cooldown / account hold / 缓存与</text><text x="40" y="900" font-size="13" font-weight="normal" fill="#262626">epoch</text><text x="30" y="930" font-size="13" font-weight="normal" fill="#262626">· 只读本地配置，不是Key权限、预算或供应商调用</text><text x="40" y="950" font-size="13" font-weight="normal" fill="#262626">成功证明</text><rect x="16" y="980" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1006" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="30" y1="1035" x2="360" y2="1035" stroke="#aaaaaa"/><text x="30" y="1055" font-size="13" font-weight="normal" fill="#262626">· 切换任务保草稿和上次快照，不自动重新预览/模</text><text x="40" y="1075" font-size="13" font-weight="normal" fill="#262626">型测试/写入affinity。</text><text x="30" y="1105" font-size="13" font-weight="normal" fill="#262626">· 状态和查询按id/role/SID隔离，旧结果不进入新</text><text x="40" y="1125" font-size="13" font-weight="normal" fill="#262626">会话。</text><rect x="16" y="1155" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1181" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1210" x2="360" y2="1210" stroke="#aaaaaa"/><text x="30" y="1230" font-size="13" font-weight="normal" fill="#262626">· 同一路由的显式任务视图，不新建路由或调用模</text><text x="40" y="1250" font-size="13" font-weight="normal" fill="#262626">型。</text><rect x="16" y="1280" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1306" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1335" x2="360" y2="1335" stroke="#aaaaaa"/><text x="30" y="1355" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作</text><text x="40" y="1375" font-size="13" font-weight="normal" fill="#262626">；保留管理员渠道表格所需的高级列。</text><text x="30" y="1405" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1425" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1455" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1493" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1549" font-size="10" font-weight="normal" fill="#666666">channel-routing-workspace · 手机390 · 来源 c916051e · 浏览器未</text><text x="16" y="1566" font-size="10"