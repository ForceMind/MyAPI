<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1358" viewBox="0 0 390 1358" role="img" aria-labelledby="title desc"><title id="title">渠道工作区 · 路由预览 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">渠道工作区 · 路由预览</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/channels#channel-routing</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="252" font-size="13" font-weight="normal" fill="#262626">渠道库存</text><rect x="112" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="122" y="252" font-size="13" font-weight="normal" fill="#262626">额度证据</text><rect x="208" y="225" width="108" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="218" y="252" font-size="13" font-weight="normal" fill="#262626">全部渠道事件</text><rect x="16" y="277" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="26" y="304" font-size="13" font-weight="600" fill="#262626">路由预览</text><rect x="16" y="337" width="358" height="167" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="363" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="392" x2="360" y2="392" stroke="#aaaaaa"/><text x="30" y="412" font-size="13" font-weight="normal" fill="#262626">· 返回库存 · 路由预览 · 原group/model/request</text><text x="40" y="432" font-size="13" font-weight="normal" fill="#262626">_path草稿</text><text x="30" y="462" font-size="13" font-weight="normal" fill="#262626">· 明确提交预览 / 只读快照 / 提交错误</text><text x="30" y="492" font-size="13" font-weight="normal" fill="#262626">· 选路层级、当前观测及完整候选摘要</text><rect x="16" y="522" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="548" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="577" x2="360" y2="577" stroke="#aaaaaa"/><text x="30" y="597" font-size="13" font-weight="normal" fill="#262626">· 原tier/priority/fallback/weight/effective_w</text><text x="40" y="617" font-size="13" font-weight="normal" fill="#262626">eight/expected_share及0值</text><text x="30" y="647" font-size="13" font-weight="normal" fill="#262626">· rejected原因/cooldown/account holds、epochs</text><text x="40" y="667" font-size="13" font-weight="normal" fill="#262626">/cache_pending/deadline/cooldown设置</text><text x="30" y="697" font-size="13" font-weight="normal" fill="#262626">· 不是Key权限/预算/价格/登录/账户额度或真实调</text><text x="40" y="717" font-size="13" font-weight="normal" fill="#262626">用成功证明</text><rect x="16" y="747" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="773" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="802" x2="360" y2="802" stroke="#aaaaaa"/><text x="30" y="822" font-size="13" font-weight="normal" fill="#262626">· 切换任务保草稿和上次快照，不自动重新预览/模</text><text x="40" y="842" font-size="13" font-weight="normal" fill="#262626">型测试/写入affinity。</text><text x="30" y="872" font-size="13" font-weight="normal" fill="#262626">· 状态和查询按id/role/SID隔离，旧结果不进入新</text><text x="40" y="892" font-size="13" font-weight="normal" fill="#262626">会话。</text><rect x="16" y="922" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="948" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="977" x2="360" y2="977" stroke="#aaaaaa"/><text x="30" y="997" font-size="13" font-weight="normal" fill="#262626">· 同一路由的显式任务视图，不新建路由或调用模</text><text x="40" y="1017" font-size="13" font-weight="normal" fill="#262626">型。</text><rect x="16" y="1047" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1073" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1102" x2="360" y2="1102" stroke="#aaaaaa"/><text x="30" y="1122" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作</text><text x="40" y="1142" font-size="13" font-weight="normal" fill="#262626">；保留管理员渠道表格所需的高级列。</text><text x="30" y="1172" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1192" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1222" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1260" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1316" font-size="10" font-weight="normal" fill="#666666">channel-routing-workspace · 手机390 · 来源 c916051e · 浏览器未</text><text x="16" y="1333" font-size="10" font-weight="normal" fill="#666666">验证</text></g></svg>
