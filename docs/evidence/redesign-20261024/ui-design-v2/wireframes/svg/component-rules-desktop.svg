<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="809" viewBox="0 0 1200 809" role="img" aria-labelledby="title desc"><title id="title">按钮、输入与反馈规范 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">按钮、输入与反馈规范</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">组件：设计语言</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="238" font-size="13" font-weight="600" fill="#262626">A1 日期范围规范</text><rect x="181" y="215" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="191" y="238" font-size="13" font-weight="normal" fill="#262626">A2 分页规范</text><rect x="309" y="215" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="319" y="238" font-size="13" font-weight="normal" fill="#262626">A3 各状态规范</text><rect x="40.0" y="279" width="552.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="305" font-size="16" font-weight="600" fill="#262626">按钮层级</text><line x1="54.0" y1="334" x2="578.0" y2="334" stroke="#aaaaaa"/><text x="54.0" y="354" font-size="13" font-weight="normal" fill="#262626">· 主操作：每个任务一个</text><text x="54.0" y="384" font-size="13" font-weight="normal" fill="#262626">· 次操作：描边 / 文本</text><text x="54.0" y="414" font-size="13" font-weight="normal" fill="#262626">· 危险操作：明确文案与确认</text><text x="54.0" y="444" font-size="13" font-weight="normal" fill="#262626">· 图标按钮有名称</text><rect x="608.0" y="279" width="552.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="622.0" y="305" font-size="16" font-weight="600" fill="#262626">输入控件</text><line x1="622.0" y1="334" x2="1146.0" y2="334" stroke="#aaaaaa"/><text x="622.0" y="354" font-size="13" font-weight="normal" fill="#262626">· 输入 / 选择 / 开关 / 多行</text><text x="622.0" y="384" font-size="13" font-weight="normal" fill="#262626">· 标签 / 帮助 / 错误就近</text><text x="622.0" y="414" font-size="13" font-weight="normal" fill="#262626">· 必填与禁用理由</text><text x="622.0" y="444" font-size="13" font-weight="normal" fill="#262626">· 提交中防重复</text><rect x="40.0" y="472" width="552.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="498" font-size="16" font-weight="600" fill="#262626">视觉与可达性</text><line x1="54.0" y1="527" x2="578.0" y2="527" stroke="#aaaaaa"/><text x="54.0" y="547" font-size="13" font-weight="normal" fill="#262626">· 方向3令牌 / Hugeicons</text><text x="54.0" y="577" font-size="13" font-weight="normal" fill="#262626">· 浅色 / 暗色同一语义</text><text x="54.0" y="607" font-size="13" font-weight="normal" fill="#262626">· 手机至少44px触控目标</text><text x="54.0" y="637" font-size="13" font-weight="normal" fill="#262626">· 键盘焦点可见</text><rect x="40" y="665" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="691" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="720" x2="1146" y2="720" stroke="#aaaaaa"/><text x="54" y="740" font-size="13" font-weight="normal" fill="#262626">· 保留Logo；没有引用真实供应商标志、凭据、金额或在线内容。</text><text x="40" y="784" font-size="10" font-weight="normal" fill="#666666">component-rules · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
