<svg xmlns="http://www.w3.org/2000/svg" width="390" height="848" viewBox="0 0 390 848" role="img" aria-labelledby="title desc"><title id="title">订阅窗口分额 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">订阅窗口分额</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：订阅窗口分额</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="251" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="280" x2="360" y2="280" stroke="#aaaaaa"/><text x="30" y="300" font-size="13" font-weight="normal" fill="#262626">· 当前窗口 / 份额摘要 / 管理操作</text><text x="30" y="330" font-size="13" font-weight="normal" fill="#262626">· Key分配 N ▾ · 总分配 / 未分配</text><rect x="16" y="360" width="358" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="386" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="415" x2="360" y2="415" stroke="#aaaaaa"/><text x="30" y="435" font-size="13" font-weight="normal" fill="#262626">· 全部分配行与准确Key/窗口/返回上下文</text><rect x="16" y="465" width="358" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="491" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="520" x2="360" y2="520" stroke="#aaaaaa"/><text x="30" y="540" font-size="13" font-weight="normal" fill="#262626">· 不改份额算法、确认或写入时机。</text><rect x="16" y="570" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="596" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="625" x2="360" y2="625" stroke="#aaaaaa"/><text x="30" y="645" font-size="13" font-weight="normal" fill="#262626">· 额度未知不补零；关闭池保持独立确认和既有并</text><text x="40" y="665" font-size="13" font-weight="normal" fill="#262626">发 / 幂等边界。</text><text x="30" y="695" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机</text><text x="40" y="715" font-size="13" font-weight="normal" fill="#262626">全屏或单列，不堆叠窄抽屉。</text><rect x="16" y="745" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="768" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="184" y="745" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="768" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><text x="16" y="823" font-size="10" font-weight="normal" fill="#666666">subscription-shares · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
