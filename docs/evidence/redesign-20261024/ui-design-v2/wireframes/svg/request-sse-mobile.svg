<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1468" viewBox="0 0 390 1468" role="img" aria-labelledby="title desc"><title id="title">请求详情 · SSE · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">请求详情 · SSE</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/usage-logs/request/$requestId?tab=sse</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="252" font-size="13" font-weight="normal" fill="#262626">诊断</text><rect x="112" y="225" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="122" y="252" font-size="13" font-weight="normal" fill="#262626">正文</text><rect x="208" y="225" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="218" y="252" font-size="13" font-weight="600" fill="#262626">SSE</text><rect x="16" y="277" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="26" y="304" font-size="13" font-weight="normal" fill="#262626">原始</text><rect x="16.0" y="337" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="365" font-size="14" font-weight="600" fill="#262626">业务结果 未知</text><rect x="200.0" y="337" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="212.0" y="365" font-size="14" font-weight="600" fill="#262626">HTTP —</text><rect x="16.0" y="427" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="455" font-size="14" font-weight="600" fill="#262626">用量证据 未知</text><rect x="200.0" y="427" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="212.0" y="455" font-size="14" font-weight="600" fill="#262626">结算 未知</text><rect x="16" y="523" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="546" font-size="13" font-weight="600" fill="#262626">A1 返回列表</text><rect x="184" y="523" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="546" font-size="13" font-weight="normal" fill="#262626">A2 复制 Request ID</text><rect x="16" y="579" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="602" font-size="13" font-weight="normal" fill="#262626">A3 查看已存正文</text><rect x="16.0" y="643" width="358.0" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="669" font-size="16" font-weight="600" fill="#262626">事件流</text><line x1="30.0" y1="698" x2="360.0" y2="698" stroke="#aaaaaa"/><text x="30.0" y="718" font-size="13" font-weight="normal" fill="#262626">· 序号 / 相对时间</text><text x="30.0" y="748" font-size="13" font-weight="normal" fill="#262626">· 事件类型</text><text x="30.0" y="778" font-size="13" font-weight="normal" fill="#262626">· 展开事件数据</text><text x="30.0" y="808" font-size="13" font-weight="normal" fill="#262626">· 仅本地文本搜索</text><rect x="16.0" y="836" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="862" font-size="16" font-weight="600" fill="#262626">证据边界</text><line x1="30.0" y1="891" x2="360.0" y2="891" stroke="#aaaaaa"/><text x="30.0" y="911" font-size="13" font-weight="normal" fill="#262626">· 结束标记是否存在</text><text x="30.0" y="941" font-size="13" font-weight="normal" fill="#262626">· 业务错误与HTTP分开</text><text x="30.0" y="971" font-size="13" font-weight="normal" fill="#262626">· 缺失不推定成功</text><rect x="16" y="999" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1025" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1054" x2="360" y2="1054" stroke="#aaaaaa"/><text x="30" y="1074" font-size="13" font-weight="normal" fill="#262626">· 打开和切换页签只读取既有证据，绝不调用供应</text><text x="40" y="1094" font-size="13" font-weight="normal" fill="#262626">商或重放请求。</text><text x="30" y="1124" font-size="13" font-weight="normal" fill="#262626">· 正文只在既有权限允许时显示；禁止把上个用户/</text><text x="40" y="1144" font-size="13" font-weight="normal" fill="#262626">会话的内容作为加载占位。</text><rect x="16" y="1174" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1200" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1229" x2="360" y2="1229" stroke="#aaaaaa"/><text x="30" y="1249" font-size="13" font-weight="normal" fill="#262626">· Key 请求页与调用记录请求页复用同一详情内容</text><text x="40" y="1269" font-size="13" font-weight="normal" fill="#262626">；两个入口和返回上下文保留。</text><text x="30" y="1299" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1319" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1349" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1387" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1443" font-size="10" font-weight="normal" fill="#666666">request-sse · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
