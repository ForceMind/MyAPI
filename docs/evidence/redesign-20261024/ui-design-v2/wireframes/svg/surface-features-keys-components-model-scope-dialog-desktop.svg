<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="993" viewBox="0 0 1200 993" role="img" aria-labelledby="title desc"><title id="title">模型范围 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">模型范围</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：模型范围</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40" y="215" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="241" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="270" x2="1146" y2="270" stroke="#aaaaaa"/><text x="54" y="290" font-size="13" font-weight="normal" fill="#262626">· 模型模式 / 已保存 N ▾ / 原风险说明</text><text x="54" y="320" font-size="13" font-weight="normal" fill="#262626">· 目录搜索及原完整保存/取消</text><rect x="40" y="350" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="376" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="405" x2="1146" y2="405" stroke="#aaaaaa"/><text x="54" y="425" font-size="13" font-weight="normal" fill="#262626">· 全部可编辑已保存模型ID，包括旧ID/空ID</text><text x="54" y="455" font-size="13" font-weight="normal" fill="#262626">· 原逐项移除动作与受限模式规则</text><rect x="40" y="485" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="511" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="540" x2="1146" y2="540" stroke="#aaaaaa"/><text x="54" y="560" font-size="13" font-weight="normal" fill="#262626">· 折叠不清空/去重/修改draft.models；不隐藏模式或保存影响。</text><rect x="40" y="590" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="616" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="645" x2="1146" y2="645" stroke="#aaaaaa"/><text x="54" y="665" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="54" y="695" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐；不得因统一模板删去业务参数。</text><text x="54" y="725" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、影响及取消入口；若为编辑，错误就近显示并保留草稿。</text><rect x="40" y="755" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="781" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="810" x2="1146" y2="810" stroke="#aaaaaa"/><text x="54" y="830" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；确认语义与提交契约仍按各自业务保留。</text><text x="54" y="860" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="890" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="913" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="174" y="890" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="913" font-size="13" font-weight="normal" fill="#262626">A2 重试</text><rect x="302" y="890" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="312" y="913" font-size="13" font-weight="normal" fill="#262626">A3 重试加载目录</text><rect x="443" y="890" width="175" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="453" y="913" font-size="13" font-weight="normal" fill="#262626">A4 清除保留的模型列表</text><rect x="626" y="890" width="161" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="636" y="913" font-size="13" font-weight="normal" fill="#262626">A5 重新加载当前范围</text><rect x="795" y="890" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="805" y="913" font-size="13" font-weight="normal" fill="#262626">A6 保存模型范围</text><text x="40" y="968" font-size="10" font-weight="normal" fill="#666666">surface-features-keys-components-model-scope-dialog · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
