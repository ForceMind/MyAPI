<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1047" viewBox="0 0 1200 1047" role="img" aria-labelledby="title desc"><title id="title">请求详情 · 原始证据 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">请求详情 · 原始证据</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/usage-logs/request/$requestId?tab=raw</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="50" y="242" font-size="13" font-weight="normal" fill="#262626">诊断</text><rect x="136" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="146" y="242" font-size="13" font-weight="normal" fill="#262626">正文</text><rect x="232" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="242" y="242" font-size="13" font-weight="normal" fill="#262626">SSE</text><rect x="328" y="215" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="338" y="242" font-size="13" font-weight="600" fill="#262626">原始</text><rect x="40.0" y="275" width="272.5" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="52.0" y="303" font-size="14" font-weight="600" fill="#262626">业务结果 未知</text><rect x="322.5" y="275" width="272.5" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="334.5" y="303" font-size="14" font-weight="600" fill="#262626">HTTP —</text><rect x="605.0" y="275" width="272.5" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="617.0" y="303" font-size="14" font-weight="600" fill="#262626">用量证据 未知</text><rect x="887.5" y="275" width="272.5" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="899.5" y="303" font-size="14" font-weight="600" fill="#262626">结算 未知</text><rect x="40" y="371" width="120" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="394" font-size="13" font-weight="600" fill="#262626">A1 返回列表</text><rect x="168" y="371" width="154" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="178" y="394" font-size="13" font-weight="normal" fill="#262626">A2 复制 Request ID</text><rect x="330" y="371" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="340" y="394" font-size="13" font-weight="normal" fill="#262626">A3 查看已存正文</text><rect x="40.0" y="435" width="552.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="461" font-size="16" font-weight="600" fill="#262626">原始只读记录</text><line x1="54.0" y1="490" x2="578.0" y2="490" stroke="#aaaaaa"/><text x="54.0" y="510" font-size="13" font-weight="normal" fill="#262626">· 原始字段 / 元数据</text><text x="54.0" y="540" font-size="13" font-weight="normal" fill="#262626">· 来源与采集时间</text><text x="54.0" y="570" font-size="13" font-weight="normal" fill="#262626">· 脱敏与截断标识</text><rect x="608.0" y="435" width="552.0" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="622.0" y="461" font-size="16" font-weight="600" fill="#262626">完整分段原文〔明确打开后〕</text><line x1="622.0" y1="490" x2="1146.0" y2="490" stroke="#aaaaaa"/><text x="622.0" y="510" font-size="13" font-weight="normal" fill="#262626">· 请求 / 响应各自读取；每段解码后最多1 MiB，base64表示有编码开销</text><text x="622.0" y="540" font-size="13" font-weight="normal" fill="#262626">· 同请求版本 / 当前字节范围 / 已保存总量；采集完整性缺失仍为未知</text><text x="622.0" y="570" font-size="13" font-weight="normal" fill="#262626">· 首页 / 上一段 / 下一段；起始字节输入 + 跳转，不必逐页翻</text><text x="622.0" y="600" font-size="13" font-weight="normal" fill="#262626">· 复制当前段 / 换行 / 返回预览；旧16 MiB及SSE结构化预览能力保留</text><text x="622.0" y="630" font-size="13" font-weight="normal" fill="#262626">· 打开分段时替换该部分预览；关闭后恢复其状态与焦点</text><text x="622.0" y="660" font-size="13" font-weight="normal" fill="#262626">· 内容变更或轮转：保当前上下文并提示明确重读；换账号或权限失效不显示旧</text><text x="622.0" y="680" font-size="13" font-weight="normal" fill="#262626">正</text><text x="632.0" y="680" font-size="13" font-weight="normal" fill="#262626">文</text><rect x="40" y="708" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="734" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="763" x2="1146" y2="763" stroke="#aaaaaa"/><text x="54" y="783" font-size="13" font-weight="normal" fill="#262626">· 打开和切换页签只读取既有证据，绝不调用供应商或重放请求。</text><text x="54" y="813" font-size="13" font-weight="normal" fill="#262626">· 正文只在既有权限允许时显示；禁止把上个用户/会话的内容作为加载占位。</text><text x="54" y="843" font-size="13" font-weight="normal" fill="#262626">· 分段只读取已经保存的原始字节；不下载整日志、不重放请求，不把读到末尾当业务成功或已结算。</text><rect x="40" y="873" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="899" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="928" x2="1146" y2="928" stroke="#aaaaaa"/><text x="54" y="948" font-size="13" font-weight="normal" fill="#262626">· Key 请求页与调用记录请求页复用同一详情内容；两个入口和返回上下文保留。</text><text x="54" y="978" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1022" font-size="10" font-weight="normal" fill="#666666">request-raw · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
