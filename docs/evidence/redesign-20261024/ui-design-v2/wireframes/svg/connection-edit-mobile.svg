<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1506" viewBox="0 0 390 1506" role="img" aria-labelledby="title desc"><title id="title">添加 / 编辑连接 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">添加 / 编辑连接</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：添加 / 编辑连接</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">基本连接</text><rect x="199.0" y="225" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="250" font-size="12" font-weight="normal" fill="#262626">账户凭据</text><rect x="16.0" y="277" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="302" font-size="12" font-weight="normal" fill="#262626">模型与分组</text><rect x="199.0" y="277" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="302" font-size="12" font-weight="normal" fill="#262626">高级设置</text><text x="16" y="355" font-size="15" font-weight="600" fill="#262626">当前主分区 · 其余原字段按选中分区显示</text><text x="16.0" y="385" font-size="12" font-weight="600" fill="#262626">连接名称〔完整〕</text><rect x="16.0" y="394" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="421" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="479" font-size="12" font-weight="600" fill="#262626">供应商类型〔原选项〕</text><rect x="16.0" y="488" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="515" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="573" font-size="12" font-weight="600" fill="#262626">地址 / 接入方式</text><rect x="16.0" y="582" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="609" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="667" font-size="12" font-weight="600" fill="#262626">当前所需凭据字段</text><rect x="16.0" y="676" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="703" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="749" width="358" height="230" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="775" font-size="16" font-weight="600" fill="#262626">高级配置入口〔默认收起；错误自动展开</text><text x="30" y="798" font-size="16" font-weight="600" fill="#262626">〕</text><line x1="30" y1="827" x2="360" y2="827" stroke="#aaaaaa"/><text x="30" y="847" font-size="13" font-weight="normal" fill="#262626">· 已配置 N 组  ›  选路 / 参数 / 请求头 / 状态</text><text x="40" y="867" font-size="13" font-weight="normal" fill="#262626">码 / 透传</text><text x="30" y="897" font-size="13" font-weight="normal" fill="#262626">· 手机与桌面都能直达同一分区；不因优先级/权重</text><text x="40" y="917" font-size="13" font-weight="normal" fill="#262626">非0铺开全部内容</text><text x="30" y="947" font-size="13" font-weight="normal" fill="#262626">· 原保存、风险确认、取消、字段校验与返回焦点</text><text x="40" y="967" font-size="13" font-weight="normal" fill="#262626">保留</text><rect x="16" y="997" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1023" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="30" y1="1052" x2="360" y2="1052" stroke="#aaaaaa"/><text x="30" y="1072" font-size="13" font-weight="normal" fill="#262626">· 错误自动展开并定位，不折叠必填字段、金额或</text><text x="40" y="1092" font-size="13" font-weight="normal" fill="#262626">关键确认。</text><text x="30" y="1122" font-size="13" font-weight="normal" fill="#262626">· 字段、校验、草稿、凭据隔离、原API/写入顺序</text><text x="40" y="1142" font-size="13" font-weight="normal" fill="#262626">与不重放保持。</text><rect x="16" y="1172" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1198" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1227" x2="360" y2="1227" stroke="#aaaaaa"/><text x="30" y="1247" font-size="13" font-weight="normal" fill="#262626">· 把基本接入、路由和高级参数分组；保存与主动</text><text x="40" y="1267" font-size="13" font-weight="normal" fill="#262626">测试分开。</text><text x="30" y="1297" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机</text><text x="40" y="1317" font-size="13" font-weight="normal" fill="#262626">全屏或单列，不堆叠窄抽屉。</text><rect x="16" y="1347" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1370" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="184" y="1347" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1370" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><rect x="16" y="1403" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1426" font-size="13" font-weight="normal" fill="#262626">A3 编辑模型映射</text><text x="16" y="1481" font-size="10" font-weight="normal" fill="#666666">connection-edit · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
