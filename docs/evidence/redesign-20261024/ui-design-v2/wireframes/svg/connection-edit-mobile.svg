<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1174" viewBox="0 0 390 1174" role="img" aria-labelledby="title desc"><title id="title">添加 / 编辑连接 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">添加 / 编辑连接</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：添加 / 编辑连接</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="358" height="217" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="251" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="280" x2="360" y2="280" stroke="#aaaaaa"/><text x="30" y="300" font-size="13" font-weight="normal" fill="#262626">· 四主区导航：基本连接 / 账户凭据 / 模型与分</text><text x="40" y="320" font-size="13" font-weight="normal" fill="#262626">组 / 高级设置</text><text x="30" y="350" font-size="13" font-weight="normal" fill="#262626">· 当前任务字段完整显示，手机与桌面均可直达</text><text x="30" y="380" font-size="13" font-weight="normal" fill="#262626">· 高级配置：已配置组数 / 明确进入 · 不因普通p</text><text x="40" y="400" font-size="13" font-weight="normal" fill="#262626">riority/weight自动铺开</text><text x="30" y="430" font-size="13" font-weight="normal" fill="#262626">· 保存 / 取消与错误摘要保持可见</text><rect x="16" y="460" width="358" height="187" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="486" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="515" x2="360" y2="515" stroke="#aaaaaa"/><text x="30" y="535" font-size="13" font-weight="normal" fill="#262626">· 高级子区：选路、参数/请求头/状态码覆盖、透</text><text x="40" y="555" font-size="13" font-weight="normal" fill="#262626">传、供应商字段、上游自动化</text><text x="30" y="585" font-size="13" font-weight="normal" fill="#262626">· 发现模型N与完整已保存ID按需展开</text><text x="30" y="615" font-size="13" font-weight="normal" fill="#262626">· OAuth/本地导入、多Key、Ollama等原入口与确认</text><text x="40" y="635" font-size="13" font-weight="normal" fill="#262626">完整保留</text><rect x="16" y="665" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="691" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="720" x2="360" y2="720" stroke="#aaaaaa"/><text x="30" y="740" font-size="13" font-weight="normal" fill="#262626">· 错误自动展开并定位，不折叠必填字段、金额或</text><text x="40" y="760" font-size="13" font-weight="normal" fill="#262626">关键确认。</text><text x="30" y="790" font-size="13" font-weight="normal" fill="#262626">· 字段、校验、草稿、凭据隔离、原API/写入顺序</text><text x="40" y="810" font-size="13" font-weight="normal" fill="#262626">与不重放保持。</text><rect x="16" y="840" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="866" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="895" x2="360" y2="895" stroke="#aaaaaa"/><text x="30" y="915" font-size="13" font-weight="normal" fill="#262626">· 把基本接入、路由和高级参数分组；保存与主动</text><text x="40" y="935" font-size="13" font-weight="normal" fill="#262626">测试分开。</text><text x="30" y="965" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机</text><text x="40" y="985" font-size="13" font-weight="normal" fill="#262626">全屏或单列，不堆叠窄抽屉。</text><rect x="16" y="1015" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1038" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="184" y="1015" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1038" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><rect x="16" y="1071" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1094" font-size="13" font-weight="normal" fill="#262626">A3 编辑模型映射</text><text x="16" y="1149" font-size="10" font-weight="normal" fill="#666666">connection-edit · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
