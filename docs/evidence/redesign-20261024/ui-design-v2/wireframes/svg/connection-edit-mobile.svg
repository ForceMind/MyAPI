<svg xmlns="http://www.w3.org/2000/svg" width="390" height="974" viewBox="0 0 390 974" role="img" aria-labelledby="title desc"><title id="title">添加 / 编辑连接 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">添加 / 编辑连接</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：添加 / 编辑连接</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="358" height="167" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="251" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="280" x2="360" y2="280" stroke="#aaaaaa"/><text x="30" y="300" font-size="13" font-weight="normal" fill="#262626">· 原全部编辑字段 / 错误 / 保存操作</text><text x="30" y="330" font-size="13" font-weight="normal" fill="#262626">· 发现模型：状态 / 观察时间 / 过期提示 / 显式</text><text x="40" y="350" font-size="13" font-weight="normal" fill="#262626">刷新</text><text x="30" y="380" font-size="13" font-weight="normal" fill="#262626">· 发现模型 N ▾</text><rect x="16" y="410" width="358" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="436" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="465" x2="360" y2="465" stroke="#aaaaaa"/><text x="30" y="485" font-size="13" font-weight="normal" fill="#262626">· 完整已发现模型名单；收起保留编辑草稿</text><rect x="16" y="515" width="358" height="107" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="541" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="570" x2="360" y2="570" stroke="#aaaaaa"/><text x="30" y="590" font-size="13" font-weight="normal" fill="#262626">· 展开不触发上游发现；刷新保持明确操作和原权</text><text x="40" y="610" font-size="13" font-weight="normal" fill="#262626">限。</text><rect x="16" y="640" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="666" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="695" x2="360" y2="695" stroke="#aaaaaa"/><text x="30" y="715" font-size="13" font-weight="normal" fill="#262626">· 把基本接入、路由和高级参数分组；保存与主动</text><text x="40" y="735" font-size="13" font-weight="normal" fill="#262626">测试分开。</text><text x="30" y="765" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机</text><text x="40" y="785" font-size="13" font-weight="normal" fill="#262626">全屏或单列，不堆叠窄抽屉。</text><rect x="16" y="815" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="838" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="184" y="815" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="838" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><rect x="16" y="871" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="894" font-size="13" font-weight="normal" fill="#262626">A3 编辑模型映射</text><text x="16" y="949" font-size="10" font-weight="normal" fill="#666666">connection-edit · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
