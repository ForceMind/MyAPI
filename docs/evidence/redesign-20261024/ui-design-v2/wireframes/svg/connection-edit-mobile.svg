<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1843" viewBox="0 0 390 1843" role="img" aria-labelledby="title desc"><title id="title">添加 / 编辑连接 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">添加 / 编辑连接</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：添加 / 编辑连接</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">基本连接</text><rect x="199.0" y="225" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="250" font-size="12" font-weight="normal" fill="#262626">账户凭据</text><rect x="16.0" y="277" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="302" font-size="12" font-weight="normal" fill="#262626">模型与分组</text><rect x="199.0" y="277" width="175.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="207.0" y="302" font-size="12" font-weight="normal" fill="#262626">高级设置</text><text x="16" y="355" font-size="15" font-weight="600" fill="#262626">当前主分区 · 其余原字段按选中分区显示</text><text x="16.0" y="385" font-size="12" font-weight="600" fill="#262626">连接名称〔完整〕</text><rect x="16.0" y="394" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="421" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="479" font-size="12" font-weight="600" fill="#262626">供应商类型〔原选项〕</text><rect x="16.0" y="488" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="515" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="573" font-size="12" font-weight="600" fill="#262626">地址 / 接入方式</text><rect x="16.0" y="582" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="609" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="667" font-size="12" font-weight="600" fill="#262626">当前所需凭据字段</text><rect x="16.0" y="676" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="703" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16.0" y="749" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="774" font-size="12" font-weight="normal" fill="#262626">模型与分组：已保存 N 项 ▾</text><rect x="16.0" y="801" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="826" font-size="12" font-weight="normal" fill="#262626">获取当前渠道模型〔明确点击〕</text><rect x="16" y="861" width="358" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="887" font-size="16" font-weight="600" fill="#262626">模型来源与草稿</text><line x1="30" y1="916" x2="360" y2="916" stroke="#aaaaaa"/><text x="30" y="936" font-size="13" font-weight="normal" fill="#262626">· 只从当前渠道本次获取结果选择，不按前缀/全局</text><text x="40" y="956" font-size="13" font-weight="normal" fill="#262626">目录填充</text><text x="30" y="986" font-size="13" font-weight="normal" fill="#262626">· 当前已保存ID、手工输入、映射与自定义预设保</text><text x="40" y="1006" font-size="13" font-weight="normal" fill="#262626">留；应用前可复核</text><text x="30" y="1036" font-size="13" font-weight="normal" fill="#262626">· 变更类型/地址/凭据后旧结果失效，失败和无列</text><text x="40" y="1056" font-size="13" font-weight="normal" fill="#262626">表能力明确提示</text><rect x="16" y="1086" width="358" height="230" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1112" font-size="16" font-weight="600" fill="#262626">高级配置入口〔默认收起；错误自动展开</text><text x="30" y="1135" font-size="16" font-weight="600" fill="#262626">〕</text><line x1="30" y1="1164" x2="360" y2="1164" stroke="#aaaaaa"/><text x="30" y="1184" font-size="13" font-weight="normal" fill="#262626">· 已配置 N 组  ›  选路 / 参数 / 请求头 / 状态</text><text x="40" y="1204" font-size="13" font-weight="normal" fill="#262626">码 / 透传</text><text x="30" y="1234" font-size="13" font-weight="normal" fill="#262626">· 手机与桌面都能直达同一分区；不因优先级/权重</text><text x="40" y="1254" font-size="13" font-weight="normal" fill="#262626">非0铺开全部内容</text><text x="30" y="1284" font-size="13" font-weight="normal" fill="#262626">· 原保存、风险确认、取消、字段校验与返回焦点</text><text x="40" y="1304" font-size="13" font-weight="normal" fill="#262626">保留</text><rect x="16" y="1334" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1360" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="30" y1="1389" x2="360" y2="1389" stroke="#aaaaaa"/><text x="30" y="1409" font-size="13" font-weight="normal" fill="#262626">· 错误自动展开并定位，不折叠必填字段、金额或</text><text x="40" y="1429" font-size="13" font-weight="normal" fill="#262626">关键确认。</text><text x="30" y="1459" font-size="13" font-weight="normal" fill="#262626">· 字段、校验、草稿、凭据隔离、原API/写入顺序</text><text x="40" y="1479" font-size="13" font-weight="normal" fill="#262626">与不重放保持。</text><rect x="16" y="1509" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1535" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1564" x2="360" y2="1564" stroke="#aaaaaa"/><text x="30" y="1584" font-size="13" font-weight="normal" fill="#262626">· 把基本接入、路由和高级参数分组；保存与主动</text><text x="40" y="1604" font-size="13" font-weight="normal" fill="#262626">测试分开。</text><text x="30" y="1634" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机</text><text x="40" y="1654" font-size="13" font-weight="normal" fill="#262626">全屏或单列，不堆叠窄抽屉。</text><rect x="16" y="1684" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1707" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="184" y="1684" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1707" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><rect x="16" y="1740" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1763" font-size="13" font-weight="normal" fill="#262626">A3 编辑模型映射</text><text x="16" y="1818" font-size="10" font-weight="normal" fill="#666666">connection-edit · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
