<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="918" viewBox="0 0 1200 918" role="img" aria-labelledby="title desc"><title id="title">用户订阅管理 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">用户订阅管理</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：用户订阅管理</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40" y="215" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="241" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="270" x2="1146" y2="270" stroke="#aaaaaa"/><text x="54" y="290" font-size="13" font-weight="normal" fill="#262626">· 准确用户名称 / ID · 读取失败与结果未确认常驻</text><text x="54" y="320" font-size="13" font-weight="normal" fill="#262626">· 默认订阅记录 · 当前 / 历史数量 · 有界分页</text><text x="54" y="350" font-size="13" font-weight="normal" fill="#262626">· 明确进入授予套餐 · 不混入记录列表首屏</text><rect x="40" y="380" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="406" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="435" x2="1146" y2="435" stroke="#aaaaaa"/><text x="54" y="455" font-size="13" font-weight="normal" fill="#262626">· 记录保原计划、来源、起止、用量、状态及取消/恢复/重置入口</text><text x="54" y="485" font-size="13" font-weight="normal" fill="#262626">· 授予套餐保选择草稿与原Add确认，切换不产生写入</text><text x="54" y="515" font-size="13" font-weight="normal" fill="#262626">· 所有原失败与结果未确认锁跨分区保留</text><rect x="40" y="545" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="571" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="600" x2="1146" y2="600" stroke="#aaaaaa"/><text x="54" y="620" font-size="13" font-weight="normal" fill="#262626">· 不合并不同套餐额度，不改变金额/Unknown/Unlimited语义。</text><text x="54" y="650" font-size="13" font-weight="normal" fill="#262626">· 保权限、原请求参数、确认和返回焦点；展示切换不自动授权或重试。</text><rect x="40" y="680" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="706" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="735" x2="1146" y2="735" stroke="#aaaaaa"/><text x="54" y="755" font-size="13" font-weight="normal" fill="#262626">· 历史、分配、停用、重置是明确分开的动作。</text><text x="54" y="785" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机全屏或单列，不堆叠窄抽屉。</text><rect x="40" y="815" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="838" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="174" y="815" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="838" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><text x="40" y="893" font-size="10" font-weight="normal" fill="#666666">user-subscriptions · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
