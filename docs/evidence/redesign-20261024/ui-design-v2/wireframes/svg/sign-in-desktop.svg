<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="716" viewBox="0 0 1200 716" role="img" aria-labelledby="title desc"><title id="title">登录 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">文档 / 登录 / 控制台</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">登录</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/sign-in</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><text x="40" y="233" font-size="15" font-weight="600" fill="#262626">当前任务字段</text><text x="40.0" y="263" font-size="12" font-weight="600" fill="#262626">用户名 / 邮箱</text><rect x="40.0" y="272" width="554.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="606.0" y="263" font-size="12" font-weight="600" fill="#262626">密码</text><rect x="606.0" y="272" width="554.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="616.0" y="299" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40.0" y="345" width="1120.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="371" font-size="16" font-weight="600" fill="#262626">其他登录方式</text><line x1="54.0" y1="400" x2="1146.0" y2="400" stroke="#aaaaaa"/><text x="54.0" y="420" font-size="13" font-weight="normal" fill="#262626">· Passkey</text><text x="54.0" y="450" font-size="13" font-weight="normal" fill="