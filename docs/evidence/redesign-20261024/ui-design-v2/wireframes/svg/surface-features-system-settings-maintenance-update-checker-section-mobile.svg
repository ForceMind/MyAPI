<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1190" viewBox="0 0 390 1190" role="img" aria-labelledby="title desc"><title id="title">有新版本可用：{{version}} / 版本详情 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">有新版本可用：{{version}} / </text><text x="16" y="125" font-size="22" font-weight="600" fill="#262626">版本详情</text><text x="16" y="160" font-size="11" font-weight="normal" fill="#666666">弹层：有新版本可用：{{version}} / 版本详情</text><rect x="16" y="176" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="198" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="217" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="254" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="276" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原</text><text x="28" y="295" font-size="12" font-weight="normal" fill="#262626">列表并恢复焦点。</text><text x="16" y="350" font-size="15" font-weight="600" fill="#262626">任务字段 / 当前证据</text><text x="16.0" y="380" font-size="12" font-weight="600" fill="#262626">作用对象 / 范围</text><rect x="16.0" y="389" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="416" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="474" font-size="12" font-weight="600" fill="#262626">当前值或已存证据</text><rect x="16.0" y="483" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="510" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="568" font-size="12" font-weight="600" fill="#262626">明确动作与影响说明</text><rect x="16.0" y="577" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="604" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="650" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="676" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="705" x2="360" y2="705" stroke="#aaaaaa"/><text x="30" y="725" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="745" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="775" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="795" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="825" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="845" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="865" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="895" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="921" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="950" x2="360" y2="950" stroke="#aaaaaa"/><text x="30" y="970" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="990" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="1020" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1040" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1070" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1093" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="184" y="1070" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1093" font-size="13" font-weight="normal" fill="#262626">A2 打开版本</text><text x="16" y="1148" font-size="10" font-weight="normal" fill="#666666">surface-features-system-settings-maintenance-update-checker-sec</text><text x="16" y="1165" font-size="10" font-weight="normal" fill="#666666">tion · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
