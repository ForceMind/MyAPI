<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1784" viewBox="0 0 390 1784" role="img" aria-labelledby="title desc"><title id="title">分组详情 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">分组详情</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：分组详情</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">准确分组 / Overview〔常驻〕</text><rect x="16.0" y="277" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="302" font-size="12" font-weight="normal" fill="#262626">入向覆盖 N ▾</text><rect x="16.0" y="329" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="354" font-size="12" font-weight="normal" fill="#262626">出向覆盖 N ▾</text><rect x="16.0" y="381" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="406" font-size="12" font-weight="normal" fill="#262626">可见关系 N ▾</text><text x="16" y="459" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="16.0" y="489" font-size="12" font-weight="600" fill="#262626">基础倍率 / 充值倍率 / 原说明</text><rect x="16.0" y="498" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="525" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="583" font-size="12" font-weight="600" fill="#262626">不可选状态 / 自动分配顺序</text><rect x="16.0" y="592" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="619" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="677" font-size="12" font-weight="600" fill="#262626">所有Hidden与danger关系〔常驻〕</text><rect x="16.0" y="686" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="713" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="759" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="785" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="30" y1="814" x2="360" y2="814" stroke="#aaaaaa"/><text x="30" y="834" font-size="13" font-weight="normal" fill="#262626">· 空关系保None、短列表原样，长已知数组数量摘</text><text x="40" y="854" font-size="13" font-weight="normal" fill="#262626">要</text><text x="30" y="884" font-size="13" font-weight="normal" fill="#262626">· 非法 / 非finite倍率与隐藏关系不收起</text><rect x="16" y="914" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="940" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="30" y1="969" x2="360" y2="969" stroke="#aaaaaa"/><text x="30" y="989" font-size="13" font-weight="normal" fill="#262626">· 展开完整双方组名、方向、原倍率和原顺序</text><text x="30" y="1019" font-size="13" font-weight="normal" fill="#262626">· 仅visible=true长关系列表可折，不改变布尔含</text><text x="40" y="1039" font-size="13" font-weight="normal" fill="#262626">义</text><rect x="16" y="1069" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1095" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="30" y1="1124" x2="360" y2="1124" stroke="#aaaaaa"/><text x="30" y="1144" font-size="13" font-weight="normal" fill="#262626">· 不解析 / 归一化 / 重写JSON、倍率、CAS或保存</text><text x="40" y="1164" font-size="13" font-weight="normal" fill="#262626">逻辑。</text><text x="30" y="1194" font-size="13" font-weight="normal" fill="#262626">· 展开零onChange / 零HTTP，换对象不继承旧展开</text><text x="40" y="1214" font-size="13" font-weight="normal" fill="#262626">，保返回焦点。</text><rect x="16" y="1244" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1270" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1299" x2="360" y2="1299" stroke="#aaaaaa"/><text x="30" y="1319" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="1339" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="1369" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="1389" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="1419" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="1439" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="1459" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="1489" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1515" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1544" x2="360" y2="1544" stroke="#aaaaaa"/><text x="30" y="1564" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="1584" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="1614" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1634" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1664" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1687" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="184" y="1664" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1687" font-size="13" font-weight="normal" fill="#262626">A2 确认当前动作</text><text x="16" y="1742" font-size="10" font-weight="normal" fill="#666666">surface-features-system-settings-models-group-ratio-visual-edit</text><text x="16" y="1759" font-size="10" font-weight="normal" fill="#666666">or-3 · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
