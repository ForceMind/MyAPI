<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1172" viewBox="0 0 1200 1172" role="img" aria-labelledby="title desc"><title id="title">渠道工作区 · 额度证据 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">渠道工作区 · 额度证据</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/channels#channel-evidence</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="240" font-size="12" font-weight="normal" fill="#262626">渠道库</text><rect x="322.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="330.0" y="240" font-size="12" font-weight="normal" fill="#262626">额度证据</text><rect x="604.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="240" font-size="12" font-weight="normal" fill="#262626">全部事件</text><rect x="886.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="894.0" y="240" font-size="12" font-weight="normal" fill="#262626">路由预览</text><rect x="40.0" y="275" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="300" font-size="12" font-weight="normal" fill="#262626">返回渠道库</text><rect x="604.0" y="275" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="300" font-size="12" font-weight="normal" fill="#262626">当前范围：明确对象 / 全部渠道</text><rect x="40.0" y="335" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="360" font-size="12" font-weight="normal" fill="#262626">原时间范围 / 日期</text><rect x="416.0" y="335" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="424.0" y="360" font-size="12" font-weight="normal" fill="#262626">窗口 / 状态筛选</text><rect x="792.0" y="335" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="800.0" y="360" font-size="12" font-weight="normal" fill="#262626">刷新保存证据</text><rect x="40" y="395" width="270" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="421" font-size="16" font-weight="600" fill="#262626">账户窗口目录</text><line x1="54" y1="450" x2="296" y2="450" stroke="#aaaaaa"/><text x="54" y="470" font-size="13" font-weight="normal" fill="#262626">· 明确账号 / 窗口 / 观察状态</text><text x="54" y="500" font-size="13" font-weight="normal" fill="#262626">· 合成窗口A · 未知</text><text x="54" y="530" font-size="13" font-weight="normal" fill="#262626">· 合成窗口B · 读取失败仍可选</text><rect x="326" y="395" width="834" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="340" y="421" font-size="16" font-weight="600" fill="#262626">请选择账户窗口 · 未自动读明细</text><line x1="340" y1="450" x2="1146" y2="450" stroke="#aaaaaa"/><text x="340" y="470" font-size="13" font-weight="normal" fill="#262626">· 选择后才读取精确series历史，原来源/单位/币种/计划不混加</text><text x="340" y="500" font-size="13" font-weight="normal" fill="#262626">· 图表与原指标/方法/时间参数完整保留</text><text x="340" y="530" font-size="13" font-weight="normal" fill="#262626">· 目标渠道没有证据：明确提示，不展示另一个渠道</text><rect x="326" y="560" width="834" height="150" rx="5" fill="#fafafa" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="344" y="635" font-size="13" font-weight="normal" fill="#262626">选中后的图表 / 数值表占位 · 无合成消耗曲线</text><rect x="40" y="728" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="754" font-size="16" font-weight="600" fill="#262626">状态与返回边界</text><line x1="54" y1="783" x2="1146" y2="783" stroke="#aaaaaa"/><text x="54" y="803" font-size="13" font-weight="normal" fill="#262626">· 进入才读取已保存数据，选中才读明细；离开停止页面轮询，后台采样不改。</text><text x="54" y="833" font-size="13" font-weight="normal" fill="#262626">· quotaChannelId找不到时明确无目标证据，不自动替换成另一个渠道。</text><text x="54" y="863" font-size="13" font-weight="normal" fill="#262626">· 关闭后已知错误/不完整仍在入口摘要，未读取不显示0或健康。</text><rect x="40" y="893" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="919" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="948" x2="1146" y2="948" stroke="#aaaaaa"/><text x="54" y="968" font-size="13" font-weight="normal" fill="#262626">· 同一路由的显式任务视图，不新建路由或调用模型。</text><rect x="40" y="998" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1024" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1053" x2="1146" y2="1053" stroke="#aaaaaa"/><text x="54" y="1073" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作；保留管理员渠道表格所需的高级列。</text><text x="54" y="1103" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1147" font-size="10" font-weight="normal" fill="#666666">channel-evidence-workspace · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
