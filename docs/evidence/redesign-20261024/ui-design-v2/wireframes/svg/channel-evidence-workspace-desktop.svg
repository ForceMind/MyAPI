<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1109" viewBox="0 0 1200 1109" role="img" aria-labelledby="title desc"><title id="title">渠道工作区 · 额度证据 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">渠道工作区 · 额度证据</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/channels#channel-evidence</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="50" y="242" font-size="13" font-weight="normal" fill="#262626">渠道库存</text><rect x="136" y="215" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="146" y="242" font-size="13" font-weight="600" fill="#262626">额度证据</text><rect x="232" y="215" width="108" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="242" y="242" font-size="13" font-weight="normal" fill="#262626">全部渠道事件</text><rect x="348" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="358" y="242" font-size="13" font-weight="normal" fill="#262626">路由预览</text><rect x="40" y="275" width="1120" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="301" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="330" x2="1146" y2="330" stroke="#aaaaaa"/><text x="54" y="350" font-size="13" font-weight="normal" fill="#262626">· 返回库存 · 额度证据 · 明确全渠道/目标渠道范围</text><text x="54" y="380" font-size="13" font-weight="normal" fill="#262626">· 原时间范围 / 自定义日期 / 窗口与状态筛选 / 刷新保存证据</text><text x="54" y="410" font-size="13" font-weight="normal" fill="#262626">· 桌面：系列目录 | 选中系列的趋势与完整证据</text><text x="54" y="440" font-size="13" font-weight="normal" fill="#262626">· 手机：对象选择 → 一份选中证据正文</text><text x="54" y="470" font-size="13" font-weight="normal" fill="#262626">· 失败/Unknown/来源不完整/采样关闭保持外露</text><rect x="40" y="500" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="526" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="555" x2="1146" y2="555" stroke="#aaaaaa"/><text x="54" y="575" font-size="13" font-weight="normal" fill="#262626">· 精确series的原current/previous/change/rate/status/source/单位/币种/plan/观察时间</text><text x="54" y="605" font-size="13" font-weight="normal" fill="#262626">· 原latest_interval/observed_window/ewma、rate_window、half-life、granularity、timezone</text><text x="54" y="635" font-size="13" font-weight="normal" fill="#262626">· 源limit2000/5000、source_complete/items_complete及图中断点不变</text><rect x="40" y="665" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="691" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="720" x2="1146" y2="720" stroke="#aaaaaa"/><text x="54" y="740" font-size="13" font-weight="normal" fill="#262626">· 进入才读取已保存数据，选中才读明细；离开停止页面轮询，后台采样不改。</text><text x="54" y="770" font-size="13" font-weight="normal" fill="#262626">· quotaChannelId找不到时明确无目标证据，不自动替换成另一个渠道。</text><text x="54" y="800" font-size="13" font-weight="normal" fill="#262626">· 关闭后已知错误/不完整仍在入口摘要，未读取不显示0或健康。</text><rect x="40" y="830" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="856" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="885" x2="1146" y2="885" stroke="#aaaaaa"/><text x="54" y="905" font-size="13" font-weight="normal" fill="#262626">· 同一路由的显式任务视图，不新建路由或调用模型。</text><rect x="40" y="935" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="961" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="990" x2="1146" y2="990" stroke="#aaaaaa"/><text x="54" y="1010" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作；保留管理员渠道表格所需的高级列。</text><text x="54" y="1040" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1084" font-size="10" font-weight="normal" fill="#666666">channel-evidence-workspace · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
