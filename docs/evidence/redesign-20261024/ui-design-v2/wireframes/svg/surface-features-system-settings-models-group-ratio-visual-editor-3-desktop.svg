<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1213" viewBox="0 0 1200 1213" role="img" aria-labelledby="title desc"><title id="title">分组详情 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">分组详情</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：分组详情</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="240" font-size="12" font-weight="normal" fill="#262626">准确分组 / Overview〔常驻〕</text><rect x="322.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="330.0" y="240" font-size="12" font-weight="normal" fill="#262626">入向覆盖 N ▾</text><rect x="604.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="240" font-size="12" font-weight="normal" fill="#262626">出向覆盖 N ▾</text><rect x="886.0" y="215" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="894.0" y="240" font-size="12" font-weight="normal" fill="#262626">可见关系 N ▾</text><text x="40" y="293" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="40.0" y="323" font-size="12" font-weight="600" fill="#262626">基础倍率 / 充值倍率 / 原说明</text><rect x="40.0" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="323" font-size="12" font-weight="600" fill="#262626">不可选状态 / 自动分配顺序</text><rect x="417.3333333333333" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="323" font-size="12" font-weight="600" fill="#262626">所有Hidden与danger关系〔常驻〕</text><rect x="794.6666666666666" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="405" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="431" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="54" y1="460" x2="1146" y2="460" stroke="#aaaaaa"/><text x="54" y="480" font-size="13" font-weight="normal" fill="#262626">· 空关系保None、短列表原样，长已知数组数量摘要</text><text x="54" y="510" font-size="13" font-weight="normal" fill="#262626">· 非法 / 非finite倍率与隐藏关系不收起</text><rect x="40" y="540" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="566" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="54" y1="595" x2="1146" y2="595" stroke="#aaaaaa"/><text x="54" y="615" font-size="13" font-weight="normal" fill="#262626">· 展开完整双方组名、方向、原倍率和原顺序</text><text x="54" y="645" font-size="13" font-weight="normal" fill="#262626">· 仅visible=true长关系列表可折，不改变布尔含义</text><rect x="40" y="675" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="701" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="54" y1="730" x2="1146" y2="730" stroke="#aaaaaa"/><text x="54" y="750" font-size="13" font-weight="normal" fill="#262626">· 不解析 / 归一化 / 重写JSON、倍率、CAS或保存逻辑。</text><text x="54" y="780" font-size="13" font-weight="normal" fill="#262626">· 展开零onChange / 零HTTP，换对象不继承旧展开，保返回焦点。</text><rect x="40" y="810" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="836" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="865" x2="1146" y2="865" stroke="#aaaaaa"/><text x="54" y="885" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="54" y="915" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐；不得因统一模板删去业务参数。</text><text x="54" y="945" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、影响及取消入口；若为编辑，错误就近显示并保留草稿。</text><rect x="40" y="975" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1001" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1030" x2="1146" y2="1030" stroke="#aaaaaa"/><text x="54" y="1050" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；确认语义与提交契约仍按各自业务保留。</text><text x="54" y="1080" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="1110" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="1133" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="174" y="1110" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="1133" font-size="13" font-weight="normal" fill="#262626">A2 确认当前动作</text><text x="40" y="1188" font-size="10" font-weight="normal" fill="#666666">surface-features-system-settings-models-group-ratio-visual-editor-3 · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
