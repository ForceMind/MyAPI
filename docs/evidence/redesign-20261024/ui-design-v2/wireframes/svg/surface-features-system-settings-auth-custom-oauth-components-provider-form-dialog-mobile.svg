<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2768" viewBox="0 0 390 2768" role="img" aria-labelledby="title desc"><title id="title">编辑 OAuth 提供商 / 添加 OAuth 提供商 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">编辑 OAuth 提供商 / 添加 OAut</text><text x="16" y="125" font-size="22" font-weight="600" fill="#262626">h 提供商</text><text x="16" y="160" font-size="11" font-weight="normal" fill="#666666">弹层：编辑 OAuth 提供商 / 添加 OAuth 提供商</text><rect x="16" y="176" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="198" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="217" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="254" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="276" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原</text><text x="28" y="295" font-size="12" font-weight="normal" fill="#262626">列表并恢复焦点。</text><text x="16" y="350" font-size="15" font-weight="600" fill="#262626">任务字段 / 当前证据</text><text x="16.0" y="380" font-size="12" font-weight="600" fill="#262626">已启用</text><rect x="16.0" y="389" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="416" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="474" font-size="12" font-weight="600" fill="#262626">提供商名称</text><rect x="16.0" y="483" width="358.0" height="44" rx="5