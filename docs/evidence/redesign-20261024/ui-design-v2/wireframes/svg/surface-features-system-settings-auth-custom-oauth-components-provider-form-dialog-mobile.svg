e="#999999"/><text x="26.0" y="1920" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="1978" font-size="12" font-weight="600" fill="#262626">访问被拒绝消息</text><rect x="16.0" y="1987" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="2014" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="2060" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2086" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="2115" x2="360" y2="2115" stroke="#aaaaaa"/><text x="30" y="2135" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="2155" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="2185" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="2205" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="2235" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="2255" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="2275" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="2305" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2331" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="2360" x2="360" y2="2360" stroke="#aaaaaa"/><text x="30" y="2380" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="2400" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="2430" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="2450" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="2480" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="2503" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="16" y="2536" width="217" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="2559" font-size="13" font-weight="normal" fill="#262626">A2 填充模板：等级和激活状态</text><rect x="16" y="2592" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="2615" font-size="13" font-weight="normal" fill="#262626">A3 填充模板：组织或角色</text><rect x="16" y="2648" width="175" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="2671" font-size="13" font-weight="normal" fill="#262626">A4 填充模板：等级提示</text><rect x="199" y="2648" width="175" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="209" y="2671" font-size="13" font-weight="normal" fill="#262626">A5 填充模板：组织提示</text><text x="16" y="2726" font-size="10" font-weight="normal" fill="#666666">surface-features-system-settings-auth-custom-oauth-components-p</text><text x="16" y="2743" font-size="10" font-weight="normal" fill="#666666">rovider-form-dialog · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
