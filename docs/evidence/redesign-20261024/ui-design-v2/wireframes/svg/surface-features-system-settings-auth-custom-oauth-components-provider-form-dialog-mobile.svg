<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2035" viewBox="0 0 390 2035" role="img" aria-labelledby="title desc"><title id="title">编辑 OAuth 提供商 / 添加 OAuth 提供商 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">编辑 OAuth 提供商 / 添加 OAut</text><text x="16" y="125" font-size="22" font-weight="600" fill="#262626">h 提供商</text><text x="16" y="160" font-size="11" font-weight="normal" fill="#666666">弹层：编辑 OAuth 提供商 / 添加 OAuth 提供商</text><rect x="16" y="176" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="198" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="217" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="254" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="279" font-size="12" font-weight="normal" fill="#262626">基本 / 凭据</text><rect x="16.0" y="306" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="331" font-size="12" font-weight="normal" fill="#262626">端点 N ▾</text><rect x="16.0" y="358" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="383" font-size="12" font-weight="normal" fill="#262626">字段映射 N ▾</text><rect x="16.0" y="410" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="435" font-size="12" font-weight="normal" fill="#262626">访问策略 / 高级 ▾</text><text x="16" y="488" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="16.0" y="518" font-size="12" font-weight="600" fill="#262626">提供方名称 / 标识</text><rect x="16.0" y="527" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="554" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="612" font-size="12" font-weight="600" fill="#262626">启用状态</text><rect x="16.0" y="621" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="648" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="706" font-size="12" font-weight="600" fill="#262626">Client ID / Secret〔仅原掩码及编辑规则〕</text><rect x="16.0" y="715" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="742" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="800" font-size="12" font-weight="600" fill="#262626">回调 URL〔原完整内容〕</text><rect x="16.0" y="809" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="836" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="882" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="908" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="30" y1="937" x2="360" y2="937" stroke="#aaaaaa"/><text x="30" y="957" font-size="13" font-weight="normal" fill="#262626">· 登录限制是否生效、配置状态与错误摘要常驻</text><text x="30" y="987" font-size="13" font-weight="normal" fill="#262626">· 必填基础与凭据不被高级配置淹没</text><rect x="16" y="1017" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1043" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="30" y1="1072" x2="360" y2="1072" stroke="#aaaaaa"/><text x="30" y="1092" font-size="13" font-weight="normal" fill="#262626">· 显式展开全部原端点、映射、策略字段</text><text x="30" y="1122" font-size="13" font-weight="normal" fill="#262626">· 原JSON / 模板 / Discovery / 取消和保存入口</text><text x="40" y="1142" font-size="13" font-weight="normal" fill="#262626">保留</text><rect x="16" y="1172" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1198" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="30" y1="1227" x2="360" y2="1227" stroke="#aaaaaa"/><text x="30" y="1247" font-size="13" font-weight="normal" fill="#262626">· Secret不进摘要；展开不自动Discovery或写入。</text><text x="30" y="1277" font-size="13" font-weight="normal" fill="#262626">· 错误自动展开原字段；不改OAuth协议、未知JSON</text><text x="40" y="1297" font-size="13" font-weight="normal" fill="#262626">或API载荷。</text><rect x="16" y="1327" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1353" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1382" x2="360" y2="1382" stroke="#aaaaaa"/><text x="30" y="1402" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="1422" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="1452" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="1472" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="1502" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="1522" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="1542" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="1572" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1598" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1627" x2="360" y2="1627" stroke="#aaaaaa"/><text x="30" y="1647" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="1667" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="1697" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1717" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1747" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1770" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="16" y="1803" width="217" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1826" font-size="13" font-weight="normal" fill="#262626">A2 填充模板：等级和激活状态</text><rect x="16" y="1859" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1882" font-size="13" font-weight="normal" fill="#262626">A3 填充模板：组织或角色</text><rect x="16" y="1915" width="175" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1938" font-size="13" font-weight="normal" fill="#262626">A4 填充模板：等级提示</text><rect x="199" y="1915" width="175" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="209" y="1938" font-size="13" font-weight="normal" fill="#262626">A5 填充模板：组织提示</text><text x="16" y="1993" font-size="10" font-weight="normal" fill="#666666">surface-features-system-settings-auth-custom-oauth-components-p</text><text x="16" y="2010" font-size="10" font-weight="normal" fill="#666666">rovider-form-dialog · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
