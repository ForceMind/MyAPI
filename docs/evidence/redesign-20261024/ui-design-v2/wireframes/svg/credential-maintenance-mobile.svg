<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1470" viewBox="0 0 390 1470" role="img" aria-labelledby="title desc"><title id="title">凭据维护 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">凭据维护</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：凭据维护</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">Key / 当前账户 / Root资格</text><rect x="16.0" y="277" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="302" font-size="12" font-weight="normal" fill="#262626">原轮换状态与入口</text><rect x="16.0" y="329" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="354" font-size="12" font-weight="normal" fill="#262626">idle迁移配置 N ▾</text><text x="16" y="407" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="16.0" y="437" font-size="12" font-weight="600" fill="#262626">轮换 / 迁移状态</text><rect x="16.0" y="446" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="473" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="531" font-size="12" font-weight="600" fill="#262626">全部blocker / unknown / 错误</text><rect x="16.0" y="540" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="567" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="625" font-size="12" font-weight="600" fill="#262626">原回执检查与恢复入口</text><rect x="16.0" y="634" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="661" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="707" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="733" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="30" y1="762" x2="360" y2="762" stroke="#aaaaaa"/><text x="30" y="782" font-size="13" font-weight="normal" fill="#262626">· 首屏保对象与所有风险，迁移idle配置显式进入</text><text x="30" y="812" font-size="13" font-weight="normal" fill="#262626">· 来源窗口缺失与未确认结果常驻，不被配置摘要</text><text x="40" y="832" font-size="13" font-weight="normal" fill="#262626">隐藏</text><rect x="16" y="862" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="888" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="30" y1="917" x2="360" y2="917" stroke="#aaaaaa"/><text x="30" y="937" font-size="13" font-weight="normal" fill="#262626">· 完整目标账户 / 窗口 / 分额草稿保挂载</text><text x="30" y="967" font-size="13" font-weight="normal" fill="#262626">· 进入预览、验证、提交或恢复后关键内容不允许</text><text x="40" y="987" font-size="13" font-weight="normal" fill="#262626">收起</text><rect x="16" y="1017" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1043" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="30" y1="1072" x2="360" y2="1072" stroke="#aaaaaa"/><text x="30" y="1092" font-size="13" font-weight="normal" fill="#262626">· 不改变phase、互斥写锁、窗口匹配、份额或恢复</text><text x="40" y="1112" font-size="13" font-weight="normal" fill="#262626">。</text><text x="30" y="1142" font-size="13" font-weight="normal" fill="#262626">· 保operation_id、preview_revision与proof；展</text><text x="40" y="1162" font-size="13" font-weight="normal" fill="#262626">开无额外请求。</text><rect x="16" y="1192" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1218" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1247" x2="360" y2="1247" stroke="#aaaaaa"/><text x="30" y="1267" font-size="13" font-weight="normal" fill="#262626">· 已验证的会话保护、精确单次写入、未知结果恢</text><text x="40" y="1287" font-size="13" font-weight="normal" fill="#262626">复和错误内容隔离不放宽。</text><text x="30" y="1317" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机</text><text x="40" y="1337" font-size="13" font-weight="normal" fill="#262626">全屏或单列，不堆叠窄抽屉。</text><rect x="16" y="1367" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1390" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="184" y="1367" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1390" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><text x="16" y="1445" font-size="10" font-weight="normal" fill="#666666">credential-maintenance · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
