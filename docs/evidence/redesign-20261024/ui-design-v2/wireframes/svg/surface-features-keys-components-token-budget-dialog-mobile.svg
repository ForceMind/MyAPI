<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1734" viewBox="0 0 390 1734" role="img" aria-labelledby="title desc"><title id="title">API Key 用量预算 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">API Key 用量预算</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：API Key 用量预算</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">预算主表单〔常驻〕</text><rect x="16.0" y="277" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="302" font-size="12" font-weight="normal" fill="#262626">适用范围 / 统计说明 ▾</text><text x="16" y="355" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="16.0" y="385" font-size="12" font-weight="600" fill="#262626">当前Token / USD模式与单位</text><rect x="16.0" y="394" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="421" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="479" font-size="12" font-weight="600" fill="#262626">已用 / 预留 / 上限 / pending</text><rect x="16.0" y="488" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="515" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="573" font-size="12" font-weight="600" fill="#262626">严格Chat 1,050,000保留上界警告</text><rect x="16.0" y="582" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="609" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="667" font-size="12" font-weight="600" fill="#262626">未知用量 / 恢复表单 / 错误</text><rect x="16.0" y="676" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="703" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="749" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="775" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="30" y1="804" x2="360" y2="804" stroke="#aaaaaa"/><text x="30" y="824" font-size="13" font-weight="normal" fill="#262626">· 合并重复协议说明，保主任务和资金模式区别</text><text x="30" y="854" font-size="13" font-weight="normal" fill="#262626">· 时效证据、互斥条件与安全上限常驻</text><rect x="16" y="884" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="910" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="30" y1="939" x2="360" y2="939" stroke="#aaaaaa"/><text x="30" y="959" font-size="13" font-weight="normal" fill="#262626">· 详细资格 / 协议字段 / 统计起点完整可达</text><text x="30" y="989" font-size="13" font-weight="normal" fill="#262626">· 原Supported request fields详情入口保留</text><rect x="16" y="1019" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1045" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="30" y1="1074" x2="360" y2="1074" stroke="#aaaaaa"/><text x="30" y="1094" font-size="13" font-weight="normal" fill="#262626">· 不改变Token整数、USD小数原字符串、BPS、时效</text><text x="40" y="1114" font-size="13" font-weight="normal" fill="#262626">和上限。</text><text x="30" y="1144" font-size="13" font-weight="normal" fill="#262626">· 保body.id、expected_revision、request_id和</text><text x="40" y="1164" font-size="13" font-weight="normal" fill="#262626">证据；未知不补零。</text><rect x="16" y="1194" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1220" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1249" x2="360" y2="1249" stroke="#aaaaaa"/><text x="30" y="1269" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="1289" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="1319" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="1339" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="1369" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="1389" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="1409" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="1439" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1465" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1494" x2="360" y2="1494" stroke="#aaaaaa"/><text x="30" y="1514" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="1534" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="1564" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1584" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1614" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1637" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="184" y="1614" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1637" font-size="13" font-weight="normal" fill="#262626">A2 刷新</text><text x="16" y="1692" font-size="10" font-weight="normal" fill="#666666">surface-features-keys-components-token-budget-dialog · 手机390 </text><text x="16" y="1709" font-size="10" font-weight="normal" fill="#666666">· 来源 c916051e · 浏览器未验证</text></g></svg>
