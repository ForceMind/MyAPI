"54" y1="1251" x2="1146" y2="1251" stroke="#aaaaaa"/><text x="54" y="1271" font-size="13" font-weight="normal" fill="#262626">· 与连接卡片共用筛选、对象详情、编辑器和动作；保留管理员渠道表格所需的高级列。</text><text x="54" y="1301" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1345" font-size="10" font-weight="normal" fill="#666666">channel-events-workspace · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
