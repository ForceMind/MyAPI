<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">外部登录提供方 · GitHub · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。管理员 / Root按既有设置权限，Lite按既有能力裁剪</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">外部登录提供方 · GitHub</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/system-settings/auth/oauth〔github〕</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="50" y="242" font-size="13" font-weight="600" fill="#262626">GitHub</text><rect x="136" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="146" y="242" font-size="13" font-weight="normal" fill="#262626">Discord</text><rect x="232" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="242" y="242" font-size="13" font-weight="normal" fill="#262626">OIDC</text><rect x="328" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="338" y="242" font-size="13" font-weight="normal" fill="#262626">Telegram</text><rect x="424" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="434" y="242" font-size="13" font-weight="normal" fill="#262626">LinuxDO</text><rect x="520" y="215" width="88" height="4