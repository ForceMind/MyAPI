<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1443" viewBox="0 0 390 1443" role="img" aria-labelledby="title desc"><title id="title">主题设置 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">主题设置</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：主题设置</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / </text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">不执行业务动作</text><rect x="16" y="225" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="247" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原</text><text x="28" y="266" font-size="12" font-weight="normal" fill="#262626">列表并恢复焦点。</text><text x="16" y="321" font-size="15" font-weight="600" fill="#262626">任务字段 / 当前证据</text><text x="16.0" y="351" font-size="12" font-weight="600" fill="#262626">主题 / 浅暗偏好</text><rect x="16.0" y="360" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="387" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="445" font-size="12" font-weight="600" fill="#262626">颜色预设</text><rect x="16.0" y="454" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="481" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="539" font-size="12" font-weight="600" fill="#262626">字体与字号</text><rect x="16.0" y="548" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="575" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="633" font-size="12" font-weight="600" fill="#262626">圆角 / 密度</text><rect x="16.0" y="642" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="669" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="727" font-size="12" font-weight="600" fill="#262626">内容宽度</text><rect x="16.0" y="736" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="763" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="821" font-size="12" font-weight="600" fill="#262626">方向与恢复默认</text><rect x="16.0" y="830" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="857" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="903" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="929" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="958" x2="360" y2="958" stroke="#aaaaaa"/><text x="30" y="978" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="998" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="1028" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="1048" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="1078" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="1098" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="1118" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="1148" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1174" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1203" x2="360" y2="1203" stroke="#aaaaaa"/><text x="30" y="1223" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="1243" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="1273" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1293" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1323" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1346" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="184" y="1323" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1346" font-size="13" font-weight="normal" fill="#262626">A2 重置</text><text x="16" y="1401" font-size="10" font-weight="normal" fill="#666666">surface-components-config-drawer · 手机390 · 来源 c916051e · 浏</text><text x="16" y="1418" font-size="10" font-weight="normal" fill="#666666">览器未验证</text></g></svg>
