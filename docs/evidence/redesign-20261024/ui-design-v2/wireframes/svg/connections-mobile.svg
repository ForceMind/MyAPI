<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2479" viewBox="0 0 390 2479" role="img" aria-labelledby="title desc"><title id="title">连接 · 卡片视图 · 手机</title><desc id="desc">2026-11-07主线线稿增量，合成数据；不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">连接 · 卡片视图</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/connections</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">现另验 / 浏览器未验证</text><text x="16" y="243" font-size="15" font-weight="600" fill="#262626">查询与筛选</text><text x="16.0" y="273" font-size="12" font-weight="600" fill="#262626">名称 / 模型搜索</text><rect x="16.0" y="282" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="309" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="367" font-size="12" font-weight="600" fill="#262626">供应商</text><rect x="16.0" y="376" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="403" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="461" font-size="12" font-weight="600" fill="#262626">状态</text><rect x="16.0" y="470" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="497" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="555" font-size="12" font-weight="600" fill="#262626">优先级</text><rect x="16.0" y="564" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="591" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="637" width="161" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="660" font-size="13" font-weight="600" fill="#262626">A1 添加连接〔跳转〕</text><rect x="185" y="637" width="161" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="195" y="660" font-size="13" font-weight="normal" fill="#262626">A7 切换表格〔跳转〕</text><rect x="16" y="693" width="161" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="716" font-size="13" font-weight="normal" fill="#262626">A8 返回来源〔跳转〕</text><rect x="16" y="757" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="783" font-size="16" font-weight="600" fill="#262626">合成连接 A #7 · 默认收起</text><line x1="30" y1="812" x2="360" y2="812" stroke="#aaaaaa"/><text x="30" y="832" font-size="13" font-weight="normal" fill="#262626">· 原启用状态 / 待处理 / 失败 / 未知常驻</text><text x="30" y="862" font-size="13" font-weight="normal" fill="#262626">· 模型 8 ▾〔A2只读〕 · 分组 1 ▾〔A9只读〕</text><text x="30" y="892" font-size="13" font-weight="normal" fill="#262626">· 7天 / 5小时各自剩余 — · 来源 / 观察时间</text><text x="30" y="922" font-size="13" font-weight="normal" fill="#262626">· 优先级 9 / 权重 25 → A4原路由任务</text><text x="30" y="952" font-size="13" font-weight="normal" fill="#262626">· A5 启用切换〔原写入 / 忙保护〕</text><text x="30" y="982" font-size="13" font-weight="normal" fill="#262626">· A3 查看窗口〔只读跳转〕 · A6 测试〔确认任务</text><text x="40" y="1002" font-size="13" font-weight="normal" fill="#262626">〕</text><rect x="16" y="1032" width="358" height="297" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1058" font-size="16" font-weight="600" fill="#262626">同一连接 · A2明确展开后</text><line x1="30" y1="1087" x2="360" y2="1087" stroke="#aaaaaa"/><text x="30" y="1107" font-size="13" font-weight="normal" fill="#262626">· 模型8：完整模型ID逐项换行；保全部名称，不用</text><text x="40" y="1127" font-size="13" font-weight="normal" fill="#262626">前缀猜</text><text x="30" y="1157" font-size="13" font-weight="normal" fill="#262626">· 可复制完整已加载模型；不获取上游或读取密钥</text><text x="30" y="1187" font-size="13" font-weight="normal" fill="#262626">· 窗口：来源 / 观察时间 / 期限 / 单位 / 状态</text><text x="40" y="1207" font-size="13" font-weight="normal" fill="#262626">完整</text><text x="30" y="1237" font-size="13" font-weight="normal" fill="#262626">· 未知 / 无窗口 / 不支持 / 尚未获取 / 失败分</text><text x="40" y="1257" font-size="13" font-weight="normal" fill="#262626">开</text><text x="30" y="1287" font-size="13" font-weight="normal" fill="#262626">· 历史记录只读；不把历史错误当当前故障</text><text x="30" y="1317" font-size="13" font-weight="normal" fill="#262626">· 同排卡片自然高度，收起恢复A2焦点</text><rect x="16" y="1347" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1370" font-size="13" font-weight="normal" fill="#262626">A2 模型 N 展开〔只读〕</text><rect x="16" y="1403" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1426" font-size="13" font-weight="normal" fill="#262626">A3 查看窗口〔只读跳转〕</text><rect x="16" y="1459" width="224" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1482" font-size="13" font-weight="normal" fill="#262626">A4 优先级 / 权重〔编辑跳转〕</text><rect x="16" y="1515" width="175" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1538" font-size="13" font-weight="normal" fill="#262626">A5 启用切换〔原写入〕</text><rect x="16" y="1571" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1594" font-size="13" font-weight="normal" fill="#262626">A6 测试连接〔进入确认〕</text><rect x="16" y="1635" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1661" font-size="16" font-weight="600" fill="#262626">状态与写入边界</text><line x1="30" y1="1690" x2="360" y2="1690" stroke="#aaaaaa"/><text x="30" y="1710" font-size="13" font-weight="normal" fill="#262626">· 加载骨架 / 真空列表 / 失败与重读 / 未授权分</text><text x="40" y="1730" font-size="13" font-weight="normal" fill="#262626">别呈现；未知数量不补0</text><text x="30" y="1760" font-size="13" font-weight="normal" fill="#262626">· A4进入原编辑，原保存才写；取消保值，权限变</text><text x="40" y="1780" font-size="13" font-weight="normal" fill="#262626">化清私有内容</text><text x="30" y="1810" font-size="13" font-weight="normal" fill="#262626">· A5失败回已确认状态；未知结果只读核对，不自</text><text x="40" y="1830" font-size="13" font-weight="normal" fill="#262626">动重放写入</text><text x="30" y="1860" font-size="13" font-weight="normal" fill="#262626">· A6只有明确执行测试才联系上游，可能有用量；</text><text x="40" y="1880" font-size="13" font-weight="normal" fill="#262626">本线稿不执行</text><rect x="16" y="1910" width="358" height="257" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1936" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1965" x2="360" y2="1965" stroke="#aaaaaa"/><text x="30" y="1985" font-size="13" font-weight="normal" fill="#262626">· 卡片自然高度；一个展开不拉伸同排其他卡；手</text><text x="40" y="2005" font-size="13" font-weight="normal" fill="#262626">机单列、按钮44px、长模型ID换行。</text><text x="30" y="2035" font-size="13" font-weight="normal" fill="#262626">· 数量按钮使用准确已加载计数；未知不能显示0，</text><text x="40" y="2055" font-size="13" font-weight="normal" fill="#262626">展开与关闭保焦点且不触发写入。</text><text x="30" y="2085" font-size="13" font-weight="normal" fill="#262626">· 窗口百分比为合成占位，不代表供应商当前健康</text><text x="40" y="2105" font-size="13" font-weight="normal" fill="#262626">；不同窗口/单位/来源不相加。</text><text x="30" y="2135" font-size="13" font-weight="normal" fill="#262626">· 保存、开关、测试均沿原权限；身份或权限变化</text><text x="40" y="2155" font-size="13" font-weight="normal" fill="#262626">清除旧私有结果，失败与未知不能藏在收起区。</text><rect x="16" y="2185" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="2211" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="2240" x2="360" y2="2240" stroke="#aaaaaa"/><text x="30" y="2260" font-size="13" font-weight="normal" fill="#262626">· 连接与渠道不再表现成两套管理功能：卡片 / 表</text><text x="40" y="2280" font-size="13" font-weight="normal" fill="#262626">格是同一对象的两种视图；旧地址保留。</text><text x="30" y="2310" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="2330" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="2360" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="2398" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="2454" font-size="10" font-weight="normal" fill="#666666">connections · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
