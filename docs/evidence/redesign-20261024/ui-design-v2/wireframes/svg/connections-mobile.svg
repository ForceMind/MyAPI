<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1902" viewBox="0 0 390 1902" role="img" aria-labelledby="title desc"><title id="title">连接 · 卡片视图 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">连接 · 卡片视图</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/connections</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="253" font-size="14" font-weight="600" fill="#262626">连接 —</text><rect x="200.0" y="225" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="212.0" y="253" font-size="14" font-weight="600" fill="#262626">可用 —</text><rect x="16.0" y="315" width="174.0" height="80" rx="5" fill="#f7f7f7" stroke="#aaaaaa"/><text x="28.0" y="343" font-size="14" font-weight="600" fill="#262626">未知 —</text><text x="16" y="429" font-size="15" font-weight="600" fill="#262626">查询与筛选</text><text x="16.0" y="459" font-size="12" font-weight="600" fill="#262626">名称 / 模型搜索</text><rect x="16.0" y="468" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="495" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="553" font-size="12" font-weight="600" fill="#262626">供应商</text><rect x="16.0" y="562" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="589" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="647" font-size="12" font-weight="600" fill="#262626">状态</text><rect x="16.0" y="656" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="683" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="741" font-size="12" font-weight="600" fill="#262626">优先级</text><rect x="16.0" y="750" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="777" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="823" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="846" font-size="13" font-weight="600" fill="#262626">A1 添加连接</text><rect x="184" y="823" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="846" font-size="13" font-weight="normal" fill="#262626">A2 切换表格</text><rect x="16" y="879" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="902" font-size="13" font-weight="normal" fill="#262626">A3 查看连接</text><rect x="184" y="879" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="902" font-size="13" font-weight="normal" fill="#262626">A4 测试连接</text><rect x="16" y="943" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="969" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="998" x2="360" y2="998" stroke="#aaaaaa"/><text x="30" y="1018" font-size="13" font-weight="normal" fill="#262626">· 合成连接 A #7 · 使用中 · 启用开关</text><text x="30" y="1048" font-size="13" font-weight="normal" fill="#262626">· 7天剩余42% · 5小时剩余82%〔合成；未知不补零</text><text x="40" y="1068" font-size="13" font-weight="normal" fill="#262626">〕</text><text x="30" y="1098" font-size="13" font-weight="normal" fill="#262626">· 模型 8 ▾ · 分组 1 ▾ · 优先级 9 · 权重 25</text><text x="30" y="1128" font-size="13" font-weight="normal" fill="#262626">· 上次测试：已保存结果与时间摘要</text><text x="30" y="1158" font-size="13" font-weight="normal" fill="#262626">· 历史记录 1 ▾ · 查看 / 测试 / 编辑</text><rect x="16" y="1188" width="358" height="197" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1214" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="1243" x2="360" y2="1243" stroke="#aaaaaa"/><text x="30" y="1263" font-size="13" font-weight="normal" fill="#262626">· 模型8：完整模型ID逐项列出，可复制，不跳详情</text><text x="30" y="1293" font-size="13" font-weight="normal" fill="#262626">· 分组1：显示全部已保存分组</text><text x="30" y="1323" font-size="13" font-weight="normal" fill="#262626">· 窗口明细：每系列保留来源/时间/状态</text><text x="30" y="1353" font-size="13" font-weight="normal" fill="#262626">· 历史记录：完整原说明与身份不确定性；不标已</text><text x="40" y="1373" font-size="13" font-weight="normal" fill="#262626">解决</text><rect x="16" y="1403" width="358" height="187" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1429" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="1458" x2="360" y2="1458" stroke="#aaaaaa"/><text x="30" y="1478" font-size="13" font-weight="normal" fill="#262626">· 卡片自然高度，同排不因一个展开而等高拉伸。</text><text x="30" y="1508" font-size="13" font-weight="normal" fill="#262626">· 当前故障/额度未知始终可见；未接入能力不能凭</text><text x="40" y="1528" font-size="13" font-weight="normal" fill="#262626">历史失败推断。</text><text x="30" y="1558" font-size="13" font-weight="normal" fill="#262626">· 模型/历史展开只读已加载数据，不测试、不刷新</text><text x="40" y="1578" font-size="13" font-weight="normal" fill="#262626">、不读取密钥。</text><rect x="16" y="1608" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1634" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1663" x2="360" y2="1663" stroke="#aaaaaa"/><text x="30" y="1683" font-size="13" font-weight="normal" fill="#262626">· 连接与渠道不再表现成两套管理功能：卡片 / 表</text><text x="40" y="1703" font-size="13" font-weight="normal" fill="#262626">格是同一对象的两种视图；旧地址保留。</text><text x="30" y="1733" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1753" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="0" y="1783" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1821" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1877" font-size="10" font-weight="normal" fill="#666666">connections · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
