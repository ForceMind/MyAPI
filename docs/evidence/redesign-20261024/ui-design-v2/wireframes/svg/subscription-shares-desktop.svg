<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="798" viewBox="0 0 1200 798" role="img" aria-labelledby="title desc"><title id="title">订阅窗口分额 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">订阅窗口分额</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：订阅窗口分额</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40" y="215" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="241" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="270" x2="1146" y2="270" stroke="#aaaaaa"/><text x="54" y="290" font-size="13" font-weight="normal" fill="#262626">· 当前窗口 / 份额摘要 / 管理操作</text><text x="54" y="320" font-size="13" font-weight="normal" fill="#262626">· Key分配 N ▾ · 总分配 / 未分配</text><rect x="40" y="350" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="376" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="405" x2="1146" y2="405" stroke="#aaaaaa"/><text x="54" y="425" font-size="13" font-weight="normal" fill="#262626">· 全部分配行与准确Key/窗口/返回上下文</text><rect x="40" y="455" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="481" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="510" x2="1146" y2="510" stroke="#aaaaaa"/><text x="54" y="530" font-size="13" font-weight="normal" fill="#262626">· 不改份额算法、确认或写入时机。</text><rect x="40" y="560" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="586" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="615" x2="1146" y2="615" stroke="#aaaaaa"/><text x="54" y="635" font-size="13" font-weight="normal" fill="#262626">· 额度未知不补零；关闭池保持独立确认和既有并发 / 幂等边界。</text><text x="54" y="665" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机全屏或单列，不堆叠窄抽屉。</text><rect x="40" y="695" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="718" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="174" y="695" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="718" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><text x="40" y="773" font-size="10" font-weight="normal" fill="#666666">subscription-shares · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
