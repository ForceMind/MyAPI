<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1048" viewBox="0 0 1200 1048" role="img" aria-labelledby="title desc"><title id="title">创建 / 编辑用户 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">创建 / 编辑用户</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：创建 / 编辑用户</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="240" font-size="12" font-weight="normal" fill="#262626">基本资料</text><rect x="416.0" y="215" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="424.0" y="240" font-size="12" font-weight="normal" fill="#262626">管理员权限 N ▾</text><rect x="792.0" y="215" width="368.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="800.0" y="240" font-size="12" font-weight="normal" fill="#262626">只读绑定 N ▾</text><text x="40" y="293" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="40.0" y="323" font-size="12" font-weight="600" fill="#262626">准确用户 / ID</text><rect x="40.0" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="323" font-size="12" font-weight="600" fill="#262626">角色〔原Root资格〕</text><rect x="417.3333333333333" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="323" font-size="12" font-weight="600" fill="#262626">分组 / 名称 / 原必填字段</text><rect x="794.6666666666666" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="405" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="431" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="54" y1="460" x2="1146" y2="460" stroke="#aaaaaa"/><text x="54" y="480" font-size="13" font-weight="normal" fill="#262626">· 权限按资源显示已授予数与覆盖状态</text><text x="54" y="510" font-size="13" font-weight="normal" fill="#262626">· 绑定显示已配置项摘要，不重复铺开只读Input</text><rect x="40" y="540" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="566" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="54" y1="595" x2="1146" y2="595" stroke="#aaaaaa"/><text x="54" y="615" font-size="13" font-weight="normal" fill="#262626">· 明确展开原资源 / 动作矩阵，保全部权限位草稿</text><text x="54" y="645" font-size="13" font-weight="normal" fill="#262626">· 绑定明细完整只读，原保存与独立确认可达</text><rect x="40" y="675" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="701" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="54" y1="730" x2="1146" y2="730" stroke="#aaaaaa"/><text x="54" y="750" font-size="13" font-weight="normal" fill="#262626">· Root编辑资格、角色风险、读取失败 / 校验错误常驻。</text><text x="54" y="780" font-size="13" font-weight="normal" fill="#262626">· 折叠不改变值，展开不请求；原角色 / 权限载荷不变。</text><rect x="40" y="810" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="836" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="865" x2="1146" y2="865" stroke="#aaaaaa"/><text x="54" y="885" font-size="13" font-weight="normal" fill="#262626">· 角色变更与额度调整保留既有权限；不自动覆盖空密码。</text><text x="54" y="915" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机全屏或单列，不堆叠窄抽屉。</text><rect x="40" y="945" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="968" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="174" y="945" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="968" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><text x="40" y="1023" font-size="10" font-weight="normal" fill="#666666">user-edit · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
