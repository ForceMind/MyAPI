<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1306" viewBox="0 0 390 1306" role="img" aria-labelledby="title desc"><title id="title">部署详情 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">部署详情</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：部署详情</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16" y="225" width="358" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="251" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="30" y1="280" x2="360" y2="280" stroke="#aaaaaa"/><text x="30" y="300" font-size="13" font-weight="normal" fill="#262626">· 部署ID / 原状态 / 硬件 / GPU数常驻</text><text x="30" y="330" font-size="13" font-weight="normal" fill="#262626">· 容器数量：确知数量或Unknown；读取失败常驻</text><text x="30" y="360" font-size="13" font-weight="normal" fill="#262626">· 位置 N ▾ · 容器 N ▾；原始状态分布保留可见</text><rect x="16" y="390" width="358" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="416" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="30" y1="445" x2="360" y2="445" stroke="#aaaaaa"/><text x="30" y="465" font-size="13" font-weight="normal" fill="#262626">· 键盘或点击展开全部位置与完整容器ID</text><text x="30" y="495" font-size="13" font-weight="normal" fill="#262626">· 每个容器的原status与明确Open按钮保留</text><text x="30" y="525" font-size="13" font-weight="normal" fill="#262626">· Raw JSON沿原展开方式，不复制多份原始数据</text><rect x="16" y="555" width="358" height="137" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="581" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="30" y1="610" x2="360" y2="610" stroke="#aaaaaa"/><text x="30" y="630" font-size="13" font-weight="normal" fill="#262626">· 展开不刷新、不打开地址、不部署；Open仍逐条</text><text x="40" y="650" font-size="13" font-weight="normal" fill="#262626">明确点击。</text><text x="30" y="680" font-size="13" font-weight="normal" fill="#262626">· 不定义新供应商健康规则；失败/缺失不补0。</text><rect x="16" y="710" width="358" height="227" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="736" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="765" x2="360" y2="765" stroke="#aaaaaa"/><text x="30" y="785" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和</text><text x="40" y="805" font-size="13" font-weight="normal" fill="#262626">动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="30" y="835" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐</text><text x="40" y="855" font-size="13" font-weight="normal" fill="#262626">；不得因统一模板删去业务参数。</text><text x="30" y="885" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、</text><text x="40" y="905" font-size="13" font-weight="normal" fill="#262626">影响及取消入口；若为编辑，错误就近显示并保</text><text x="40" y="925" font-size="13" font-weight="normal" fill="#262626">留草稿。</text><rect x="16" y="955" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="981" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1010" x2="360" y2="1010" stroke="#aaaaaa"/><text x="30" y="1030" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；</text><text x="40" y="1050" font-size="13" font-weight="normal" fill="#262626">确认语义与提交契约仍按各自业务保留。</text><text x="30" y="1080" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1100" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1130" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1153" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="184" y="1130" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1153" font-size="13" font-weight="normal" fill="#262626">A2 复制</text><rect x="16" y="1186" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1209" font-size="13" font-weight="normal" fill="#262626">A3 刷新</text><rect x="184" y="1186" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1209" font-size="13" font-weight="normal" fill="#262626">A4 打开</text><text x="16" y="1264" font-size="10" font-weight="normal" fill="#666666">surface-features-models-components-dialogs-view-details-dialog </text><text x="16" y="1281" font-size="10" font-weight="normal" fill="#666666">· 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
