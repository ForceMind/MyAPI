<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1430" viewBox="0 0 390 1430" role="img" aria-labelledby="title desc"><title id="title">创建 / 编辑用户 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">创建 / 编辑用户</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">弹层：创建 / 编辑用户</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><rect x="16.0" y="225" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="250" font-size="12" font-weight="normal" fill="#262626">基本资料</text><rect x="16.0" y="277" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="302" font-size="12" font-weight="normal" fill="#262626">管理员权限 N ▾</text><rect x="16.0" y="329" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="24.0" y="354" font-size="12" font-weight="normal" fill="#262626">只读绑定 N ▾</text><text x="16" y="407" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="16.0" y="437" font-size="12" font-weight="600" fill="#262626">准确用户 / ID</text><rect x="16.0" y="446" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="473" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="531" font-size="12" font-weight="600" fill="#262626">角色〔原Root资格〕</text><rect x="16.0" y="540" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="567" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="625" font-size="12" font-weight="600" fill="#262626">分组 / 名称 / 原必填字段</text><rect x="16.0" y="634" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="661" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="707" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="733" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="30" y1="762" x2="360" y2="762" stroke="#aaaaaa"/><text x="30" y="782" font-size="13" font-weight="normal" fill="#262626">· 权限按资源显示已授予数与覆盖状态</text><text x="30" y="812" font-size="13" font-weight="normal" fill="#262626">· 绑定显示已配置项摘要，不重复铺开只读Input</text><rect x="16" y="842" width="358" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="868" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="30" y1="897" x2="360" y2="897" stroke="#aaaaaa"/><text x="30" y="917" font-size="13" font-weight="normal" fill="#262626">· 明确展开原资源 / 动作矩阵，保全部权限位草稿</text><text x="30" y="947" font-size="13" font-weight="normal" fill="#262626">· 绑定明细完整只读，原保存与独立确认可达</text><rect x="16" y="977" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1003" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="30" y1="1032" x2="360" y2="1032" stroke="#aaaaaa"/><text x="30" y="1052" font-size="13" font-weight="normal" fill="#262626">· Root编辑资格、角色风险、读取失败 / 校验错误</text><text x="40" y="1072" font-size="13" font-weight="normal" fill="#262626">常驻。</text><text x="30" y="1102" font-size="13" font-weight="normal" fill="#262626">· 折叠不改变值，展开不请求；原角色 / 权限载荷</text><text x="40" y="1122" font-size="13" font-weight="normal" fill="#262626">不变。</text><rect x="16" y="1152" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1178" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1207" x2="360" y2="1207" stroke="#aaaaaa"/><text x="30" y="1227" font-size="13" font-weight="normal" fill="#262626">· 角色变更与额度调整保留既有权限；不自动覆盖</text><text x="40" y="1247" font-size="13" font-weight="normal" fill="#262626">空密码。</text><text x="30" y="1277" font-size="13" font-weight="normal" fill="#262626">· 桌面采用带标题与固定动作区的聚焦弹层；手机</text><text x="40" y="1297" font-size="13" font-weight="normal" fill="#262626">全屏或单列，不堆叠窄抽屉。</text><rect x="16" y="1327" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1350" font-size="13" font-weight="600" fill="#262626">A1 取消 / 返回</text><rect x="184" y="1327" width="182" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1350" font-size="13" font-weight="normal" fill="#262626">A2 提交 / 执行当前动作</text><text x="16" y="1405" font-size="10" font-weight="normal" fill="#666666">user-edit · 手机390 · 来源 c916051e · 浏览器未验证</text></g></svg>
