<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1390" viewBox="0 0 1200 1390" role="img" aria-labelledby="title desc"><title id="title">API Key 详情 · 交付 · 桌面</title><desc id="desc">2026-11-07主线线稿增量，合成数据；不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">API Key 详情 · 交付</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/keys/$keyId?tab=delivery</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实现另验 / 浏览器未验证</text><rect x="40" y="215" width="88" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="50" y="242" font-size="13" font-weight="normal" fill="#262626">请求</text><rect x="136" y="215" width="94" height="44" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="146" y="242" font-size="13" font-weight="normal" fill="#262626">范围与分额</text><rect x="238" y="215" width="88" height="44" rx="5" fill="#dedede" stroke="#555555"/><text x="248" y="242" font-size="13" font-weight="600" fill="#262626">交付</text><rect x="40" y="275" width="161" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="298" font-size="13" font-weight="600" fill="#262626">A1 返回来源〔跳转〕</text><rect x="209" y="275" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="219" y="298" font-size="13" font-weight="normal" fill="#262626">A7 凭据维护〔独立确认〕</text><rect x="40" y="339" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="365" font-size="16" font-weight="600" fill="#262626">准确Key与来源 · 首屏常驻</text><line x1="54" y1="394" x2="1146" y2="394" stroke="#aaaaaa"/><text x="54" y="414" font-size="13" font-weight="normal" fill="#262626">· Key #示例 · 名称 / 掩码 / 状态未知；当前身份和权限</text><text x="54" y="444" font-size="13" font-weight="normal" fill="#262626">· 首页来源 → 该Key交付；A1返回恢复原选择与焦点</text><text x="54" y="474" font-size="13" font-weight="normal" fill="#262626">· 加载 / 无Key / 读取失败 / 撤权可见，不回显旧对象秘密</text><rect x="40.0" y="504" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="529" font-size="12" font-weight="normal" fill="#262626">真实Base URL〔配置 / 当前访问来源〕</text><rect x="604.0" y="504" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="529" font-size="12" font-weight="normal" fill="#262626">A2 复制Base URL〔只读〕</text><text x="40" y="582" font-size="15" font-weight="600" fill="#262626">交付草稿 · 不自动发现 / 读密钥 / 发送</text><text x="40.0" y="612" font-size="12" font-weight="600" fill="#262626">客户端模板〔原支持列表〕</text><rect x="40.0" y="621" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="648" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="612" font-size="12" font-weight="600" fill="#262626">候选地址 ▾ / 手工输入〔原校验〕</text><rect x="417.3333333333333" y="621" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="648" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="612" font-size="12" font-weight="600" fill="#262626">凭据〔默认掩码；可手工粘贴〕</text><rect x="794.6666666666666" y="621" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="648" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="694" width="238" height="56" rx="5" fill="#ffffff" stroke="#555555"/><text x="50" y="717" font-size="13" font-weight="normal" fill="#262626">A3 选择 / 手填候选〔本地草稿</text><text x="50" y="737" font-size="13" font-weight="normal" fill="#262626">〕</text><rect x="286" y="694" width="217" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="296" y="717" font-size="13" font-weight="normal" fill="#262626">A4 手工粘贴凭据〔本地草稿〕</text><rect x="511" y="694" width="224" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="521" y="717" font-size="13" font-weight="normal" fill="#262626">A5 复制配置〔显式 / 原确认〕</text><rect x="743" y="694" width="203" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="753" y="717" font-size="13" font-weight="normal" fill="#262626">A6 导入客户端〔明确确认〕</text><rect x="40" y="766" width="1120" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="792" font-size="16" font-weight="600" fill="#262626">预览与确认 · 复制 / 导入分开</text><line x1="54" y1="821" x2="1146" y2="821" stroke="#aaaaaa"/><text x="54" y="841" font-size="13" font-weight="normal" fill="#262626">· 预览：准确地址、目标客户端、原协议字段；秘密保持原掩码策略</text><text x="54" y="871" font-size="13" font-weight="normal" fill="#262626">· A5显式复制配置；含秘密沿原确认，复制失败就近反馈</text><text x="54" y="901" font-size="13" font-weight="normal" fill="#262626">· A6导入前明确确认目标 / 地址及秘密；确认后才按原方式唤起</text><text x="54" y="931" font-size="13" font-weight="normal" fill="#262626">· 无目标应用 / 无导入支持 / 字段无效：保草稿和替代复制入口</text><text x="54" y="961" font-size="13" font-weight="normal" fill="#262626">· 不自动调用模型；成功复制不等于客户端已经连通</text><rect x="40" y="991" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1017" font-size="16" font-weight="600" fill="#262626">权限变化与返回</text><line x1="54" y1="1046" x2="1146" y2="1046" stroke="#aaaaaa"/><text x="54" y="1066" font-size="13" font-weight="normal" fill="#262626">· 切Key / 换账号 / 撤权：清旧秘密及敏感导入草稿，不复用旧异步回报</text><text x="54" y="1096" font-size="13" font-weight="normal" fill="#262626">· 取消与返回保非秘密上下文；显示 / 复制 / 轮换保持独立原授权</text><text x="54" y="1126" font-size="13" font-weight="normal" fill="#262626">· A7凭据维护进入既有任务，保独立确认与结果未知恢复</text><rect x="40" y="1156" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1182" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="1211" x2="1146" y2="1211" stroke="#aaaaaa"/><text x="54" y="1231" font-size="13" font-weight="normal" fill="#262626">· 所有地址、Key与候选均为线稿占位；实现复用现有真实来源与模板，不把示例URL写死进产品。</text><text x="54" y="1261" font-size="13" font-weight="normal" fill="#262626">· 保完整原字段、协议、复制/导入能力与权限；本轮不新增自动读密钥、自动唤起或自动测试。</text><text x="54" y="1291" font-size="13" font-weight="normal" fill="#262626">· 加载、无Key、字段无效、复制失败、目标应用不可用、权限变化均就近可见；禁止旧对象秘密进入新对象。</text><text x="54" y="1321" font-size="13" font-weight="normal" fill="#262626">· 返回与取消保非秘密上下文，敏感值沿原生命周期清理；轮换、保存与交付分离。</text><text x="40" y="1365" font-size="10" font-weight="normal" fill="#666666">key-delivery · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
