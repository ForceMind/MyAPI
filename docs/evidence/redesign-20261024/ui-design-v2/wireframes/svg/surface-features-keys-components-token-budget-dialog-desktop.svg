<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1307" viewBox="0 0 1200 1307" role="img" aria-labelledby="title desc"><title id="title">API Key 用量预算 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">API Key 用量预算</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">弹层：API Key 用量预算</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40.0" y="215" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="240" font-size="12" font-weight="normal" fill="#262626">预算主表单〔常驻〕</text><rect x="604.0" y="215" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="240" font-size="12" font-weight="normal" fill="#262626">适用范围 / 统计说明 ▾</text><text x="40" y="293" font-size="15" font-weight="600" fill="#262626">当前主任务 / 关键状态</text><text x="40.0" y="323" font-size="12" font-weight="600" fill="#262626">当前Token / USD模式与单位</text><rect x="40.0" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="323" font-size="12" font-weight="600" fill="#262626">已用 / 预留 / 上限 / pending</text><rect x="417.3333333333333" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="323" font-size="12" font-weight="600" fill="#262626">严格Chat 1,050,000保留上界警告</text><rect x="794.6666666666666" y="332" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="359" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="40.0" y="417" font-size="12" font-weight="600" fill="#262626">未知用量 / 恢复表单 / 错误</text><rect x="40.0" y="426" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="453" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="499" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="525" font-size="16" font-weight="600" fill="#262626">首屏状态与摘要</text><line x1="54" y1="554" x2="1146" y2="554" stroke="#aaaaaa"/><text x="54" y="574" font-size="13" font-weight="normal" fill="#262626">· 合并重复协议说明，保主任务和资金模式区别</text><text x="54" y="604" font-size="13" font-weight="normal" fill="#262626">· 时效证据、互斥条件与安全上限常驻</text><rect x="40" y="634" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="660" font-size="16" font-weight="600" fill="#262626">明确进入后的完整任务</text><line x1="54" y1="689" x2="1146" y2="689" stroke="#aaaaaa"/><text x="54" y="709" font-size="13" font-weight="normal" fill="#262626">· 详细资格 / 协议字段 / 统计起点完整可达</text><text x="54" y="739" font-size="13" font-weight="normal" fill="#262626">· 原Supported request fields详情入口保留</text><rect x="40" y="769" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="795" font-size="16" font-weight="600" fill="#262626">交互 / 权限 / 恢复边界</text><line x1="54" y1="824" x2="1146" y2="824" stroke="#aaaaaa"/><text x="54" y="844" font-size="13" font-weight="normal" fill="#262626">· 不改变Token整数、USD小数原字符串、BPS、时效和上限。</text><text x="54" y="874" font-size="13" font-weight="normal" fill="#262626">· 保body.id、expected_revision、request_id和证据；未知不补零。</text><rect x="40" y="904" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="930" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="959" x2="1146" y2="959" stroke="#aaaaaa"/><text x="54" y="979" font-size="13" font-weight="normal" fill="#262626">· 按单个弹层而非整个文件提取标题、字段标签和动作，避免把相邻编辑器或确认框的按钮混入。</text><text x="54" y="1009" font-size="13" font-weight="normal" fill="#262626">· 条件性字段与动作仍按原权限、模式和状态显隐；不得因统一模板删去业务参数。</text><text x="54" y="1039" font-size="13" font-weight="normal" fill="#262626">· 若为确认操作，正文必须展示准确对象、范围、影响及取消入口；若为编辑，错误就近显示并保留草稿。</text><rect x="40" y="1069" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1095" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1124" x2="1146" y2="1124" stroke="#aaaaaa"/><text x="54" y="1144" font-size="13" font-weight="normal" fill="#262626">· 同类弹层复用标题、字段、错误与动作区组件；确认语义与提交契约仍按各自业务保留。</text><text x="54" y="1174" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="1204" width="126" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="1227" font-size="13" font-weight="600" fill="#262626">A1 取消 / 关闭</text><rect x="174" y="1204" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="1227" font-size="13" font-weight="normal" fill="#262626">A2 刷新</text><text x="40" y="1282" font-size="10" font-weight="normal" fill="#666666">surface-features-keys-components-token-budget-dialog · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
