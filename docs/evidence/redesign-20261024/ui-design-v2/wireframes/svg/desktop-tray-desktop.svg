<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2350" viewBox="0 0 1200 2350" role="img" aria-labelledby="title desc"><title id="title">Desktop · 本机服务 / 公网接入向导 · 桌面</title><desc id="desc">2026-11-08入口检查线稿增量，沿既有2026-11-07方案；合成数据，不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="12" font-weight="normal" fill="#262626">本机服务 / 语言 / 关闭窗口留托盘</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">Desktop · 本机服务 / 公网接入向导</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">原生托盘 / LAN帮助</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实现另验 / 浏览器未验证</text><rect x="40" y="215" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="237" font-size="12" font-weight="normal" fill="#262626">已有HTTPS反代向导 · 以下均为合成示例 · 用户提供的公网入口始终未验证</text><rect x="40" y="279" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="305" font-size="16" font-weight="600" fill="#262626">本机事实〔保留原B5a操作〕</text><line x1="54" y1="334" x2="1146" y2="334" stroke="#aaaaaa"/><text x="54" y="354" font-size="13" font-weight="normal" fill="#262626">· 服务状态 / 实际监听范围 / 当前版本；关窗留托盘、仅停止和退出仍各自独立</text><text x="54" y="384" font-size="13" font-weight="normal" fill="#262626">· 本机监听 http://127.0.0.1:3000〔合成〕；公网入口单独显示，不混入本机复制列表</text><rect x="40.0" y="412" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="437" font-size="12" font-weight="normal" fill="#262626">1 反代位置</text><rect x="322.0" y="412" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="330.0" y="437" font-size="12" font-weight="normal" fill="#262626">2 外部条件</text><rect x="604.0" y="412" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="437" font-size="12" font-weight="normal" fill="#262626">3 入口地址〔当前〕</text><rect x="886.0" y="412" width="274.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="894.0" y="437" font-size="12" font-weight="normal" fill="#262626">4 配置客户端</text><rect x="40" y="472" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="498" font-size="16" font-weight="600" fill="#262626">▸ 1 反代位置〔选择后继续〕〔步骤说明〕</text><line x1="54" y1="527" x2="1146" y2="527" stroke="#aaaaaa"/><text x="54" y="547" font-size="13" font-weight="normal" fill="#262626">· 同一电脑：明确复制本机反代目标根地址，不附 /v1</text><text x="54" y="577" font-size="13" font-weight="normal" fill="#262626">· 另一台LAN设备：需要现有私网监听与防火墙条件，只提供原LAN显式确认入口；不因填写地址自动重启</text><rect x="40" y="605" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="631" font-size="16" font-weight="600" fill="#262626">▸ 2 外部条件〔默认收起说明〕〔步骤说明〕</text><line x1="54" y1="660" x2="1146" y2="660" stroke="#aaaaaa"/><text x="54" y="680" font-size="13" font-weight="normal" fill="#262626">· 已有HTTPS反代：由用户管理域名/DNS/证书、端口、反代与防火墙；未具备则待配置，不伪报连接失败</text><text x="54" y="710" font-size="13" font-weight="normal" fill="#262626">· 开机/休眠/合盖/断网/退出、动态地址、上行带宽和额度会影响服务；NAT/CGNAT、IPv4/IPv6与第三方入口由用户选择，不自动购买或改配置</text><rect x="40" y="738" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="764" font-size="16" font-weight="600" fill="#262626">3 填入口地址〔本图当前步骤〕</text><line x1="54" y1="793" x2="1146" y2="793" stroke="#aaaaaa"/><text x="54" y="813" font-size="13" font-weight="normal" fill="#262626">· 只接受已有HTTPS根origin；示例 https://gateway.example.com</text><text x="54" y="843" font-size="13" font-weight="normal" fill="#262626">· 预览 https://gateway.example.com/v1；用户提供 · 未验证</text><text x="54" y="873" font-size="13" font-weight="normal" fill="#262626">· HTTP/凭据/query/fragment/控制符/超长输入拒绝；路径前缀或已知本机/LAN入口解释当前不支持/转对应分支，不偷偷截断</text><text x="54" y="903" font-size="13" font-weight="normal" fill="#262626">· 保存前默认取消确认：仅保存此电脑的入口记录；确认后重新核对可信窗口、声明版本与服务身份</text><rect x="40" y="931" width="126" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="50" y="954" font-size="13" font-weight="normal" fill="#262626">A12 返回上一步</text><rect x="174" y="931" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="184" y="954" font-size="13" font-weight="normal" fill="#262626">A9 确认保存入口</text><rect x="40" y="995" width="1120" height="587" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1021" font-size="16" font-weight="600" fill="#262626">保存后 · 4 配置客户端〔保存后显示〕</text><line x1="54" y1="1050" x2="1146" y2="1050" stroke="#aaaaaa"/><text x="54" y="1070" font-size="13" font-weight="normal" fill="#262626">· 已保存 · 未验证；明确复制当前所见公网 /v1，打开本机控制台选择Key</text><text x="54" y="1100" font-size="13" font-weight="normal" fill="#262626">· 不读取Key，不发模型请求，不改现有客户端导入、后台配置或监听</text><text x="54" y="1130" font-size="13" font-weight="normal" fill="#262626">· 修改/撤销后旧地址不可复制；撤销需确认，只清除此应用声明，外部反代/隧道须用户自行关闭</text><g id="desktop-public-check-increment"><rect x="54" y="1150" width="1092" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="64" y="1168" font-size="14" font-weight="600" fill="#262626">▸ 从此电脑检查</text><text x="284" y="1177" font-size="12" font-weight="normal" fill="#262626">默认折叠；展开不会自动请求</text><rect x="54" y="1206" width="1092" height="360" rx="5" fill="#ffffff" stroke="#aaaaaa"/><text x="64" y="1230" font-size="14" font-weight="600" fill="#262626">展开态参考〔默认不显示〕</text><text x="64" y="1256" font-size="13" font-weight="normal" fill="#262626">检查入口：https://gateway.example.com〔合成〕</text><text x="64" y="1278" font-size="12" font-weight="normal" fill="#262626">实际观察时间：尚未检查；完成后显示该次观测时间</text><rect x="64" y="1296" width="1072" height="30" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="72" y="1317" font-size="13" font-weight="normal" fill="#262626">DNS解析〔直接IP时为地址检查〕</text><text x="654" y="1317" font-size="13" font-weight="normal" fill="#262626">尚未检查</text><rect x="64" y="1332" width="1072" height="30" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="72" y="1353" font-size="13" font-weight="normal" fill="#262626">TLS证书</text><text x="654" y="1353" font-size="13" font-weight="normal" fill="#262626">尚未检查</text><rect x="64" y="1368" width="1072" height="30" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="72" y="1389" font-size="13" font-weight="normal" fill="#262626">公共状态响应</text><text x="654" y="1389" font-size="13" font-weight="normal" fill="#262626">尚未检查</text><rect x="64" y="1410" width="180" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><rect x="256" y="1410" width="180" height="44" rx="5" fill="#fafafa" stroke="#aaaaaa"/><text x="74" y="1437" font-size="13" font-weight="normal" fill="#262626">A13 检查入口</text><text x="266" y="1437" font-size="13" font-weight="normal" fill="#262626">A14 取消检查</text><text x="64" y="1478" font-size="12" font-weight="normal" fill="#262626">仅此电脑观测；外部verification保持unknown，不证明公网入站、本机实例、鉴权、模型或额度。</text><text x="64" y="1500" font-size="12" font-weight="normal" fill="#262626">不读取Key或发模型请求；停止/退出仍可用，草稿、步骤及焦点保留。</text><text x="64" y="1534" font-size="12" font-weight="normal" fill="#262626">来源origin / revision / generation变化，旧结果失效；旧回复不得覆盖新入口或结果。</text></g><rect x="40" y="1598" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1624" font-size="16" font-weight="600" fill="#262626">状态与恢复〔关键说明始终可见〕</text><line x1="54" y1="1653" x2="1146" y2="1653" stroke="#aaaaaa"/><text x="54" y="1673" font-size="13" font-weight="normal" fill="#262626">· 待配置 / 当前不支持 / 外部状态无法判断 / 已保存未验证分开；文件无法读取不得装成从未配置</text><text x="54" y="1703" font-size="13" font-weight="normal" fill="#262626">· 保存失败保旧记录与草稿；旧revision不盖新结果，定时状态不重置输入/步骤或抢焦点</text><text x="54" y="1733" font-size="13" font-weight="normal" fill="#262626">· 此电脑DNS/地址、TLS及公共状态仅点击后检查；公网入站、本机实例、鉴权、模型与额度仍未验证</text><text x="40" y="1779" font-size="15" font-weight="600" fill="#262626">补充任务字段</text><text x="40.0" y="1809" font-size="12" font-weight="600" fill="#262626">反代位置：同机 / 另一台LAN设备</text><rect x="40.0" y="1818" width="554.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="1845" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="606.0" y="1809" font-size="12" font-weight="600" fill="#262626">已有HTTPS根origin〔示例〕</text><rect x="606.0" y="1818" width="554.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="616.0" y="1845" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="1891" width="1120" height="267" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1917" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="1946" x2="1146" y2="1946" stroke="#aaaaaa"/><text x="54" y="1966" font-size="13" font-weight="normal" fill="#262626">· 沿同目录Desktop服务效果图；所有状态示例为结构说明，不是已运行或视觉验收。</text><text x="54" y="1996" font-size="13" font-weight="normal" fill="#262626">· 沿用appId/userData/旧DB原位采用、SESSION_SECRET及显式数据库路径，不搬动/删除数据，不回灌或重放。</text><text x="54" y="2026" font-size="13" font-weight="normal" fill="#262626">· B5a仅当前迭代，完整三版本计划和公网B5b仍在主Goal；界面不得把unknown写成健康或已停止。</text><text x="54" y="2056" font-size="13" font-weight="normal" fill="#262626">· Node/VM/合成子进程与打包验证在Actions，浏览器/真实托盘/设备交互仍需单独验收。</text><text x="54" y="2086" font-size="13" font-weight="normal" fill="#262626">· mobile SVG仅窄窗口排列参考，不表示移动App或手机支持。</text><text x="54" y="2116" font-size="13" font-weight="normal" fill="#262626">· 沿desktop-public-access-concept-20261107.png；本批B5b1是已有反代交付，不取代完整B5b公网验证目标。</text><text x="54" y="2146" font-size="13" font-weight="normal" fill="#262626">· 所有公网示例均未验证；原B5a停止未知/owned-child、可信file IPC、明确LAN和数据保护规则不放宽。</text><rect x="40" y="2176" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="2202" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="2231" x2="1146" y2="2231" stroke="#aaaaaa"/><text x="54" y="2251" font-size="13" font-weight="normal" fill="#262626">· 公网入口引导收在原本机面板内，分步只展当前任务；真实监听与用户声明各有来源，原服务管理/网关控制台继续复用。</text><text x="54" y="2281" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="2325" font-size="10" font-weight="normal" fill="#666666">desktop-tray · 桌面1200 · 来源 13eedad9 · 浏览器未验证</text></g></svg>
