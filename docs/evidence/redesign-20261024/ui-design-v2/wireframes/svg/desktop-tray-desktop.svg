<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1807" viewBox="0 0 1200 1807" role="img" aria-labelledby="title desc"><title id="title">Desktop · 本机服务 / 托盘 / 明确退出 · 桌面</title><desc id="desc">2026-11-07主线线稿增量，合成数据；不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="12" font-weight="normal" fill="#262626">本机服务 / 语言 / 关闭窗口留托盘</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">Desktop · 本机服务 / 托盘 / 明确退出</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">原生托盘 / LAN帮助</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实现另验 / 浏览器未验证</text><rect x="40" y="215" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="237" font-size="12" font-weight="normal" fill="#262626">本机原生面板：以下均为线稿状态；后端停止/失败时仍保留操作入口</text><rect x="40" y="279" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="305" font-size="16" font-weight="600" fill="#262626">B5a本地面板 · 后端停止仍可用</text><line x1="54" y1="334" x2="1146" y2="334" stroke="#aaaaaa"/><text x="54" y="354" font-size="13" font-weight="normal" fill="#262626">· 本机服务状态：停止 / 启动中 / 可连接 / 停止中 / 失败 / 停止未确认 / 外部开发服务</text><text x="54" y="384" font-size="13" font-weight="normal" fill="#262626">· 实际地址 / 本机或LAN范围 / 当前版本；公网可达性未验证</text><text x="54" y="414" font-size="13" font-weight="normal" fill="#262626">· A1打开控制台；A2明确启动；A3明确停止；忙状态不重复提交</text><text x="54" y="444" font-size="13" font-weight="normal" fill="#262626">· 数据 / 日志仅展开已知位置和固定入口，不展示凭据或正文</text><rect x="40" y="472" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="498" font-size="16" font-weight="600" fill="#262626">窗口 / 服务 / 应用三个独立动作</text><line x1="54" y1="527" x2="1146" y2="527" stroke="#aaaaaa"/><text x="54" y="547" font-size="13" font-weight="normal" fill="#262626">· 关闭窗口：留托盘，服务状态不变</text><text x="54" y="577" font-size="13" font-weight="normal" fill="#262626">· 仅停止：确认后停止本应用创建的child，面板和应用保留</text><text x="54" y="607" font-size="13" font-weight="normal" fill="#262626">· 退出应用：确认后等待owned child实际关闭，再退出</text><text x="54" y="637" font-size="13" font-weight="normal" fill="#262626">· 停止未确认：不标已停止，不允许第二个进程，保留错误与核对入口</text><rect x="40" y="665" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="691" font-size="16" font-weight="600" fill="#262626">停止或退出确认〔默认取消〕</text><line x1="54" y1="720" x2="1146" y2="720" stroke="#aaaaaa"/><text x="54" y="740" font-size="13" font-weight="normal" fill="#262626">· 当前请求可能中断；先确认客户端状态，配置、数据库、日志保留</text><text x="54" y="770" font-size="13" font-weight="normal" fill="#262626">· 取消 / 明确停止本机服务；确认返回后复核窗口、generation与child</text><text x="54" y="800" font-size="13" font-weight="normal" fill="#262626">· 仅持有的ChildProcess可被停止，不按端口或任意PID找进程</text><rect x="40" y="828" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="854" font-size="16" font-weight="600" fill="#262626">托盘与访问范围</text><line x1="54" y1="883" x2="1146" y2="883" stroke="#aaaaaa"/><text x="54" y="903" font-size="13" font-weight="normal" fill="#262626">· 中英文一致：打开控制台 / 本机服务 / 当前范围 / LAN设置 / 退出MyAPI</text><text x="54" y="933" font-size="13" font-weight="normal" fill="#262626">· 本机默认；LAN沿原明确同意、私网和重启门禁</text><text x="54" y="963" font-size="13" font-weight="normal" fill="#262626">· 公网B5b独立向导待后续；不自动开端口/防火墙/NAT或声称已验证</text><text x="54" y="993" font-size="13" font-weight="normal" fill="#262626">· 自动更新关闭；macOS先、Windows后，不宣称Linux首发支持</text><rect x="40" y="1021" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1047" font-size="16" font-weight="600" fill="#262626">可信本地面板边界</text><line x1="54" y1="1076" x2="1146" y2="1076" stroke="#aaaaaa"/><text x="54" y="1096" font-size="13" font-weight="normal" fill="#262626">· 面板使用独立preload；网关HTTP页面不获得服务控制能力</text><text x="54" y="1126" font-size="13" font-weight="normal" fill="#262626">· 固定窗口+主frame+精确file URL+固定动作，导航/iframe/错误来源拒绝</text><text x="54" y="1156" font-size="13" font-weight="normal" fill="#262626">· 无任意invoke、命令、PID、文件路径或URL参数；状态按文本渲染</text><text x="54" y="1186" font-size="13" font-weight="normal" fill="#262626">· 开发模式外部服务不由本应用开始/停止；无自动重放或恢复旧快照</text><rect x="40" y="1214" width="120" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="1237" font-size="13" font-weight="600" fill="#262626">A1 打开控制台</text><rect x="168" y="1214" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="178" y="1237" font-size="13" font-weight="normal" fill="#262626">A2 启动本机服务</text><rect x="309" y="1214" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="319" y="1237" font-size="13" font-weight="normal" fill="#262626">A3 停止本机服务</text><rect x="450" y="1214" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="460" y="1237" font-size="13" font-weight="normal" fill="#262626">A4 退出MyAPI</text><rect x="578" y="1214" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="588" y="1237" font-size="13" font-weight="normal" fill="#262626">A5 LAN设置</text><rect x="706" y="1214" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="716" y="1237" font-size="13" font-weight="normal" fill="#262626">A6 公网配置说明</text><rect x="847" y="1214" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="857" y="1237" font-size="13" font-weight="normal" fill="#262626">A7 数据与日志</text><rect x="975" y="1214" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="985" y="1237" font-size="13" font-weight="normal" fill="#262626">A8 复制接入地址</text><text x="40" y="1296" font-size="15" font-weight="600" fill="#262626">补充任务字段</text><text x="40.0" y="1326" font-size="12" font-weight="600" fill="#262626">服务状态</text><rect x="40.0" y="1335" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="1362" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="1326" font-size="12" font-weight="600" fill="#262626">本机Base URL〔合成〕</text><rect x="417.3333333333333" y="1335" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="1362" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="1326" font-size="12" font-weight="600" fill="#262626">访问模式：仅本机 / 局域网</text><rect x="794.6666666666666" y="1335" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="1362" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40" y="1408" width="1120" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1434" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="1463" x2="1146" y2="1463" stroke="#aaaaaa"/><text x="54" y="1483" font-size="13" font-weight="normal" fill="#262626">· 沿同目录Desktop服务效果图；所有状态示例为结构说明，不是已运行或视觉验收。</text><text x="54" y="1513" font-size="13" font-weight="normal" fill="#262626">· 沿用appId/userData/旧DB原位采用、SESSION_SECRET及显式数据库路径，不搬动/删除数据，不回灌或重放。</text><text x="54" y="1543" font-size="13" font-weight="normal" fill="#262626">· B5a仅当前迭代，完整三版本计划和公网B5b仍在主Goal；界面不得把unknown写成健康或已停止。</text><text x="54" y="1573" font-size="13" font-weight="normal" fill="#262626">· Node/VM/合成子进程与打包验证在Actions，浏览器/真实托盘/设备交互仍需单独验收。</text><text x="54" y="1603" font-size="13" font-weight="normal" fill="#262626">· mobile SVG仅窄窗口排列参考，不表示移动App或手机支持。</text><rect x="40" y="1633" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1659" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="1688" x2="1146" y2="1688" stroke="#aaaaaa"/><text x="54" y="1708" font-size="13" font-weight="normal" fill="#262626">· 本地服务管理与网关业务控制台各有职责；复用已有托盘、探测、目录和LAN规则，不重搭后台或提供任意宿主控制。</text><text x="54" y="1738" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><text x="40" y="1782" font-size="10" font-weight="normal" fill="#666666">desktop-tray · 桌面1200 · 来源 4601139a · 浏览器未验证</text></g></svg>
