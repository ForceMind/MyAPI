<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">Desktop 托盘与本机接入 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">Desktop 托盘与本机接入</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">原生托盘 / LAN帮助</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">低保真设计提案 · 合成占位 · 待确认 · 不连接API / 不执行业务动作</text><rect x="40" y="215" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="237" font-size="12" font-weight="normal" fill="#262626">手机：单列全屏任务；桌面：聚焦弹层。关闭后返回原列表并恢复焦点。</text><text x="40" y="297" font-size="15" font-weight="600" fill="#262626">任务字段 / 当前证据</text><text x="40.0" y="327" font-size="12" font-weight="600" fill="#262626">服务状态</text><rect x="40.0" y="336" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="50.0" y="363" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="417.3333333333333" y="327" font-size="12" font-weight="600" fill="#262626">本机Base URL〔合成〕</text><rect x="417.3333333333333" y="336" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="427.3333333333333" y="363" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="794.6666666666666" y="327" font-size="12" font-weight="600" fill="#262626">访问模式：仅本机 / 局域网</text><rect x="794.6666666666666" y="336" width="365.3333333333333" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="804.6666666666666" y="363" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="40.0" y="409" width="1120.0" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="435" font-size="16" font-weight="600" fill="#262626">托盘动作</text><line x1="54.0" y1="464" x2="1146.0" y2="464" stroke="#aaaaaa"/><text x="54.0" y="484" font-size="13" font-weight="normal" fill="#262626">· 显示MyAPI</text><text x="54.0" y="514" font-size="13" font-weight="normal" fill="#262626">· 复制接入地址</text><text x="54.0" y="544" font-size="13" font-weight="normal" fill="#262626">· LAN帮助</text><text x="54.0" y="574" font-size="13" font-weight="normal" fill="#262626">· 明确重启并变更访问模式</text><text x="54.0" y="604" font-size="13" font-weight="normal" fill="#262626">· 退出应用</text><rect x="40" y="632" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="658" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="687" x2="1146" y2="687" stroke="#aaaaaa"/><text x="54" y="707" font-size="13" font-weight="normal" fill="#262626">· 复用Lite页面，不维护第二套业务；窗口关闭、退出应用、停止服务的语义必须分别说明。</text><text x="54" y="737" font-size="13" font-weight="normal" fill="#262626">· 本图是原生菜单 / 系统对话框的结构线稿，不伪装为已实现的HTML设置页。</text><rect x="40" y="767" width="120" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="790" font-size="13" font-weight="600" fill="#262626">A1 打开控制台</text><rect x="168" y="767" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="178" y="790" font-size="13" font-weight="normal" fill="#262626">A2 接入说明</text><rect x="296" y="767" width="133" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="306" y="790" font-size="13" font-weight="normal" fill="#262626">A3 改变访问范围</text><text x="40" y="845" font-size="