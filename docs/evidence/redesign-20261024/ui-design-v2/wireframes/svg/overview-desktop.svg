<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1935" viewBox="0 0 1200 1935" role="img" aria-labelledby="title desc"><title id="title">概览 · 流向板 · 桌面</title><desc id="desc">2026-11-07主线线稿增量，合成数据；不是产品或浏览器验收。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">概览 · 流向板</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/dashboard/overview</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">2026-11-07已批准主线设计增量 · 合成占位 · 产品实现另验 / 浏览器未验证</text><rect x="40" y="215" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="237" font-size="12" font-weight="normal" fill="#262626">Full · 流向图主视图；Lite / Desktop布局在下方分别定义，不叠成产品中的三个面板</text><rect x="40" y="279" width="161" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="302" font-size="13" font-weight="600" fill="#262626">A1 添加连接〔跳转〕</text><rect x="209" y="279" width="203" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="219" y="302" font-size="13" font-weight="normal" fill="#262626">A2 创建 / 选择Key〔跳转〕</text><rect x="420" y="279" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="430" y="302" font-size="13" font-weight="normal" fill="#262626">A4 复制接入地址〔只读〕</text><rect x="617" y="279" width="189" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="627" y="302" font-size="13" font-weight="normal" fill="#262626">A6 查看请求〔只读跳转〕</text><rect x="40.0" y="343" width="357.3333333333333" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="369" font-size="16" font-weight="600" fill="#262626">谁在调用 · API Key</text><line x1="54.0" y1="398" x2="383.3333333333333" y2="398" stroke="#aaaaaa"/><text x="54.0" y="418" font-size="13" font-weight="normal" fill="#262626">· Key A〔掩码〕 / 请求 —</text><text x="54.0" y="448" font-size="13" font-weight="normal" fill="#262626">· Key B〔掩码〕 / 状态未知</text><text x="54.0" y="478" font-size="13" font-weight="normal" fill="#262626">· 选择节点：只筛选已存请求</text><rect x="421.3333333333333" y="343" width="357.3333333333333" height="207" rx="5" fill="#ffffff" stroke="#888888"/><text x="435.3333333333333" y="369" font-size="16" font-weight="600" fill="#262626">MyAPI 网关 · 中性紧凑核心</text><line x1="435.3333333333333" y1="398" x2="764.6666666666666" y2="398" stroke="#aaaaaa"/><text x="435.3333333333333" y="418" font-size="13" font-weight="normal" fill="#262626">· 真实Base URL〔来源：配置 / 当前访问〕</text><text x="435.3333333333333" y="448" font-size="13" font-weight="normal" fill="#262626">· A4 复制接入地址〔只读〕</text><text x="435.3333333333333" y="478" font-size="13" font-weight="normal" fill="#262626">· 24小时请求 — / 失败率 — / 中位耗时 —</text><text x="435.3333333333333" y="508" font-size="13" font-weight="normal" fill="#262626">· 每小时请求及数值文字；样本未覆盖不补0</text><text x="435.3333333333333" y="538" font-size="13" font-weight="normal" fill="#262626">· 版本 / 访问摘要；完整原meta保留</text><text x="399.3333333333333" y="409" font-size="19" font-weight="600" fill="#262626">→</text><rect x="802.6666666666666" y="343" width="357.3333333333333" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="816.6666666666666" y="369" font-size="16" font-weight="600" fill="#262626">连接到哪里 · 原连接</text><line x1="816.6666666666666" y1="398" x2="1146.0" y2="398" stroke="#aaaaaa"/><text x="816.6666666666666" y="418" font-size="13" font-weight="normal" fill="#262626">· 连接 A / 已保存状态；健康未知</text><text x="816.6666666666666" y="448" font-size="13" font-weight="normal" fill="#262626">· A5 模型 N ▾〔只读展开〕</text><text x="816.6666666666666" y="478" font-size="13" font-weight="normal" fill="#262626">· 优先级 / 权重 → 原连接路由任务</text><text x="816.6666666666666" y="508" font-size="13" font-weight="normal" fill="#262626">· 窗口剩余 — / 来源 / 观察时间</text><text x="780.6666666666666" y="409" font-size="19" font-weight="600" fill="#262626">→</text><rect x="40" y="568" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="594" font-size="16" font-weight="600" fill="#262626">最近请求 · Full完整保留</text><line x1="54" y1="623" x2="1146" y2="623" stroke="#aaaaaa"/><text x="54" y="643" font-size="13" font-weight="normal" fill="#262626">· 时间 / 模型 / Key / 连接 / 业务结果 / 用量证据</text><text x="54" y="673" font-size="13" font-weight="normal" fill="#262626">· 选择节点只筛选；A6 查看请求 → 原调用记录，返回恢复条件</text><rect x="40" y="703" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="725" font-size="12" font-weight="normal" fill="#262626">Lite · 接入你的客户端；默认以三步任务和实际地址为首屏</text><rect x="40.0" y="767" width="362.6666666666667" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54.0" y="793" font-size="16" font-weight="600" fill="#262626">1 添加连接</text><line x1="54.0" y1="822" x2="388.6666666666667" y2="822" stroke="#aaaaaa"/><text x="54.0" y="842" font-size="13" font-weight="normal" fill="#262626">· A1 → /connections〔跳转〕</text><text x="54.0" y="872" font-size="13" font-weight="normal" fill="#262626">· 在原编辑任务保存；不自动创建或测试</text><rect x="418.6666666666667" y="767" width="362.6666666666667" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="432.6666666666667" y="793" font-size="16" font-weight="600" fill="#262626">2 创建 / 选择 API Key</text><line x1="432.6666666666667" y1="822" x2="767.3333333333334" y2="822" stroke="#aaaaaa"/><text x="432.6666666666667" y="842" font-size="13" font-weight="normal" fill="#262626">· A2 → /keys〔跳转〕</text><text x="432.6666666666667" y="872" font-size="13" font-weight="normal" fill="#262626">· 选择准确Key；不自动创建或读秘密</text><rect x="797.3333333333334" y="767" width="362.6666666666667" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="811.3333333333334" y="793" font-size="16" font-weight="600" fill="#262626">3 配置客户端</text><line x1="811.3333333333334" y1="822" x2="1146.0" y2="822" stroke="#aaaaaa"/><text x="811.3333333333334" y="842" font-size="13" font-weight="normal" fill="#262626">· A3 先选Key → 该Key交付〔跳转〕</text><text x="811.3333333333334" y="872" font-size="13" font-weight="normal" fill="#262626">· 地址 / 模板 / 复制 / 导入按原明确流程</text><rect x="40.0" y="902" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="927" font-size="12" font-weight="normal" fill="#262626">真实Base URL〔配置 / 当前访问来源〕</text><rect x="604.0" y="902" width="556.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="612.0" y="927" font-size="12" font-weight="normal" fill="#262626">A4 复制地址〔只读 / 失败反馈〕</text><rect x="40" y="962" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="988" font-size="16" font-weight="600" fill="#262626">折叠外常驻 · 已有状态与保存窗口</text><line x1="54" y1="1017" x2="1146" y2="1017" stroke="#aaaaaa"/><text x="54" y="1037" font-size="13" font-weight="normal" fill="#262626">· 待处理 / 失败 / 结果未知：原OverviewAttention保持</text><text x="54" y="1067" font-size="13" font-weight="normal" fill="#262626">· Key / 连接 / 统计各自加载、失败或未知；不把缺数据当空列表</text><text x="54" y="1097" font-size="13" font-weight="normal" fill="#262626">· 当前连接已保存窗口：剩余 — / 状态未知 / 来源 / 观察时间</text><text x="54" y="1127" font-size="13" font-weight="normal" fill="#262626">· 不支持余额接口、尚未获取、读取失败分别说明；不推断全部不支持</text><rect x="40.0" y="1157" width="1120.0" height="44" rx="5" fill="#fafafa" stroke="#888888"/><text x="48.0" y="1182" font-size="12" font-weight="normal" fill="#262626">A7 完整流向与统计 ▸〔只读 / Enter或Space展开〕</text><rect x="40" y="1217" width="1120" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1243" font-size="16" font-weight="600" fill="#262626">A7展开态参考 · 同一页面，默认收起</text><line x1="54" y1="1272" x2="1146" y2="1272" stroke="#aaaaaa"/><text x="54" y="1292" font-size="13" font-weight="normal" fill="#262626">· 原完整FlowBoard：Key → 网关 → 连接及全部值、筛选和统计</text><text x="54" y="1322" font-size="13" font-weight="normal" fill="#262626">· 原错误详情、retry/actions、样本覆盖和每小时数值文字完整可达</text><text x="54" y="1352" font-size="13" font-weight="normal" fill="#262626">· 展开/收起不新增请求；失败/未知/窗口风险保留在外侧，焦点回summary</text><rect x="40" y="1382" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="1404" font-size="12" font-weight="normal" fill="#262626">Desktop · Lite桌面壳；复用上方任务 / 地址 / 已存状态，不把概念图画成已实现服务控制</text><rect x="40" y="1446" width="1120" height="177" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1472" font-size="16" font-weight="600" fill="#262626">原生壳边界</text><line x1="54" y1="1501" x2="1146" y2="1501" stroke="#aaaaaa"/><text x="54" y="1521" font-size="13" font-weight="normal" fill="#262626">· 当前只保已有关闭窗口 / 托盘指引；状态来自真实既有能力</text><text x="54" y="1551" font-size="13" font-weight="normal" fill="#262626">· 配置客户端仍先选Key，不自动读秘密或测试</text><text x="54" y="1581" font-size="13" font-weight="normal" fill="#262626">· B5待实现：原生服务健康、停止服务、局域网访问控制</text><text x="54" y="1611" font-size="13" font-weight="normal" fill="#262626">· 本轮不画停止 / LAN开关，不用页面可访问推断后台健康</text><rect x="40" y="1641" width="1120" height="237" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="1667" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="1696" x2="1146" y2="1696" stroke="#aaaaaa"/><text x="54" y="1716" font-size="13" font-weight="normal" fill="#262626">· 效果图仅作方向参考；Full保原全部统计、图表可访问文字、样本覆盖和meta，不因卡片紧凑删字段。</text><text x="54" y="1746" font-size="13" font-weight="normal" fill="#262626">· Lite首屏是三步任务与真实地址，完整流向/统计放可键盘展开区；收起保已加载数据，展开不新增HTTP。</text><text x="54" y="1776" font-size="13" font-weight="normal" fill="#262626">· 折叠外保OverviewAttention及各类加载/读取失败/未知摘要；已保存窗口的剩余/状态/观察时间常驻，保进入详情重试入口。</text><text x="54" y="1806" font-size="13" font-weight="normal" fill="#262626">· 加载、无连接、无Key、失败、未知和权限变化分别提示；没有证据不得显示健康或可调用。</text><text x="54" y="1836" font-size="13" font-weight="normal" fill="#262626">· 当前供应商余额能力按实际连接说明支持/不支持/未获取/失败；可查看已保存账号窗口，不笼统判定全部不支持。</text><text x="54" y="1866" font-size="13" font-weight="normal" fill="#262626">· Desktop原生服务健康、停止、LAN均标B5待实现；本轮只保已有壳及关窗/托盘指引，不承诺已验收。</text><text x="40" y="1910" font-size="10" font-weight="normal" fill="#666666">overview · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
