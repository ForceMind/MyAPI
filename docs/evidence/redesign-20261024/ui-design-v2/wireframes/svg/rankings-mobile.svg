<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1122" viewBox="0 0 390 1122" role="img" aria-labelledby="title desc"><title id="title">公开排行榜 · 手机</title><desc id="desc">低保真设计源文件，合成数据，待确认。沿用现有身份、角色和服务端权限</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="390" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="16" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="266" y="34" font-size="12" font-weight="normal" fill="#262626">搜索  /  菜单</text><text x="16" y="96" font-size="22" font-weight="600" fill="#262626">公开排行榜</text><text x="16" y="131" font-size="11" font-weight="normal" fill="#666666">/rankings</text><rect x="16" y="147" width="358" height="62" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="28" y="169" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览</text><text x="28" y="188" font-size="12" font-weight="normal" fill="#262626">器未验证 · 不连接API</text><text x="16" y="243" font-size="15" font-weight="600" fill="#262626">查询与筛选</text><text x="16.0" y="273" font-size="12" font-weight="600" fill="#262626">榜单</text><rect x="16.0" y="282" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="309" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><text x="16.0" y="367" font-size="12" font-weight="600" fill="#262626">日期范围</text><rect x="16.0" y="376" width="358.0" height="44" rx="5" fill="#fafafa" stroke="#999999"/><text x="26.0" y="403" font-size="13" font-weight="normal" fill="#666666">选择 / 输入 …</text><rect x="16" y="449" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="472" font-size="13" font-weight="600" fill="#262626">A1 应用榜单筛选</text><rect x="184" y="449" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="472" font-size="13" font-weight="normal" fill