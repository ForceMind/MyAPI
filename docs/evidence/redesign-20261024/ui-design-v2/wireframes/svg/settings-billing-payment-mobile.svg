 x2="360.0" y2="992" stroke="#aaaaaa"/><text x="30.0" y="1012" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="30.0" y="1042" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="30.0" y="1072" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="16.0" y="1100" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="1126" font-size="16" font-weight="600" fill="#262626">提供方配置分组</text><line x1="30.0" y1="1155" x2="360.0" y2="1155" stroke="#aaaaaa"/><text x="30.0" y="1175" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="30.0" y="1205" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="30.0" y="1235" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="16.0" y="1263" width="358.0" height="147" rx="5" fill="#ffffff" stroke="#888888"/><text x="30.0" y="1289" font-size="16" font-weight="600" fill="#262626">提交前影响摘要</text><line x1="30.0" y1="1318" x2="360.0" y2="1318" stroke="#aaaaaa"/><text x="30.0" y="1338" font-size="13" font-weight="normal" fill="#262626">· 字段按任务归组</text><text x="30.0" y="1368" font-size="13" font-weight="normal" fill="#262626">· 高级规则默认折叠但可完整访问</text><text x="30.0" y="1398" font-size="13" font-weight="normal" fill="#262626">· 保存前展示字段错误</text><rect x="16" y="1426" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1452" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="30" y1="1481" x2="360" y2="1481" stroke="#aaaaaa"/><text x="30" y="1501" font-size="13" font-weight="normal" fill="#262626">· 分区顶部只保留一个主保存入口；底部未保存栏</text><text x="40" y="1521" font-size="13" font-weight="normal" fill="#262626">在手机不遮挡最后一个字段或验证信息。</text><text x="30" y="1551" font-size="13" font-weight="normal" fill="#262626">· 低保真图表达任务分组和可访问字段范围；最终</text><text x="40" y="1571" font-size="13" font-weight="normal" fill="#262626">字段校验与服务端契约保持不变。</text><rect x="16" y="1601" width="358" height="157" rx="5" fill="#ffffff" stroke="#888888"/><text x="30" y="1627" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="30" y1="1656" x2="360" y2="1656" stroke="#aaaaaa"/><text x="30" y="1676" font-size="13" font-weight="normal" fill="#262626">· 同一任务的字段在当前分区内归组；高级参数可</text><text x="40" y="1696" font-size="13" font-weight="normal" fill="#262626">展开，旧分区地址和服务端选项不删除。</text><text x="30" y="1726" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业</text><text x="40" y="1746" font-size="13" font-weight="normal" fill="#262626">务功能。</text><rect x="16" y="1776" width="160" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="26" y="1799" font-size="13" font-weight="600" fill="#262626">A1 保存当前分区</text><rect x="184" y="1776" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="194" y="1799" font-size="13" font-weight="normal" fill="#262626">A2 放弃草稿</text><rect x="16" y="1832" width="160" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="26" y="1855" font-size="13" font-weight="normal" fill="#262626">A3 危险操作确认</text><rect x="0" y="1896" width="390" height="64" rx="0" fill="#eeeeee" stroke="#777777"/><text x="20" y="1934" font-size="13" font-weight="normal" fill="#262626">概览      上游      Key      请求      更多</text><text x="16" y="1990" font-size="10" font-weight="normal" fill="#666666">settings-billing-payment · 手机390 · 来源 c916051e · 浏览器未验</text><text x="16" y="2007" font-size="10" font-weight="normal" fill="#666666">证</text></g></svg>
