<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="933" viewBox="0 0 1200 933" role="img" aria-labelledby="title desc"><title id="title">常见问题 · 桌面</title><desc id="desc">低保真设计源文件，合成数据，待确认。管理员 / Root按既有设置权限，Lite按既有能力裁剪</desc><rect width="100%" height="100%" fill="#ffffff"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"><rect x="0" y="0" width="1200" height="56" rx="0" fill="#f0f0f0" stroke="#777777"/><text x="40" y="34" font-size="14" font-weight="600" fill="#262626">MyAPI  [Logo保留]</text><text x="250" y="34" font-size="14" font-weight="normal" fill="#262626">概览    上游    API Key    请求    设置    管理 ▾       搜索 / 账户</text><text x="40" y="96" font-size="26" font-weight="600" fill="#262626">常见问题</text><text x="40" y="135" font-size="11" font-weight="normal" fill="#666666">/system-settings/content/faq</text><rect x="40" y="151" width="1120" height="48" rx="5" fill="#f5f5f5" stroke="#aaaaaa" stroke-dasharray="5 4"/><text x="52" y="173" font-size="12" font-weight="normal" fill="#262626">已批准的信息层级方案 · 合成占位 · 实现待CI / 浏览器未验证 · 不连接API</text><rect x="40" y="215" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="241" font-size="16" font-weight="600" fill="#262626">默认收起态 · 首屏</text><line x1="54" y1="270" x2="1146" y2="270" stroke="#aaaaaa"/><text x="54" y="290" font-size="13" font-weight="normal" fill="#262626">· 问题标题 / 回答短摘要 / 选择与编辑操作</text><text x="54" y="320" font-size="13" font-weight="normal" fill="#262626">· 查看全文 ▾ · 原本地草稿 / 页面保存状态</text><rect x="40" y="350" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="376" font-size="16" font-weight="600" fill="#262626">明确点击后的展开态 · 同一页面</text><line x1="54" y1="405" x2="1146" y2="405" stroke="#aaaaaa"/><text x="54" y="425" font-size="13" font-weight="normal" fill="#262626">· 该条完整原回答；不截断丢失内容</text><rect x="40" y="455" width="1120" height="87" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="481" font-size="16" font-weight="600" fill="#262626">交互与恢复边界</text><line x1="54" y1="510" x2="1146" y2="510" stroke="#aaaaaa"/><text x="54" y="530" font-size="13" font-weight="normal" fill="#262626">· 只折只读预览；必填编辑字段/坏JSON/dirty/保存操作不折叠。</text><rect x="40" y="560" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="586" font-size="16" font-weight="600" fill="#262626">设计约束 / 恢复行为</text><line x1="54" y1="615" x2="1146" y2="615" stroke="#aaaaaa"/><text x="54" y="635" font-size="13" font-weight="normal" fill="#262626">· 分区顶部只保留一个主保存入口；底部未保存栏在手机不遮挡最后一个字段或验证信息。</text><text x="54" y="665" font-size="13" font-weight="normal" fill="#262626">· 低保真图表达任务分组和可访问字段范围；最终字段校验与服务端契约保持不变。</text><rect x="40" y="695" width="1120" height="117" rx="5" fill="#ffffff" stroke="#888888"/><text x="54" y="721" font-size="16" font-weight="600" fill="#262626">拟精简 / 合并方式</text><line x1="54" y1="750" x2="1146" y2="750" stroke="#aaaaaa"/><text x="54" y="770" font-size="13" font-weight="normal" fill="#262626">· 同一任务的字段在当前分区内归组；高级参数可展开，旧分区地址和服务端选项不删除。</text><text x="54" y="800" font-size="13" font-weight="normal" fill="#262626">· 本轮只提交设计，不删除页面、参数、权限或业务功能。</text><rect x="40" y="830" width="133" height="44" rx="5" fill="#eeeeee" stroke="#555555"/><text x="50" y="853" font-size="13" font-weight="600" fill="#262626">A1 保存当前分区</text><rect x="181" y="830" width="120" height="44" rx="5" fill="#ffffff" stroke="#555555"/><text x="191" y="853" font-size="13" font-weight="normal" fill="#262626">A2 放弃草稿</text><text x="40" y="908" font-size="10" font-weight="normal" fill="#666666">settings-content-faq · 桌面1200 · 来源 c916051e · 浏览器未验证</text></g></svg>
